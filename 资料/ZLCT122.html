    text-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .banner .lead{

  }

    position:relative; display:flex; gap:14px; margin-top:22px; flex-wrap:wrap;
  }
  .banner .card{
    flex:1 1 150px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.17);
    border-radius:14px; padding:15px 20px; backdrop-filter:blur(2px);

  .banner .card .cap{font-size:14px; color:#c6d8ec; margin-top:6px; letter-spacing:.5px;}
  .banner .alert{
    position:relative; margin-top:20px; background:rgba(217,58,58,.20);
    border-left:5px solid #ff6b6b; border-radius:10px; padding:13px 18px;
    font-size:17.5px; font-weight:700; color:#ffe3e3; line-height:1.8;

  .score b{color:var(--brand); font-size:17px;}
  .score .ok{color:var(--ok);} .score .bad{color:var(--bad);}

  .q.wrong .opts li.sel{border-color:var(--bad); background:#fbdcdc;}

    display:none; margin-top:12px; font-weight:700; font-size:14px;
    padding:7px 14px; border-radius:9px;

  .q.right .verdict{display:inline-block; color:var(--ok); background:#d3f1e1;}
  .q.wrong .verdict{display:inline-block; color:var(--bad); background:#fadada;}

  .sec{
    margin:34px 0 14px; padding:10px 16px; font-size:19px; color:#1f2733;

    border-radius:0 12px 12px 0; display:flex; align-items:center; gap:10px;

{id:"ZL030", no:"80-7", page:"80", kp:"混合增长率", material:"2023年3月，全国规模以上工业企业的工业机器人完成产量4.4万套，服务机器人完成产量70万套。2023年1~3月全国规模以上工业企业的工业机器人累计完成产量10.4万套，服务机器人累计完成产量145万套。 2023年3月，我国机器人设备出口金额0.7亿美元，较上年增长110.3%，进口金额2.4亿美元，较上年增长68.5%。2023年1~3月我国机器人设备累计出口金额1.9亿美元，较上年增长62.1%，累计进口金额6.9亿美元，较上年增长55.1%。 2022年12月，全国规模以上工业企业的工业机器人完成产量4万套，服务机器人完成产量49.1万套。2022年1~12月全国规模以上工业企业的工业机器人累计完成产量44.3万套，服务机器人累计完成产量645.8万套。 2022年12月，我国工业机器人设备出口金额0.5亿美元，进口金额1.8亿美元。2022年1~12月我国工业机器人设备累计出口金额6.1亿美元，累计进口金额20亿美元。", imgs:[], stem:"2023年一季度，我国机器人设备进出口贸易逆差比上年同期：", opts:{A:"下降了不到30%",B:"下降了30%以上",C:"上升了不到30%",D:"上升了30%以上"}, ans:"D"},
{id:"ZL031", no:"81-12", page:"81 82", kp:"简单加减", material:"2022年，京津冀地区生产总值合计10.0万亿元，是2013年的1.8倍。其中，北京、河北跨越4万亿元量级，均为4.2万亿元，分别是2013年的2.0倍和1.7倍；天津1.6万亿元，是2013年的1.6倍。京津冀第一产业、第二产业、第三产业增加值占生产总值比重构成由2013年的6.2：35.7：58.1变化为2022年的4.8：29.6：65.6。京津冀三地第三产业增加值占生产总值比重分别为83.8%、61.3％和49.4%，较2013年分别提高4.3、7.2和8.4个百分点。 2013—2022年，京津冀地区城镇累计分别新增就业288.1万、405.5万和748.4万人。2021年，北京法人单位从业人员中，第三产业比重为84.4%，较2013年提高6.2个百分点，其中信息服务业和商务服务业占比达25.5%，较2013年提高6.2个百分点；天津和河北第三产业就业人员占比为60.5％和46.6%，较2013年提高10.9和15.1个百分点。 2022年，京津冀三地全体居民人均可支配收入分别为77415元、48976元和30867元，与2013年相比，年均分别增长7.4%、7.1％和8.2%。其中，城镇居民人均可支配收入分别增长7.3%、6.9％和7.1%，农村居民人均可支配收入分别增长8.2%、7.3％和8.6%。", imgs:[], stem:"2013年，北京第三产业增加值占其生产总值比重比天津高多少个百分点？", opts:{A:"25.4",B:"22.5",C:"19.6",D:"16.7"}, ans:"A"},
{id:"ZL033", no:"84-3", page:"83 84", kp:"现期比重", material:"2023年上半年，全国新注册登记机动车1688万辆，同比增长1.9%。新注册登记汽车1175万辆，同比增长5.8%。其中，新注册登记载客汽车1034万辆，同比增长5.6%；新注册登记载货汽车133万辆，同比增长8.1%。新注册登记新能源汽车313万辆，同比增长41.6%。 2023年上半年，全国办理机动车转让登记业务1134万辆。其中，办理汽车转让登记业务1057万辆，同比增长5.3%；异地直接办理交易登记二手小客车157万辆。 2023年6月末，全国机动车保有量4.26亿辆，同比增长4.9%。其中，汽车3.28亿辆，同比增长5.8%；新能源汽车1620万辆，同比增长61.8%。新能源汽车中，纯电动汽车保有量1259万辆，同比增长55.4%；2023年6月末，全国机动车驾驶人为5.13亿人，同比增长4.3%。其中，汽车驾驶人4.75亿人，同比增长4.6%。2023年上半年，全国新领证驾驶人1191万人，同比增长8.0%。 2023年6月末，全国有88个城市汽车保有量超过100万辆，同比增加7个城市。其中，41个城市超过200万辆，24个城市超过300万辆，3个城市超过500万辆，2个城市超过600万辆。", imgs:[], stem:"2023年6月末，新能源汽车保有量占汽车保有量的比重，比当年上半年新注册登记新能源汽车数量占新注册登记汽车数量的比重约低多少个百分点？", opts:{A:"12",B:"17",C:"22",D:"27"}, ans:"C"},
{id:"ZL034", no:"85-6", page:"85", kp:"间隔增长率", material:"2022年，全国软件和信息技术服务业规模以上企业超3.5万家，累计完成软件业务收入108126亿元，同比增长11.2%，增速较上年同期回落6.5个百分点。 2022年，全国软件业利润总额12648亿元，同比增长5.7%，增速较上年同期回落1.9个百分点。软件业务出口额524.1亿美元，同比增长3.0%，增速较上年同期回落5.8个百分点。其中，软件外包服务出口额同比增长9.2%。 2022年，东部、中部、西部和东北地区分别完成软件业务收入88663亿元、5390亿元、11574亿元和2499亿元，分别同比增长10.6%、16.9%、14.3%和8.7%。软件业务收入居前5名的北京、广东、江苏、山东、浙江共完成收入74537亿元，占比较上年同期提高2.9个百分点。 2022年，全国15个副省级中心城市实现软件业务收入53419亿元，同比增长10.0%，增速较上年同期回落6.3个百分点；实现利润总额6924亿元，同比增长2.4%，增速较上年同期回落2.1个百分点。", imgs:[], stem:"2022年，全国软件和信息技术服务业规模以上企业累计完成软件业务收入约比2020年增长了：", opts:{A:"16%",B:"23%",C:"29%",D:"31%"}, ans:"D"},
{id:"ZL035", no:"86-10", page:"85 86", kp:"现期比重, 基期量计算, 基期平均数", material:"2022年，全国软件和信息技术服务业规模以上企业超3.5万家，累计完成软件业务收入108126亿元，同比增长11.2%，增速较上年同期回落6.5个百分点。 2022年，全国软件业利润总额12648亿元，同比增长5.7%，增速较上年同期回落1.9个百分点。软件业务出口额524.1亿美元，同比增长3.0%，增速较上年同期回落5.8个百分点。其中，软件外包服务出口额同比增长9.2%。 2022年，东部、中部、西部和东北地区分别完成软件业务收入88663亿元、5390亿元、11574亿元和2499亿元，分别同比增长10.6%、16.9%、14.3%和8.7%。软件业务收入居前5名的北京、广东、江苏、山东、浙江共完成收入74537亿元，占比较上年同期提高2.9个百分点。 2022年，全国15个副省级中心城市实现软件业务收入53419亿元，同比增长10.0%，增速较上年同期回落6.3个百分点；实现利润总额6924亿元，同比增长2.4%，增速较上年同期回落2.1个百分点。", imgs:[], stem:"以下信息中，能够从上述资料中推出的有几项？ ①2020年平均每个副省级中心城市软件业务收入 ②2021年北京、广东、江苏、山东、浙江软件业务收入之和 ③2022年软件外包服务出口额占软件业务出口额比重", opts:{A:"0",B:"1",C:"2",D:"3"}, ans:"C"},
{id:"ZL036", no:"91-10", page:"90 91", kp:"现期倍数, 基期量计算, 间隔增长率", material:"2021年前三季度，上述企业实现营业收入84205亿元，按可比口径计算，同比增长21.8%；两年平均增长10.0%。 分业态营业收入情况：文化新业态特征较为明显的16个行业小类28322亿元，同比增长26.1%；两年平均增长24.0%，高于全部规模以上文化及相关产业企业14.0个百分点。 分行业类别营业收入情况：新闻信息服务9847亿元，同比增长22.1%；内容创作生产17693亿元，同比增长18.6%；创意设计服务13787亿元，同比增长24.0%；文化传播渠道9309亿元，同比增长30.1%；文化投资运营359亿元，同比增长13.8％；文化娱乐休闲服务916亿元，同比增长35.3％；文化辅助生产和中介服务11441亿元，同比增长18.3％；文化装备生产4880亿元，同比增长17.8％；文化消费终端生产15974亿元，同比增长22.0％。 分产业类型营业收入情况：文化制造业30950亿元，同比增长17.7％；文化批发和零售业13561亿元，同比增长26.0％；文化服务业39693亿元，同比增长23.7％。 分领域营业收入情况：文化核心领域51911亿元，同比增长22.9％；文化相关领域32294亿元，同比增长20.0％。 分区域营业收入情况：东部地区64715亿元，同比增长22.5％；中部地区11417亿元，同比增长19.7％；西部地区7329亿元，同比增长19.0％；东北地区744亿元，同比增长20.2％。", imgs:[], stem:"关于2020年前三季度，以下说法正确的是：", opts:{A:"文化新业态特征较为明显的16个行业小类营业收入同比增速高于2021年同期",B:"内容创作生产营业收入超过15000亿元",C:"文化核心领域收入超过文化相关领域收入2倍",D:"东部地区与中部地区营业收入之比低于"}, ans:"D"},
{id:"ZL037", no:"92-13", page:"92", kp:"基期比重", material:"2022年，规模以上工业企业实现营业收入137.91万亿元，同比增长5.9％；发生营业成本116.84万亿元，同比增长7.1％；营业收入利润率为6.09％，同比下降0.64个百分点。 2022年，规模以上工业企业中，分行业看：采矿业实现利润总额15573.6亿元，同比增长48.6％；制造业实现利润总额64150.2亿元，同比下降13.4％；电力、热力、燃气及水生产和供应业实现利润总额4314.7亿元，同比增长41.8％。 2022年，在41个工业大类行业中，利润总额由高到低的前十个行业的利润情况如下：煤炭开采和洗选业实现利润总额10202亿元，同比增长44.3％；计算机、通信和其他电子设备制造业实现利润总额7389.5亿元，同比下降13.1％；化学原料和化学制品制造业实现利润总额7302.6亿元，同比下降8.7％；电气机械和器材制造业实现利润总额5915.6亿元，同比增长31.2％；汽车制造业实现利润总额5319.6亿元，同比增长0.6％；非金属矿物制品业实现利润总额4759亿元，同比下降15.5％；医药制造业实现利润总额4288.7亿元，同比下降31.8％；石油和天然气开采业实现利润总额3545亿元，同比增长109.8％；通用设备制造业实现利润总额3250.3亿元，同比增长0.4％；电力、热力生产和供应业实现利润总额3154亿元，同比增长86.3％。", imgs:[], stem:"2021年，石油和天然气开采业利润总额占采矿业利润总额的（ ）。", opts:{A:"不足10%",B:"10%-20%之间",C:"20%-30%之间",D:"30%以上"}, ans:"B"},
{id:"ZL038", no:"94-19", page:"94", kp:"现期比重", material:"2020年全国人口共141178万人，比2010年增长了约5.38%。从地区分布上看，2020年东部地区人口占39.93%，中部地区占25.83%，西部地区占27.12%，东北地区占6.98%。与2010年相比，东部地区人口所占比重上升2.15个百分点，中部地区下降0.79个百分点，西部地区上升0.22个百分点，东北地区下降1.20个百分点。 从性别构成上看，2020年男性人口为72334万人，女性人口为68844万人。从年龄构成上看，2020年0-14岁人口为25338万人，15-59岁人口为89438万人，60岁及以上人口为26402万人（其中，65岁及以上人口为19064万人）。从城乡分布上看，2020年居住在城镇的人口为90199万人，居住在乡村的人口为50979万人，与2010年相比，城镇人口增加23642万人，乡村人口减少16436万人。从民族构成上看，2020年汉族人口为128631万人，各少数民族人口为12547万人，与2010年相比，汉族人口增长4.93%，各少数民族人口增长10.26%，少数民族人口比重上升0.40个百分点。", imgs:[], stem:"2020年，65岁及以上人口占比与60-64岁人口占比相差：", opts:{A:"约6.3%",B:"约7.3%",C:"约8.3%",D:"约9.3%"}, ans:"C"},
{id:"ZL039", no:"96-8", page:"95 96", kp:"基期比重", material:"2019年6月，全国发行地方政府债券8996亿元，同比增长68.37%，环比增长195.63%。其中，发行一般债券3178亿元，同比减少28.33%，环比增长117.08%，发行专项债券5818亿元，同比增长540.04%，环比增长268.46%；按用途划分，发行新增债券7170亿元，同比增长127.11%，环比增长332.71%，发行置换债券和再融资债券1826亿元，同比减少16.47%，环比增长31.75%。 2019年6月，地方政府债券平均发行期限11.1年，其中新增债券10.4年，置换债券和再融资债券13.4年；地方政府债券平均发行利率3.55%，其中新增债券3.52%，置换债券和再融资债券3.65%。 2019年1至6月，全国发行地方政府债券28372亿元，同比增长101.09%。其中，发行一般债券12858亿元，同比增长23.21%，发行专项债券15514亿元，同比增长322.38%；按用途划分，发行新增债券21765亿元，同比增长553.80%，发行置换债券和再融资债券6607亿元，同比减少38.71%。 2019年1至6月，地方政府债券平均发行期限9.3年，其中一般债券11.2年，专项债券7.8年；地方政府债券平均发行利率3.47%，其中一般债券3.53%，专项债券3.43%。 2019年全国地方政府债务限额为240774.3亿元。其中，一般债务限额133089.22亿元，专项债务限额107685.08亿元。截至2019年6月末，全国地方政府债务余额205477亿元，其中，一般债务118397亿元，专项债务87080亿元。", imgs:[], stem:"2018年1至6月，发行一般债券的占比较发行专项债券的占比约：", opts:{A:"低9.36%",B:"低52.81%",C:"高47.93%",D:"高53.43%"}, ans:"C"},
{id:"ZL043", no:"104-17", page:"104", kp:"两期比重", material:"2017年全国海洋生产总值77611亿元，比上年增长6.9%，海洋生产总值占国内生产总值的9.4%。 2017年，J省海洋生产总值为7217亿元，比上年增长9.2%，海洋生产总值占地区生产总值的8.4%，2017年，全省沿海沿江港口完成货物吞吐量20.4亿吨，同比增长8.3%；集装箱吞吐量1698.8万标箱，同比增长5.5%。 2017年，J省造船完工量为1412.4万载重吨，同比下降5.4%；新承订单量为1393.4万载重吨，同比增长228.5%；手持订单量为3662.3万载重吨，同比下降6.4%，分别占全国份额的33.1%、41.3%和42.0%。 2017年，J省沿海三市接待国内游客10558.01万人次，同比增长12.6%；接待入境过夜旅游者27.65万人次，同比增长8.1%。 2017年，J省实现海水养殖产量93.1万吨，同比增长3%；海洋捕捞产量53万吨，同比下降3.4%；远洋渔业产量2.9万吨，同比增长43.3%。 2017年，J省海工装备产值同比增长6.9%。全省沿海地区风电装机容量达到589.7万千瓦，同比增长16.6%；海上风电装机容量达到162.5万千瓦，同比增长46.3%。2017年，全省完成海水淡化产量1.31万吨，同比增长7.4%。", imgs:[], stem:"2017年J省海洋生产总值占全国的比重比上年：", opts:{A:"上升了约0.2个百分点",B:"上升了约2个百分点",C:"下降了约0.2个百分点",D:"下降了约2个百分点"}, ans:"A"},
{id:"ZL047", no:"117-4", page:"116 117", kp:"基期倍数", material:"2018年，A省公共财政预算收入1180.07亿元，比上年增长10.7%。其中，一般公共预算收入103.82亿元，比上年下降19.9%。全年A省实际完成地方税收收入104亿元，中央财政返还68.60亿元，增长1.2%。A省一般公共预算支出从2012年的603.2亿元增加到2018年的958.41亿元，2018年同比增长8.9%。 2018年末，A省辖区各项存款余额3051.06亿元，同比增长4.4%。其中，个人存款1491.89亿元，增长17.9%；单位存款1531.38亿元，下降7.6%；代理财政性存款25.38亿元，增长17.9倍。A省辖区各项贷款余额2574.10亿元，同比增长9.4%。其中，个人贷款311.99亿元，下降2.6%；单位贷款2202.74亿元，增长10.8%；含票据融资59.38亿元，增长32.9%。 2018年，农行A省分行年末各项本外币存款余额1300.85亿元，同比增长2.7%，比上年同期下降7个百分点。其中，个人存款645.62亿元，增长8.4%；单位存款653.96亿元，下降1.9%；同业存款1.26亿元，下降64.5%。年末各项贷款余额662.92亿元，同比增长0.7%，比上年同期下降19个百分点。其中，个人贷款103.52亿元，增长6.0%；单位贷款484.65亿元，下降6.1%；贸易融资57.59亿元，增长30.8%；贴现及转贴现净值17.16亿元，增长155.0倍。", imgs:[], stem:"2017年，农行A省单位贷款额是个人贷款额的（ ）。", opts:{A:"3～4倍",B:"4～5倍",C:"5～6倍",D:"6～7倍"}, ans:"C"},
{id:"ZL048", no:"117-5", page:"116 117", kp:"增长量计算, 基期比重, 年均增长率", material:"2018年，A省公共财政预算收入1180.07亿元，比上年增长10.7%。其中，一般公共预算收入103.82亿元，比上年下降19.9%。全年A省实际完成地方税收收入104亿元，中央财政返还68.60亿元，增长1.2%。A省一般公共预算支出从2012年的603.2亿元增加到2018年的958.41亿元，2018年同比增长8.9%。 2018年末，A省辖区各项存款余额3051.06亿元，同比增长4.4%。其中，个人存款1491.89亿元，增长17.9%；单位存款1531.38亿元，下降7.6%；代理财政性存款25.38亿元，增长17.9倍。A省辖区各项贷款余额2574.10亿元，同比增长9.4%。其中，个人贷款311.99亿元，下降2.6%；单位贷款2202.74亿元，增长10.8%；含票据融资59.38亿元，增长32.9%。 2018年，农行A省分行年末各项本外币存款余额1300.85亿元，同比增长2.7%，比上年同期下降7个百分点。其中，个人存款645.62亿元，增长8.4%；单位存款653.96亿元，下降1.9%；同业存款1.26亿元，下降64.5%。年末各项贷款余额662.92亿元，同比增长0.7%，比上年同期下降19个百分点。其中，个人贷款103.52亿元，增长6.0%；单位贷款484.65亿元，下降6.1%；贸易融资57.59亿元，增长30.8%；贴现及转贴现净值17.16亿元，增长155.0倍。", imgs:[], stem:"下列哪个指标不能从上述资料中推出？（ ）", opts:{A:"2012年到2018年A省一般公共预算支出的平均增长率",B:"2017年农行A省分行年末各项本外币存款余额的同比增长量",C:"2016年农行A省分行年末各项贷款余额占A省辖区各项贷款余额的比重",D:"2017年A省个人贷款额和农行A省分行个人贷款额的比值"}, ans:"C"},
{id:"ZL049", no:"117-6", page:"117", kp:"两期比重", material:"2023年，我国互联网企业完成互联网业务收入17483亿元，同比增长6.8%。实现利润总额1295亿元，同比增长0.5%。共投入研发经费943.2亿元，同比下降3.7%。 2023年，东部地区互联网企业完成互联网业务收入15608亿元，同比增长7.3%；中部地区互联网企业完成互联网业务收入781.6亿元，同比增长8.1%；西部地区互联网企业完成互联网业务收入1054亿元，同比增长0.2%；东北地区互联网企业完成互联网业务收入39.4亿元，同比下降25.1%。 2023年，京津冀地区互联网企业完成互联网业务收入6777亿元，同比增长6.4%；长三角地区（上海、浙江、江苏和安徽）互联网企业完成互联网业务收入6624亿元，同比增长12.9%。 2023年，互联网企业互联网业务累计收入居前5名的省级行政区为北京（5721.4亿元，增长4.2%）、上海（4167.8亿元，增长17.5%）、浙江（1955.9亿元，增长4.8%）、广东（1754.5亿元，下降4.6%）和天津（981.7亿元，增长20.3%）。全国互联网企业互联网业务增速实现正增长的省级行政区有16个，数量较2022年全年增长3个。", imgs:[], stem:"2023年，我国互联网企业投入的研发经费占业务收入的比重比上年下降了约多少个百分点？", opts:{A:"0.2",B:"0.6",C:"1.9",D:"9.8"}, ans:"B"},
{id:"ZL050", no:"118-12", page:"118 119", kp:"现期倍数", material:"2025年8月，全国电梯采购规模25.11亿元，环比增长7.77%，同比增长43%。 全国电梯采购规模突破千万元的有河北省、湖北省等22个省份，其中，河北省、湖北省和北京市位居全国电梯采购规模前三，采购规模依次为67006.13万元、33061.49万元和23594.98万元。 8月，全国电梯更新改造采购规模56108.32万元，环比增长51.92%，同比增长347.55%。 8月，全国电梯维保采购规模9650.81万元，环比下降40.06%，同比下降14.11%，主要分布于政府机关、医疗系统、教育系统、轨道交通等，其中，政府机关电梯维保占全国电梯维保采购市场40.85%。河北省、江苏省和浙江省电梯维保采购规模排名位列前三，分别为2227.91万元、1662.78万元和1376.29万元。 8月，全国加装电梯采购规模9538.15万元，环比增长30.72%，同比下降18.63%，主要分布于政府机关、医疗系统、教育系统等，其中，政府机关加装电梯占全国加装电梯采购市场61.17%。四川省、北京市和广东省加装电梯采购规模排名前三，依次2484.57万元、2459.31万元和939.68万元。", imgs:[], stem:"2025年8月，全国电梯更新改造采购规模环比增量约是全国加装电梯采购规模环比增量的多少倍？", opts:{A:"4.4",B:"5.9",C:"7.3",D:"8.6"}, ans:"D"},
{id:"ZL051", no:"120-18", page:"119 120", kp:"增长量比较", material:"2021年1-2月，全国房地产开发投资13986亿元，同比增长3873亿元，房屋施工面积770629万平方米，同比增长11.0%。其中，住宅542503万平方米，增长11.2%；办公楼31802万平方米，增长7.3%；商业营业用房76346万平方米，增长2.5%；其他类型119978万平方米。房屋新开工面积17037万平方米，增长64.3%，其中，住宅12736万平方米，增长68.5%。商品房销售面积17363万平方米，同比增长1.05倍，比2019年1-2月增长23.3%，商品房销售额19151亿元，同比增长1.33倍，比2019年同期增长49.6%。 2月末，商品房待售面积比上年末增加2575万平方米，其中，住宅增加2314万平方米，办公楼和商业营业用房分别减少24万平方米和269万平方米。 2021年1-2月，分地区看，东部地区房地产开发投资8353亿元，同比增长32.4%；中部地区2640亿元，增长52.5%；西部地区2834亿元，增长45.1%；东北地区158亿元，增长28.6%。 东部地区商品房销售面积7565万平方米，同比增长113.9%；销售额11891亿元，增长148.1%，中部地区商品房销售面积4369万平方米，增长104.3%；销售额3280亿元，增长130.2%，西部地区商品房销售面积5004万平方米，增长95.1%；销售额3620亿元，增长103.6%，东北地区商品房销售面积425万平方米，增长82.0%；销售额359亿元，增长72.7%。", imgs:[], stem:"2021年1-2月，各地区按商品房销售额同比增量从大到小排列，正确的是（ ）。", opts:{A:"中部地区＞东部地区＞东北地区＞西部地区",B:"东部地区＞西部地区＞中部地区＞东北地区",C:"中部地区＞西部地区＞东北地区＞东部地区",D:"东部地区＞中部地区＞西部地区＞东北地区"}, ans:"D"},
{id:"ZL053", no:"122-8", page:"122 123", kp:"现期比重", material:"2024年，我国对联合国定义的45个最不发达国家（以下简称最不发达国家）进出口14230.2亿元人民币，占同期我国外贸进出口总值的3.2%。其中出口8664.6亿元，同比（下同）增长4.3%；进口5565.5亿元，增长12.8%。 2024年，我国对最不发达国家出口机电产品3942.2亿元，增长13.5%。其中出口船舶690.8亿元，增长65.9%，主要出口至全球第一大船旗国利比里亚。出口金额654.3亿元，增长67%；出口工程机械、火车分别为165.3亿元、91.6亿元，分别增长28.9%、39.5%；出口劳动密集型产品2481亿元，增长3.7%，其中纺织品1623.5亿元，增长15.3%。 2024年，我国自最不发达国家进口铜材、原油、金属矿砂分别为1469.6亿元、1364.2亿元、1221亿元。最不发达国家成为我国钢材、铝矿、锡矿、钨矿、钛矿第一大进口来源地，分别占我国同类商品进口总值的38.2%，73.1%，65.4%，57.7%，58.1%。 2024年12月1日起，我国给予所有已建交的最不发达国家100%税目产品零关税待遇。12月，我国自最不发达国家进口512.7亿元，增长18.1%，其中自刚果民主共和国、几内亚、老挝、赞比亚分别进口156.3亿元，54.7亿元，35.6亿元，33.9亿元，分别增长84.6%，40.3%，25.7%、127.27%。", imgs:["zlimage/tigan/题28_选项A_饼图.png","zlimage/tigan/题28_选项B_饼图.png","zlimage/tigan/题28_选项C_饼图.png","zlimage/tigan/题28_选项D_饼图.png"], stem:"下列饼状图，最能准确反映2024年我国自最不发达国家进口值中，铜材（黑色），原油（横线），金属矿砂（白色）和其他（竖线）进口值占比关系的是：", opts:{A:"",B:"",C:"",D:""}, ans:"B"},
{id:"ZL057", no:"126-3", page:"125 126", kp:"两期平均数", material:"2018年前三季度，S省社会物流总额35357.26亿元，同比增长6.4%，增速比上半年放缓0.7个百分点。其中，工业品物流总额16636.15亿元，同比增长0.2%，增速比上半年放缓2.1个百分点；外部流入（含进口）货物物流总额17357.31亿元，同比增长12.1%，增速比上半年加快0.8个百分点；农产品物流总额875.06亿元，同比增长11.6%，增速比上半年加快0.5个百分点；单位与居民物品物流总额457.86亿元，同比增长40.7%，增速比上半年放缓3个百分点；再生资源物流总额30.88亿元，同比下降7.0%，降幅比上半年扩大4.3个百分点。 2018年前三季度，S省物流相关行业实现总收入1912.8亿元，同比增长6.6%。其中：运输环节收入1321.9亿元，同比增长6.0%；保管环节收入226.2亿元，同比增长6.4%；邮政业收入82.8亿元，同比增长16.7%；配送、加工、包装业收入98.8亿元，同比增长6.4%。 2018年前三季度，S省社会物流总费用2682.1亿元，同比增长6.3%，比上半年放缓0.9个百分点。其中：物流运输环节总费用1854.6亿元，同比增长6.3%；保管环节总费用612.4亿元，同比增长6.4%；管理环节总费用214.9亿元，同比增长6.4%。", imgs:[], stem:"2018年前三季度，平均每万元社会物流总额产生的物流费用比上年同期：", opts:{A:"上升了不到1%",B:"上升了1%以上",C:"下降了不到1%",D:"下降了1%以上"}, ans:"C"},
{id:"ZL058", no:"127-6", page:"127", kp:"现期比重", material:"2024年一季度，全国规模以上文化及相关产业企业（以下简称“文化企业”）实现营业收入31057亿元，比上年同期增长8.5%；实现利润总额2116亿元；营业收入利润率（ ）为6.81%，同比下降0.17个百分点。其中，文化新业态特征较为明显的16个行业小类实现营业收入12633亿元。增速快于全部规模以上文化企业3.4个百分点。 分产业类型看，文化制造业实现营业收入9240亿元，比上年同期增长5.4%；文化批发和零售业5485亿元，增长6.8%；文化服务业16331亿元，增长10.9%。 分领域看，文化核心领域实现营业收入20921亿元，比上年同期增长10.3%；文化相关领域实现营业收入10136亿元。 分行业类别看，新闻信息服务实现营业收入4101亿元，比上年同期增长11.1%；内容创作生产7054亿元，增长12.0%；创意设计服务5219亿元，增长10.4%；文化传播渠道4026亿元，增长6.8%；文化投资运营145亿元，增长10.4%；文化娱乐休闲服务375亿元，增长10.5%；文化辅助生产和中介服务3583亿元，增长7.3%；文化装备生产1378亿元，增长6.0%；文化消费终端生产5175亿元，增长2.7%。 分区域看，东部地区实现营业收入24759亿元，比上年同期增长9.2%；中部地区3491亿元，增长6.5%；西部地区2524亿元，增长4.9%；东北地区282亿元，增长5.0%。", imgs:[], stem:"2024年第一季度，东部地区规模以上文化企业实现营业收入同比增量约占全国规模以上文化企业营业收入同比增量的：", opts:{A:"86%",B:"79%",C:"73%",D:"68%"}, ans:"A"},

{id:"ZL061", no:"129-14", page:"128 129", kp:"现期平均数", material:"2023年全国著作权（包括作品著作权、计算机软件著作权、著作权质权）登记总量达8923901件，同比增长40.46%，增速比上年同期增加39个百分点。根据各省、自治区、直辖市版权局和中国版权保护中心作品登记信息统计，2023年全国共完成作品著作权登记6428277件，同比增长42.30%，登记量前五位的分别是：北京市1101072件，同比增加53802件；山东省873826件，同比增加619459件；福建省710648件，同比增加424814件；中国版权保护中心493070件，同比增加1476件；上海市412660件，同比增加30660件。从作品类型来看，登记量最多的是美术作品3296437件，第二是摄影作品2501968件，第三是文字作品329128件，前三类作品类型登记量占作品著作权登记总量的95.32%，该比例比上年同期增加4.86个百分点。 2023年全国共完成著作权质权登记411件，同比增长17.43%，涉及主债务金额995817.4万元，同比增长82.82%；涉及担保金额985783.88万元，同比增长80.85%。其中计算机软件著作权质权登记361件，涉及主债务金额917149.06万元，涉及担保金额907399.56万元；作品（除计算机软件之外）著作权质权登记50件，同比下降26.47%，涉及主债务金额78668.34万元，同比下降55.13%，涉及担保金额78384.32万元，同比下降55.46%。", imgs:[], stem:"2023年平均每件计算机软件著作权质权登记涉及主债务金额比作品（除计算机软件之外）著作权质权登记高约：", opts:{A:"1135万元",B:"1056万元",C:"967万元",D:"825万元"}, ans:"C"},
{id:"ZL063", no:"132-2", page:"131 132", kp:"基期和差", material:"2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。 截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只，存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。 截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。", imgs:[], stem:"2021年银行机构存续的理财产品存续规模约为多少万亿元？", opts:{A:"5.4",B:"6.7",C:"10.5",D:"11.8"}, ans:"D"},
{id:"ZL064", no:"132-3", page:"131 132", kp:"现期平均数", material:"2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。 截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只，存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。 截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。", imgs:[], stem:"2022年不同机构每只存续理财产品平均存续金额从大到小排前三名的是：", opts:{A:"大型银行、理财公司、城商行",B:"理财公司、大型银行、城商行",C:"大型银行、理财公司、股份制银行",D:"理财公司、大型银行、股份制银行"}, ans:"D"},
{id:"ZL065", no:"132-4", page:"131 132", kp:"现期倍数", material:"2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。 截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只，存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。 截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。", imgs:[], stem:"以存续规模计算市场份额，2022年理财公司存续理财产品的市场份额是2021年理财公司的多少倍？", opts:{A:"0.45",B:"0.78",C:"1.36",D:"1.56"}, ans:"C"},
{id:"ZL067", no:"133-7", page:"132 133", kp:"基期倍数", material:"哨点医院ILI%监测情况 本周哨点医院共报告流感样病例总数为5187例，比上周增加4.49%，比去年同期减少56.16%，其中国家级哨点医院455例，比上周减少6.57%，比去年同期减少55.04%。城区哨点医院1899例，比上周减少19.40%，比去年同期减少55.46%；郊区、县（市）哨点医院3288例，比上周增加26.07%，比去年同期减少56.55%。本周全市哨点医院ILI%为5.98%，比上周低0.07个百分点，其中国家级哨点医院ILI%为2.12%，比上周高0.23个百分点。城区哨点医院ILI%为4.45%，比上周低0.56个百分点；郊区、县（市）哨点医院ILI%为7.46%，比上周高0.01个百分点。 （二）哨点医院ILI%纵向比较 2023年第14周全市哨点医院ILI%为5.98%，比2022年同期低7.56个百分点，比2021年同期低0.66个百分点，其中国家级哨点医院ILI%为2.12%，比2022年同期低3.36个百分点，比2021年同期低4.67个百分点。城区哨点医院ILI%为4.45%，比2022年同期低6.81个百分点，比2021年同期低2.08个百分点；郊区、县（市）哨点医院ILI%为7.46%，比2022年同期低7.82个百分点，比2021年同期高0.54个百分点。 （三）各年龄组流感样病例构成情况 2023年第14周各年龄组报告的流感样病例构成情况为：0~4岁组1472例，5~14岁组1103例，15~24岁组406例，25~59岁组1266例，60岁以上组940例。", imgs:[], stem:"2023年第13周，H市郊区、县（市）哨点医院报告流感样病例约是城区的多少倍？", opts:{A:"1.7",B:"1.5",C:"1.3",D:"1.1"}, ans:"D"},
{id:"ZL071", no:"135-14", page:"134 135", kp:"现期平均数", material:"2019年A市专利密集型产业实现增加值6918.8亿元，比上年增长9.6%，分别高于战略性新兴产业、高技术产业增加值增速2.3个和1.7个百分点；专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。 2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，比规模以上重点企业高5.1个百分点。专利密集型产业每亿元R&D经费产生的发明专利申请量为73.1件，比规模以上重点企业高3.6件；企业户均拥有有效发明专利15.6件，是规模以上重点企业的2.2倍。从成果转化看，已被成功实施的发明专利数为5.2万件，占有效发明专利数的58.4%。 在专利密集型产业中，2019年信息通信技术服务业实现营业收入10198.5亿元，增速达41.3%；实现利润197.6亿元，比上年增长1倍；单位企业实现营业收入12亿元，是专利密集型产业平均水平的3.3倍。 在专利密集型产业中，2019年医药医疗产业营业收入、利润分别增长13.7%和5%；收入利润率达到17%，高于专利密集型产业平均水平4.1个百分点；单位企业营业收入、利润分别为4.5亿元和0.76亿元。", imgs:[], stem:"在专利密集型产业中，2019年A市信息通信技术服务业单位企业实现利润额约为多少亿元？", opts:{A:"0.18",B:"0.23",C:"0.35",D:"0.59"}, ans:"B"},

{id:"ZL073", no:"135-16", page:"135", kp:"间隔增长率", material:"2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。 2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。 2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。 2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。", imgs:[], stem:"2020年，全国服装出口额比2019年：", opts:{A:"增长了10%以上",B:"下降了10%以上",C:"增长了不到10%",D:"下降了不到10%"}, ans:"D"},
{id:"ZL074", no:"136-17", page:"135 136", kp:"现期比重", material:"2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。 2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。 2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。 2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。", imgs:[], stem:"2021年，全国针织、梭织服装及衣着附件总出口额约占纺织品服装出口总额的：", opts:{A:"55%",B:"50%",C:"45%",D:"40%"}, ans:"B"},
{id:"ZL076", no:"137-3", page:"136 137", kp:"现期倍数", material:"2021年上半年，S市工业战略性新兴产业总产值7164.68亿元，比去年同期增长19.6%，两年平均增长12.3%。其中，新能源汽车、新能源和高端装备产值同比分别增长2.5倍、32.1%和24.5%。 2021年上半年，全市第三产业增加值15080.35亿元，比去年同期增长11.3%。其中，信息传输、软件和信息技术服务业增加值1770.06亿元，比去年同期增加245.5亿元；批发和零售业增加值2428.92亿元，同比增长15.2%；金融业增加值3842.65亿元，比去年同期增加274.7亿元；房地产业增加值1812.18亿元，同比增长13.6%。 2021年上半年，全市社会消费品零售总额9048.44亿元，比去年同期增加了2104.14亿元。分行业看，批发和零售业零售额8287.13亿元，同比增长28.4%；住宿和餐饮业零售额761.31亿元，同比增长54.0%。2021年上半年，全市网上商店零售额1485.72亿元，比去年同期增加259.92亿元。 2021年上半年，全市新建商品房销售面积832.83万平方米，比去年同期增长29.2%。其中，新建商品住宅销售面积667.94万平方米，同比增长23.0%。", imgs:[], stem:"2021年上半年，S市批发和零售业零售额同比增量约是住宿和餐饮业的多少倍？", opts:{A:"3",B:"5",C:"7",D:"9"}, ans:"C"},
{id:"ZL077", no:"138-10", page:"137 138", kp:"现期平均数, 增长量比较, 基期平均数", material:"2022年1~7月，全国规模以上工业发电4.77万亿千瓦时，同比增长1.4%，增速比上半年加快0.7个百分点。7月份，全国发电量8059亿千瓦时，同比增长4.5%，增速比上月加快3.0个百分点。分品种看，7月份火电由降转增，同比增长5.3%；由于来水偏枯，水电同比增长2.4%，增速比上月放缓26.6个百分点；风电同比增长5.7%，增速比上月放缓11.0个百分点；核电同比下降3.3%，降幅比上月收窄5.7个百分点；太阳能发电同比增长13.0%，增速比上月加快3.1个百分点。 2022年1~7月，全社会用电量累计49303亿千瓦时，同比增长3.4%。分产业看，第一产业用电量634亿千瓦时，同比增长11.1%；第二产业用电量32552亿千瓦时，同比增长1.1%；第三产业用电量8531亿千瓦时，同比增长4.6%；城乡居民生活用电量7586亿千瓦时，同比增长12.5%。7月份，全社会用电量8324亿千瓦时，同比增长6.3%。分产业看，第一产业用电量121亿千瓦时，同比增长14.3%；第二产业用电量5132亿千瓦时，同比下降0.1%；第三产业用电量1591亿千瓦时，同比增长11.5%；城乡居民生活用电量1480亿千瓦时，同比增长26.8%。", imgs:[], stem:"能够从上述资料中推出的是：", opts:{A:"2022年7月全国太阳能发电增长量最大",B:"2022年6月全国核电发电量比5月份高",C:"2022年7月第二产业用电量高于上半年第二产业月均用电量",D:"2021年7月第一产业用电量低于2021年上半年第一产业月均用电量"}, ans:"C"},
{id:"ZL078", no:"139-14", page:"138 139", kp:"现期量计算", material:"2016年全国女性就业人员占全社会就业人员的比重为43.1%，其中城镇单位女性就业人员6518万人，比2010年增加1656万人。 2016年公有制企事业单位中女性专业技术人员1480万人，比2010年增加211万人，所占比重达47.8%，提高2.8个百分点；其中女性高级专业技术人员161万人，比2010年增加59.3万人，所占比重38.3%，提高3个百分点。 2016年企业董事会中女职工董事占职工董事的比重为39.9%，企业监事会中女职工监事占职工监事的比重为40.1%，比2010年分别提高7.2和4.9个百分点；企业职工代表大会中女性代表比重为28.7%，略低于2010年0.3个百分点。 2016年女性参加生育保险的人数达8020万人，比2010年增长49%。2016年，参加城镇职工基本医疗保险的女性1.4亿人，比2011年增长21.5%；参加城镇居民基本医疗保险的女性1.9亿人，比2011年增长了1.5倍。 2016年全国参加城镇职工基本养老保险人数3.8亿人，其中女性1.8亿人，占比比2010年提高3个百分点；2016年，参加城乡居民基本养老保险人数5.1亿人，其中女性超过1.7亿人。 2016年全国参加失业保险的人数超过1.8亿人，其中女性7551万人，分别比2010年增加4713万人和2402万人，增长约35%和47%；参加工伤保险人数2.2亿人，其中女性8129万人，分别比2010年增加5728万人和2429万人，增长约35%和43%。", imgs:[], stem:"如2017年及以后年份同比增量保持不变，同比增量按照2011-2016年间同比增量的平均值计算，全国参加失业保险的女性将在哪年超过1.2亿人？", opts:{A:"2024",B:"2026",C:"2028",D:"2030"}, ans:"C"},

{id:"ZL080", no:"141-2", page:"140 141", kp:"简单加减", material:"2020年，我国规模以上互联网和相关服务企业（以下简称互联网企业）业务收入12838亿元，同比增长12.5%，增速低于上年同期8.9个百分点。 2020年，互联网企业实现营业利润1187亿元，同比增长13.2%，增速低于上年同期3.7个百分点；得益于成本控制较好，营业成本仅增长2.4%，行业营业利润高出同期收入增速0.7个百分点。 2020年，互联网企业信息服务收入共7068亿元，同比增长11.5%，增速低于上年同期11.2个百分点。互联网接入及相关服务收入447.5亿元，同比增长11.5%，增速低于上年同期20.8个百分点；互联网数据服务（包括云服务、大数据服务等）收入199.8亿元，同比增长29.5%，增速较上年同期提高3.9个百分点。 2020年，东部地区互联网业务收入11227亿元，同比增长14.8%，增速较上年同期回落9个百分点，中部地区互联网业务收入448.1亿元，同比增长3.4%，增速较上年同期回落53.1个百分点。西部地区互联网业务收入497.2亿元，同比增长6.9%，增速较上年同期回落15.2个百分点。东北地区互联网业务收入47.1亿元，同比增长9.1%。 2020年，互联网业务累计收入居前5名的广东（增长5.2%）、北京（增长21.5%）、上海（增长20.9%）、浙江（增长24.4%）和江苏（增长8.0%）共完成互联网业务收入10706亿元，同比增长15.1%，增速超过全国平均水平2.6个百分点，占全国（扣除跨地区企业）比重达87.6%，占比较上年同期提高0.8个百分点。", imgs:[], stem:"2019年，互联网企业互联网接入及相关服务收入同比增速比同年信息服务收入同比增速：", opts:{A:"高不到10个百分点",B:"高10个百分点以上",C:"低不到10个百分点",D:"低10个百分点以上"}, ans:"A"},
{id:"ZL085", no:"146-4", page:"145 146", kp:"两期平均数", material:"2023年三季度，支付系统共处理支付业务3358.88亿笔，金额3151.37万亿元，同比分别增长12.59%和6.97%。 三季度，人民银行清算总中心系统共处理支付业务54.79亿笔，金额2379.52万亿元，同比分别增长0.92%和9.53%，其中，大额实时支付系统处理业务9518.17万笔，同比下降10.39%，金额2254.07万亿元，同比增长9.72%；小额批量支付系统处理业务11.51亿笔，金额46.69万亿元，同比分别增长5.73%和10.03%；网上支付跨行清算系统处理业务42.31亿笔，同比下降0.03%，金额74.66万亿元，同比增长5.38%；境内外币支付系统处理业务134.46万笔，同比增长2.83%，金额5707.35亿美元，同比下降14.63%。 在其他支付系统中，银行行内业务系统三季度处理业务54.42亿笔，同比增长11.14%，金额539.56万亿元，同比下降4.10%；银联跨行支付系统处理业务837.93亿笔，金额70.27万亿元，同比分别增长21.37%和8.70%；城银清算支付清算系统处理业务1056.40万笔，金额9744.45亿元，同比分别增长34.61%和36.31%；农信银支付清算系统处理业务7.41亿笔，金额7162.13亿元，同比分别下降39.98%和13.55%；人民币跨境支付系统处理业务176.43万笔，金额33.42万亿元，同比分别增长43.23%和31.41%；网联清算平台处理业务2404.21亿笔，金额126.92万亿元，同比分别增长10.42%和6.28%。", imgs:[], stem:"将其他支付系统中①银行行内业务系统、②银联跨行支付系统、③城银清算支付清算系统和④农信银支付清算系统按2023年三季度平均每笔业务金额同比增速从高到低排列，以下正确的是：", opts:{A:"①②③④",B:"③②①④",C:"④③②①",D:"④①②③"}, ans:"C"},
{id:"ZL087", no:"147-7", page:"147", kp:"基期平均数", material:"2020年1-2月，我国境内投资者共对全球147个国家和地区的1733家境外企业进行了非金融类直接投资，累计实现投资1078.6亿元人民币，同比增长1.8%。对外承包工程完成营业额1080亿元人民币，同比下降9.5%，新签合同额2150.3亿元人民币，同比增长38.3%。对外劳务合作派出各类劳务人员3.9万人，同比减少2.9万人，2月末在外各类劳务人员77.8万人。 2020年1-2月，我国对外投资合作主要呈现以下特点： 一是对“一带一路”投资合作增幅较大。2020年1-2月，我国企业对“一带一路”沿线的48个国家有新增投资，合计27.2亿美元，同比增长18.3%。在“一带一路”沿线的59个国家新签对外承包工程合同额153.6亿美元，同比增长25.6%，完成营业额91.4亿美元。 二是对外投资结构持续多元。2020年1-2月，对外投资主要流向租赁和商务服务业、批发和零售业、制造业和采矿业等传统投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其中流向租赁和商务服务业的投资额同比增长43.2%，成为增速最高的领域。 三是对外承包工程新签大项目增多。2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有115个，较去年同期增加29个，占新签合同总额的83.9%。", imgs:[], stem:"2019年1-2月，我国对外承包工程月均完成营业额比月均新签合同额：", opts:{A:"高不到300亿元人民币",B:"高300亿元人民币以上",C:"低不到300亿元人民币",D:"低300亿元人民币以上"}, ans:"C"},

{id:"ZL089", no:"147-9", page:"147 148", kp:"现期平均数", material:"2020年1-2月，我国境内投资者共对全球147个国家和地区的1733家境外企业进行了非金融类直接投资，累计实现投资1078.6亿元人民币，同比增长1.8%。对外承包工程完成营业额1080亿元人民币，同比下降9.5%，新签合同额2150.3亿元人民币，同比增长38.3%。对外劳务合作派出各类劳务人员3.9万人，同比减少2.9万人，2月末在外各类劳务人员77.8万人。 2020年1-2月，我国对外投资合作主要呈现以下特点： 一是对“一带一路”投资合作增幅较大。2020年1-2月，我国企业对“一带一路”沿线的48个国家有新增投资，合计27.2亿美元，同比增长18.3%。在“一带一路”沿线的59个国家新签对外承包工程合同额153.6亿美元，同比增长25.6%，完成营业额91.4亿美元。 二是对外投资结构持续多元。2020年1-2月，对外投资主要流向租赁和商务服务业、批发和零售业、制造业和采矿业等传统投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其中流向租赁和商务服务业的投资额同比增长43.2%，成为增速最高的领域。 三是对外承包工程新签大项目增多。2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有115个，较去年同期增加29个，占新签合同总额的83.9%。", imgs:[], stem:"如2020年1-2月人民币与美元的汇率稳定为7元人民币兑换1美元，则同期对外承包工程新签合同额在5000万美元以上的项目的平均新签合同额在以下哪个范围内？", opts:{A:"2亿美元以上",B:"1.5-2亿美元之间",C:"1-1.5亿美元之间",D:"0.5-1亿美元之间"}, ans:"A"},

{id:"ZL091", no:"149-14", page:"148 149", kp:"现期比重", material:"党的十八大以来，我国居民收入水平持续较快增长，消费水平稳步提高，消费结构优化升级，生活质量明显提升，人民生活正阔步迈向全面小康。 2019年，全国居民人均可支配收入30733元，比2000年增长4.4倍。全国居民人均消费支出21559元，比2012年增长78.9%，年均增长8.7%。其中，城镇居民人均消费支出28063元，比2012年增长64.0%；农村居民人均消费支出13328元，比2012年增长99.9%。 2019年全国居民恩格尔系数（人均食品支出占人均消费支出的比重）为28.2%，比2000年下降14.0个百分点。其中，城镇居民恩格尔系数为27.6%，农村居民恩格尔系数为30.0%，分别比2000年下降11.0和18.3个百分点。 2019年，全国居民平均每百户拥有彩色电视机120.6台、洗衣机96.0台、电冰箱100.9台、空调115.6台、汽车35.3辆。城镇居民人均住房建筑面积为39.8平方米，比2002年增长62.1%；农村居民人均住房建筑面积为48.9平方米，比2000年增长97.2%。全国居民人均交通通信支出2862元，比2000年年均增长14.7%，占人均消费支出的比重较2000年提高6.1个百分点。全国居民人均医疗保健支出1902元，比2000年年均增长13.4%，占人均消费支出的比重较2000年提高2.9个百分点。", imgs:[], stem:"2019年城镇居民人口占总人口的比重约为：", opts:{A:"52.7%",B:"53.8%",C:"54.1%",D:"55.9%"}, ans:"D"},

{id:"ZL102", no:"172-3", page:"171 172", kp:"一般增长率比较", material:"2021年12月，我国原煤产量3.8亿吨，同比增长7.2%；原油产量1647万吨，同比增长1.7%；天然气产量192亿立方米，同比增长2.3%；发电量7234亿千瓦时，同比下降2.1%。", imgs:["zlimage/tigan/综合_题93_材料图1.png","zlimage/tigan/综合_题93_材料图2.png"], stem:"将我国主要能源按2021年产量的同比增速从高到低排列，正确的是：", opts:{A:"电>天然气>原煤>原油",B:"天然气>电>原煤>原油",C:"电>原油>天然气>原煤",D:"天然气>原油>电>原煤"}, ans:"B"},
{id:"ZL103", no:"173-7", page:"172 173", kp:"现期比重", material:"2024年有48.07%的家庭收入持平，22.01%的家庭收入增加，其中6.09%的家庭收入明显增加；近三成被访者表示收入减少，其中11.23%的家庭明显减少。对于2025年的家庭收入，46.10%的居民预计将基本持平，19.04%的居民预期收入将增加，23.28%的居民对未来收入变化不确定，11.58%的居民预期收入将明显减少。 调查发现，47.01%的城乡居民日常购物以线上渠道为主，37.52%的城乡居民线上、线下并重，只有15.48%的城乡居民明确表示以线下为主。 不同群体的购物选择存在较大差异：一是代际断层，年轻群体成为线上消费主力，其中00后群体线上购物占比69.8%，比70后群体高了53.79个百分点；二是城乡分化，城镇居民的线上购物占比50.18%，高于农村居民11.66个百分点，务农群体选择线上购物的占比比农村居民还要低19.74个百分点；三是学历分化，高学历群体选择线上购物比例更高，硕士以上学历群体线上购物占比62.81%，远高于初中及以下学历群体的22.63%。", imgs:["zlimage/tigan/综合_题91_材料图.png"], stem:"已知2023年初我国人口为14.12亿，2025年初我国人口为14.08亿。根据调查分析的比例推测，2025年初我国更倾向于“只买必需品，多存点钱”的人数比2023年初：", opts:{A:"少不到0.1亿",B:"少0.1亿以上",C:"多不到0.1亿",D:"多0.1亿以上"}, ans:"B"},
{id:"ZL104", no:"173-9", page:"172 173", kp:"现期比重", material:"2024年有48.07%的家庭收入持平，22.01%的家庭收入增加，其中6.09%的家庭收入明显增加；近三成被访者表示收入减少，其中11.23%的家庭明显减少。对于2025年的家庭收入，46.10%的居民预计将基本持平，19.04%的居民预期收入将增加，23.28%的居民对未来收入变化不确定，11.58%的居民预期收入将明显减少。 调查发现，47.01%的城乡居民日常购物以线上渠道为主，37.52%的城乡居民线上、线下并重，只有15.48%的城乡居民明确表示以线下为主。 不同群体的购物选择存在较大差异：一是代际断层，年轻群体成为线上消费主力，其中00后群体线上购物占比69.8%，比70后群体高了53.79个百分点；二是城乡分化，城镇居民的线上购物占比50.18%，高于农村居民11.66个百分点，务农群体选择线上购物的占比比农村居民还要低19.74个百分点；三是学历分化，高学历群体选择线上购物比例更高，硕士以上学历群体线上购物占比62.81%，远高于初中及以下学历群体的22.63%。", imgs:["zlimage/tigan/综合_题91_材料图.png"], stem:"在参与调查的居民中，2024年家庭收入未减少且2025年预期收入将基本持平的家庭数量：", opts:{A:"至少占16.18%",B:"至少占46.10%",C:"至多占16.18%",D:"至多占70.08%"}, ans:"A"},

{id:"ZL126", no:"209-4", page:"208 209", kp:"一般增长率计算", material:"2019年12月31日，中国共产党党员总数为9191.6万名，同比增长1.46%。在党员的性别、民族和学历上，女党员2559.9万名，少数民族党员680.3万名，大专及以上学历党员4661.5万名。在党员的入党时间上，新中国成立前入党的17.4万名，新中国成立后至党的十一届三中全会前入党的1550.9万名，党的十一届三中全会后至党的十八大前入党的6127.7万名，党的十八大以来入党的1495.6万名。在党员的职业上，工人（含工勤技能人员）644.5万名，农牧渔民2556.1万名，企事业单位、社会组织专业技术人员1440.3万名，企事业单位、社会组织管理人员1010.4万名，党政机关工作人员767.8万名，学生196.0万名，其他职业人员710.4万名，离退休人员1866.1万名。 2019年共发展党员234.4万名，比上年增长14.06%。其中，发展女党员99.4万名，占42.4%；发展少数民族党员23.6万名，占10.1%；发展35岁及以下党员188.3万名，占80.3%；发展具有大专及以上学历的党员106.8万名，占45.6%。发展党员的职业上，工人（含工勤技能人员）14.3万名，企事业单位、社会组织专业技术人员31.6万名，企事业单位、社会组织管理人员25.3万名，农牧渔民42.4万名，党政机关工作人员13.4万名，学生84.4万名，其他职业人员22.9万名。", imgs:["zlimage/tigan/综合_题9_材料图.png"], stem:"截至2019年12月31日，55岁以上党员人数比46岁以下党员人数：", opts:{A:"多14.36%",B:"少14.36%",C:"多16.76%",D:"少16.76%"}, ans:"B"},

{id:"ZL130", no:"216-9", page:"216", kp:"现期比重", material:"2023年，我国跨境电商进出口2.37万亿元人民币，比2022年（下同）增长15.3%，占同期我国货物贸易进出口总值的5.7%，比重提升0.8个百分点。其中，出口约1.84万亿元，增长20.2%，占同期我国出口总值的7.7%，进口约5335.2亿元，增长1.1%，占同期我国进口总值的3%。 从出口目的地看，美国（37.4%）、英国（8.7%）、德国（4.7%）、俄罗斯（4.6%）、法国（3.7%），合计占出口总额近6成；泰国（2.5%）、越南（2.4%）、马来西亚（2.4%）、澳大利亚（2.1%）等新兴市场活跃。美国（15.6%）、日本（13.5%）、澳大利亚（11.2%）、法国（7.9%）、韩国（7.2%）、新西兰（7%）、德国（6.4%）、意大利（3.6%）、英国（3.4%）、荷兰（3.3%）是主要进口来源地。", imgs:["zlimage/tigan/综合_题13_材料图.png"], stem:"2023年，在跨境电商进出口贸易中，我国与下列哪个国家出现贸易逆差？", opts:{A:"德国",B:"法国",C:"英国",D:"澳大利亚"}, ans:"D"},

{id:"ZL135", no:"223-9", page:"222 223", kp:"现期比重", material:"2019年2月中下旬，某市统计局随机抽取2000名在该市居住半年以上的18～65周岁居民，就其2019年春节期间的消费情况进行了调查。调查结果显示：与上年春节相比，28.3%的受访居民消费支出有所增加，58.0%的受访居民消费支出基本持平。", imgs:["zlimage/tigan/综合_题17_材料图1.png","zlimage/tigan/综合_题17_材料图2.png"], stem:"2019年春节期间消费支出在5000元以上的受访居民人数有可能是：", opts:{A:"320人",B:"388人",C:"420人",D:"456人"}, ans:"B"},
{id:"ZL138", no:"230-6", page:"229 230", kp:"年均增长率", material:"2021年，各地区各部门全面落实党中央、国务院关于实现数字乡村发展战略的决策部署，积极引入社会资本投资建数字乡村。2021年全国用于县域农业农村信息化建设的社会资本投入为954.6亿元，县均社会资本投入3588.8万元、乡村人均社会资本投入135.2元，分别比上年增长17.2%和24.0%。分区域看，东部地区社会资本投入562.4亿元，占全国社会资本投入58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿元。", imgs:["zlimage/tigan/综合_题21_材料图1.png","zlimage/tigan/综合_题21_材料图2.png"], stem:"2019-2021年，全国县域农业农村信息化建设县均社会资本投入的年均增率约为（ ）。", opts:{A:"10%",B:"21%",C:"32%",D:"43%"}, ans:"C"},
{id:"ZL139", no:"231-8", page:"229 230 231", kp:"现期倍数", material:"2021年，各地区各部门全面落实党中央、国务院关于实现数字乡村发展战略的决策部署，积极引入社会资本投资建数字乡村。2021年全国用于县域农业农村信息化建设的社会资本投入为954.6亿元，县均社会资本投入3588.8万元、乡村人均社会资本投入135.2元，分别比上年增长17.2%和24.0%。分区域看，东部地区社会资本投入562.4亿元，占全国社会资本投入58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿元。", imgs:["zlimage/tigan/综合_题21_材料图1.png","zlimage/tigan/综合_题21_材料图2.png"], stem:"2021年，东部地区县域农业农村信息化建设社会资本投入约是中、西部地区之和的（ ）倍。", opts:{A:"1.43",B:"1.64",C:"1.80",D:"1.95"}, ans:"A"},
{id:"ZL140", no:"231-9", page:"229 230 231", kp:"一般增长率比较", material:"2021年，各地区各部门全面落实党中央、国务院关于实现数字乡村发展战略的决策部署，积极引入社会资本投资建数字乡村。2021年全国用于县域农业农村信息化建设的社会资本投入为954.6亿元，县均社会资本投入3588.8万元、乡村人均社会资本投入135.2元，分别比上年增长17.2%和24.0%。分区域看，东部地区社会资本投入562.4亿元，占全国社会资本投入58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿元。", imgs:["zlimage/tigan/综合_题21_材料图1.png","zlimage/tigan/综合_题21_材料图2.png"], stem:"2021年，关于县域农业农村信息化建设，下列数据同比增长率最大的是（ ）。", opts:{A:"东部地区县均社会资本投入",B:"东部地区乡村人均社会资本投入",C:"西部地区县均社会资本投入",D:"西部地区乡村人均社会资本投入"}, ans:"D"},
{id:"ZL141", no:"232-14", page:"231 232", kp:"现期倍数", material:"2021年，全国城市供水总量673.34亿立方米，同比增长6.96%；城市供水管道长度105.99万公里，同比增长5.26%；人均日生活用水量185.03升；供水普及率99.38%，比上年增加0.39个百分点。天津、河北、上海、江苏、浙江和广东6个省（市）城市供水普及率达到100%；福建、山东、湖北、广西、安徽、辽宁、宁夏、新疆、内蒙古、山西、甘肃、河南、黑龙江、江西、云南和湖南16个省（区）超过99%（含）；西藏、青海、北京、四川、贵州和陕西6个省（区、市）超过98%；重庆、吉林、海南3个省（市）和新疆建设兵团超过95%。", imgs:["zlimage/tigan/综合_题24_材料图.png"], stem:"图2中，城市人均日生活用水量最高的省份是用水量中位数省份的约：", opts:{A:"1.78倍",B:"1.88倍",C:"1.95倍",D:"2.03倍"}, ans:"B"},
{id:"ZL143", no:"235-2", page:"234 235", kp:"两期比重", material:"2018年全球茶叶产量585.6万吨，同比增长约3%，中国茶叶产量261.6万吨，同比增长0.7万吨。2018年，中国茶叶国内销售量为191万吨，同比增长5.1%，国内销售总额为2661亿元，出口量为36.5万吨，同比增长2.8%，出口总额为17.89亿美元（合人民币120亿元），同比增长（？）。", imgs:["zlimage/tigan/综合_题26_材料图.png"], stem:"设中国茶叶国内销售量和出口量与当年中国茶叶产量的比值分别为x和y，则2018年的x和y值与2017年分别相比：", opts:{A:"两者均下降",B:"两者均上升",C:"只有x值上升",D:"只有y值上升"}, ans:"B"},
{id:"ZL144", no:"236-7", page:"236", kp:"现期倍数", material:"2019年，我国快递业务量为635.2亿件，其中东部、中部、西部地区分别完成业务量506.3亿件、81.9亿件和47亿件。全年快递业务收入7497.8亿元，其中东部、中部、西部地区的业务收入所占比重分别为80.2%、11.3%和8.5%。东部、中部、西部地区业务收入占全国比重分别比上年上升0.2个百分点、上升0.1个百分点和下降0.3个百分点。 2016-2018年，我国快递业务收入分别为3974.4亿元、4957.1亿元、6038.4亿元。", imgs:["zlimage/tigan/综合_题27_材料图.png"], stem:"2019年，中部地区平均每件快递产生的快递业务收入约是西部地区的多少倍？", opts:{A:"0.5",B:"0.8",C:"1.3",D:"2.1"}, ans:"B"},

{id:"ZL149", no:"243-14", page:"243 244", kp:"现期倍数", material:"2019年，1043.0万残疾儿童及持证残疾人得到基本康复服务，其中包括0～6岁残疾儿童18.1万人。 截至2019年末，全国已竣工的各级残疾人综合服务设施2341个，总建设规模584.5万平方米，总投资183.1亿元；已竣工各级残疾人康复设施1006个，总建设规模414.2万平方米，总投资132.2亿元。", imgs:["zlimage/tigan/综合_题33_材料图2.png","zlimage/tigan/综合_题33_材料图4.png"], stem:"截至2019年末，全国平均每个已竣工的残疾人综合服务设施建设规模约是已竣工残疾人康复设施的多少倍？", opts:{A:"0.6",B:"0.8",C:"1.2",D:"1.7"}, ans:"A"},
{id:"ZL150", no:"244-13", page:"243 244", kp:"简单加减", material:"2019年，1043.0万残疾儿童及持证残疾人得到基本康复服务，其中包括0～6岁残疾儿童18.1万人。 截至2019年末，全国已竣工的各级残疾人综合服务设施2341个，总建设规模584.5万平方米，总投资183.1亿元；已竣工各级残疾人康复设施1006个，总建设规模414.2万平方米，总投资132.2亿元。", imgs:["zlimage/tigan/综合_题33_材料图2.png","zlimage/tigan/综合_题33_材料图4.png"], stem:"如提供视力残疾康复服务的残疾人康复机构中，同时提供听力言语残疾康复服务的机构比不提供该服务的机构多20%，则2019年末全国有多少家残疾人康复机构不提供以上两种康复服务中的任意一种？", opts:{A:"不到7300家",B:"7300～7600家之间",C:"7600～7900家之间",D:"超过7900家"}, ans:"B"},
{id:"ZL151", no:"245-17", page:"245", kp:"一般增长率比较", material:"2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长9.5%，在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少2.9%。 2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：", imgs:["zlimage/tigan/综合_题35_材料图.png"], stem:"2015~2019年，移动电话基站总量同比增速最快的年份是：", opts:{A:"2015年",B:"2016年",C:"2017年",D:"2019年"}, ans:"A"},
{id:"ZL152", no:"246-19", page:"245 246", kp:"现期量计算", material:"2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长9.5%，在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少2.9%。 2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：", imgs:["zlimage/tigan/综合_题35_材料图.png"], stem:"假设4G基站数保持2019年同比增量不变，且由于5G技术的快速普及，2020年开始每年非4G基站同比增量均为300万个。问哪一年4G基站数占移动电话基站总量的比重将下降到50%以下？", opts:{A:"2021",B:"2022",C:"2023",D:"2024"}, ans:"A"},
{id:"ZL153", no:"246-20", page:"245 246", kp:"增长量计算, 两期比重, 一般增长率比较", material:"2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长9.5%，在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少2.9%。 2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：", imgs:["zlimage/tigan/综合_题35_材料图.png"], stem:"能够从上述资料中推出的是：", opts:{A:"2019年移动通信业务收入占电信业务收入的比重同比下降了2.9个百分点",B:"2019年固定通信业务收入同比增长了400多亿元",C:"2015~2019年间，非4G基站数量逐年递增",D:"2015~2019年间，4G基站数同比增速和增量最大的年份不是同一个"}, ans:"D"},
{id:"ZL154", no:"247-2", page:"246 247", kp:"一般增长率计算", material:"2019年间，4G基站数同比增速和增量最大的年份不是同一个 截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用电视上网的比例为25.9%；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%，农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。 2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%，互联网进一步向中老年群体渗透。 2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%。互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。农村地区在线教育和互联网医疗用户分别占农村网民整体的31%和21.5%，较上年分别增加2.7%和4.1%。", imgs:["zlimage/tigan/综合_题38_材料图.png"], stem:"截至2022年12月，我国城镇网民规模同比增速约为：", opts:{A:"1.2%",B:"1.6%",C:"2.0%",D:"2.4%"}, ans:"B"},
{id:"ZL155", no:"247-3", page:"246 247", kp:"增长量计算", material:"2019年间，4G基站数同比增速和增量最大的年份不是同一个 截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%，较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用电视上网的比例为25.9%；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我国城镇网民规模约为7.59亿，占网民整体的71.1%，农村网民规模约为3.08亿，较2021年12月增长约2371万，占网民整体的28.9%。 2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占比由2021年12月的26.8%提升至30.8%，互联网进一步向中老年群体渗透。 2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%。互联网医疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。农村地区在线教育和互联网医疗用户分别占农村网民整体的31%和21.5%，较上年分别增加2.7%和4.1%。", imgs:["zlimage/tigan/综合_题38_材料图.png"], stem:"2019-2022年，当年12月我国城镇与农村互联网普及率同比增量相差在1个百分点以内的年份有几个？", opts:{A:"1",B:"2",C:"3",D:"4"}, ans:"A"},

{id:"ZL161", no:"255-7", page:"254 255", kp:"两期平均数", material:"2022年，我国废钢铁、废有色金属等十个品种（详见表格）再生资源回收总重量约为37067.7万吨，同比下降2.62%，回收总金额约为13140.6亿元，同比下降4.05%。2022年废有色金属中废铅回收重量同比增长5.56%。2022年我国报废机动车回收数量399.1万辆，同比增长32.9%，回收数量占我国机动车保有量的9.57‰。", imgs:["zlimage/tigan/综合_题46_材料图1.png","zlimage/tigan/综合_题46_材料图2.png"], stem:"相比2021年，2022年我国废纸平均回收价格（平均回收价格 ）：", opts:{A:"下调约170元/吨",B:"下调约347元/吨",C:"上调约170元/吨",D:"上调约347元/吨"}, ans:"A"},
{id:"ZL163", no:"257-11", page:"256 257", kp:"基期和差", material:"其中，机床工具商品进口105.2亿美元，同比增长23.7%；出口137.4亿美元，同比增长40.8%。 从进口来源来看，2021年1～9月进口来源前三位分别是：日本34.5亿美元，同比增长37.8%；德国22.2亿美元，同比增长11.0%；中国台湾14.3亿美元，同比增长36.1%。 从出口去向来看，2021年1～9月出口去向前三位分别是：美国17.5亿美元，同比增长27.4%；越南10.5亿美元，同比增长35.4%；印度8.8亿美元，同比增长67.8%。", imgs:["zlimage/tigan/综合_题48_材料图1.png","zlimage/tigan/综合_题48_材料图2.png"], stem:"2020年1～9月，我国机床工具贸易状况为：", opts:{A:"顺差10亿美元以上",B:"顺差不到10亿美元",C:"逆差10亿美元以上",D:"逆差不到10亿美元"}, ans:"A"},
{id:"ZL165", no:"257-15", page:"256 257", kp:"增长量计算, 一般增长率比较, 基期量计算", material:"其中，机床工具商品进口105.2亿美元，同比增长23.7%；出口137.4亿美元，同比增长40.8%。 从进口来源来看，2021年1～9月进口来源前三位分别是：日本34.5亿美元，同比增长37.8%；德国22.2亿美元，同比增长11.0%；中国台湾14.3亿美元，同比增长36.1%。 从出口去向来看，2021年1～9月出口去向前三位分别是：美国17.5亿美元，同比增长27.4%；越南10.5亿美元，同比增长35.4%；印度8.8亿美元，同比增长67.8%。", imgs:["zlimage/tigan/综合_题48_材料图1.png","zlimage/tigan/综合_题48_材料图2.png"], stem:"能够从上述资料中推出的是：", opts:{A:"2021年1～9月，我国机床工具自日本进口同比增量是德国增量的5倍多",B:"2021年1～9月，进口额同比增速最高的机床工具产品类型是金属切削机床",C:"2021年1～9月，进出口总额超过30亿美元的机床工具产品有3种",D:"2020年1～9月，我国机床工具对印度出口额不到5亿美元"}, ans:"C"},
{id:"ZL166", no:"260-4", page:"256 260", kp:"现期平均数", material:"据国家统计局数据显示，2021年我国研究与试验发展（R&D）经费支出27864亿元，同比增长14.2%，占国内生产总值之比为2.44%，其中基础研究经费1696亿元。国家自然科学基金共资助4.87万个项目。2021年全年授予专利权460.1万件，同比增长26.4%；PCT专利申请受理量7.3万件。截至2021年末，有效专利1542.1万件，其中境内有效发明专利270.4万件。每万人口高价值发明专利拥有量7.5件。全年商标注册773.9万件，同比增长34.3%。全年共签订技术合同67万项，技术合同成交金额37294亿元，同比增长32.0%。", imgs:["zlimage/tigan/综合_题52_材料图1.png","zlimage/tigan/综合_题52_材料图2.png"], stem:"2017~2021年，我国研究与试验发展经费支出超过年平均值的年份的个数是：", opts:{A:"1个",B:"2个",C:"3个",D:"4个"}, ans:"B"},
{id:"ZL167", no:"260-5", page:"259 260", kp:"现期比重, 增长量计算", material:"据国家统计局数据显示，2021年我国研究与试验发展（R&D）经费支出27864亿元，同比增长14.2%，占国内生产总值之比为2.44%，其中基础研究经费1696亿元。国家自然科学基金共资助4.87万个项目。2021年全年授予专利权460.1万件，同比增长26.4%；PCT专利申请受理量7.3万件。截至2021年末，有效专利1542.1万件，其中境内有效发明专利270.4万件。每万人口高价值发明专利拥有量7.5件。全年商标注册773.9万件，同比增长34.3%。全年共签订技术合同67万项，技术合同成交金额37294亿元，同比增长32.0%。", imgs:["zlimage/tigan/综合_题52_材料图1.png","zlimage/tigan/综合_题52_材料图2.png"], stem:"下列说法正确的是：", opts:{A:"2021年，我国基础研究经费占R&D经费的比重不到5%",B:"2021年，全国有效专利中有效发明专利不到20%",C:"2021年，专利授权数比上一年增加不超过100万件",D:"2021年，我国技术合同成交金额比上一年增加超过万亿元"}, ans:"C"},
{id:"ZL169", no:"262-12", page:"262 263", kp:"一般增长率计算", material:"实现利润总额10676亿元，同比增长7.8%；人均实现业务收入115.8万元，同比增长8.6%。 分领域看，2020年，软件产品实现收入22758亿元，同比增长10.1%；其中，工业软件产品实现收入1974亿元，增长11.2%。信息技术服务实现收入49868亿元，比上年同期增加6579亿元；其中，电子商务平台技术服务收入9095亿元，同比增长10.5%；云服务、大数据服务共实现收入4116亿元，同比增长11.1%。信息安全产品和服务实现收入1540亿元，同比增长10.0%，增速较上年回落2.4个百分点。嵌入式系统软件实现收入7492亿元，比上年同期增加803亿元，增速较上年提高4.2个百分点。", imgs:["zlimage/tigan/综合_题54_材料图.png"], stem:"2014~2020年，我国软件和信息技术服务业完成业务收入同比增速超过15%的年份有几个？", opts:{A:"2",B:"3",C:"4",D:"5"}, ans:"B"},
{id:"ZL173", no:"266-3", page:"265 266", kp:"简单加减", material:"2022年上半年，我国软件与信息技术服务业总收入同比增长10.9%，增速较1~5月份提高0.3个百分点。软件与信息技术服务业收入中，软件产品收入、信息技术服务收入、信息安全收入、嵌入式系统软件收入同比分别增长10.2%、12%、11.4%和5%。信息技术服务收入中，云计算、大数据服务收入4790亿元，同比增长9.3%；集成电路设计收入1279亿元，同比增长15.2%。 2022年上半年，我国东部、中部、西部、东北地区完成软件与信息技术服务业总收入同比增速分别为10.2%、14.4%、15.9%和6.3%。", imgs:["zlimage/tigan/综合_题56_材料图.png"], stem:"在全国4个地区中，2022年二季度四类软件与信息技术服务业收入均高于一季度水平的有几个？", opts:{A:"4",B:"3",C:"2",D:"1"}, ans:"C"},

/* ===== 渲染 ===== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const LETTERS = ["A","B","C","D"];
const groupsOf = q => q.kp.split(",").map(s=>s.trim());

/* 考点分类顺序（依据考点映射表） */
const SECTION_ORDER = ["现期比重","现期平均数","现期倍数","增长量计算","两期比重","简单加减","一般增长率计算","一般增长率比较","增长量比较","基期比重","基期量计算","直接找数","基期平均数","两期平均数","年均增长率","间隔增长率","混合增长率","基期和差","基期倍数","年均增长量","现期量计算","排序题","倍数与增长"];
const KEY_SECTIONS = ["现期比重","现期倍数","现期平均数"];

function cardHtml(q,i){
  const kpTags = groupsOf(q).map(k=>`<span class="kp-tag">${esc(k)}</span>`).join("");
  const imgHtml = (q.imgs && q.imgs.length)
    ? `<div class="imgs">${q.imgs.map(src=>`<img src="${esc(src)}" alt="配图" loading="lazy">`).join("")}</div>` : "";
  const matHtml = `
      <div class="block">
        <span class="label label-mat">材料</span>
        <div class="content">
          ${q.material ? `<div class="mat-text">${esc(q.material)}</div>` : `<div class="mat-text" style="color:#98a2b3">（本题无文字材料，请见配图）</div>`}
          ${imgHtml}
        </div>
      </div>`;
  const optsHtml = LETTERS.map(L=>`
      <li data-q="${i}" data-k="${L}">
        <input type="radio" name="q${i}" value="${L}" id="q${i}_${L}">
        <span class="k">${L}</span><span class="v">${esc(q.opts[L])}</span>
      </li>`).join("");
  return `
    <a class="anchor" id="${esc(q.id)}"></a>
    <section class="q" id="card-${i}">
      <div class="q-head">
        <span class="badge-id">${esc(q.id)}</span>
        <span class="q-no">题号 ${esc(q.no)}</span>
        <span class="q-page">书籍页码 ${esc(q.page)}</span>
        <span class="q-kp">${kpTags}</span>
      </div>
      ${matHtml}
      <div class="block">
        <span class="label label-stem">题干</span>
        <div class="content"><div class="stem-text">${esc(q.stem)}</div></div>
      </div>
      <ul class="opts">${optsHtml}</ul>
      <div class="verdict"></div>
    </section>`;
}

function render(){
  const sheet = document.getElementById("sheet");
  const items = DATA.map((q,i)=>({q,i}));
  let html = "";
  SECTION_ORDER.forEach(sec=>{
    const members = items.filter(o=>groupsOf(o.q).includes(sec));
    if(!members.length) return;
    const primary = members.filter(o=>groupsOf(o.q)[0]===sec);
    const secondary = members.filter(o=>groupsOf(o.q)[0]!==sec);
    const keyBadge = KEY_SECTIONS.includes(sec) ? `<span class="sec-key">重点攻坚</span>` : "";
    let inner = `<h2 class="sec">${esc(sec)}${keyBadge}<span class="sec-n">共 ${members.length} 题</span></h2>`;
    inner += primary.map(o=>cardHtml(o.q,o.i)).join("");
    if(secondary.length){
      inner += `<div class="xref">↳ 交叉考点（完整题干见主分类）：` +
        secondary.map(o=>`<a href="#${esc(o.q.id)}">${esc(o.q.id)}</a>`).join("、") + `</div>`;
    }
    html += `<div class="sec-block" data-idx="${primary.map(o=>o.i).join(",")}">${inner}</div>`;
  });
  sheet.innerHTML = html;

  sheet.querySelectorAll(".opts li").forEach(li=>{
    li.addEventListener("click", e=>{
      const i = li.dataset.q;
      const inp = li.querySelector("input");
      inp.checked = true;
      document.querySelectorAll(`.opts li[data-q="${i}"]`).forEach(x=>x.classList.remove("sel"));
      li.classList.add("sel");
      document.getElementById("card-"+i).classList.remove("right","wrong");
      document.querySelector(`#card-${i} .verdict`).textContent = "";
      updateDone();
      applyFilter();
    });
  });
}

function selectedOf(i){
  const inp = document.querySelector(`input[name="q${i}"]:checked`);
  return inp ? inp.value : "";
}
function updateDone(){
  let n = 0;
  for(let i=0;i<DATA.length;i++) if(selectedOf(i)) n++;
  document.getElementById("doneN").textContent = n;
}

/* ===== 隐藏 / 显示已作答的题目 ===== */
let hideDone = false;
function toggleDone(){
  hideDone = !hideDone;
  const btn = document.getElementById("btnDone");
  btn.textContent = hideDone ? "显示全部" : "隐藏已完成";
  btn.classList.toggle("btn-primary", hideDone);
  btn.classList.toggle("btn-ghost", !hideDone);
  applyFilter();
}
function applyFilter(){
  const vis = DATA.map((q,i)=> !(hideDone && selectedOf(i)));
  DATA.forEach((q,i)=>{
    const card = document.getElementById("card-"+i);
    if(card) card.style.display = vis[i] ? "" : "none";
  });
  document.querySelectorAll(".sec-block").forEach(blk=>{
    const idxs = (blk.dataset.idx || "").split(",").filter(s=>s!=="").map(Number);
    blk.style.display = idxs.some(i=>vis[i]) ? "" : "none";
  });
}

/* ===== 判定正确率 ===== */
function grade(){
  let right=0, answered=0;
  DATA.forEach((q,i)=>{
    const card = document.getElementById("card-"+i);
    const v = card.querySelector(".verdict");
    const sel = selectedOf(i);
    card.classList.remove("right","wrong");
    if(!sel){ v.textContent=""; return; }
    answered++;
    if(sel === q.ans){ right++; card.classList.add("right"); v.textContent="✔ 正确"; }
    else { card.classList.add("wrong"); v.textContent="✘ 错误"; }
  });
  const rate = answered ? (right/answered*100).toFixed(1) : "0.0";
  document.getElementById("score").innerHTML =
    `已作答 <b>${answered}</b> / ${DATA.length} ｜ 正确 <b class="ok">${right}</b> ｜ 错误 <b class="bad">${answered-right}</b> ｜ 正确率 <b>${rate}%</b>`;
  applyFilter();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ===== 清空作答 ===== */
function resetAll(){
  document.querySelectorAll(".opts li").forEach(li=>li.classList.remove("sel"));
  document.querySelectorAll('input[type="radio"]').forEach(i=>i.checked=false);
  document.querySelectorAll(".q").forEach(c=>c.classList.remove("right","wrong"));
  document.querySelectorAll(".verdict").forEach(v=>v.textContent="");
  document.getElementById("score").innerHTML = `已作答 <b id="doneN">0</b> / ${DATA.length}`;
  applyFilter();
}

/* ===== 导出作答记录（仅 编号、题号、作答记录）===== */
function exportRecords(){
  const lines = ["编号,题号,作答记录"];
  DATA.forEach((q,i)=>{
    const sel = selectedOf(i) || "";
    lines.push(`${q.id},${q.no},${sel}`);
  });
  const blob = new Blob(["\ufeff"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  a.href = url; a.download = `资料分析_半会半错_作答记录_${stamp}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
updateDone();
</script>

</html>
