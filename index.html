<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>错题复盘 · 刷题系统</title>
<style>
  :root{
    --primary:#2563eb; --primary-d:#1d4ed8; --ok:#16a34a; --bad:#dc2626;
    --bg:#f1f5f9; --card:#ffffff; --text:#1e293b; --muted:#64748b;
    --line:#e2e8f0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; font-size:16px; line-height:1.6;}
  .wrap{max-width:720px; margin:0 auto; padding:10px 12px calc(20px + env(safe-area-inset-bottom));}
  h1{font-size:19px; margin:8px 0 4px; text-align:center;}
  .sub{font-size:12px; color:var(--muted); text-align:center; margin:0 0 12px;}
  /* tabs */
  .tabs{display:flex; gap:8px; margin-bottom:12px;}
  .tabs button{flex:1; min-height:44px; border:none; border-radius:10px; background:#e2e8f0; color:#334155; font-size:15px; font-weight:600; cursor:pointer;}
  .tabs button.active{background:var(--primary); color:#fff;}
  /* card */
  .card{background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(15,23,42,.06);}
  .qhead{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .tag{background:#eef2ff; color:var(--primary-d); border-radius:6px; padding:2px 8px; font-size:12px; white-space:nowrap;}
  .stem{font-size:16px; margin-bottom:10px; white-space:pre-wrap; word-break:break-word;}
  .opt{display:flex; gap:8px; align-items:flex-start; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; margin:6px 0; background:#fff; transition:background .15s,border-color .15s;}
  .opt .key{flex:none; font-weight:700; color:var(--primary-d); min-width:22px;}
  .opt .txt{word-break:break-word;}
  .opt.correct{border-color:var(--ok); background:#f0fdf4;}
  .opt.correct .key{color:var(--ok);}
  .opt.wrong{border-color:var(--bad); background:#fef2f2;}
  .opt.wrong .key{color:var(--bad);}
  .opt.clickable{cursor:pointer;}
  .opt.clickable:active{background:#f8fafc;}
  .opt.disabled{opacity:.55;}
  /* review blocks */
  .block{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);}
  .block .bhead{font-size:13px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .bhead .num{display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--primary); color:#fff; font-size:12px; align-items:center; justify-content:center; flex:none;}
  input[type=text], textarea{width:100%; padding:10px 11px; border:1.5px solid var(--line); border-radius:9px; font:inherit; font-size:15px; color:var(--text); background:#fff;}
  textarea{resize:vertical; min-height:72px;}
  input:focus, textarea:focus{outline:none; border-color:var(--primary);}
  .ansbox{background:#f0fdf4; border:1.5px solid var(--ok); color:#14532d; border-radius:9px; padding:10px 12px; font-size:15px;}
  /* buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; text-align:center;}
  .btn:active{background:var(--primary-d);}
  .btn.ghost{background:#e2e8f0; color:#334155;}
  .btn.ghost:active{background:#cbd5e1;}
  .btn.danger{background:#fef2f2; color:var(--bad); border:1.5px solid var(--bad);}
  .btn.block{width:100%;}
  .btn.sm{min-height:34px; padding:0 12px; font-size:13px; border-radius:8px;}
  .nav{display:flex; gap:8px; margin-top:12px;}
  .nav .btn{flex:1;}
  /* progress */
  .pbar{height:8px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin:8px 0;}
  .pbar>div{height:100%; background:var(--primary); border-radius:99px; transition:width .2s;}
  .meta{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:4px;}
  /* controls */
  .ctrl{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
  .ctrl select, .ctrl input[type=checkbox]{font:inherit;}
  select{border:1.5px solid var(--line); border-radius:8px; padding:7px 8px; background:#fff; color:var(--text); font-size:14px;}
  label.chk{display:inline-flex; align-items:center; gap:5px; font-size:14px; background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer;}
  /* history */
  .hist-item{border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; background:#fff;}
  .hist-top{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px;}
  .acc{font-weight:700; font-size:16px;}
  .acc.ok{color:var(--ok);} .acc.mid{color:#d97706;} .acc.bad{color:var(--bad);}
  .wrong-row{font-size:13px; padding:6px 0; border-top:1px dashed var(--line);}
  .wrong-row .wa{color:var(--bad); font-weight:700;}
  .wrong-row .ra{color:var(--ok); font-weight:700;}
  .empty{text-align:center; color:var(--muted); padding:30px 0; font-size:14px;}
  .stat{display:flex; gap:10px; margin-bottom:10px;}
  .stat .box{flex:1; background:#fff; border-radius:10px; padding:10px; text-align:center; border:1.5px solid var(--line);}
  .stat .v{font-size:22px; font-weight:700;}
  .stat .k{font-size:12px; color:var(--muted);}
  .chip{font-size:12px; border-radius:6px; padding:2px 8px;}
  .chip.done{background:#f0fdf4; color:var(--ok);}
  .chip.undone{background:#fef2f2; color:var(--bad);}
  .hint{font-size:12px; color:var(--muted);}
  .jumprow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; max-height:180px; overflow:auto;}
  .jumprow button{width:38px; height:34px; border-radius:8px; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-size:13px;}
  .jumprow button.cur{background:var(--primary); color:#fff; border-color:var(--primary);}
  .hiddensc{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden;}
  .feed{font-size:15px; font-weight:700; margin:10px 0 4px;}
  .feed.ok{color:var(--ok);} .feed.no{color:var(--bad);}
  .answer-line{font-size:14px; color:#14532d; background:#f0fdf4; border-radius:8px; padding:8px 10px; margin-top:6px;}
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1e3a5f,#0f172a);display:flex;align-items:center;justify-content:center;padding:20px;}
#lock .lockbox{background:#fff;border-radius:16px;padding:28px 26px;width:100%;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center;}
#lock .lock-title{font-size:20px;font-weight:800;color:#1e293b;}
#lock .lock-sub{font-size:13px;color:#64748b;margin:6px 0 16px;}
#lock input{width:100%;padding:11px 12px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:16px;text-align:center;letter-spacing:2px;box-sizing:border-box;}
#lock input:focus{outline:none;border-color:#2563eb;}
#lock button{width:100%;margin-top:12px;min-height:44px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
#lock .lock-err{color:#dc2626;font-size:13px;margin-top:10px;display:none;}</style>
</head>
<body><div id="lock"><div class="lockbox"><div class="lock-title">&#128274; 错题系统</div><div class="lock-sub">请输入访问密码</div><input type="password" id="lock-pass" autocomplete="off" placeholder="密码"><button id="lock-btn">进入</button><div class="lock-err" id="lock-err">密码错误，请重试</div></div></div>
<div class="wrap">
  <h1>错题复盘 · 刷题系统</h1>
  <p class="sub">共 345 题（政治理论 77 + 常识判断 268）· 本地存储，双击即可用</p>

  <div class="tabs">
    <button id="tab-review" class="active">📋 错题复盘</button>
    <button id="tab-quiz">🎯 刷题模式</button>
    <button id="tab-history">📈 刷题记录</button>
  </div>

  <!-- 复盘模式 -->
  <section id="view-review">
    <div class="card" style="padding:12px">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">记录同步</div>
      <div class="ctrl">
        <button class="btn sm" id="rev-export-full">📄 导出完整JSON（含正确答案+我的答案）</button>
        <button class="btn sm ghost" id="rev-bind">🔗 绑定文件自动同步</button>
        <button class="btn sm ghost" id="rev-resume" hidden>🔓 恢复上次绑定</button>
        <button class="btn sm ghost" id="rev-unbind" hidden>解除绑定</button>
      </div>
      <div class="hint" id="rev-sync-status">绑定后，你每次填写都会自动写入所选 JSON 文件（需 Chrome / Edge）</div>
    </div>
    <div class="card">
      <div class="ctrl">
        <select id="rv-chapter">
          <option value="">全部章节</option>
          <optgroup label="政治理论">
            <option>马克思主义</option>
            <option>新思想</option>
            <option>时事政治</option>
            <option>毛中特</option>
          </optgroup>
          <optgroup label="常识判断">
            <option>经济常识</option>
            <option>科技常识</option>
            <option>人文常识</option>
            <option>地理国情</option>
            <option>法律常识</option>
          </optgroup>
        </select>
        <label class="chk"><input type="checkbox" id="rv-onlyempty"> 只看未填</label>
      </div>
      <div class="meta"><span id="rv-progress">已记录 0 / 77</span><span id="rv-pos">第 1 / 77 题</span></div>
      <div class="pbar"><div id="rv-pbar" style="width:0%"></div></div>
    </div>
    <div class="card" style="padding:12px">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">搜索题目</div>
      <input type="text" id="rv-search" placeholder="输入关键词，如：矛盾 / 人工智能 / 三三制（空格分隔多个词=同时匹配）">
      <div id="rv-search-res" style="margin-top:8px;max-height:260px;overflow:auto"></div>
    </div>
    <div class="card" id="rv-card"></div>
    <div class="nav">
      <button class="btn ghost" id="rv-prev">← 上一题</button>
      <button class="btn" id="rv-next">下一题 →</button>
    </div>
    <div class="card">
      <div class="hint" style="margin-bottom:6px">快速跳转：</div>
      <div class="jumprow" id="rv-jump"></div>
    </div>
  </section>

  <!-- 刷题模式 -->
  <section id="view-quiz" hidden>
    <div id="quiz-setup">
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:8px">选择练习范围：</div>
        <div class="ctrl">
          <label class="chk"><input type="checkbox" class="qz-chk" value="马克思主义" checked> 马克思主义</label>
          <label class="chk"><input type="checkbox" class="qz-chk" value="新思想" checked> 新思想</label>
          <label class="chk"><input type="checkbox" class="qz-chk" value="时事政治" checked> 时事政治</label>
          <label class="chk"><input type="checkbox" class="qz-chk" value="毛中特" checked> 毛中特</label>
          <label class="chk" style="background:#eef2ff;border-color:#c7d2fe"><input type="checkbox" class="qz-chk" value="经济常识" checked> 经济常识</label>
          <label class="chk" style="background:#eef2ff;border-color:#c7d2fe"><input type="checkbox" class="qz-chk" value="科技常识" checked> 科技常识</label>
          <label class="chk" style="background:#eef2ff;border-color:#c7d2fe"><input type="checkbox" class="qz-chk" value="人文常识" checked> 人文常识</label>
          <label class="chk" style="background:#eef2ff;border-color:#c7d2fe"><input type="checkbox" class="qz-chk" value="地理国情" checked> 地理国情</label>
          <label class="chk" style="background:#eef2ff;border-color:#c7d2fe"><input type="checkbox" class="qz-chk" value="法律常识" checked> 法律常识</label>
        </div>
        <div class="ctrl">
          <label class="chk"><input type="checkbox" id="qz-random" checked> 打乱顺序</label>
          <label class="chk"><input type="checkbox" id="qz-dedupe" checked> 去重（同题只出一遍）</label>
        </div>
        <div class="ctrl">
          <span style="font-size:14px">题量：</span>
          <select id="qz-count">
            <option value="0">全部</option>
            <option value="10">10 题</option>
            <option value="20">20 题</option>
            <option value="30">30 题</option>
            <option value="50">50 题</option>
          </select>
        </div>
        <button class="btn block" id="qz-start">开始刷题</button>
      </div>
    </div>
    <div id="quiz-run" hidden>
      <div class="card">
        <div class="meta"><span id="qz-progress">第 1 / 1 题</span><span id="qz-score">对 0 · 错 0</span></div>
        <div class="pbar"><div id="qz-pbar" style="width:0%"></div></div>
      </div>
      <div class="card" id="qz-card"></div>
      <div class="nav">
        <button class="btn ghost" id="qz-stop">结束本组</button>
        <button class="btn" id="qz-next" hidden>下一题 →</button>
      </div>
    </div>
    <div id="quiz-result" hidden>
      <div class="stat">
        <div class="box"><div class="v" id="rz-total">0</div><div class="k">作答</div></div>
        <div class="box"><div class="v" style="color:var(--ok)" id="rz-right">0</div><div class="k">答对</div></div>
        <div class="box"><div class="v" style="color:var(--bad)" id="rz-wrong">0</div><div class="k">答错</div></div>
        <div class="box"><div class="v" id="rz-acc">0%</div><div class="k">正确率</div></div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:6px">本轮错题：</div>
        <div id="rz-wronglist"></div>
      </div>
      <div class="nav">
        <button class="btn ghost" id="rz-again">只刷错题</button>
        <button class="btn" id="rz-back">返回设置</button>
      </div>
    </div>
  </section>

  <!-- 刷题记录 -->
  <section id="view-history" hidden>
    <div class="card">
      <div class="ctrl">
        <button class="btn sm ghost" id="his-export">导出数据</button>
        <button class="btn sm ghost" id="his-import-btn">导入数据</button>
        <input type="file" id="his-import" accept=".json" class="hiddensc">
        <button class="btn sm danger" id="his-clear">清空全部记录</button>
      </div>
    </div>
    <div id="his-list"></div>
  </section>

</div>

{"c":"马克思主义","f":"唯物辩证法","n":3,"s":"习近平总书记指出，人与自然是生命共同体，人类必须尊重自然、顺应自然、保护自然。这一论断是基于马克思主义人与自然关系思想的重大理论创新成果。下列说法与其相一致的有几项?①保护自然就是保护人类自己，善待自然就是善待人类自己②如果人靠科学和创造性天才征服了自然力，那么自然力将完全为人服务③人类通过实践活动改造自然，使自然成为人类本质力量对象化的产物④大自然是人类赖以生存发展的基本条件，给人类直接提供了生活资料和生产资料⑤人本身是自然界的产物，是在自己所处的环境中并且和这个环境一起发展起来的","o":{"A":"2","B":"3","C":"4","D":"5"},"a":"C"},

{"c":"马克思主义","f":"唯物辩证法","n":6,"s":"习近平总书记强调，“领导干部要有草摇叶响知鹿过、松风一起知虎来、一叶易色而知天下秋的见微知著能力。”下列工作行为展现了这一能力要求的有：①面对随时可能发生的各种“黑天鹅”“灰犀牛”事件，能够抓早抓小②面对社会发展领域各方面的改革任务，能够做到“十个指头弹钢琴”③面对高水平生态环境建设任务，能够做好生态环境监测的“吹哨人”④面对纷繁复杂的基层工作，能够做到“两点论”和“重点论”相结合⑤面对工作中不托底的人和事，能够经常敲响警钟，念好安全“紧箍咒”","o":{"A":"2项","B":"3项","C":"4项","D":"5项"},"a":"B"},
{"c":"马克思主义","f":"唯物辩证法","n":7,"s":"党的十八大以来，习近平总书记在许多重要场合都提到“行百里者半九十”，这对党员干部是一种警醒，更是一种激励与鞭策。下列古语与“行百里者半九十”所蕴含的道理最相近的是：","o":{"A":"靡不有初，鲜克有终","B":"慎终如始，则无败事","C":"为山九仞，功亏一篑","D":"千里之堤，毁于蚁穴"},"a":"C"},
{"c":"马克思主义","f":"唯物辩证法","n":8,"s":"习近平总书记指出，改革开放以来，我们党提出的一系列“两手抓”，包括一手抓物质文明建设、一手抓精神文明建设，一手抓经济建设、一手抓法治建设，一手抓发展、一手抓稳定，一手抓改革开放、一手抓惩治腐败等，都是符合历史唯物主义要求的。上述重要讲话直接体现的马克思主义哲学观点不包括（    ）。","o":{"A":"事物发展需要通过量变的积累实现质的飞跃","B":"事物总是有着这样那样的联系，不能孤立地静止地看待事物发展","C":"在观察社会发展时，要注意矛盾双方既对立又统一的辩证关系","D":"物质生产是社会生活的基础，但上层建筑也可以反作用于经济基础"},"a":"A"},
{"c":"马克思主义","f":"唯物论·唯物史观","n":1,"s":"习近平总书记指出：“中国共产党人的理想信念，建立在马克思主义科学真理的基础之上，建立在马克思主义揭示的人类社会发展规律的基础之上，建立在为最广大人民谋利益的崇高价值的基础之上。我们坚定，是因为我们追求的是真理。我们坚定，是因为我们遵循的是规律。我们坚定，是因为我们代表的是最广大人民根本利益。”这一论述最直接体现了马克思主义的哪一基本观点？","o":{"A":"真理尺度与价值尺度的辩证统一","B":"认识世界与改造世界的辩证统一","C":"量变与质变的辩证统一","D":"矛盾的特殊性与普遍性的辩证统一"},"a":"A"},
{"c":"马克思主义","f":"唯物论·唯物史观","n":2,"s":"发展新质生产力，必须进一步全面深化改革，形成与之相适应的新型生产关系。要深化经济体制、科技体制等改革，着力打通束缚新质生产力发展的堵点卡点，建立高标准市场体系，创新生产要素配置方式，让各类先进优质生产要素向发展新质生产力顺畅流动，这最直接体现了马克思主义的哪些基本观点？①生产关系必须与生产力发展要求相适应，才能促进生产力发展②经济基础的变更必然引起上层建筑的变革，并决定其变革方向③生产关系对生产力发展具有决定作用④改革是社会主义社会发展的直接动力","o":{"A":"①②","B":"①④","C":"②③","D":"②④"},"a":"B"},
{"c":"马克思主义","f":"政治经济学·科学社会主义","n":1,"s":"关于马克思主义政治经济学，下列说法正确的是：","o":{"A":"商品的价值量是由生产该商品所需的个别劳动时间决定的","B":"货币的价值尺度职能是通过实际的物质交换来实现的","C":"具体劳动和抽象劳动是不同商品生产过程中的不同劳动","D":"具体劳动创造商品的使用价值，抽象劳动形成商品的价值"},"a":"D"},
{"c":"马克思主义","f":"政治经济学·科学社会主义","n":2,"s":"关于科学社会主义，下列说法正确的有几项？①科学社会主义的理论基础是唯物史观和剩余价值学说②科学社会主义的思想来源是工人运动的兴起③科学社会主义在21世纪的中国焕发出强大的生命力④《共产党宣言》的发表标志着科学社会主义的诞生⑤中国式现代化理论是科学社会主义的最新重大成果","o":{"A":"2","B":"3","C":"4","D":"5"},"a":"C"},
{"c":"新思想","f":"新思想总论","n":1,"s":"习近平新时代中国特色社会主义思想是当代中国马克思主义，二十一世纪马克思主义是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。下列有关表述正确的有几项？①习近平新时代中国特色社会主义思想，体现了以习近平同志为核心的党中央对共产党执政规律、社会主义建设规律、人类社会发展规律认识的深化、拓展、升华②党的二十大提出的六个必须坚持概括阐述了习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法③“两个确立”是指“确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位”④坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴","o":{"A":"1","B":"2","C":"3","D":"4"},"a":"D"},
{"c":"新思想","f":"新思想总论","n":2,"s":"习近平新时代中国特色社会主义思想内容丰富、博大精深，提出了一系列原创性的治国理政新理念新思想新战略。这一伟大思想，不仅属于中国，也属于世界。下列不属于习近平新时代中国特色社会主义思想的世界意义的是：","o":{"A":"破解反贫困难题，创造减贫治理的中国样本，为全球减贫事业作出重大贡献","B":"在新时代引领党和国家事业取得了重大成就，续写了经济快速发展和社会长期稳定两大奇迹","C":"破解自我监督难题，找到长期执政条件下跳出历史周期率的第二个答案，为世界政党建设提供借鉴","D":"打破“现代化=西方化”的迷思，拓展发展中国家走向现代化的路径选择，为人类对更好社会制度的探索提供中国方案"},"a":"B"},
{"c":"新思想","f":"新思想总论","n":3,"s":"“我们要坚持对马克思主义的坚定信仰、对中国特色社会主义的坚定信念，坚定道路自信、理论自信、制度自信、文化自信，以更加积极的历史担当和创造精神为发展马克思主义作出新的贡献，既不能刻舟求剑、封闭僵化，也不能照抄照搬、食洋不化。”这段话最能体现习近平新时代中国特色社会主义思想（    ）的立场观点方法。","o":{"A":"必须坚持问题导向","B":"必须坚持守正创新","C":"必须坚持自信自立","D":"必须坚持胸怀天下"},"a":"C"},
{"c":"新思想","f":"五位一体·经济建设","n":1,"s":"完善市场经济基础制度是构建高水平社会主义市场经济体制的重要内容。下列不属于完善市场经济基础制度内容的是：","o":{"A":"完善财政转移支付体系","B":"完善市场信息披露制度","C":"完善市场准入制度","D":"完善产权制度"},"a":"A"},
{"c":"新思想","f":"五位一体·经济建设","n":2,"s":"习近平总书记强调，要坚持城乡融合发展，畅通城乡要素流动。关于城乡融合发展，下列说法正确的有几项？①城乡融合发展是中国式现代化的必然要求②推进以乡镇为重要载体的新型城镇化建设，发展各具特色的乡镇经济③发展新型农村集体经济，构建产权明晰、分配合理的运行机制④完善覆盖农村人口的常态化防止返贫致贫机制⑤允许农户合法拥有的住房通过出租、入股、合作等方式盘活利用","o":{"A":"1项","B":"2项","C":"3项","D":"4项"},"a":"D"},
{"c":"新思想","f":"五位一体·经济建设","n":3,"s":"中共中央、国务院印发《加快建设农业强国规划（2024-2035年）》，提出面对新形势新要求，必须把加快建设农业强国作为统领“三农”工作的战略总纲，摆上建设社会主义现代化强国的重要位置，下列与加快建设农业强国有关的说法正确的是：","o":{"A":"推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿","B":"建立健全长江流域信息共享系统，推进长江流域农业深度节水控水","C":"完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜","D":"推进农业科技推广体系，从经营性向公益性转变"},"a":"A"},
{"c":"新思想","f":"五位一体·经济建设","n":4,"s":"在“优化国土空间发展格局”方面，《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出了明确要求。下列相关说法正确的是：","o":{"A":"调整城市化地区、农产品主产区、生态功能区格局，以适应新的发展形势","B":"推动战略性产业向东部地区集中，发挥其技术和人才优势","C":"赋予省级政府统筹建设用地更大自主权，探索实施建设用地总量按规划期管控模式，实行统筹存量和增量综合供地","D":"逐步取消城镇开发边界，为城市扩张和经济发展提供充足空间"},"a":"C"},
{"c":"新思想","f":"五位一体·经济建设","n":5,"s":"习近平总书记指出，人工智能作为引领新一轮科技革命和产业变革的战略性技术，深刻改变人类生产生活方式。下列有关表述，正确的是：","o":{"A":"当前全球人工智能科技创新和产业创新深度融合，每年为全球经济贡献超百万亿元，已成为最重要的增长点之一","B":"要加快实施“人工智能+”产业发展行动，构建政府主导、国企运营、民企参与的产学研用协同创新体系，助力传统产业改造升级","C":"人工智能可以是造福人类的国际公共产品，要广泛开展人工智能国际合作，帮助全球南方国家加强技术能力建设，为弥合全球智能鸿沟作出中国贡献","D":"要持续加强基础研究，集中力量攻克关键核心技术，强化算力、算法、数据等高效供给，加快构建独立于西方技术体系的人工智能产业链生态链，确保产业安全和国家安全"},"a":"C"},
{"c":"新思想","f":"五位一体·经济建设","n":6,"s":"以习近平同志为核心的党中央审时度势、高瞻远瞩，坚持把科技创新摆在国家发展全局的核心位置，关于科技创新，下列说法正确的是：①深化基础研究体制机制改革，加强制度保障和政策引导，完善竞争性支持占主导的投入机制②扎实推动科技创新和产业创新深度融合，融合的关键是强化高水平研究型大学科技创新主体地位③当前我国人才培养与科技创新供需不匹配的结构性矛盾比较突出，要坚持以科技创新需求为牵引，优化高等学校学科设置④要突出构建以先进制造业为骨干的现代化产业体系这个重点，以科技创新为引领，统筹推进传统产业升级、新兴产业壮大、未来产业培育","o":{"A":"②③","B":"③④","C":"①②④","D":"①③④"},"a":"B"},
{"c":"新思想","f":"五位一体·经济建设","n":7,"s":"中国式现代化要靠科技现代化作支撑，实现高质量发展要靠科技创新培育新动能。关于建成科技强国的举措，下列说法正确的是：","o":{"A":"要坚持有所为有所不为，突出经济发展需求，在重要领域实施科技战略部署","B":"要充分发挥人才在科技资源配置中的决定性作用，调动产学研各环节的积极性","C":"要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目","D":"要降低基础研究组织化程度，强化自由探索，鼓励面向重大科学问题的协同攻关"},"a":"C"},
{"c":"新思想","f":"五位一体·经济建设","n":8,"s":"习近平总书记在对各省区市进行深入考察调研的过程中，结合各地实际情况，对推进高质量发展作出一系列重要部署。下列对应关系正确的是：","o":{"A":"江苏——要建设国家资源型经济转型综合配套改革试验区，重点抓好能源转型、产业升级和适度多元发展","B":"山东——要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地","C":"云南——要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵","D":"贵州——聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动"},"a":"B"},
{"c":"新思想","f":"五位一体·经济建设","n":9,"s":"习近平总书记强调，现代化产业体系是现代化国家的物质技术基础，必须把发展经济的着力点放在实体经济上，为实现第二个百年奋斗目标提供坚强物质支撑。下列与之相关说法正确的有几项？①推进实施绿色发展战略，充分发挥绿色化赋能实体经济发展效应②促进数字技术和实体经济深度融合，催生新产业新业态新模式替代传统产业③重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合④推动重点产业在国内外有序转移、促进国内外产业深度融合与实体经济发展相结合","o":{"A":"1","B":"2","C":"3","D":"4"},"a":"C"},
{"c":"新思想","f":"五位一体·经济建设","n":10,"s":"2025年4月30日，习近平总书记在上海主持召开部分省区市“十五五”时期经济社会发展座谈会时强调，“十五五”时期，必须把因地制宜发展新质生产力摆在更加突出的战略位置上，科学发展新质生产力。下列说法错误的是：","o":{"A":"“因地制宜”发展新质生产力强调要注重发展的普遍性、协调性和灵活性","B":"把发展新质生产力“摆在更加突出的战略位置”，源于新质生产力对高质量发展的强劲推动力、支撑力","C":"发展新质生产力，不能因发展战略性新兴产业而忽视传统产业改造升级","D":"发展新质生产力，要形成与新质生产力相适应的生产关系"},"a":"A"},
{"c":"新思想","f":"五位一体·经济建设","n":11,"s":"“十五五”时期经济社会发展必须遵循的原则是：","o":{"A":"坚持人民至上；坚持自信自立；坚持守正创新；坚持问题导向；坚持系统观念；坚持胸怀天下","B":"坚持人民主体地位；坚持科学发展；坚持深化改革；坚持依法治国：坚持统筹国内国际两个大局；坚持党的全面领导","C":"坚持党的全面领导；坚持以人民为中心；坚持新发展理念；坚持深化改革开放；坚持系统观念","D":"坚持党的全面领导；坚持人民至上；坚持高质量发展；坚持全面深化改革；坚持有效市场和有为政府相结合；坚持统筹发展和安全"},"a":"D"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":1,"s":"党的二十届三中全会提出，聚焦发展全过程人民民主。关于健全全过程人民民主制度体系的举措，下列说法正确的有几项？①坚持好、完善好、运行好人民代表大会制度②发挥人民政协作为专门协商机构作用，健全深度协商互动、意见充分表达、广泛凝聚共识的机制③发挥工会、共青团、妇联等群团组织联系服务群众的桥梁纽带作用④健全协商于决策之前的落实机制，完善协商成果实施及监督机制⑤建立港澳同胞和海外华侨华人政治引领机制","o":{"A":"5项","B":"4项","C":"3项","D":"2项"},"a":"C"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":2,"s":"习近平总书记指出，中华民族有着五千多年的悠久历史和灿烂文化，而且中华文化从远古一直延续发展到今天，是世界上唯一绵延不断，且以国家形态发展至今的伟大文明，具有突出的连续性。关于中华文化为何具有突出的连续性，下列说法正确的是：①强大的文化主体性，夯实了中华文明连续性的内在支撑②浩如烟海的文化典籍成为中华文明连续性的天然载体③独特又稳定的地理环境，筑牢了中华文明连续性的自然基础④中华文化“中和”的文化价值诉求奠定了中华文明连续性的价值底蕴","o":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"a":"D"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":3,"s":"习近平总书记指出，“两个结合”是我们取得成功的最大法宝。关于“两个结合”，下列表述正确的有几项？①“两个结合”筑牢了道路根基，中国特色的关键就在于“两个结合”②“两个结合”本身就是创新，同时又开启了广阔的理论和实践创新空间③“两个结合”产生了深刻的“化学反应”，造就了一个有机统一的新的文化生命体④“两个结合”是坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合","o":{"A":"1","B":"2","C":"3","D":"4"},"a":"D"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":4,"s":"习近平总书记强调，要加强新时代廉洁文化建设，教育引导广大党员、干部增强不想腐的自觉，清清白白做人、干干净净做事。下列属于加强新时代廉洁文化建设的举措有几项？①开办红色廉洁文化专题展览，在红色教育中传承党的廉洁基因②对新入职党员、干部及时开展廉洁教育，扣好年轻干部廉洁从政第一粒扣子③注重从优秀传统家训家规中汲取营养，开展红色家风传承活动④挖掘历史文献、文化经典、文物古迹中的廉洁思想，整理古圣先贤、清官廉吏的嘉言懿行","o":{"A":"1项","B":"2项","C":"3项","D":"4项"},"a":"D"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":5,"s":"习近平总书记指出，“中华文明延续着我们国家和民族的精神血脉，既需要薪火相传、代代守护，也需要与时俱进、推陈出新”。关于中华文明，下列表述正确的是：①中国具有百万年的人类史、一万年的文明史、五千多年的文化史②中华文明是世界上唯一绵延不断且以国家形态发展至今的伟大文明③中华文明具有连续性、创新性、统一性、包容性、和平性等突出特性④在新的起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明，是我们在新时代新的文化使命","o":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"a":"D"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":6,"s":"人口发展是关系中华民族伟大复兴的大事。下列有关表述，不正确的是：","o":{"A":"我国总体上已由人口增量发展转向减量发展阶段，人口发展呈现少子化、老龄化、区域人口增减分化等明显的趋势性特征","B":"我国现有人口和劳动力规模足够庞大，目前人口减少的体量有限，全民受教育水平持续提高，人口综合红利仍然具有明显优势","C":"人口安全是人口高质量发展的底线要求，大国兴衰往往受到人口状况的深刻影响，要将人口安全纳入总体国家安全范畴加以谋划","D":"党的二十大提出，优化人口发展战略，建立生育支持政策体系，降低生育、养育、教育成本，并决定实施三孩生育政策以及育儿补贴制度等配套支持措施"},"a":"D"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":7,"s":"加强普惠性、基础性、兜底性民生建设，解决好人民群众最关心最直接最现实的利益问题，才能不断满足人民对美好生活的向往。关于加强普惠性、基础性、兜底性民生建设，下列表述正确的有几项？①出台完善青年创新人才发现、选拔、培养机制②加强低收入人口动态监测，做好分层分类社会救助工作③出台政策鼓励收养病残孤儿，政府为收养家庭提供适度补贴④发展集中管理运营的社区养老服务网络，提升农村互助养老设施建设水平","o":{"A":"4项","B":"3项","C":"2项","D":"1项"},"a":"B"},
{"c":"新思想","f":"五位一体·政治/文化/社会/生态","n":8,"s":"生态文明建设是关乎中华民族永续发展的根本大计，保护生态环境就是保护生产力，改善生态环境就是发展生产力。下列有关说法正确的有几项？①绿色发展是高质量发展的底色，新质生产力本身就是绿色生产力②中国二氧化碳排放力争于2035年前达到峰值，努力争取2050年前实现碳中和③富煤贫油少气是我国的国情，推进“双碳”工作必须立足这个实际，不能盲目追求“去煤化”④坚持山水林田湖草沙一体化保护和系统治理，以人工修复为主，自然恢复为辅，整体推进生态修复","o":{"A":"1","B":"2","C":"3","D":"4"},"a":"B"},
{"c":"新思想","f":"其他建设","n":1,"s":"习近平总书记强调，纪检监察机关是推进党的自我革命的重要力量，党和人民对这支队伍充分信任、充满期待，下列与之相关说法正确的有几项？①巩固拓展主题教育和教育整顿成果，坚持把思想教育放在首位②强化严格管理监督，打造忠诚干净担当、敢于善于斗争的纪检监察铁军③深化纪检监察体制改革，坚持授权和控权相结合，把权力关进制度的笼子④着力加强纪检监察工作规范化法治化正规化建设，不断提高正风肃纪反腐能力","o":{"A":"1","B":"2","C":"3","D":"4"},"a":"C"},
{"c":"新思想","f":"其他建设","n":2,"s":"2024年6月，和平共处五项原则发表70周年纪念大会在北京举行，习近平总书记在会上指出，构建人类命运共同体理念与和平共处五项原则一脉相承，下列有关说法正确的是：①构建人类命运共同体理念顺应了平等和共生的时代潮流，开辟了和平和进步的新境界②和平共处五项原则的出发点就是维护弱小国家在强权政治环境中的利益和诉求③和平共处五项原则为不同社会制度国家建立和发展关系提供了正确指导④中国式现代化的本质要求之一就是推动构建人类命运共同体","o":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"a":"D"},
{"c":"新思想","f":"其他建设","n":3,"s":"党的二十大强调，国家安全是民族复兴的根基，社会稳定是国家强盛的前提，必须坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程，确保国家安全和社会稳定。下列表述不正确的是：","o":{"A":"坚持党中央对国家安全工作的集中统一领导，完善高效权威的国家安全领导体制","B":"坚持安全第一、应急为主，建立大安全大应急框架，完善公共安全体系","C":"加强海外安全保障能力建设，维护我国公民、法人在海外合法权益","D":"强化食品药品安全监管，健全生物安全监管预警防控体系"},"a":"B"},
{"c":"新思想","f":"其他建设","n":4,"s":"扩大高水平对外开放是推进中国式现代化的必然要求。关于坚定不移推进高水平对外开放，下列说法正确的是：","o":{"A":"我国积极营造市场化、法治化、国际化一流营商环境，制造业领域外资准入负面清单已实现“清零”","B":"我国拥有全球第二大规模中等收入群体，蕴含着巨大投资潜力，外资企业在中国可以尽展优势和能力","C":"新增K字签证，明确发给入境的从境内外知名高校毕业的科学、技术、工程、数学、艺术学科领域外国青年人才","D":"主动对接《全面与进步跨太平洋伙伴关系协定》和《区域全面经济伙伴关系协定》等国际高标准经贸规则，稳步扩大制度型开放"},"a":"A"},
{"c":"新思想","f":"其他建设","n":5,"s":"党的十八大以来以习近平同志为核心的党中央把全面从严治党纳入“四个全面”战略布局，深入推进新时代党的建设新的伟大工程，提出一系列新理念新思想新战略，形成习近平总书记关于党的建设的重要思想。党在革命性锻造中更加坚强有力、更加充满活力。全面从严治党开辟了百年大党自我革命的新境界。关于新时代全面从严治党取得的历史性开创性成就，下列表述正确的是：①牢牢抓住“关键少数”，坚持从领导干部抓起，以上率下②提出让人民监督政府是跳出历史周期率第一个答案③开展了史无前例的反腐败斗争，取得压倒性胜利并全面巩固④把制度建设贯穿党的政治各方面，形成比较完善的党内法规体系⑤以党的政治建设统领党的建设的各项工作，不断增强党组织政治功能","o":{"A":"①②③⑤","B":"①②④⑤","C":"①③④⑤","D":"②③④⑤"},"a":"C"},

{"c":"新思想","f":"其他建设","n":7,"s":"习近平总书记强调，要持之以恒推进党的自我革命，确保党永远不变质、不变色。关于党的自我革命，下列说法正确的有几项？①坚持制度治党、依规治党，以党章为根本，以民主集中制为核心，完善党内法规制度体系②推进党的自我革命，要强化党的自我监督，完善党内监督的各项制度机制，不断健全党内监督体系③勇于自我革命是我们党最鲜明的品格和最大优势④推进党的自我革命必须坚持结果导向","o":{"A":"1项","B":"2项","C":"3项","D":"4项"},"a":"C"},

{"c":"时事政治","f":"重要会议讲话","n":5,"s":"习近平总书记指出，人工智能作为引领新一轮科技革命和产业变革的战略性技术，深刻改变人类生产生活方式。下列有关表述，正确的是：","o":{"A":"当前全球人工智能科技创新和产业创新深度融合，每年为全球经济贡献超百万亿元，已成为最重要的增长点之一","B":"要加快实施“人工智能+”产业发展行动，构建政府主导、国企运营、民企参与的产学研用协同创新体系，助力传统产业改造升级","C":"人工智能可以是造福人类的国际公共产品，要广泛开展人工智能国际合作，帮助全球南方国家加强技术能力建设，为弥合全球智能鸿沟作出中国贡献","D":"要持续加强基础研究，集中力量攻克关键核心技术，强化算力、算法、数据等高效供给，加快构建独立于西方技术体系的人工智能产业链生态链，确保产业安全和国家安全"},"a":"C"},
{"c":"时事政治","f":"重要会议讲话","n":6,"s":"以习近平同志为核心的党中央审时度势、高瞻远瞩，坚持把科技创新摆在国家发展全局的核心位置，关于科技创新，下列说法正确的是：①深化基础研究体制机制改革，加强制度保障和政策引导，完善竞争性支持占主导的投入机制②扎实推动科技创新和产业创新深度融合，融合的关键是强化高水平研究型大学科技创新主体地位③当前我国人才培养与科技创新供需不匹配的结构性矛盾比较突出，要坚持以科技创新需求为牵引，优化高等学校学科设置④要突出构建以先进制造业为骨干的现代化产业体系这个重点，以科技创新为引领，统筹推进传统产业升级、新兴产业壮大、未来产业培育","o":{"A":"②③","B":"③④","C":"①②④","D":"①③④"},"a":"B"},
{"c":"时事政治","f":"重要会议讲话","n":7,"s":"中国式现代化要靠科技现代化作支撑，实现高质量发展要靠科技创新培育新动能。关于建成科技强国的举措，下列说法正确的是：","o":{"A":"要坚持有所为有所不为，突出经济发展需求，在重要领域实施科技战略部署","B":"要充分发挥人才在科技资源配置中的决定性作用，调动产学研各环节的积极性","C":"要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目","D":"要降低基础研究组织化程度，强化自由探索，鼓励面向重大科学问题的协同攻关"},"a":"C"},
{"c":"时事政治","f":"重要会议讲话","n":8,"s":"习近平总书记在对各省区市进行深入考察调研的过程中，结合各地实际情况，对推进高质量发展作出一系列重要部署。下列对应关系正确的是：","o":{"A":"江苏——要建设国家资源型经济转型综合配套改革试验区，重点抓好能源转型、产业升级和适度多元发展","B":"山东——要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地","C":"云南——要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵","D":"贵州——聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动"},"a":"B"},
{"c":"时事政治","f":"重要会议讲话","n":9,"s":"习近平总书记强调，要持之以恒推进党的自我革命，确保党永远不变质、不变色。关于党的自我革命，下列说法正确的有几项？①坚持制度治党、依规治党，以党章为根本，以民主集中制为核心，完善党内法规制度体系②推进党的自我革命，要强化党的自我监督，完善党内监督的各项制度机制，不断健全党内监督体系③勇于自我革命是我们党最鲜明的品格和最大优势④推进党的自我革命必须坚持结果导向","o":{"A":"1项","B":"2项","C":"3项","D":"4项"},"a":"C"},
{"c":"时事政治","f":"重要会议讲话","n":10,"s":"“我们要坚持对马克思主义的坚定信仰、对中国特色社会主义的坚定信念，坚定道路自信、理论自信、制度自信、文化自信，以更加积极的历史担当和创造精神为发展马克思主义作出新的贡献，既不能刻舟求剑、封闭僵化，也不能照抄照搬、食洋不化。”这段话最能体现习近平新时代中国特色社会主义思想（    ）的立场观点方法。","o":{"A":"必须坚持问题导向","B":"必须坚持守正创新","C":"必须坚持自信自立","D":"必须坚持胸怀天下"},"a":"C"},
{"c":"时事政治","f":"重要会议讲话","n":11,"s":"2025年4月30日，习近平总书记在上海主持召开部分省区市“十五五”时期经济社会发展座谈会时强调，“十五五”时期，必须把因地制宜发展新质生产力摆在更加突出的战略位置上，科学发展新质生产力。下列说法错误的是：","o":{"A":"“因地制宜”发展新质生产力强调要注重发展的普遍性、协调性和灵活性","B":"把发展新质生产力“摆在更加突出的战略位置”，源于新质生产力对高质量发展的强劲推动力、支撑力","C":"发展新质生产力，不能因发展战略性新兴产业而忽视传统产业改造升级","D":"发展新质生产力，要形成与新质生产力相适应的生产关系"},"a":"A"},
{"c":"时事政治","f":"重要文件","n":1,"s":"完善市场经济基础制度是构建高水平社会主义市场经济体制的重要内容。下列不属于完善市场经济基础制度内容的是：","o":{"A":"完善财政转移支付体系","B":"完善市场信息披露制度","C":"完善市场准入制度","D":"完善产权制度"},"a":"A"},
{"c":"时事政治","f":"重要文件","n":2,"s":"习近平总书记强调，要坚持城乡融合发展，畅通城乡要素流动。关于城乡融合发展，下列说法正确的有几项？①城乡融合发展是中国式现代化的必然要求②推进以乡镇为重要载体的新型城镇化建设，发展各具特色的乡镇经济③发展新型农村集体经济，构建产权明晰、分配合理的运行机制④完善覆盖农村人口的常态化防止返贫致贫机制⑤允许农户合法拥有的住房通过出租、入股、合作等方式盘活利用","o":{"A":"1项","B":"2项","C":"3项","D":"4项"},"a":"D"},
{"c":"时事政治","f":"重要文件","n":3,"s":"中共中央、国务院印发《加快建设农业强国规划（2024-2035年）》，提出面对新形势新要求，必须把加快建设农业强国作为统领“三农”工作的战略总纲，摆上建设社会主义现代化强国的重要位置，下列与加快建设农业强国有关的说法正确的是：","o":{"A":"推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿","B":"建立健全长江流域信息共享系统，推进长江流域农业深度节水控水","C":"完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜","D":"推进农业科技推广体系，从经营性向公益性转变"},"a":"A"},
{"c":"时事政治","f":"重要文件","n":4,"s":"在“优化国土空间发展格局”方面，《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出了明确要求。下列相关说法正确的是：","o":{"A":"调整城市化地区、农产品主产区、生态功能区格局，以适应新的发展形势","B":"推动战略性产业向东部地区集中，发挥其技术和人才优势","C":"赋予省级政府统筹建设用地更大自主权，探索实施建设用地总量按规划期管控模式，实行统筹存量和增量综合供地","D":"逐步取消城镇开发边界，为城市扩张和经济发展提供充足空间"},"a":"C"},
{"c":"时事政治","f":"重要文件","n":5,"s":"党的二十届三中全会提出，聚焦发展全过程人民民主。关于健全全过程人民民主制度体系的举措，下列说法正确的有几项？①坚持好、完善好、运行好人民代表大会制度②发挥人民政协作为专门协商机构作用，健全深度协商互动、意见充分表达、广泛凝聚共识的机制③发挥工会、共青团、妇联等群团组织联系服务群众的桥梁纽带作用④健全协商于决策之前的落实机制，完善协商成果实施及监督机制⑤建立港澳同胞和海外华侨华人政治引领机制","o":{"A":"5项","B":"4项","C":"3项","D":"2项"},"a":"C"},
{"c":"时事政治","f":"重要文件","n":6,"s":"习近平总书记强调，现代化产业体系是现代化国家的物质技术基础，必须把发展经济的着力点放在实体经济上，为实现第二个百年奋斗目标提供坚强物质支撑。下列与之相关说法正确的有几项？①推进实施绿色发展战略，充分发挥绿色化赋能实体经济发展效应②促进数字技术和实体经济深度融合，催生新产业新业态新模式替代传统产业③重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合④推动重点产业在国内外有序转移、促进国内外产业深度融合与实体经济发展相结合","o":{"A":"1","B":"2","C":"3","D":"4"},"a":"C"},
{"c":"时事政治","f":"重要文件","n":7,"s":"加强普惠性、基础性、兜底性民生建设，解决好人民群众最关心最直接最现实的利益问题，才能不断满足人民对美好生活的向往。关于加强普惠性、基础性、兜底性民生建设，下列表述正确的有几项？①出台完善青年创新人才发现、选拔、培养机制②加强低收入人口动态监测，做好分层分类社会救助工作③出台政策鼓励收养病残孤儿，政府为收养家庭提供适度补贴④发展集中管理运营的社区养老服务网络，提升农村互助养老设施建设水平","o":{"A":"4项","B":"3项","C":"2项","D":"1项"},"a":"B"},
{"c":"时事政治","f":"重要文件","n":8,"s":"“十五五”时期经济社会发展必须遵循的原则是：","o":{"A":"坚持人民至上；坚持自信自立；坚持守正创新；坚持问题导向；坚持系统观念；坚持胸怀天下","B":"坚持人民主体地位；坚持科学发展；坚持深化改革；坚持依法治国：坚持统筹国内国际两个大局；坚持党的全面领导","C":"坚持党的全面领导；坚持以人民为中心；坚持新发展理念；坚持深化改革开放；坚持系统观念","D":"坚持党的全面领导；坚持人民至上；坚持高质量发展；坚持全面深化改革；坚持有效市场和有为政府相结合；坚持统筹发展和安全"},"a":"D"},
{"c":"毛中特","f":"党章党纪","n":1,"s":"中国共产党的入党誓词，镌刻着我党百年来的初心与使命，下列说法正确的是（    ）。","o":{"A":"党的十二大通过了新的《中国共产党章程》，将入党誓词明确写入党章","B":"中国共产党一大第二次会议认真讨论了入党誓词的内容","C":"中国共产党入党誓词内容从未发生过变化","D":"预备党员应在转正时进行入党宣誓仪式"},"a":"A"},
{"c":"毛中特","f":"党章党纪","n":2,"s":"习近平总书记指出，“要把纪律建设摆在更加突出位置”，宣示了党中央以铁的纪律管党治党的政治定力和坚定决心。关于党的纪律建设，下列说法正确的有：①政治纪律中最根本的是坚定捍卫“两个确立”，坚决做到“两个维护”②组织纪律包括民主集中制这个根本制度、“四个服从”这个基本原则③廉洁纪律是保持干部队伍先进性和纯洁性、永葆生机和活力的关键④群众纪律是党的性质和宗旨的体现，是我们党区别于其他政治组织的显著标志⑤工作纪律的根本要求是党员要在工作中带头践行社会主义核心价值观","o":{"A":"2项","B":"3项","C":"4项","D":"5项"},"a":"B"},
{"c":"毛中特","f":"党的历史","n":1,"s":"下列毛泽东诗句与其创作时期，对应正确的是：","o":{"A":"问苍茫大地，谁主沉浮？——大革命时期","B":"钟山风雨起苍黄，百万雄师过大江——抗日战争时期","C":"神女应无恙，当惊世界殊——解放战争时期","D":"俱往矣，数风流人物，还看今朝——社会主义建设时期"},"a":"A"},
{"c":"毛中特","f":"党的历史","n":2,"s":"毛泽东同志说：“我们共产党人从来不隐瞒自己的政治主张。我们的将来纲领或最高纲领，是要将中国推进到社会主义社会和共产主义社会去的，这是确定的和毫无疑义的。”这段话出自（    ）。","o":{"A":"《井冈山的斗争》","B":"《中国共产党在抗日时期的任务》","C":"《论联合政府》","D":"《论十大关系》"},"a":"C"},
{"c":"毛中特","f":"党的历史","n":3,"s":"2024年是我国人民代表大会制度建立70周年。人民代表大会制度是中国共产党领导中国人民艰辛探索长期奋斗的成果，是从中国土壤中生长起来的全新政治制度，是人类政治制度史上的伟大创造。关于人民代表大会制度发展历程中的重大事件，下列表述准确的有：①抗日根据地政权建设实行的“三三制”是人民代表大会制度形成和发展的历史起点②《中国人民政治协商会议共同纲领》对新中国实行人民代表大会制度作出了明确安排③一届全国人大一次会议通过《中华人民共和国宪法》，标志着人民代表大会制度的建立④五届全国人大二次会议通过修宪决议和地方组织法，规定县级以上地方各级人大设立常委会","o":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"a":"D"},
{"c":"毛中特","f":"党的历史","n":4,"s":"1940年3月6日，中共中央首次提出了“三三制”原则，规定在根据地政权人员配备上，共产党员、党外进步人士和（    ）各占三分之一，推动了根据地的民主运动和政权建设。","o":{"A":"中间派","B":"开明地主","C":"进步官僚","D":"先进工人"},"a":"A"},
{"c":"毛中特","f":"党的历史","n":5,"s":"1920年10月，北京共产党组织成立，书记是（    ）。","o":{"A":"陈独秀","B":"李大钊","C":"董必武","D":"毛泽东"},"a":"B"},
{"c":"毛中特","f":"党的历史","n":6,"s":"中国共产党很早就认识到农民问题的重要性，早在1923年就在（    ）成立了中国第一个县级农会组织。","o":{"A":"安徽金寨","B":"湖南宁乡","C":"江西永新","D":"广东海丰"},"a":"D"},
{"c":"毛中特","f":"党的历史","n":7,"s":"下列关于党史的描述，错误的是（    ）。","o":{"A":"1921年7月，中国共产党第一次全国代表大会在上海召开","B":"1927年8月，毛泽东在“八七会议”上提出“枪杆子里面出政权”的重要思想","C":"1944年9月，毛泽东在追悼白求恩的会上发表了《为人民服务》的讲话","D":"1923年6月，中国共产党在广州举行第三次全国代表大会，决定共产党员以个人身份加入国民党"},"a":"C"},
{"c":"毛中特","f":"党的历史","n":8,"s":"1949年3月，中共中央和毛泽东离开西柏坡前往北平进驻香山。在香山的半年时间里，发生的一系列重大历史事件在党和国家历史上具有非常重要的地位。下列发生在这一时期的重大历史事件是①毛泽东、朱德发布向全国进军的命令，吹响了解放全中国的伟大号角②召开了党的七届二中全会，规定了党在全国胜利后应当采取的基本政策③毛泽东发表了《论人民民主专政》，为新中国建立奠定了理论和政策基础④制定了《中国人民政治协商会议共同纲领》，描绘了建立建设新中国的蓝图","o":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"a":"C"},
{"c":"毛中特","f":"党的历史","n":9,"s":"1929年，中国共产党红四军第九次代表大会通过的《关于纠正党内的错误思想》成为中国共产党及其领导的人民军队建设的纲领性文件。这次会议史称（    ）。","o":{"A":"八七会议","B":"遵义会议","C":"古田会议","D":"瓦窑堡会议"},"a":"C"},
{"c":"毛中特","f":"党的历史","n":10,"s":"2021年是中国共产党百年华诞，回首百年前，1921年7月23日，中国共产党第一次全国代表大会开幕，关于中共一大，下列说法不正确的是：","o":{"A":"召开地点为上海、嘉兴","B":"通过了党的第一个纲领","C":"成立中央局，并选举陈独秀任书记","D":"与会代表13人，包括陈独秀、李大钊、毛泽东"},"a":"D"},

{"c":"经济常识","f":"市场经济","n":2,"s":"近年来，在我国现代化产业体系建设与经济高质量发展过程中，“内卷式”竞争已经成为一个值得关注的问题。2024年中央政治局召开会议，分析研究经济形势和经济工作，首次提出“要强化行业自律，防止‘内卷式’恶性竞争”。2024年12月，中央经济工作会议进一步指出，要“综合整治‘内卷式’竞争，规范地方政府和企业行为”。这种“内卷式”竞争加剧了行业内部的资源消耗，成为当前经济发展中的一大痛点。这表明（    ）。","o":{"A":"“内卷”是市场经济的必然结果，行业竞争必然阻碍经济发展","B":"推动高质量发展需要强化政府配置资源，加强对经济的宏观调控","C":"行业竞争不利于企业创新，国民经济发展无需关注行业竞争状况","D":"行业竞争存在自发性等弊端，经济发展需要转变发展方式"},"a":"D","img":""},

{"c":"科技常识","f":"物理常识","n":18,"s":"下列关于家用电器的说法正确的是：","o":{"A":"电磁炉加热不产生明火，因此使用电磁炉不会造成火灾","B":"家用电器一般都有安全使用年限，燃气灶具的安全使用年限为10年","C":"一般将直接使用220v交流电、大于1200W的用电器称为大功率电器","D":"电磁炉通过电磁感应工作，有电磁辐射；微波炉利用磁控管工作，没有电磁辐射"},"a":"C","img":""},

<script>
"use strict";
var Q;
try {
  Q = JSON.parse(document.getElementById('qdata').textContent);
} catch(e) {
  Q = [];
  alert('题目数据加载失败：' + e.message);
}
Q.forEach(function(q,i){ q.id = i + 1; });

/* ---------- 本地存储 ---------- */
var P = 'zzll_';
function load(key, def){
  try {
    var v = localStorage.getItem(P + key);
    return v ? JSON.parse(v) : def;
  } catch(e){ return def; }
}
function save(key, val){
  try { localStorage.setItem(P + key, JSON.stringify(val)); } catch(e){}
}

var review = load('review', null); if(review === null){ review = (typeof SEED_REVIEW !== 'undefined') ? SEED_REVIEW : {}; save('review', review); }
var sessions = load('sessions', []);

function saveReview(){ save('review', review); maybeSync(); }
function saveSessions(){ save('sessions', sessions); maybeSync(); }

/* ---------- 视图切换 ---------- */
function showView(name){
  ['review','quiz','history'].forEach(function(v){
    document.getElementById('view-' + v).hidden = (v !== name);
  });
  ['tab-review','tab-quiz','tab-history'].forEach(function(id){
    document.getElementById(id).className = (id === 'tab-' + name) ? 'active' : '';
  });
  if(name === 'history') renderHistory();
  if(name === 'review'){ rProgress(); rRender(); }
}
document.getElementById('tab-review').onclick = function(){ showView('review'); };
document.getElementById('tab-quiz').onclick = function(){ showView('quiz'); };
document.getElementById('tab-history').onclick = function(){ showView('history'); };

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function qImg(q){
  if(q.img) return '<img src="' + q.img + '" style="max-width:100%;border-radius:8px;margin:8px 0;display:block">';
  return '';
}

/* ---------- 复盘模式 ---------- */
var rIndex = 0;

function rFilled(qid){
  var r = review[qid] || {};
  return !!((r.wrong || '').trim() || (r.think || '').trim());
}

function rCurrent(){
  var ids = rList();
  if(ids.length === 0) return null;
  if(rIndex >= ids.length) rIndex = ids.length - 1;
  if(rIndex < 0) rIndex = 0;
  return ids[rIndex];
}

function rProgress(){
  var filled = Q.filter(function(q){ return rFilled(q.id); }).length;
  document.getElementById('rv-progress').textContent = '已记录 ' + filled + ' / ' + Q.length;
  document.getElementById('rv-pbar').style.width = Math.round(filled / Q.length * 100) + '%';
}

function rRender(){
  var ids = rList();
  var total = ids.length;
  if(total === 0){
    document.getElementById('rv-card').innerHTML = '<div class="empty">没有符合条件的题目</div>';
    document.getElementById('rv-pos').textContent = '第 0 / 0 题';
    return;
  }
  var cur = rCurrent();
  var pos = ids.indexOf(cur);
  document.getElementById('rv-pos').textContent = '第 ' + (pos+1) + ' / ' + total + ' 题';

  var q = Q[cur - 1];
  var card = document.getElementById('rv-card');
  var r = review[q.id] || {};
  var ans = q.a;
  var ansTxt = q.o[ans];

  var html = '';
  html += '<div class="qhead"><span class="tag">' + esc(q.c) + ' · ' + esc(q.f) + '</span>';
  html += '<span class="chip ' + (rFilled(q.id) ? 'done' : 'undone') + '">' + (rFilled(q.id) ? '✓ 已记录' : '未记录') + '</span></div>';
  html += '<div class="stem">' + esc(q.n) + '. ' + esc(q.s) + '</div>';
  html += qImg(q);

  var keys = Object.keys(q.o);
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    html += '<div class="opt' + (k === ans ? ' correct' : '') + '" data-ans="' + k + '" id="rv-opt-' + k + '"><span class="key">' + k + '</span><span class="txt">' + esc(q.o[k]) + '</span></div>';
  }

  /* 第一块：正确答案（直接显示） */
  html += '<div class="block"><div class="bhead"><span class="num">1</span>正确答案</div>';
  html += '<div class="ansbox">答案：<b>' + ans + '</b> —— ' + esc(ansTxt) + '</div></div>';

  /* 第二块：我的错误答案 */
  html += '<div class="block"><div class="bhead"><span class="num">2</span>我的错误答案</div>';
  html += '<input type="text" id="rv-wrong" placeholder="填写你当时选的错误答案（如：B），也可点下方按钮快捷填写，自动保存" value="' + esc(r.wrong || '') + '">';
  html += '<div id="rv-wrong-abc" style="display:flex;gap:6px;margin-top:8px">';
  html += '<button class="btn sm ghost" data-letter="A" style="flex:1;min-height:42px;font-size:17px;font-weight:700">A</button>';
  html += '<button class="btn sm ghost" data-letter="B" style="flex:1;min-height:42px;font-size:17px;font-weight:700">B</button>';
  html += '<button class="btn sm ghost" data-letter="C" style="flex:1;min-height:42px;font-size:17px;font-weight:700">C</button>';
  html += '<button class="btn sm ghost" data-letter="D" style="flex:1;min-height:42px;font-size:17px;font-weight:700">D</button>';
  html += '</div>';
  html += '<div class="hint" id="rv-wrong-save">' + ((r.wrong||'').trim() ? '✓ 已保存' : '留空待填') + '</div></div>';

  /* 第三块：错误思路 */
  html += '<div class="block"><div class="bhead"><span class="num">3</span>错误思路</div>';
  html += '<textarea id="rv-think" placeholder="记录你当时的错误思路、误选原因，方便复盘" rows="4">' + esc(r.think || '') + '</textarea>';
  html += '<div class="hint" id="rv-think-save">' + ((r.think||'').trim() ? '✓ 已保存' : '留空待填') + '</div></div>';

  card.innerHTML = html;

  /* 错误答案输入（含 A/B/C/D 快捷按钮） */
  var wInp = document.getElementById('rv-wrong');
  function saveWrongVal(val){
    if(!review[q.id]) review[q.id] = {wrong:'', think:''};
    review[q.id].wrong = val;
    saveReview();
    document.getElementById('rv-wrong-save').textContent = val.trim() ? '✓ 已保存' : '留空待填';
    rProgress();
  }
  wInp.oninput = function(){ saveWrongVal(wInp.value); };
  document.getElementById('rv-wrong-abc').querySelectorAll('button').forEach(function(btn){
    btn.onclick = function(){
      var letter = btn.getAttribute('data-letter');
      wInp.value = letter;
      saveWrongVal(letter);
    };
  });

  /* 错误思路输入 */
  var tInp = document.getElementById('rv-think');
  tInp.oninput = function(){
    if(!review[q.id]) review[q.id] = {wrong:'', think:''};
    review[q.id].think = tInp.value;
    saveReview();
    document.getElementById('rv-think-save').textContent = tInp.value.trim() ? '✓ 已保存' : '留空待填';
    rProgress();
  };

  /* 跳转条 */
  var jr = document.getElementById('rv-jump');
  jr.innerHTML = '';
  ids.forEach(function(qid, idx){
    var b = document.createElement('button');
    b.textContent = qid;
    if(qid === cur) b.className = 'cur';
    b.onclick = function(){ rIndex = idx; rRender(); };
    jr.appendChild(b);
  });
}

document.getElementById('rv-prev').onclick = function(){
  var ids = rList();
  if(ids.length === 0) return;
  rIndex = (rIndex <= 0) ? ids.length - 1 : rIndex - 1;
  rRender();
};
document.getElementById('rv-next').onclick = function(){
  var ids = rList();
  if(ids.length === 0) return;
  rIndex = (rIndex >= ids.length - 1) ? 0 : rIndex + 1;
  rRender();
};
document.getElementById('rv-chapter').onchange = function(){ rIndex = 0; rRender(); };
document.getElementById('rv-onlyempty').onchange = function(){ rIndex = 0; rRender(); };

/* “只看未填”：仅显示未记录的题 */
function rList(){
  var ch = document.getElementById('rv-chapter').value;
  var only = document.getElementById('rv-onlyempty').checked;
  return Q.filter(function(q){
    if(ch && q.c !== ch) return false;
    if(only && rFilled(q.id)) return false;
    return true;
  }).map(function(q){ return q.id; });
};

/* ---------- 搜索题目 ---------- */
function searchMatch(q, terms){
  var hay = (q.s + ' ' + q.c + ' ' + q.f + ' ' + q.id + ' ' +
             Object.keys(q.o).map(function(k){ return q.o[k]; }).join(' ')).toLowerCase();
  return terms.every(function(t){ return hay.indexOf(t) >= 0; });
}

function renderSearch(){
  var box = document.getElementById('rv-search');
  var res = document.getElementById('rv-search-res');
  var val = box.value.trim();
  if(!val){
    res.innerHTML = '<div class="hint">输入关键词搜索，命中后点题目直接跳转填写</div>';
    return;
  }
  var terms = val.toLowerCase().split(/\s+/).filter(Boolean);
  var hits = Q.filter(function(q){ return searchMatch(q, terms); });
  if(hits.length === 0){
    res.innerHTML = '<div class="hint">没有匹配的题目，换个关键词试试</div>';
    return;
  }
  res.innerHTML = '';
  hits.slice(0, 50).forEach(function(q){
    var snippet = q.s.length > 40 ? q.s.slice(0,40) + '…' : q.s;
    var b = document.createElement('button');
    b.style.cssText = 'width:100%;height:auto;padding:8px 10px;text-align:left;margin:4px 0;white-space:normal;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px;';
    b.innerHTML = '<b>#' + q.id + '</b> ' + esc(q.c) + '·' + esc(q.f) +
      '　<span style="color:' + (rFilled(q.id) ? '#16a34a' : '#dc2626') + '">' + (rFilled(q.id) ? '已填' : '未填') + '</span><br>' +
      '<span style="color:#475569">' + esc(snippet) + '</span>';
    b.onclick = function(){ jumpToQuestion(q.id); };
    res.appendChild(b);
  });
  if(hits.length > 50){
    var more = document.createElement('div');
    more.className = 'hint';
    more.textContent = '…还有 ' + (hits.length - 50) + ' 条匹配，请用更具体的关键词';
    res.appendChild(more);
  }
}

function jumpToQuestion(qid){
  document.getElementById('rv-search').value = '';
  document.getElementById('rv-chapter').value = '';
  document.getElementById('rv-onlyempty').checked = false;
  var idx = -1;
  Q.forEach(function(q,i){ if(q.id === qid) idx = i; });
  rIndex = idx >= 0 ? idx : 0;
  renderSearch();
  rRender();
  window.scrollTo(0, 0);
}

document.getElementById('rv-search').oninput = renderSearch;

/* ---------- 刷题模式 ---------- */
var pool = [];       /* 当前刷题题目（去重/打乱/限量后） */
var qIndex = 0;
var answers = [];    /* 每题：{chosen, ok} */
var lastWrongIds = []; /* 用于“只刷错题” */

function qSetupVisible(v){
  document.getElementById('quiz-setup').hidden = !v;
  document.getElementById('quiz-run').hidden = v;
  document.getElementById('quiz-result').hidden = v;
}

function startQuiz(ids){
  /* ids 若给定则直接作为题目池 */
  var list;
  if(ids && ids.length){
    list = ids.slice();
  } else {
    var chks = document.querySelectorAll('.qz-chk');
    var chapters = [];
    chks.forEach(function(c){ if(c.checked) chapters.push(c.value); });
    list = Q.filter(function(q){ return chapters.indexOf(q.c) >= 0; });
    if(document.getElementById('qz-dedupe').checked){
      var seen = {};
      list = list.filter(function(q){ if(seen[q.s]) return false; seen[q.s] = true; return true; });
    }
    if(document.getElementById('qz-random').checked){
      for(var i=list.length-1;i>0;i--){
        var j = Math.floor(Math.random()*(i+1));
        var t = list[i]; list[i] = list[j]; list[j] = t;
      }
    }
    var cnt = parseInt(document.getElementById('qz-count').value, 10);
    if(cnt > 0 && list.length > cnt) list = list.slice(0, cnt);
  }
  if(list.length === 0){
    alert('没有可练习的题目，请勾选章节。');
    return;
  }
  pool = list;
  answers = [];
  qIndex = 0;
  lastWrongIds = [];
  qSetupVisible(false);
  renderQuiz();
}

function renderQuiz(){
  if(qIndex >= pool.length){
    finishQuiz();
    return;
  }
  var q = pool[qIndex];
  var total = pool.length;
  var done = answers.length;
  document.getElementById('qz-progress').textContent = '第 ' + (done+1) + ' / ' + total + ' 题';
  document.getElementById('qz-pbar').style.width = Math.round(done/total*100) + '%';
  document.getElementById('qz-next').hidden = true;
  document.getElementById('qz-stop').textContent = (done === 0 ? '结束本组' : '结束本组');

  var card = document.getElementById('qz-card');
  var html = '';
  html += '<div class="qhead"><span class="tag">' + esc(q.c) + ' · ' + esc(q.f) + '</span><span class="hint">' + esc(q.n) + '/题</span></div>';
  html += '<div class="stem">' + esc(q.s) + '</div>';
  html += qImg(q);
  var keys = Object.keys(q.o);
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    html += '<div class="opt clickable" id="qz-opt-' + k + '"><span class="key">' + k + '</span><span class="txt">' + esc(q.o[k]) + '</span></div>';
  }
  html += '<div id="qz-feedback"></div>';
  card.innerHTML = html;

  var clicked = false;
  keys.forEach(function(k){
    document.getElementById('qz-opt-' + k).onclick = function(){
      if(clicked) return;
      clicked = true;
      var correct = (k === q.a);
      answers.push({chosen:k, ok:correct, q:q});
      /* 标记样式 */
      keys.forEach(function(kk){
        var el = document.getElementById('qz-opt-' + kk);
        el.classList.add('disabled');
        el.onclick = null;
        if(kk === q.a) el.classList.add('correct');
        else if(kk === k) el.classList.add('wrong');
      });
      var fb = document.getElementById('qz-feedback');
      if(correct){
        fb.innerHTML = '<div class="feed ok">✓ 回答正确！</div>';
      } else {
        fb.innerHTML = '<div class="feed no">✗ 回答错误</div><div class="answer-line">正确答案：' + q.a + ' —— ' + esc(q.o[q.a]) + '</div>';
      }
      document.getElementById('qz-next').hidden = false;
    };
  });
}

document.getElementById('qz-next').onclick = function(){
  qIndex++;
  renderQuiz();
};

document.getElementById('qz-start').onclick = function(){ startQuiz(); };

document.getElementById('qz-stop').onclick = function(){
  if(answers.length === 0 && pool.length > 0){
    if(!confirm('本组还没作答，确定结束吗？')) return;
  }
  finishQuiz();
};

function finishQuiz(){
  var total = answers.length;
  var right = answers.filter(function(a){ return a.ok; }).length;
  var wrong = total - right;
  var acc = total === 0 ? 0 : Math.round(right/total*100);

  document.getElementById('rz-total').textContent = total;
  document.getElementById('rz-right').textContent = right;
  document.getElementById('rz-wrong').textContent = wrong;
  document.getElementById('rz-acc').textContent = acc + '%';

  var wl = document.getElementById('rz-wronglist');
  lastWrongIds = [];
  if(wrong === 0){
    wl.innerHTML = '<div class="empty">全部答对，太棒了！</div>';
  } else {
    wl.innerHTML = '';
    answers.forEach(function(a){
      if(a.ok) return;
      lastWrongIds.push(a.q.id);
      var div = document.createElement('div');
      div.className = 'wrong-row';
      div.innerHTML = '<b>#' + a.q.id + '</b> ' + esc(a.q.c) + '·' + esc(a.q.f) + '<br>' +
        '题干：' + esc((a.q.s.length>60 ? a.q.s.slice(0,60)+'…' : a.q.s)) + '<br>' +
        '你的答案：<span class="wa">' + a.chosen + '</span>　正确答案：<span class="ra">' + a.q.a + '</span>';
      wl.appendChild(div);
    });
  }

  /* 保存刷题记录 */
  var rec = {
    t: new Date().toLocaleString('zh-CN', {hour12:false}),
    total: total,
    right: right,
    wrong: wrong,
    acc: acc,
    wrongList: answers.filter(function(a){ return !a.ok; }).map(function(a){
      return {qid:a.q.id, c:a.q.c, f:a.q.f, n:a.q.n, stem:a.q.s, userAns:a.chosen, ans:a.q.a};
    })
  };
  sessions.unshift(rec);
  if(sessions.length > 200) sessions = sessions.slice(0, 200);
  saveSessions();

  document.getElementById('quiz-run').hidden = true;
  document.getElementById('quiz-result').hidden = false;
}

document.getElementById('rz-again').onclick = function(){
  if(lastWrongIds.length === 0){ alert('本轮没有错题。'); return; }
  startQuiz(lastWrongIds);
  lastWrongIds = [];
};
document.getElementById('rz-back').onclick = function(){
  qSetupVisible(true);
};

/* ---------- 刷题记录 ---------- */
function renderHistory(){
  var list = document.getElementById('his-list');
  if(sessions.length === 0){
    list.innerHTML = '<div class="empty">还没有刷题记录，去刷题模式练一练吧</div>';
    return;
  }
  list.innerHTML = '';
  sessions.forEach(function(rec, idx){
    var item = document.createElement('div');
    item.className = 'hist-item';
    var accCls = rec.acc >= 80 ? 'ok' : (rec.acc >= 60 ? 'mid' : 'bad');
    var head = '<div class="hist-top">' +
      '<span>' + esc(rec.t) + '</span>' +
      '<span>共 ' + rec.total + ' 题 · 对 ' + rec.right + ' · 错 ' + rec.wrong +
      '　<span class="acc ' + accCls + '">' + rec.acc + '%</span></span>' +
      '</div>';
    var body = '';
    if(rec.wrongList && rec.wrongList.length){
      body += '<div id="his-wl-' + idx + '" hidden>';
      rec.wrongList.forEach(function(w){
        body += '<div class="wrong-row"><b>#' + w.qid + '</b> ' + esc(w.c) + '·' + esc(w.f) + '<br>' +
          '题干：' + esc((w.stem.length>60 ? w.stem.slice(0,60)+'…' : w.stem)) + '<br>' +
          '你的答案：<span class="wa">' + w.userAns + '</span>　正确答案：<span class="ra">' + w.ans + '</span></div>';
      });
      body += '</div>';
    }
    var btns = '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">';
    if(rec.wrongList && rec.wrongList.length){
      btns += '<button class="btn sm ghost" data-toggle="his-wl-' + idx + '" data-count="' + rec.wrongList.length + '">' + rec.wrongList.length + ' 道错题详情</button>';
      btns += '<button class="btn sm" data-replay="' + idx + '">再刷这套错题</button>';
    }
    btns += '</div>';
    item.innerHTML = head + body + btns;
    list.appendChild(item);
  });

  /* 绑定事件 */
  list.querySelectorAll('button[data-toggle]').forEach(function(b){
    b.onclick = function(){
      var t = document.getElementById(b.getAttribute('data-toggle'));
      t.hidden = !t.hidden;
      b.textContent = t.hidden ? (b.getAttribute('data-count') + ' 道错题详情') : '收起';
    };
  });
  list.querySelectorAll('button[data-replay]').forEach(function(b){
    b.onclick = function(){
      var idx = parseInt(b.getAttribute('data-replay'), 10);
      var rec = sessions[idx];
      var ids = (rec.wrongList || []).map(function(w){ return w.qid; });
      showView('quiz');
      qSetupVisible(false);
      startQuiz(ids);
    };
  });
}

document.getElementById('his-clear').onclick = function(){
  if(confirm('确定清空全部刷题记录吗？（错题复盘笔记不会受影响）')){
    sessions = [];
    saveSessions();
    renderHistory();
  }
};

/* 导出 / 导入数据 */
document.getElementById('his-export').onclick = function(){
  var data = JSON.stringify({review: review, sessions: sessions}, null, 2);
  var blob = new Blob([data], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '政治理论错题数据_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 100);
};
document.getElementById('his-import-btn').onclick = function(){
  document.getElementById('his-import').click();
};
document.getElementById('his-import').onchange = function(){
  var file = this.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(reader.result);
      if(data['题目'] && Array.isArray(data['题目'])){
        /* 完整记录格式（含正确答案 + 我的错误答案） */
        var nr = {};
        data['题目'].forEach(function(it){
          if(it && it['题号']){
            var wrong = it['我的错误答案'] || '';
            var think = it['错误思路'] || '';
            if(wrong || think) nr[it['题号']] = {wrong: wrong, think: think};
          }
        });
        review = nr; saveReview();
        alert('导入成功！已从完整记录恢复 ' + Object.keys(review).length + ' 条复盘笔记。');
      } else {
        if(data.review && typeof data.review === 'object'){ review = data.review; saveReview(); }
        if(data.sessions && Array.isArray(data.sessions)){ sessions = data.sessions; saveSessions(); }
        alert('导入成功！复盘笔记 ' + Object.keys(review).length + ' 条，刷题记录 ' + sessions.length + ' 条。');
      }
      renderHistory();
    } catch(e){
      alert('导入失败：文件格式不正确。');
    }
  };
  reader.readAsText(file);
  this.value = '';
};

/* ---------- 导出 / 自动同步 JSON ---------- */
function buildExport(){
  var now = new Date();
  var filled = 0;
  var items = Q.map(function(q){
    var r = review[q.id] || {};
    var wrong = (r.wrong || '').trim();
    var think = (r.think || '').trim();
    if(wrong || think) filled++;
    return {
      '题号': q.id,
      '章节': q.c,
      '分类': q.f,
      '题干': q.s,
      '选项': q.o,
      '正确答案': q.a,
      '我的错误答案': wrong,
      '错误思路': think
    };
  });
  return JSON.stringify({
    '说明': '错题记录：正确答案 + 我的错误答案 + 错误思路（政治理论 + 常识判断）',
    '导出时间': now.toLocaleString('zh-CN', {hour12:false}),
    '统计': {'总题数': Q.length, '已填写': filled},
    '题目': items
  }, null, 2);
}

document.getElementById('rev-export-full').onclick = function(){
  var blob = new Blob([buildExport()], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '错题记录_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 100);
};

var fileHandle = null;
var syncTimer = null;
var syncStatus = document.getElementById('rev-sync-status');

function setSyncStatus(msg){ if(syncStatus) syncStatus.textContent = msg; }

function maybeSync(){
  if(!fileHandle) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){
    writeFile().then(function(){
      setSyncStatus('✓ ' + new Date().toLocaleTimeString('zh-CN', {hour12:false}) + ' 已同步到 ' + fileHandle.name);
    }).catch(function(e){
      setSyncStatus('同步失败：' + (e && e.message ? e.message : e));
    });
  }, 800);
}

function writeFile(){
  if(!fileHandle) return Promise.resolve();
  return fileHandle.createWritable().then(function(w){
    return w.write(buildExport()).then(function(){ return w.close(); });
  });
}

/* ---------- 记忆绑定：IndexedDB 保存文件句柄，刷新后自动恢复 ---------- */
var DB_NAME = 'zzll-fs';
var DB_STORE = 'handles';
var DB_KEY = 'ledger-handle';

function idbOpen(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbPut(handle){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(handle, DB_KEY);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbDel(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(DB_KEY);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve){
      var rq = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(DB_KEY);
      rq.onsuccess = function(){ resolve(rq.result); };
      rq.onerror = function(){ resolve(null); };
    });
  });
}

function restoreBinding(){
  if(!window.indexedDB || !window.showSaveFilePicker) return;
  idbGet().then(function(handle){
    if(!handle) return;
    if(handle.queryPermission){
      return handle.queryPermission({mode:'readwrite'}).then(function(state){
        if(state === 'granted'){
          fileHandle = handle;
          document.getElementById('rev-unbind').hidden = false;
          return writeFile().then(function(){
            setSyncStatus('✓ 已自动恢复绑定：' + handle.name);
          });
        }
        document.getElementById('rev-resume').hidden = false;
        setSyncStatus('检测到上次绑定的文件，点“恢复上次绑定”即可继续同步。');
      });
    }
    fileHandle = handle;
    document.getElementById('rev-unbind').hidden = false;
    setSyncStatus('✓ 已恢复绑定：' + handle.name);
  }).catch(function(){});
}

document.getElementById('rev-bind').onclick = function(){
  if(!window.showSaveFilePicker){
    alert('当前浏览器不支持自动写入文件。请改用“导出完整JSON”按钮下载；或使用 Chrome / Edge 浏览器打开本页面。');
    return;
  }
  window.showSaveFilePicker({
    suggestedName: '错题记录.json',
    types: [{description: 'JSON 文件', accept: {'application/json': ['.json']}}]
  }).then(function(handle){
    fileHandle = handle;
    document.getElementById('rev-unbind').hidden = false;
    document.getElementById('rev-resume').hidden = true;
    return idbPut(handle).then(function(){
      return writeFile().then(function(){
        setSyncStatus('已绑定：' + handle.name + '（已记忆，刷新后自动恢复）');
      });
    });
  }).catch(function(e){
    if(e && e.name === 'AbortError') return; /* 用户取消 */
    setSyncStatus('绑定失败：' + (e && e.message ? e.message : e));
  });
};

document.getElementById('rev-resume').onclick = function(){
  idbGet().then(function(handle){
    if(!handle){ setSyncStatus('没有找到上次的绑定记录，请重新绑定。'); return; }
    if(handle.requestPermission){
      return handle.requestPermission({mode:'readwrite'}).then(function(state){
        if(state === 'granted'){
          fileHandle = handle;
          document.getElementById('rev-unbind').hidden = false;
          document.getElementById('rev-resume').hidden = true;
          return writeFile().then(function(){
            setSyncStatus('✓ 已恢复上次绑定：' + handle.name);
          });
        }
        setSyncStatus('授权未通过，请点“绑定文件自动同步”重新选择文件。');
      });
    }
    fileHandle = handle;
    document.getElementById('rev-unbind').hidden = false;
    document.getElementById('rev-resume').hidden = true;
    setSyncStatus('✓ 已恢复绑定：' + handle.name);
  }).catch(function(){ setSyncStatus('恢复失败，请重新绑定。'); });
};

document.getElementById('rev-unbind').onclick = function(){
  fileHandle = null;
  document.getElementById('rev-unbind').hidden = true;
  idbDel().catch(function(){});
  setSyncStatus('已解除绑定。');
};

/* ---------- 初始化 ---------- */
showView('review');
rProgress();
rRender();
restoreBinding();
