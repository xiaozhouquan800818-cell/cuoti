.6}\\approx\\frac{288.6}{1550+1810+590+290}\\approx\\frac{288.6}{4240}\\approx 6.8\\%$$\n\n  ，6.8%>6.1%，即比重较上一年有所上升，错误；\n- C项：定位统计图可知：2022年竞猜型彩票销售额为1809.3亿元。所以2022年内竞猜型彩票月平均销售额$=\\frac{1809.3}{12}\\approx 151$亿元=15100百万元。定位表格可知：2022年1-12月各月竞猜型彩票销售额，其中月销售额高于年内月平均销售额的月份只有11月（31081.42百万元）、12月（42994.68百万元），共2个，正确；\n- D项：定位统计图可知：2021年、2022年乐透数字型、竞猜型、即开型、基诺型和视频型各类型彩票销售额。所以2021年全国彩票销售总额=1618.9+1343.2+543.9+226.9=3732.9亿元，2022年全国彩票销售总额=1554.2+1809.3+594.5+288.6=4246.6亿元，题干所求=4246.6-3732.9=513.7亿元>500亿元，正确。\n\n本题为选非题，故正确答案为B。","point":"综合分析；综合资料","src":"2023年吉林省公务员录用考试《行测》题（网友回忆版）第94题","bimgs":["book/228.webp","book/229.webp"],"setno":1,"qno":5,"p0":"229","setTxt":"综合·提升进阶 第1套","gid":94},{"no":"ZL-141","sec":"综合资料","cat":"综合资料","qh":"230-6","page":"229 230","bsec":"综合","bpart":"提升进阶","mat":"2021年，各地区各部门全面落实党中央、国务院关于实现数字乡村发展战略的决策部署，积极引入社会资 本投资建数字乡村。2021年全国用于县域农业农村信息化建设的社会资本投入为954.6亿元，县均社会资本投入 3588.8万元、乡村人均社会资本投入135.2元，分别比上年增长17.2%和24.0%。分区域看，东部地区社会资本投 入562.4亿元，占全国社会资本投入58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿 元。 ","imgs":["image/综合_题21_材料图1.png","image/综合_题21_材料图2.png"],"stem":"2019-2021年，全国县域农业农村信息化建设县均社会资本投入的年均增率约为（ ）。","opts":{"A":"10%","B":"21%","C":"32%","D":"43%"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"66%","trap":"B","sol":"根据题干\"2019-2021年，……年均增率约为\"，可判定本题为年均增长率问题。定位图1可得：2019年全国县域工业农村信息化建设县均社会资本投入为2054.6万元，2021年为3588.8万元。根据公式：\n\n$$(1+r)^{n}=\\frac{现期量}{基期量}$$\n\n，则$(1+r)^{2}=\\frac{3588.8}{2054.6}\\approx 1.75$，解得$r\\approx 32\\%$。\n\n故正确答案为C。","point":"年均增长率；综合资料","src":"2024年广东省公务员录用考试《行测》题（网友回忆版）第86题","bimgs":["book/229.webp","book/230.webp"],"setno":1,"qno":6,"p0":"230","setTxt":"综合·提升进阶 第1套","gid":95},{"no":"ZL-142","sec":"综合资料","cat":"综合资料","qh":"231-8","page":"229 230 231","bsec":"综合","bpart":"提升进阶","mat":"2021年，各地区各部门全面落实党中央、国务院关于实现数字乡村发展战略的决策部署，积极引入社会资 本投资建数字乡村。2021年全国用于县域农业农村信息化建设的社会资本投入为954.6亿元，县均社会资本投入 3588.8万元、乡村人均社会资本投入135.2元，分别比上年增长17.2%和24.0%。分区域看，东部地区社会资本投 入562.4亿元，占全国社会资本投入58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿 元。 ","imgs":["image/综合_题21_材料图1.png","image/综合_题21_材料图2.png"],"stem":"2021年，东部地区县域农业农村信息化建设社会资本投入约是中、西部地区之和的（ ）倍。","opts":{"A":"1.43","B":"1.64","C":"1.80","D":"1.95"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"60%","trap":"C","sol":"根据\"2021年……是……倍\"，可判定本题为现期倍数问题。定位文字材料第一段可得：（2021年）分区域看，东部地区社会资本投入562.4亿元，占全国社会资本投入的58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿元。\n\n方法一：根据公式：倍数$=\\frac{A}{B}$，则所求\n\n$$=\\frac{东部}{中部+西部}=\\frac{562.4}{193.8+198.4}=\\frac{562.4}{392.2}\u003c1.5\\ \\text{倍}$$\n\n，只有A项符合。\n\n方法二：根据公式：部分=整体×比重，且全国社会资本投入=东部+中部+西部，则所求倍数\n\n$$=\\frac{东部}{全国-东部}=\\frac{全国\\times 东部占比}{全国-全国\\times 东部占比}=\\frac{东部占比}{1-东部占比}=\\frac{58.9\\%}{1-58.9\\%}=\\frac{58.9\\%}{41.1\\%}\u003c1.5\\ \\text{倍}$$\n\n，只有A项符合。\n\n故正确答案为A。","point":"现期倍数；综合资料","src":"2024年广东省公务员录用考试《行测》题（网友回忆版）第87题","bimgs":["book/229.webp","book/230.webp","book/231.webp"],"setno":1,"qno":8,"p0":"231","setTxt":"综合·提升进阶 第1套","gid":95},{"no":"ZL-143","sec":"综合资料","cat":"综合资料","qh":"231-9","page":"229 230 231","bsec":"综合","bpart":"提升进阶","mat":"2021年，各地区各部门全面落实党中央、国务院关于实现数字乡村发展战略的决策部署，积极引入社会资 本投资建数字乡村。2021年全国用于县域农业农村信息化建设的社会资本投入为954.6亿元，县均社会资本投入 3588.8万元、乡村人均社会资本投入135.2元，分别比上年增长17.2%和24.0%。分区域看，东部地区社会资本投 入562.4亿元，占全国社会资本投入58.9%；中部地区社会资本投入193.8亿元；西部地区社会资本投入198.4亿 元。 ","imgs":["image/综合_题21_材料图1.png","image/综合_题21_材料图2.png"],"stem":"2021年，关于县域农业农村信息化建设，下列数据同比增长率最大的是（ ）。","opts":{"A":"东部地区县均社会资本投入","B":"东部地区乡村人均社会资本投入","C":"西部地区县均社会资本投入","D":"西部地区乡村人均社会资本投入"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"73%","trap":"C","sol":"根据题干\"2021年……同比增长率最大的是\"，可判定本题为一般增长率问题。定位图1可得2020、2021年东部、西部地区的县均社会资本投入。定位图2可得2020、2021年东部、西部地区的乡村人均社会资本投入。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则各选项2021年同比增长率分别为：\n\n东部地区县均社会资本投入$=\\frac{7410.0-6129.8}{6129.8}\\approx\\frac{1280.2}{6100}=20\\%^{+}$；\n\n东部地区乡村人均社会资本投入$=\\frac{231.8-182.1}{182.1}\\approx\\frac{49.7}{180}=20\\%^{+}$；\n\n西部地区县均社会资本投入$=\\frac{1893.1-1327.9}{1327.9}\\approx\\frac{565.2}{1300}=40\\%^{+}$；\n\n西部地区乡村人均社会资本投入$=\\frac{89.4-59.6}{59.6}=\\frac{29.8}{59.6}=50\\%$。\n\n综上，同比增长率最大的是2021年西部地区乡村人均社会资本投入。\n\n故正确答案为D。","point":"一般增长率比较；综合资料","src":"2024年广东省公务员录用考试《行测》题（网友回忆版）第88题","bimgs":["book/229.webp","book/230.webp","book/231.webp"],"setno":1,"qno":9,"p0":"231","setTxt":"综合·提升进阶 第1套","gid":95},{"no":"ZL-144","sec":"综合资料","cat":"综合资料","qh":"232-14","page":"231 232","bsec":"综合","bpart":"提升进阶","mat":"2021年，全国城市供水总量673.34亿立方米，同比增长6.96%；城市供水管道长度105.99万公里，同比增长 5.26%；人均日生活用水量185.03升；供水普及率99.38%，比上年增加0.39个百分点。天津、河北、上海、江 苏、浙江和广东6个省（市）城市供水普及率达到100%；福建、山东、湖北、广西、安徽、辽宁、宁夏、新 疆、内蒙古、山西、甘肃、河南、黑龙江、江西、云南和湖南16个省（区）超过99%（含）；西藏、青海、北 京、四川、贵州和陕西6个省（区、市）超过98%；重庆、吉林、海南3个省（市）和新疆建设兵团超过95%。 ","imgs":["image/综合_题24_材料图.png"],"stem":"图2中，城市人均日生活用水量最高的省份是用水量中位数省份的约：","opts":{"A":"1.78倍","B":"1.88倍","C":"1.95倍","D":"2.03倍"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"71%","trap":"C","sol":"根据题干\"图2中……是……\"，结合选项求倍数，可判定本题为现期倍数问题。定位图2可知，城市人均日生活用水量最高的省份是海南，用水量为315升；城市人均日生活用水量中位数省份，即排名第8的省份为宁夏，用水量为168升。故城市人均日生活用水量最高的省份是用水量中位数省份的倍数为$\\frac{315}{168}=1.875$倍，与B项最接近。\n\n故正确答案为B。","point":"现期倍数；综合资料","src":"2023年江西省公务员录用考试《行测》题（网友回忆版）第123题","bimgs":["book/231.webp","book/232.webp"],"setno":1,"qno":14,"p0":"232","setTxt":"综合·提升进阶 第1套","gid":96},{"no":"ZL-145","sec":"综合资料","cat":"综合资料","qh":"233-16","page":"233 234","bsec":"综合","bpart":"提升进阶","mat":"五年来，我国积极推进网络强国和数字中国建设，着力深化数字经济与实体经济融合，为打造数字经济新 优势、增强经济发展新动能提供有力支撑。2022年，我国电信业务收入累计完成1.58万亿元，比上年增长8%， 较2018年增长超2800亿元。 2022年移动数据流量业务收入6397亿元，比上年增长0.3%，在电信业务收入中占比约为40.5%。数据中 心、云计算、大数据、物联网等新兴业务快速发展，对我国电信业务拉动作用持续增强。2022年新兴业务收入  达3072亿元，在电信业务收入中占比由上年的16.1%提升至19.4%。其中，数据中心、云计算、大数据、物联网 业务比上年分别增长11.5%、118.2%、58%和24.7%。","imgs":["image/综合_题25_材料图1.png","image/综合_题25_材料图2.png"],"stem":"2022年我国电信业务收入约为2018年的（ ）倍。","opts":{"A":"1.1","B":"1.2","C":"1.3","D":"1.4"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"D","a2":null,"rate":"84%","trap":"A","sol":"根据题干\"2022年……为2018年的（ ）倍\"，可判定本题为现期倍数问题。定位文字材料第一段可得：2022年，我国电信业务收入累计完成1.58万亿元，较2018年增长超2800亿元。可知，2022年电信业务收入较2018年的增长量在2800~2900亿元之间。根据公式：基期量=现期量-增长量，则题干所求在\n\n$$\\frac{1.58}{(1.58-2800\\times 10^{-4})}=\\frac{1.58}{1.3}\\approx 1.215\\ \\text{倍}$$\n\n与$\\frac{1.58}{(1.58-2900\\times 10^{-4})}=\\frac{1.58}{1.29}\\approx 1.225$倍之间，保留小数点后一位，约为1.2倍。\n\n故正确答案为B。\n\n**考场思维**：由于分母1.3和1.29很接近，1.58除以这两个数的商差别很小，考场上可直接近似用1.58÷1.3得出答案。","point":"现期倍数；综合资料","src":"2023年广东省公务员录用考试《行测》题（县级卷）（网友回忆版）第96题","bimgs":["book/233.webp","book/234.webp"],"setno":1,"qno":16,"p0":"233","setTxt":"综合·提升进阶 第1套","gid":97},{"no":"ZL-146","sec":"综合资料","cat":"综合资料","qh":"235-2","page":"234 235","bsec":"综合","bpart":"提升进阶","mat":"2018年全球茶叶产量585.6万吨，同比增长约3%，中国茶叶产量261.6万吨，同比增长0.7万吨。2018年，中 国茶叶国内销售量为191万吨，同比增长5.1%，国内销售总额为2661亿元，出口量为36.5万吨，同比增长2.8%， 出口总额为17.89亿美元（合人民币120亿元），同比增长（？）。","imgs":["image/综合_题26_材料图.png"],"stem":"设中国茶叶国内销售量和出口量与当年中国茶叶产量的比值分别为x和y，则2018年的x和y值与2017年分别相比：","opts":{"A":"两者均下降","B":"两者均上升","C":"只有x值上升","D":"只有y值上升"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"D","a2":null,"rate":"74%","trap":"C","sol":"根据题干\"设……与……的比值分别为x和y，则2018年的x和y值与2017年分别相比\"，可判定本题为比值比较问题。定位文字材料可得，2018年中国茶叶产量261.6万吨，同比增长0.7万，中国茶叶国内销售量为191万吨，同比增长5.1%（$a_{x}$），出口量为36.5万吨，同比增长2.8%（$a_{y}$）。根据本篇材料第1题的计算结果可知，2018年中国茶叶产量同比增速$b\\approx 0.3\\%$，根据两期比重结论，当a>b时，比重上升，2018年茶叶国内销售量增速（$a_{x}=5.1\\%$）和出口量增速（$a_{y}=2.8\\%$）均高于茶叶产量增速（$b\\approx 0.3\\%$），可知2018年中国茶叶国内销售量和出口量与当年中国茶叶产量的比值均高于上年同期，即2018年的x、y值与2017年相比均有所上升。\n\n故正确答案为B。","point":"两期比重/比值比较；综合资料","src":"2021年北京市公务员录用考试《行测》题（区级及以上卷）（网友回忆版）第126题","bimgs":["book/234.webp","book/235.webp"],"setno":2,"qno":2,"p0":"235","setTxt":"综合·提升进阶 第2套","gid":98},{"no":"ZL-147","sec":"综合资料","cat":"综合资料","qh":"236-7","page":"236","bsec":"综合","bpart":"提升进阶","mat":" 2019年，我国快递业务量为635.2亿件，其中东部、中部、西部地区分别完成业务量506.3亿件、81.9亿件和 47亿件。全年快递业务收入7497.8亿元，其中东部、中部、西部地区的业务收入所占比重分别为80.2%、11.3% 和8.5%。东部、中部、西部地区业务收入占全国比重分别比上年上升0.2个百分点、上升0.1个百分点和下降0.3 个百分点。 2016-2018年，我国快递业务收入分别为3974.4亿元、4957.1亿元、6038.4亿元。","imgs":["image/综合_题27_材料图.png"],"stem":"2019年，中部地区平均每件快递产生的快递业务收入约是西部地区的多少倍？","opts":{"A":"0.5","B":"0.8","C":"1.3","D":"2.1"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"68%","trap":"C","sol":"根据题干\"2019年……是……的多少倍\"，可判定本题为现期倍数问题。定位文字材料第一段可得：2019年，我国中部、西部地区分别完成业务量81.9亿件和47亿件。全年快递业务收入7497.8亿元，其中中部、西部地区的业务收入所占比重分别为11.3%和8.5%。根据公式：地区快递业务收入=全国快递业务收入×地区占比，则所求倍数\n\n$$=\\frac{7497.8\\times 11.3\\%}{81.9}\\div\\frac{7497.8\\times 8.5\\%}{47}\\approx\\frac{11}{82}\\times\\frac{47}{8.5}\\approx 0.7$$\n\n，与B项最接近。\n\n故正确答案为B。","point":"现期倍数；综合资料","src":"2022年四川省公务员录用考试《行测》题（网友回忆版）第96题","bimgs":["book/236.webp"],"setno":2,"qno":7,"p0":"236","setTxt":"综合·提升进阶 第2套","gid":99},{"no":"ZL-148","sec":"综合资料","cat":"综合资料","qh":"238-12","page":"238","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题28_材料图1.png","image/综合_题28_材料图2.png"],"stem":"与2009年相比，2019年城镇非私营单位就业人员平均工资增长的倍数约为：","opts":{"A":"1.5倍","B":"1.8倍","C":"2.8倍","D":"3.2倍"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"54%","trap":"C","sol":"根据题干\"与2009相比，2019年……增长的倍数约为\"，可判定本题为一般增长率计算问题。定位图1可知，2009年、2019年城镇非私营单位就业人员平均工资分别为32244元、90501元。根据增长率\n\n$$=\\frac{现期-基期}{基期}$$\n\n，所求增长率$=\\frac{90501-32244}{32244}\\approx\\frac{90500-32200}{32200}\\approx\\frac{583}{320}\\approx 182\\%=1.82$倍，即增长的倍数约为1.8倍。\n\n故正确答案为B。","point":"一般增长率；综合资料","src":"2021年广西区考公务员录用考试《行测》题（网友回忆版）第106题","bimgs":["book/238.webp"],"setno":2,"qno":12,"p0":"238","setTxt":"综合·提升进阶 第2套","gid":100},{"no":"ZL-149","sec":"综合资料","cat":"综合资料","qh":"240-19","page":"239 240","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题29_材料图.png"],"stem":"2019年棉花种植面积排名前7的省区中，棉花单产超过1吨/公顷的省区有几个？","opts":{"A":"5","B":"4","C":"3","D":"2"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"D","a2":null,"rate":"79%","trap":"B","sol":"根据题干\"2019年……棉花单产超过1吨/公顷\"，且材料时间是2019年，可判定本题为现期平均数问题。定位表格材料，根据公式：\n\n$$单产=\\frac{总产量}{种植面积}$$\n\n可知，只需 $\\frac{总产量}{种植面积}>1$ 吨/公顷即可，则2019年棉花种植面积排名前7的省区棉花单产情况如下：\n\n河北：$\\frac{22.7万吨}{203.9千公顷}=\\frac{22.7\\times 10000吨}{203.9\\times 综合资料","src":"2021年国家公务员录用考试《行测》题（副省级网友回忆版）第128题","bimgs":["book/243.webp","book/244.webp"],"setno":3,"qno":14,"p0":"243","setTxt":"综合·提升进阶 第3套","gid":104},{"no":"ZL-153","sec":"综合资料","cat":"综合资料","qh":"244-13","page":"243 244","bsec":"综合","bpart":"提升进阶","mat":"2019年，1043.0万残疾儿童及持证 残疾人得到基本康复服务，其中包括0～6岁残疾儿童18.1万人。  截至2019年末，全国已竣工的各级残疾人综合服务设施2341个，总建设规模584.5万平方米，总投资183.1 亿元；已竣工各级残疾人康复设施1006个，总建设规模414.2万平方米，总投资132.2亿元。","imgs":["image/综合_题33_材料图2.png","image/综合_题33_材料图4.png"],"stem":"如提供视力残疾康复服务的残疾人康复机构中，同时提供听力言语残疾康复服务的机构比不提供该服务的机构多20%，则2019年末全国有多少家残疾人康复机构不提供以上两种康复服务中的任意一种？","opts":{"A":"不到7300家","B":"7300～7600家之间","C":"7600～7900家之间","D":"超过7900家"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"60%","trap":"A","sol":"定位图形材料1可得：2019年全国残疾人康复机构总数为9775个；定位图形材料2可得：提供视力残疾康复服务的机构为1430个，提供听力言语残疾康复服务的机构为1669个。根据题干\"提供视力残疾康复服务的残疾人康复机构中，同时提供听力言语残疾康复服务的机构比不提供该服务的机构多20%\"，假设在提供视力残疾康复服务的机构中，不提供听力言语残疾康复服务的机构数为x个，则提供的机构数为1.2x个，可得：x+1.2x=1430，解得x=650，即只提供视力残疾康复服务的机构为650个。因此2019年末不提供以上两种康复服务中的任意一种的机构数为9775-650-1669≈9780-650-1670=7400⁺个，在B项范围内。\n\n故正确答案为B。","point":"两集合容斥；综合资料","src":"2021年国家公务员录用考试《行测》题（副省级网友回忆版）第127题","bimgs":["book/243.webp","book/244.webp"],"setno":3,"qno":13,"p0":"244","setTxt":"综合·提升进阶 第3套","gid":104},{"no":"ZL-154","sec":"综合资料","cat":"综合资料","qh":"245-17","page":"245","bsec":"综合","bpart":"提升进阶","mat":"2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长9.5%， 在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少2.9%。 2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：","imgs":["image/综合_题35_材料图.png"],"stem":"2015~2019年，移动电话基站总量同比增速最快的年份是：","opts":{"A":"2015年","B":"2016年","C":"2017年","D":"2019年"},"letters":["A","B","C","D"],"key":"A","bookkey":"B","a1":"D","a2":null,"rate":"69%","trap":"D","sol":"根据题干\"2015~2019年，移动电话基站总量同比增速最快的年份\"，可判定本题为一般增长率比较问题。定位图形材料可得2014~2019年移动电话基站总量分别为：\n\n2014年：85+266=351万个；\n\n2015年：177+289=466万个；\n\n2016年：263+296=559万个；\n\n2017年：328+291=619万个；\n\n2018年：372+295=667万个；\n\n2019年：544+297=841万个。\n\n代入公式：增长率$=\\frac{现期量-基期量}{基期量}$，可得：\n\n2015年：$\\frac{466-351}{351}=\\frac{115}{351}=30\\%^{+}$；\n\n2016年：$\\frac{559-466}{466}=\\frac{93}{466}\\approx 20\\%$；\n\n2017年：$\\frac{619-559}{559}=\\frac{60}{559}=10\\%^{+}$；\n\n2019年：$\\frac{841-667}{667}=\\frac{174}{667}=20\\%^{+}$。\n\n比较可知，2015~2019年，移动电话基站总量同比增速最快的年份是2015年。\n\n故正确答案为A。","point":"一般增长率比较；综合资料","src":"2021年山东省公务员录用考试《行测》题（网友回忆版）第76题","bimgs":["book/245.webp"],"setno":3,"qno":17,"p0":"245","setTxt":"综合·提升进阶 第3套","gid":105},{"no":"ZL-155","sec":"综合资料","cat":"综合资料","qh":"246-19","page":"245 246","bsec":"综合","bpart":"提升进阶","mat":"2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长9.5%， 在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少2.9%。 2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：","imgs":["image/综合_题35_材料图.png"],"stem":"假设4G基站数保持2019年同比增量不变，且由于5G技术的快速普及，2020年开始每年非4G基站同比增量均为300万个。问哪一年4G基站数占移动电话基站总量的比重将下降到50%以下？","opts":{"A":"2021","B":"2022","C":"2023","D":"2024"},"letters":["A","B","C","D"],"key":"A","bookkey":"B","a1":"B","a2":null,"rate":"64%","trap":"B","sol":"根据题干\"假设……保持2019年同比增量不变……哪一年……比重将下降到50%以下\"，结合选项时间为2021~2024年，可判定本题为现期追赶计算问题。定位图形材料可知，2018年4G基站数为372万个；2019年4G基站数及非4G基站数分别为544万个、297万个。根据现期量=基期量+增长量×n，则4G基站数=544+(544-372)n=544+172n，移动电话基站总量=4G基站数+非4G基站数\n\n$$=544+172n+297+300n=841+472n$$\n\n。故 $\\frac{4G基站数}{移动电话基站总量}=\\frac{544+172n}{841+472n}\u003c50\\%$，解得n>1.93，向上取整，n=2，所以需经过2年，即在2019+2=2021年实现4G基站数占比下降到50%以下。\n\n故正确答案为A。","point":"现期计算；综合资料","src":"2021年山东省公务员录用考试《行测》题（网友回忆版）第78题","bimgs":["book/245.webp","book/246.webp"],"setno":3,"qno":19,"p0":"246","setTxt":"综合·提升进阶 第3套","gid":105},{"no":"ZL-156","sec":"综合资料","cat":"综合资料","qh":"246-20","page":"245 246","bsec":"综合","bpart":"提升进阶","mat":"2019年，我国电信业务收入累计完成金额1.31万亿元，固定通信业务收入完成4161亿元，同比增长9.5%， 在电信业务收入中所占比重较上年提高2.6个百分点；移动通信业务实现收入8942亿元，同比减少2.9%。 2014~2019年，全国移动电话4G及非4G基站数变化情况如下图所示：","imgs":["image/综合_题35_材料图.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"2019年移动通信业务收入占电信业务收入的比重同比下降了2.9个百分点","B":"2019年固定通信业务收入同比增长了400多亿元","C":"2015~2019年间，非4G基站数量逐年递增","D":"2015~2019年间，4G基站数同比增速和增量最大的年份不是同一个"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"76%","trap":"A","sol":"- A项：定位文字材料，可知2019年我国固定通信业务收入在电信业务收入中所占比重较上年提高2.6个百分点。根据电信业务收入=固定通信业务收入+移动通信业务收入，则移动通信业务收入占电信业务收入的比重应同比下降2.6个百分点，错误；\n- B项：定位文字材料，可知2019年我国固定通信业务收入完成4161亿元，同比增长9.5%。根据增长量$=\\frac{现期量}{1+r}\\times r=\\frac{4161}{1+9.5\\%}\\times 9.5\\%\\approx\\frac{4161}{1+\\frac{1}{10.5}}\\times\\frac{1}{10.5}=\\frac{4161}{10.5+1}\\approx 362$亿元\u003c400亿元，错误；\n- C项：定位图形材料，可得2015~2019年非4G基站数量分别为289万个、296万个、291万个、295万个、297万个，其中2017年（291万个）\u003c2016年（296万个），并非逐年递增，错误；\n- D项：定位图形材料，可得2014~2019年4G基站数的具体数值。根据增长量=现期量-基期量和柱状图的高度差，可得2019年的增长量最大。根据增长率$=\\frac{现期量}{基期量}-1$，可直接比较$\\frac{现期量}{基期量}$，\n\n  2015年：$\\frac{177}{85}>2$；\n\n  2016年：$\\frac{263}{177}\u003c2$；\n\n  2017年：$\\frac{328}{263}\u003c2$；\n\n  2018年：$\\frac{372}{328}\u003c2$；\n\n  2019年：$\\frac{544}{372}\u003c2$。\n\n  可以看出，增长率最大的年份为2015年。故2015~2019年间，4G基站数同比增速和增量最大的年份不是同一个，正确。\n\n故正确答案为D。","point":"综合分析；综合资料","src":"2021年山东省公务员录用考试《行测》题（网友回忆版）第79题","bimgs":["book/245.webp","book/246.webp"],"setno":3,"qno":20,"p0":"246","setTxt":"综合·提升进阶 第3套","gid":105},{"no":"ZL-157","sec":"综合资料","cat":"综合资料","qh":"247-2","page":"246 247","bsec":"综合","bpart":"提升进阶","mat":"2019年间，4G基站数同比增速和增量最大的年份不是同一个 截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%， 较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用 电视上网的比例为25.9%；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我 国城镇网民规模约为7.59亿，占网民整体的71.1%，农村网民规模约为3.08亿，较2021年12月增长约2371万，占 网民整体的28.9%。 2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占 比由2021年12月的26.8%提升至30.8%，互联网进一步向中老年群体渗透。 2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%。互联网医 疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。农村地区在线教育和互联网医疗用 户分别占农村网民整体的31%和21.5%，较上年分别增加2.7%和4.1%。 ","imgs":["image/综合_题38_材料图.png"],"stem":"截至2022年12月，我国城镇网民规模同比增速约为：","opts":{"A":"1.2%","B":"1.6%","C":"2.0%","D":"2.4%"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"64%","trap":"D","sol":"根据题干\"截至2022年12月……同比增速约为\"，可判定本题为一般增长率问题。定位文字材料第一段可得：截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万。我国城镇网民规模约为7.59亿，农村网民规模约为3.08亿，较2021年12月增长约2371万。由于我国网民规模的同比增长量=城镇网民规模的同比增长量+农村网民规模的同比增长量，则2022年12月，我国城镇网民规模同比增长约3549-2371=1178万=0.1178亿。根据公式：增长率\n\n$$=\\frac{增长量}{现期量-增长量}=\\frac{0.1178}{7.59-0.1178}\\approx\\frac{0.12}{7.59-0.12}\\approx\\frac{0.12}{7.5}=1.6\\%$$\n\n。\n\n故正确答案为B。","point":"一般增长率；综合资料","src":"2024年甘肃公务员录用考试《行测》题（网友回忆版）第106题","bimgs":["book/246.webp","book/247.webp"],"setno":4,"qno":2,"p0":"247","setTxt":"综合·提升进阶 第4套","gid":106},{"no":"ZL-158","sec":"综合资料","cat":"综合资料","qh":"247-3","page":"246 247","bsec":"综合","bpart":"提升进阶","mat":"2019年间，4G基站数同比增速和增量最大的年份不是同一个 截止2022年12月，我国网民规模约为10.67亿，较2021年12月新增网民约3549万，互联网普及率达75.6%， 较2021年12月提升2.6个百分点。我国网民使用手机上网的比例达99.8%，较2021年12月增加0.1个百分点；使用 电视上网的比例为25.9%；使用台式电脑、笔记本电脑、平板电脑上网的比例分别为34.2%、32.8%和28.5%。我 国城镇网民规模约为7.59亿，占网民整体的71.1%，农村网民规模约为3.08亿，较2021年12月增长约2371万，占 网民整体的28.9%。 2022年12月，20-29岁、30-39岁、40-49岁网民占比分别为14.2%、19.6%和16.7%；50岁及以上网民群体占 比由2021年12月的26.8%提升至30.8%，互联网进一步向中老年群体渗透。 2022年12月，线上办公用户规模约达5.4亿，较2021年12月增加7078万户，占整体网民的50.6%。互联网医 疗用户规模约达3.63亿，较2021年12月增加约6466万，占网民整体的34%。农村地区在线教育和互联网医疗用 户分别占农村网民整体的31%和21.5%，较上年分别增加2.7%和4.1%。 ","imgs":["image/综合_题38_材料图.png"],"stem":"2019-2022年，当年12月我国城镇与农村互联网普及率同比增量相差在1个百分点以内的年份有几个？","opts":{"A":"1","B":"2","C":"3","D":"4"},"letters":["A","B","C","D"],"key":"A","bookkey":"B","a1":"C","a2":null,"rate":"70%","trap":"B","sol":"根据题干\"2019-2022年，当年12月……同比增量……\"，可判定本题为增长量计算问题。定位统计图可知2018年12月-2022年12月我国城镇与农村互联网的普及率。根据公式：增长量=现期量-基期量，则2019-2022年，当年12月我国城镇与农村互联网普及率同比增量差值分别为：\n\n2019年：$|(76.5\\%-74.6\\%)-(46.2\\%-38.4\\%)|=|1.9\\%-7.8\\%|>5\\%$，不满足；\n\n2020年：$|(79.8\\%-76.5\\%)-(55.9\\%-46.2\\%)|=|3.3\\%-9.7\\%|>6\\%$，不满足；\n\n2021年：$|(81.3\\%-79.8\\%)-(57.6\\%-55.9\\%)|=|1.5\\%-1.7\\%|\u003c1\\%$，满足；\n\n2022年：$|(83.1\\%-81.3\\%)-(61.9\\%-57.6\\%)|=|1.8\\%-4.3\\%|>2\\%$，不满足。\n\n综上可知，2019-2022年，当年12月我国城镇与农村互联网普及率同比增量相差在1个百分点以内的年份仅有1个（2021年）。\n\n故正确答案为A。","point":"增长量计算；综合资料","src":"2024年甘肃公务员录用考试《行测》题（网友回忆版）第107题","bimgs":["book/246.webp","book/247.webp"],"setno":4,"qno":3,"p0":"247","setTxt":"综合·提升进阶 第4套","gid":106},{"no":"ZL-159","sec":"综合资料","cat":"综合资料","qh":"252-17","page":"251 252","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题41_材料图1.png","image/综合_题41_材料图2.png"],"stem":"2022年全国人均体育场地面积同比增量约为2018~2022年年均增长量的：","opts":{"A":"108.7%","B":"110.5%","C":"115.6%","D":"118.2%"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"61%","trap":"A","sol":"根据题干\"2022年……同比增量约为……年均增长量的\"，结合选项为百分数，可判定本题为比值计算问题。定位统计图可得：2018年、2021年、2022年全国人均体育场地面积分别为1.86平方米、2.41平方米、2.62平方米。根据公式：增长量=现期量-基期量，可得2022年全国人均体育场地面积同比增量=2.62-2.41=0.21平方米；根据公式：年均增长量$=\\frac{现期量-基期量}{年份差}$，可得2018~2022年全国人均体育场地面积年均增长量\n\n$$=\\frac{2.62-1.86}{4}=\\frac{0.76}{4}=0.19\\ \\text{平方米}$$\n\n。则所求\n\n$$=\\frac{0.21}{0.19}\\approx 110.5\\%$$\n\n。\n\n故正确答案为B。","point":"比值计算；综合资料","src":"2024年青海省公务员录用考试《行测》题（网友回忆版）第111题","bimgs":["book/251.webp","book/252.webp"],"setno":4,"qno":17,"p0":"252","setTxt":"综合·提升进阶 第4套","gid":107},{"no":"ZL-160","sec":"综合资料","cat":"综合资料","qh":"252-18","page":"251 252","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题41_材料图1.png","image/综合_题41_材料图2.png"],"stem":"2022年，按体育场地类型的数量，从大到小排位第二的约占全国体育场地数量的：","opts":{"A":"5.4%","B":"23.2%","C":"29.6%","D":"62.1%"},"letters":["A","B","C","D"],"key":"C","bookkey":"A","a1":"B","a2":null,"rate":"49%","trap":"B","sol":"根据题干\"2022年……约占……的\"，结合材料时间为2022年，可判定本题为现期比重问题。定位统计图可得：2022年全国体育场地数量为422.68万个；定位表格可得2022年全国主要分项体育场地数量。则2022年各体育场地类型的数量分别为：\n\n基础大项场地，19.74+3.60≈23万个；\n\n球类运动场地，13.59+110.28+10.12+93.53+24.61+10.53≈14+110+10+94+25+11=264万个；\n\n冰雪运动场地，1576+876=2452个；\n\n体育健身场地，98.02+14.29+12.78≈98+14+13=125万个。\n\n因此，按体育场地类型的数量从大到小排位第二的是体育健身场地。根据公式：比重$=\\frac{部分}{整体}$，则题干所求比重为$\\frac{125}{422.68}\\approx\\frac{125}{420}\\approx 30\\%$，与C项最接近。\n\n故正确答案为C。","point":"现期比重；综合资料","src":"2024年青海省公务员录用考试《行测》题（网友回忆版）第112题","bimgs":["book/251.webp","book/252.webp"],"setno":4,"qno":18,"p0":"252","setTxt":"综合·提升进阶 第4套","gid":107},{"no":"ZL-161","sec":"综合资料","cat":"综合资料","qh":"252-19","page":"251 252","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题41_材料图1.png","image/综合_题41_材料图2.png"],"stem":"2022年，按运动项目划分场地数量之和最接近全国体育场地数量25%的是：","opts":{"A":"游泳场地+全民健身路径","B":"健身步道+全民健身路径","C":"篮球场地+滑雪场地","D":"排球场地+乒乓球场地"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"77%","trap":"A","sol":"根据题干\"2022年……之和最接近全国体育场地数量25%的是\"，可判定本题为现期比重问题。定位统计图可知2022年全国体育场地数量为422.68万个；定位表格可知按运动项目划分场地数量。根据公式：部分=整体×比重，全国体育场地数量的25%为$422.68\\times 25\\%\\approx 105.7$万个。各选项场地数量之和为：A项，3.60万个+98.02万个≈101.6万个；B项，12.78万个+98.02万个=110.8万个；C项，110.28万个+876个≈110.4万个；D项，10.12万个+93.53万个≈103.7万个。分析可得，103.7万个与105.7万个差值最小，即排球场地与乒乓球场地数量之和最接近全国体育场地数量的25%。\n\n故正确答案为D。","point":"现期比重；综合资料","src":"2024年青海省公务员录用考试《行测》题（网友回忆版）第114题","bimgs":["book/251.webp","book/252.webp"],"setno":4,"qno":19,"p0":"252","setTxt":"综合·提升进阶 第4套","gid":107},{"no":"ZL-162","sec":"综合资料","cat":"综合资料","qh":"252-20","page":"251 252","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题41_材料图1.png","image/综合_题41_材料图2.png"],"stem":"能够从上述资料推出的是：","opts":{"A":"2022年全国每个体育场地平均面积大于900平方米","B":"2022年足球、篮球、排球场地数量之和少于体育健身场地数量","C":"2022年全国体育场地数量同比增速比2021年提高了2个百分点","D":"2022年全国主要分项体育场地数量占全国体育场地数量的95%以上"},"letters":["A","B","C","D"],"key":"D","bookkey":"B","a1":"A","a2":null,"rate":"64%","trap":"C","sol":"- A项：定位统计图可得，2022年全国体育场地数量为422.68万个，全国体育场地面积37.02亿平方米。则2022年全国每个体育场地平均面积\n\n  $$=\\frac{全国体育场地面积}{全国体育场地数量}=\\frac{37.02亿平方米}{422.68万}=0.08^{+}\\ \\text{万平方米}$$\n\n  $=800^{+}$平方米\u003c900平方米，错误；\n- B项：定位统计表可得，2022年全国足球场地13.59万个，篮球场地110.28万个，排球场地10.12万个；体育健身场地中，全民健身路径98.02万个，健身房14.29万个，健身步道12.78万个。则2022年足球、篮球、排球场地数量之和=13.59+110.28+10.12=133.99万个，体育健身场地数量=98.02+14.29+12.78=125.09万个，即足球、篮球、排球场地数量之和多于体育健身场地数量，错误；\n- C项：定位统计图可得，2020-2022年全国体育场地数量分别为371.34万个、397.14万个、422.68万个。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2022年全国体育场地数量同比增速\n\n  $$=\\frac{422.68-397.14}{397.14}=\\frac{25.54}{397.14}$$\n\n  ，2021年全国体育场地数量同比增速$=\\frac{397.14-371.34}{371.34}=\\frac{25.8}{371.34}$，后者分子大分母小，则2022年同比增速\u003c2021年同比增速，即2022年全国体育场地数量同比增速较2021年有所下降，错误；\n- D项：定位统计图可得，2022年全国体育场地数量为422.68万个；定位统计表可得2022年全国主要分项体育场地数量。则2022年全国主要分项体育场地数量\n\n  $$=19.74+3.60+13.59+110.28+10.12+93.53+24.61+10.53+0.1576+0.0876+98.02+14.29+12.78\\approx$$\n\n  $20+4+14+110+10+94+25+11+98+14+13=413$万个。根据公式：比重$=\\frac{部分}{整体}$，可得2022年全国主要分项体育场地数量占全国体育场地数量的比重$=\\frac{413}{422.68}\\approx\\frac{413}{423}=97\\%^{+}>95\\%$，正确。\n\n故正确答案为D。","point":"综合分析；综合资料","src":"2024年青海省公务员录用考试《行测》题（网友回忆版）第114题","bimgs":["book/251.webp","book/252.webp"],"setno":4,"qno":20,"p0":"252","setTxt":"综合·提升进阶 第4套","gid":107},{"no":"ZL-163","sec":"综合资料","cat":"综合资料","qh":"253-4","page":"252 253","bsec":"综合","bpart":"提升进阶","mat":"","imgs":["image/综合_题45_材料图1.png","image/综合_题45_材料图2.png"],"stem":"假设羊肉每年以零售价格全部售罄，那么，2021年羊肉销售收入同比增长约：","opts":{"A":"5.2%","B":"10.4%","C":"17.6%","D":"22.7%"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"58%","trap":"A","sol":"方法一：根据题干\"2021年……同比增长约\"，结合选项为百分数，可判定本题为一般增长率问题。定位图表可得：2021年、2020年羊肉产量分别为514.1万吨、492.3万吨，2021年、2020年羊肉零售价格分别为81.40元/公斤、77.01元/公斤。因题目假设羊肉每年以零售价格全部售罄，故羊肉销售收入=产量×零售价格，则2021年羊肉销售收入=514.1万吨×81.40元/公斤≈51亿公斤×81元/公斤=4131亿元；2020年羊肉销售收入=492.3万吨×77.01元/公斤≈49亿公斤×77元/公斤=3773亿元。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2021年羊肉销售收入同比增长$\\frac{4131-3773}{3773}\\approx\\frac{358}{3800}\\approx 9.4\\%$，与B项最接近。\n\n方法二：根据题干\"2021年……同比增长约\"，结合选项为百分数，且题目假设羊肉每年以零售价格全部售罄，故羊肉零售价格$=\\frac{销售收入}{产量}$，可判定本题为平均数的增长率问题。定位图表可得：2021年、2020年羊肉产量分别为514.1万吨、492.3万吨，2021年、2020年羊肉零售价格分别为81.40元/公斤、77.01元/公斤。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2021年羊肉产量同比增长率为\n\n$$\\frac{514.1-492.3}{492.3}=\\frac{21.8}{490}\\approx 4.4\\%$$\n\n（b）（也可根据第一小题答案直接使用），2021年羊肉零售价格同比增长率为$\\frac{81.40-77.01}{77.01}\\approx\\frac{4.39}{77}\\approx 5.7\\%$（r）。根据平均数的增长率公式：$r=\\frac{a-b}{1+b}$，设2021年羊肉销售收入同比增长率为a，代入公式得：$5.7\\%=\\frac{a-4.4\\%}{1+4.4\\%}$，则a=5.7%×（1+4.4%）+4.4%≈10.4%。\n\n故正确答案为B。","point":"一般增长率；综合资料","src":"2023年江西省公务员录用考试《行测》题（网友回忆版）第119题","bimgs":["book/252.webp","book/253.webp"],"setno":5,"qno":4,"p0":"253","setTxt":"综合·提升进阶 第5套","gid":108},{"no":"ZL-164","sec":"综合资料","cat":"综合资料","qh":"255-7","page":"254 255","bsec":"综合","bpart":"提升进阶","mat":"2022年，我国废钢铁、废有色金属等十个品种（详见表格）再生资源回收总重量约为37067.7万吨，同比下 降2.62%，回收总金额约为13140.6亿元，同比下降4.05%。2022年废有色金属中废铅回收重量同比增长5.56%。 2022年我国报废机动车回收数量399.1万辆，同比增长32.9%，回收数量占我国机动车保有量的9.57‰。 ","imgs":["image/综合_题46_材料图1.png","image/综合_题46_材料图2.png"],"stem":"相比2021年，2022年我国废纸平均回收价格（平均回收价格 ）：","opts":{"A":"下调约170元/吨","B":"下调约347元/吨","C":"上调约170元/吨","D":"上调约347元/吨"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"78%","trap":"B","sol":"根据题干\"相比2021年，2022年……平均回收价格……\"，结合选项为上调/下调约+单位，可判定本题为平均数的增长量问题。定位统计表可知：2021年和2022年我国废纸回收重量分别为6491.0万吨和6585.0万吨；2021年和2022年我国废纸回收金额分别为1493.0亿元和1402.6亿元。根据平均回收价格$=\\frac{年度回收金额}{年度回收重量}$，可知题干所求\n\n$$=\\frac{1402.6亿元}{6585.0万吨}-\\frac{1493.0亿元}{6491.0万吨}\\approx\\frac{1403}{0.66}-\\frac{1493}{0.65}=2126-2297=-171\\ \\text{元/吨}$$\n\n，与A项最为接近。\n\n故正确答案为A。","point":"平均数增长量；综合资料","src":"2024年河北省公务员录用考试《行测》题（网友回忆版）第122题","bimgs":["book/254.webp","book/255.webp"],"setno":5,"qno":7,"p0":"255","setTxt":"综合·提升进阶 第5套","gid":109},{"no":"ZL-165","sec":"综合资料","cat":"综合资料","qh":"255-10","page":"254 255","bsec":"综合","bpart":"提升进阶","mat":"2022年，我国废钢铁、废有色金属等十个品种（详见表格）再生资源回收总重量约为37067.7万吨，同比下 降2.62%，回收总金额约为13140.6亿元，同比下降4.05%。2022年废有色金属中废铅回收重量同比增长5.56%。 2022年我国报废机动车回收数量399.1万辆，同比增长32.9%，回收数量占我国机动车保有量的9.57‰。 ","imgs":["image/综合_题46_材料图1.png","image/综合_题46_材料图2.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"截止2022年底，我国机动车保有量约为4170万辆","B":"2022年我国十个品种再生资源平均回收价格最高的是废有色金属","C":"2021年回收金额排前两名的再生资源回收金额之和的比值超过75%","D":"2022年除废铅以外的废有色金属回收重量总和比2021年的有所下降"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"42%","trap":"A","sol":"- A项：定位文字材料可得：2022年我国报废机动车回收数量399.1万辆，回收数量占我国机动车保有量的9.57‰。根据公式：整体$=\\frac{部分}{比重}$，可知截止2022年底，我国机动车保有量为$\\frac{399.1}{9.57‰}=\\frac{399.1}{0.00957}\\approx\\frac{400}{0.01}\\approx 40000$万辆，错误；\n- B项：定位统计表可知2022年我国十个品种再生资源的回收重量以及回收金额。根据公式：平均回收价格$=\\frac{回收金额}{回收重量}$，可得2022年废有色金属的平均回收价格为$\\frac{2959.7亿元}{1375.0万吨}\\approx\\frac{2960}{1380}\\approx 2.1$万元/吨；废电池（铅酸电池除外）的平均回收价格为$\\frac{121.6亿元}{51.0万吨}\\approx 2.4$万元/吨，可知废有色金属的平均回收价格低于废电池（铅酸电池除外），则2022年我国十个品种再生资源平均回收价格最高的并非废有色金属，错误；\n- C项：定位文字材料可得：2022年，我国废钢铁、废有色金属等十个品种再生资源回收总金额约为13140.6亿元，同比下降4.05%。定位统计表可知2021年我国十个品种再生资源的回收金额。观察可知：2021年回收金额排前两名的再生资源分别为废钢铁（7523.6亿元）、废有色金属（2878.5亿元），根据公式：基期量$=\\frac{现期量}{1+增长率}$，则所求为\n\n  $$\\frac{7523.6+2878.5}{1-4.05\\%}=\\frac{10402.1}{0.9595}\\approx\\frac{10402\\times(1+4\\%)}{1.0402}\\approx\\frac{10402+416}{13141}=\\frac{9986}{13141}\\approx 76\\%>75\\%$$\n\n  ，正确；\n- D项：定位文字材料可得：2022年废有色金属中废铅回收重量同比增长5.56%。定位统计表可得：2021年、2022年废有色金属的回收重量分别为1348.0万吨、1375.0万吨。定位统计图可知2021年废有色金属中除废铅以外的各类废金属回收重量的占比情况。\n\n  方法一：定位统计图可知，2021年废有色金属中废铅回收重量的占比为1-（51.93%+17.88%+10.16%）=1-79.97%=20.03%。根据公式：部分=整体×比重，可知2021年废有色金属中废铅回收重量为$1348.0\\times 20.03\\%\\approx 1348\\times\\frac{1}{5}\\approx 270$万吨，则2021年废有色金属中除废铅以外的各类废金属回收重量约为1348.0-270=1078万吨。根据公式：现期量=基期量×（1+增长率），可知2022年废有色金属中废铅回收重量为$270\\times(1+5.56\\%)\\approx 270+15=285$万吨，则2022年废有色金属中除废铅以外的各类废金属回收重量为1375.0-285=1090万吨>1078万吨，即2022年除废铅以外的废有色金属回收重量总和比2021年的有所上升，错误。\n\n  方法二：2021年废有色金属中除废铅以外的废有色金属回收重量的占比为51.93%+17.88%+10.16%=79.97%，则2021年废有色金属中废铅回收重量的占比为1-79.97%=20.03%。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，可知2022年废有色金属的回收重量同比增长率为\n\n  $$\\frac{1375-1348}{1348}=\\frac{27}{1348}\\approx 2\\%$$\n\n  ，设2022年除废铅以外的废有色金属回收重量总和的同比增长率为r，根据线段法\"距离与基期量成反比\"，可知：$\\frac{5.56\\%-2\\%}{2\\%-r}=\\frac{79.97\\%}{20.03\\%}\\approx\\frac{4}{1}$，解得：$r\\approx 1.1\\%>0$，即2022年除废铅以外的废有色金属回收重量总和比2021年的有所上升，错误。\n\n故正确答案为C。","point":"综合分析；综合资料","src":"2024年河北省公务员录用考试《行测》题（网友回忆版）第124题","bimgs":["book/254.webp","book/255.webp"],"setno":5,"qno":10,"p0":"255","setTxt":"综合·提升进阶 第5套","gid":109},{"no":"ZL-166","sec":"综合资料","cat":"综合资料","qh":"257-11","page":"256 257","bsec":"综合","bpart":"提升进阶","mat":"其中，机床工具商品进口105.2亿 美元，同比增长23.7%；出口137.4亿美元，同比增长40.8%。 从进口来源来看，2021年1～9月进口来源前三位分别是：日本34.5亿美元，同比增长37.8%；德国 22.2亿美 元，同比增长11.0%；中国台湾14.3亿美元，同比增长36.1%。 从出口去向来看，2021年1～9月出口去向前三位分别是：美国17.5亿美元，同比增长27.4%；越南10.5亿美 元，同比增长35.4%；印度8.8亿美元，同比增长67.8%。 ","imgs":["image/综合_题48_材料图1.png","image/综合_题48_材料图2.png"],"stem":"2020年1～9月，我国机床工具贸易状况为：","opts":{"A":"顺差10亿美元以上","B":"顺差不到10亿美元","C":"逆差10亿美元以上","D":"逆差不到10亿美元"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"70%","trap":"B","sol":"根据题干\"2020年1~9月，我国机床工具贸易状况为\"，结合材料时间为2021年1~9月，可判定本题为基期和差问题。定位文字材料第一段可得：2021年1~9月……机床工具商品进口105.2亿美元，同比增长23.7%；出口137.4亿美元，同比增长40.8%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，则2020年1~9月我国机床工具贸易状况：出口额-进口额\n\n$$=\\frac{137.4}{1+40.8\\%}-\\frac{105.2}{1+23.7\\%}\\approx\\frac{137.4}{1.41}-\\frac{105.2}{1.24}\\approx 97-85=12\\ \\text{亿美元}$$\n\n，即2020年1~9月的贸易状况为顺差10亿美元以上。\n\n故正确答案为A。","point":"基期和差；综合资料","src":"2022年天津市公务员录用考试《行测》题（网友回忆版）第76题","bimgs":["book/256.webp","book/257.webp"],"setno":5,"qno":11,"p0":"257","setTxt":"综合·提升进阶 第5套","gid":110},{"no":"ZL-167","sec":"综合资料","cat":"综合资料","qh":"257-14","page":"256 257","bsec":"综合","bpart":"提升进阶","mat":"其中，机床工具商品进口105.2亿 美元，同比增长23.7%；出口137.4亿美元，同比增长40.8%。 从进口来源来看，2021年1～9月进口来源前三位分别是：日本34.5亿美元，同比增长37.8%；德国 22.2亿美 元，同比增长11.0%；中国台湾14.3亿美元，同比增长36.1%。 从出口去向来看，2021年1～9月出口去向前三位分别是：美国17.5亿美元，同比增长27.4%；越南10.5亿美 元，同比增长35.4%；印度8.8亿美元，同比增长67.8%。 ","imgs":["image/综合_题48_材料图1.png","image/综合_题48_材料图2.png"],"stem":"2021年1～9月，下列产品中我国对外贸易顺差最大的是：","opts":{"A":"金属切削机床","B":"磨料磨具","C":"切削刀具","D":"机床功能部件（含零件）"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"83%","trap":"A","sol":"定位统计图1可得，2021年1~9月，我国金属切削机床、磨料磨具、切削刀具以及机床功能部件（含零件）进口额分别为47.3亿美元、5.7亿美元、12.6亿美元、14.8亿美元；定位统计图2可得，2021年1~9月，我国金属切削机床、磨料磨具、切削刀具以及机床功能部件（含零件）出口额分别为26.2亿美元、29.3亿美元、27.6亿美元、12.1亿美元。则我国对外贸易实现顺差的有：磨料磨具，29.3-5.7=23.6亿美元；切削刀具，27.6-12.6=15亿美元。比较可知，2021年1~9月，我国对外贸易顺差最大的产品是磨料磨具（23.6亿美元）。\n\n故正确答案为B。","point":"简单计算；综合资料","src":"2022年天津市公务员录用考试《行测》题（网友回忆版）第78题","bimgs":["book/256.webp","book/257.webp"],"setno":5,"qno":14,"p0":"257","setTxt":"综合·提升进阶 第5套","gid":110},{"no":"ZL-168","sec":"综合资料","cat":"综合资料","qh":"257-15","page":"256 257","bsec":"综合","bpart":"提升进阶","mat":"其中，机床工具商品进口105.2亿 美元，同比增长23.7%；出口137.4亿美元，同比增长40.8%。 从进口来源来看，2021年1～9月进口来源前三位分别是：日本34.5亿美元，同比增长37.8%；德国 22.2亿美 元，同比增长11.0%；中国台湾14.3亿美元，同比增长36.1%。 从出口去向来看，2021年1～9月出口去向前三位分别是：美国17.5亿美元，同比增长27.4%；越南10.5亿美 元，同比增长35.4%；印度8.8亿美元，同比增长67.8%。 ","imgs":["image/综合_题48_材料图1.png","image/综合_题48_材料图2.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"2021年1～9月，我国机床工具自日本进口同比增量是德国增量的5倍多","B":"2021年1～9月，进口额同比增速最高的机床工具产品类型是金属切削机床","C":"2021年1～9月，进出口总额超过30亿美元的机床工具产品有3种","D":"2020年1～9月，我国机床工具对印度出口额不到5亿美元"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"66%","trap":"B","sol":"- A项：定位文字材料第二段，2021年1~9月，我国机床工具从日本进口额为34.5亿美元，同比增长37.8%；从德国进口额为22.2亿美元，同比增长11.0%。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，可得从日本进口额同比增量$=\\frac{34.5}{1+37.8\\%}\\times 37.8\\%\\approx\\frac{34.5}{1+\\frac{1}{2.6}}\\times\\frac{1}{2.6}=\\frac{34.5}{3.6}=10^{-}$亿美元；从德国进口额同比增量$=\\frac{22.2}{1+11.0\\%}\\times 11.0\\%=20\\times 11.0\\%=2.2$亿美元。故2021年1~9月，我国机床工具自日本进口同比增量是德国增量的$\\frac{10^{-}}{2.2}\u003c5$倍，错误；\n- B项：定位图1可知2020年1-9月和2021年1-9月我国机床工具产品的累计进口额。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则金属切削机床同比增速$=\\frac{47.3-36.7}{36.7}=\\frac{10.6}{36.7}=20\\%^{+}$；量具、量仪同比增速$=\\frac{1.8-1.2}{1.2}=\\frac{0.6}{1.2}=50\\%>20\\%$。故2021年1~9月，进口额同比增速最高的机床工具产品类型不是金属切削机床，错误；\n- C项：定位图1和图2可知2021年1-9月我国机床工具产品的累计进口额和出口额。金属切削机床进出口总额=47.3+26.2>30亿美元；机床功能部件（含零件）进出口总额=14.8+12.1\u003c30亿美元；切削刀具进出口总额=12.6+27.6>30亿美元；数控装置进出口总额=10.4+8.2\u003c30亿美元；金属成形机床进出口总额=9.3+11.7\u003c30亿美元；磨料磨具进出口总额=5.7+29.3>30亿美元；木工机床进出口总额=2.5+19.7\u003c30亿美元；量具、量仪进出口总额=1.8+1.6\u003c30亿美元；铸造机进出口总额=0.8+1.0\u003c30亿美元。故2021年1~9月，进出口总额超过30亿美元的机床工具产品有金属切削机床、切削刀具、磨料磨具，共3种，正确；\n- D项：定位文字材料第三段，2021年1~9月，我国机床工具对印度出口额为8.8亿美元，同比增长67.8%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，则2020年1~9月，我国机床工具对印度出口额\n\n  $$=\\frac{8.8}{1+67.8\\%}\\approx\\frac{8.8}{1.68}=5^{+}\\ \\text{亿美元}$$\n\n  >5亿美元，错误。\n\n故正确答案为C。","point":"综合分析；综合资料","src":"2022年天津市公务员录用考试《行测》题（网友回忆版）第79题","bimgs":["book/256.webp","book/257.webp"],"setno":5,"qno":15,"p0":"257","setTxt":"综合·提升进阶 第5套","gid":110},{"no":"ZL-169","sec":"综合资料","cat":"综合资料","qh":"260-4","page":"256 260","bsec":"综合","bpart":"提升进阶","mat":"据国家统计局数据显示，2021年我国研究与试验发展（R&D）经费支出27864亿元，同比增长14.2%，占国 内生产总值之比为2.44%，其中基础研究经费1696亿元。国家自然科学基金共资助4.87万个项目。2021年全年授 予专利权460.1万件，同比增长26.4%；PCT专利申请受理量7.3万件。截至2021年末，有效专利1542.1万件，其 中境内有效发明专利270.4万件。每万人口高价值发明专利拥有量7.5件。全年商标注册773.9万件，同比增长 34.3%。全年共签订技术合同67万项，技术合同成交金额37294亿元，同比增长32.0%。 ","imgs":["image/综合_题52_材料图1.png","image/综合_题52_材料图2.png"],"stem":"2017~2021年，我国研究与试验发展经费支出超过年平均值的年份的个数是：","opts":{"A":"1个","B":"2个","C":"3个","D":"4个"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"71%","trap":"C","sol":"根据题干\"2017~2021年……年平均值……\"，可判定本题为现期平均数问题。定位统计图可得：2017~2021年我国研究与试验发展经费支出分别为17606亿元、19678亿元、22144亿元、24393亿元、27864亿元。根据公式：平均数$=\\frac{总量}{份数}$，可得2017~2021年的年平均值为\n\n$$\\frac{17606+19678+22144+24393+27864}{5}=\\frac{111685}{5}=22337\\ \\text{亿元}$$\n\n，则超过年平均值的年份有2020年、2021年，共2个。\n\n故正确答案为B。","point":"现期平均数；综合资料","src":"2023年辽宁省公务员录用考试《行测》题（网友回忆版）第103题","bimgs":["book/256.webp","book/260.webp"],"setno":6,"qno":4,"p0":"260","setTxt":"综合·提升进阶 第6套","gid":111},{"no":"ZL-170","sec":"综合资料","cat":"综合资料","qh":"260-5","page":"259 260","bsec":"综合","bpart":"提升进阶","mat":"据国家统计局数据显示，2021年我国研究与试验发展（R&D）经费支出27864亿元，同比增长14.2%，占国 内生产总值之比为2.44%，其中基础研究经费1696亿元。国家自然科学基金共资助4.87万个项目。2021年全年授 予专利权460.1万件，同比增长26.4%；PCT专利申请受理量7.3万件。截至2021年末，有效专利1542.1万件，其 中境内有效发明专利270.4万件。每万人口高价值发明专利拥有量7.5件。全年商标注册773.9万件，同比增长 34.3%。全年共签订技术合同67万项，技术合同成交金额37294亿元，同比增长32.0%。 ","imgs":["image/综合_题52_材料图1.png","image/综合_题52_材料图2.png"],"stem":"下列说法正确的是：","opts":{"A":"2021年，我国基础研究经费占R&D经费的比重不到5%","B":"2021年，全国有效专利中有效发明专利不到20%","C":"2021年，专利授权数比上一年增加不超过100万件","D":"2021年，我国技术合同成交金额比上一年增加超过万亿元"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"68%","trap":"B","sol":"- A项：定位文字材料可得，2021年我国研究与试验发展（R&D）经费支出27864亿元，其中基础研究经费1696亿元。则基础研究经费占R&D经费的比重$=\\frac{1696}{27864}\\approx\\frac{1696}{28000}\\approx 6\\%>5\\%$，错误；\n- B项：定位统计表可得，2021年有效专利数为1542.1万件，其中有效发明专利数为359.7万件。则全国有效发明专利数占有效专利数的比重$\\frac{359.7}{1542.1}>20\\%$，错误；\n- C项：定位文字材料可得，2021年全年授予专利权460.1万件，同比增长26.4%。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，则专利授权数同比增量\n\n  $$=\\frac{460.1}{1+26.4\\%}\\times 26.4\\%\\approx\\frac{460.1}{1+\\frac{1}{3.7}}\\times\\frac{1}{3.7}=\\frac{460.1}{4.7}\u003c100\\ \\text{万件}$$\n\n  ，正确；\n- D项：定位文字材料可得，2021年技术合同成交金额37294亿元，同比增长32.0%。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，则我国技术合同成交金额同比增量\n\n  $$=\\frac{37294}{1+32.0\\%}\\times 32.0\\%\\approx\\frac{37294}{1+\\frac{1}{3}}\\times\\frac{1}{3}=\\frac{37294}{4}\u003c10000\\ \\text{亿元}$$\n\n  ，错误。\n\n故正确答案为C。","point":"综合分析；综合资料","src":"2023年辽宁省公务员录用考试《行测》题（网友回忆版）第104题","bimgs":["book/259.webp","book/260.webp"],"setno":6,"qno":5,"p0":"260","setTxt":"综合·提升进阶 第6套","gid":111},{"no":"ZL-171","sec":"综合资料","cat":"综合资料","qh":"261-10","page":"260 261","bsec":"综合","bpart":"提升进阶","mat":"2018年第一季度，共有9586家星级饭店通过省级旅游主管部门审核，全国星级饭店第一季度的营业收入为 487.11亿元，同比增长2.43%。餐饮收入为208.24亿元，客房收入为209.12亿元。 第一季度全国50个重点旅游城市共有3636家星级饭店通过省级旅游主管部门数据审核，第一季度全国50个 重点旅游城市星级饭店营业收入为320.19亿元。","imgs":["image/综合_题51_材料图.png"],"stem":"下列能够从上述资料中推出的是：","opts":{"A":"2017年第一季度，全国星级饭店营业收入超过480亿元","B":"2018年第一季度，五星级饭店数量占全国星级饭店的一成以上","C":"2018年第一季度，全国二星级饭店的客房收入比餐饮收入高2亿多元","D":"2018年第一季度，全国50个重点旅游城市平均每家星级饭店营业收入高于全国平均水平"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"A","a2":null,"rate":"86%","trap":"C","sol":"- A项：定位文字材料第一段可知，2018年第一季度，全国星级饭店的营业收入为487.11亿元，同比增长2.43%。根据公式：基期量$=\\frac{现期量}{1+r}$，则2017年第一季度，全国星级饭店营业收入为$\\frac{487.11}{1+2.43\\%}\u003c\\frac{487.11}{1.02}\\approx 478$亿元，小于480亿元，错误；\n- B项：定位统计表可知，2018年第一季度五星级饭店数量为827家；全国星级饭店数量为9586家。根据公式：比重$=\\frac{部分}{整体}$，则2018年第一季度，五星级饭店数量占全国星级饭店的比重$=\\frac{827}{9586}\u003c\\frac{958.6}{9586}=10\\%$，不足一成，错误；\n- C项：定位统计表可知，2018年第一季度全国二星级饭店营业收入为20.16亿元，餐饮收入所占比重为30.17%，客房收入所占比重为37.35%。则2018年第一季度，全国二星级饭店的客房收入比餐饮收入高\n\n  $$20.16\\times 37.35\\%-20.16\\times 30.17\\%=20.16\\times(37.35\\%-30.17\\%)=20.16\\times 7.18\\%\\approx 1.45\\ \\text{亿元}$$\n\n  ，不足2亿元，错误；\n- D项：定位文字材料第一段可知，2018年第一季度，共有9586家星级饭店，全国星级饭店第一季度的营业收入为487.11亿元；定位文字材料第二段可知，第一季度全国50个重点旅游城市共有3636家星级饭店，营业收入为320.19亿元。则2018年第一季度，全国平均每家星级饭店营业收入为$\\frac{487.11}{9586}\\approx\\frac{487.11}{9600}\\approx 0.05$亿元；全国50个重点旅游城市平均每家星级饭店营业收入为$\\frac{320.19}{3636}\\approx\\frac{320.19}{3600}\\approx 0.09$亿元。故全国50个重点旅游城市平均每家星级饭店营业收入高于全国平均水平，正确。\n\n故正确答案为D","point":"综合分析；综合资料","src":"2021年新疆公务员录用考试《行测》题（网友回忆版）第104题","bimgs":["book/260.webp","book/261.webp"],"setno":6,"qno":10,"p0":"261","setTxt":"综合·提升进阶 第6套","gid":112},{"no":"ZL-172","sec":"综合资料","cat":"综合资料","qh":"262-12","page":"262 263","bsec":"综合","bpart":"提升进阶","mat":"实现利润总额10676 亿元，同比增长7.8%；人均实现业务收入115.8万元，同比增长8.6%。 分领域看，2020年，软件产品实现收入22758亿元，同比增长10.1%；其中，工业软件产品实现收入1974亿 元，增长11.2%。信息技术服务实现收入49868亿元，比上年同期增加6579亿元；其中，电子商务平台技术服务 收入9095亿元，同比增长10.5%；云服务、大数据服务共实现收入4116亿元，同比增长11.1%。信息安全产品和  服务实现收入1540亿元，同比增长10.0%，增速较上年回落2.4个百分点。嵌入式系统软件实现收入7492亿元， 比上年同期增加803亿元，增速较上年提高4.2个百分点。","imgs":["image/综合_题54_材料图.png"],"stem":"2014~2020年，我国软件和信息技术服务业完成业务收入同比增速超过15%的年份有几个？","opts":{"A":"2","B":"3","C":"4","D":"5"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"55%","trap":"A","sol":"根据题干\"2014~2020年……同比增速……\"，可判定本题为一般增长率问题。定位统计图可知2013~2020年我国软件和信息技术服务业完成业务收入额。根据公式：一般增长率$=\\frac{现期量-基期量}{基期量}$，则2014~2020年我国软件和信息技术服务业完成业务收入同比增速分别为：\n\n2014年，$\\frac{37026-30587}{30587}=\\frac{6439}{30587}>20\\%$；\n\n2015年，$\\frac{42848-37026}{37026}=\\frac{5822}{37026}\\approx\\frac{5822}{37000}=15\\%^{+}$；\n\n2016年，$\\frac{48232-42848}{42848}=\\frac{5384}{42848}\\approx\\frac{5384}{42800}=12\\%^{+}$；\n\n2017年，$\\frac{55103-48232}{48232}=\\frac{6871}{48232}\\approx\\frac{6871}{48200}=14\\%^{+}$；\n\n2018年，$\\frac{61909-55103}{55103}=\\frac{6806}{55103}\\approx\\frac{6806}{55100}=12\\%^{+}$；\n\n2019年，$\\frac{72072-61909}{61909}=\\frac{10163}{61909}\\approx\\frac{10163}{61900}=16\\%^{+}$；\n\n2020年，$\\frac{81658-72072}{72072}=\\frac{9586}{72072}\\approx\\frac{9586}{72100}=13\\%^{+}$。\n\n因此，同比增速超过15%的年份有2014年、2015年、2019年，共3个。\n\n故正确答案为B。","point":"一般增长率；综合资料","src":"2023年四川省公务员录用考试《行测》题（网友回忆版）第86题","bimgs":["book/262.webp","book/263.webp"],"setno":6,"qno":12,"p0":"262","setTxt":"综合·提升进阶 第6套","gid":113},{"no":"ZL-173","sec":"综合资料","cat":"综合资料","qh":"264-20","page":"263 264 265","bsec":"综合","bpart":"提升进阶","mat":"其中，住宅 投资64352亿元，增长9.2%。 2014年，全国商品房销售面积120649万平方米，比上年下降7.6%，降幅比1—11月份收窄0.6个百分点， 2013年为增长17.3%；商品房销售额76292亿元，下降6.3%，降幅比1—11月份收窄1.5个百分点，2013年为增长 26.3%。 2014年，东部地区商品房销售面积54756万平方米，比上年下降13.7%，降幅比1—11月份收窄1.3个百分 点；销售额43607亿元，下降11.6%，降幅收窄2.1个百分点。中部地区商品房销售面积33824万平方米，下降 3.9%，降幅收窄0.4个百分点；销售额16558亿元，增长0.2%，1—11月份为下降0.9%。西部地区商品房销售面 积32068万平方米，增长0.6%，增速回落0.6个百分点；销售额16127亿元，增长3.5%，增速回落0.6个百分点。","imgs":["image/综合_题55_材料图.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"2013年东部地区的商品房销售额超过50000亿元","B":"2014年我国东部地区住宅投资额低于中、西部地区之和","C":"2014年我国东部地区房地产投资额是西部地区的3倍多","D":"2014年住宅投资占房地产开发投资的比重不到七成"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"A","a2":null,"rate":"83%","trap":"A","sol":"- A项：定位材料第三段可知，\"2014年，东部地区商品房……销售额43607亿元，下降11.6%\"，根据基期量$=\\frac{现期量}{1+增长率}$，可得2013年东部地区的商品房销售额$=\\frac{43607}{1-11.6\\%}=\\frac{43607}{88.4\\%}\u003c50000$亿元，错误；\n- B项：定位表格可知，2014年东部地区住宅投资额为35477亿元，而中部地区住宅投资额为14552亿元，西部地区住宅投资额为14323亿元。35477>14552+14323，所以2014年东部地区住宅投资额高于中、西部地区之和，错误；\n- C项：定位表格可知，2014年东部地区房地产投资额为52941亿元，而西部地区房地产投资额为21433亿元。$\\frac{52941}{21433}\u003c3$，所以2014年二者的倍数关系不到3倍，错误；\n- D项：定位材料第一段，\"2014年，全国房地产开发投资95036亿元，……其中，住宅投资64352亿元，增长9.2%。\"$\\frac{64352}{95036}\u003c70\\%$，也就是不到七成，正确。\n\n故正确答案为D。","point":"综合分析；综合资料","src":"2020年新疆公务员录用考试《行测》题（网友回忆版）第109题","bimgs":["book/263.webp","book/264.webp","book/265.webp"],"setno":6,"qno":20,"p0":"264","setTxt":"综合·提升进阶 第6套","gid":114},{"no":"ZL-174","sec":"综合资料","cat":"综合资料","qh":"265-1","page":"265 266","bsec":"综合","bpart":"提升进阶","mat":"2022年上半年，我国软件与信息技术服务业总收入同比增长10.9%，增速较1~5月份提高0.3个百分点。软件 与信息技术服务业收入中，软件产品收入、信息技术服务收入、信息安全收入、嵌入式系统软件收入同比分别 增长10.2%、12%、11.4%和5%。信息技术服务收入中，云计算、大数据服务收入4790亿元，同比增长9.3%；集 成电路设计收入1279亿元，同比增长15.2%。 2022年上半年，我国东部、中部、西部、东北地区完成软件与信息技术服务业总收入同比增速分别为 10.2%、14.4%、15.9%和6.3%。","imgs":["image/综合_题56_材料图.png"],"stem":"2022年二季度，我国中部地区软件与信息技术服务业总收入约是东北地区的：","opts":{"A":"不到2倍","B":"2~3倍之间","C":"3~4倍之间","D":"4倍以上"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"87%","trap":"C","sol":"根据题干\"2022年二季度……是……\"，结合选项为倍数，且材料给出2022年一季度与上半年数据，可判定本题为现期倍数问题。定位统计表可得：2022年一季度我国中部地区和东北地区软件与信息技术服务业总收入分别为666亿元和356亿元，上半年分别为2174亿元和974亿元。根据公式：倍数$=\\frac{A}{B}$，则所求\n\n$$=\\frac{2174-666}{974-356}=\\frac{1508}{618}\\approx\\frac{1508}{620}\\approx 2.4\\ \\text{倍}$$\n\n，在B项范围内。\n\n故正确答案为B。","point":"现期倍数；综合资料","src":"2025年四川省考/选调公务员录用考试《行测》题（网友回忆版）第96题","bimgs":["book/265.webp","book/266.webp"],"setno":7,"qno":1,"p0":"265","setTxt":"综合·提升进阶 第7套","gid":115},{"no":"ZL-175","sec":"综合资料","cat":"综合资料","qh":"266-2","page":"265 266","bsec":"综合","bpart":"提升进阶","mat":"2022年上半年，我国软件与信息技术服务业总收入同比增长10.9%，增速较1~5月份提高0.3个百分点。软件 与信息技术服务业收入中，软件产品收入、信息技术服务收入、信息安全收入、嵌入式系统软件收入同比分别 增长10.2%、12%、11.4%和5%。信息技术服务收入中，云计算、大数据服务收入4790亿元，同比增长9.3%；集 成电路设计收入1279亿元，同比增长15.2%。 2022年上半年，我国东部、中部、西部、东北地区完成软件与信息技术服务业总收入同比增速分别为 10.2%、14.4%、15.9%和6.3%。","imgs":["image/综合_题56_材料图.png"],"stem":"2022年上半年，我国东部地区信息技术服务收入在全国软件与信息技术服务业总收入中的占比在以下哪个范围内？","opts":{"A":"不到50%","B":"50%~60%之间","C":"60%~70%之间","D":"超过70%"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"40%","trap":"D","sol":"根据题干\"2022年上半年，……占比……\"，结合材料给出2022年上半年具体值，可判定本题为现期比重问题。定位统计表可得：2022年上半年，全国软件与信息技术服务业总收入为46266亿元、东部地区信息技术服务收入为25040亿元。根据公式：比重$=\\frac{部分量}{整体量}$，则所求比重\n\n$$=\\frac{25040}{46266}\\approx\\frac{25040}{46000}\\approx 54\\%$$\n\n，在B项范围内。\n\n故正确答案为B。","point":"现期比重；综合资料","src":"2025年四川省考/选调公务员录用考试《行测》题（网友回忆版）第96题","bimgs":["book/265.webp","book/266.webp"],"setno":7,"qno":2,"p0":"266","setTxt":"综合·提升进阶 第7套","gid":115},{"no":"ZL-176","sec":"综合资料","cat":"综合资料","qh":"266-3","page":"265 266","bsec":"综合","bpart":"提升进阶","mat":"2022年上半年，我国软件与信息技术服务业总收入同比增长10.9%，增速较1~5月份提高0.3个百分点。软件 与信息技术服务业收入中，软件产品收入、信息技术服务收入、信息安全收入、嵌入式系统软件收入同比分别 增长10.2%、12%、11.4%和5%。信息技术服务收入中，云计算、大数据服务收入4790亿元，同比增长9.3%；集 成电路设计收入1279亿元，同比增长15.2%。 2022年上半年，我国东部、中部、西部、东北地区完成软件与信息技术服务业总收入同比增速分别为 10.2%、14.4%、15.9%和6.3%。","imgs":["image/综合_题56_材料图.png"],"stem":"在全国4个地区中，2022年二季度四类软件与信息技术服务业收入均高于一季度水平的有几个？","opts":{"A":"4","B":"3","C":"2","D":"1"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"59%","trap":"A","sol":"定位表格可知2022年上半年和一季度全国四个地区四类软件与信息技术服务业的收入。则全国四个地区2022年二季度四类软件与信息技术服务业收入与一季度的比较如下：\n\n东部地区：软件产品，9032－4062＝4900⁺亿元＞4062亿元；信息技术服务，25040－10893＝14000⁺亿元＞10893亿元；信息安全，597－256＝300⁺亿元＞256亿元；嵌入式系统软件，3353-1353=2000亿元>1353亿元。则2022年二季度东部地区四类软件与信息技术服务业收入均高于一季度水平；\n\n中部地区：软件产品，751－262＝400⁺亿元＞262亿元；信息技术服务，1257－349＝900⁺亿元＞349亿元；信息安全，19－5＝10⁺亿元＞5亿元；嵌入式系统软件，147－50＝90⁺亿元＞50亿元。则2022年二季度中部地区四类软件与信息技术服务业收入均高于一季度水平；\n\n西部地区：软件产品，1234-627=607亿元\u003c627亿元。则2022年二季度西部地区不满足四类软件与信息技术服务收入均高于一季度水平；\n\n东北地区：软件产品，410－145＝200⁺亿元＞145亿元；信息技术服务，477－174＝300⁺亿元＞174亿元；信息安全，50－32＝10⁺亿元＜32亿元。则2022年二季度东北地区不满足四类软件与信息技术服务收入均高于一季度水平。\n\n综上，符合题意的有东部地区、中部地区，共2个。\n\n故正确答案为C。","point":"简单比较；综合资料","src":"2025年四川省考/选调公务员录用考试《行测》题（网友回忆版）第97题","bimgs":["book/265.webp","book/266.webp"],"setno":7,"qno":3,"p0":"266","setTxt":"综合·提升进阶 第7套","gid":115},{"no":"ZL-177","sec":"综合资料","cat":"综合资料","qh":"266-5","page":"265 266","bsec":"综合","bpart":"提升进阶","mat":"2022年上半年，我国软件与信息技术服务业总收入同比增长10.9%，增速较1~5月份提高0.3个百分点。软件 与信息技术服务业收入中，软件产品收入、信息技术服务收入、信息安全收入、嵌入式系统软件收入同比分别 增长10.2%、12%、11.4%和5%。信息技术服务收入中，云计算、大数据服务收入4790亿元，同比增长9.3%；集 成电路设计收入1279亿元，同比增长15.2%。 2022年上半年，我国东部、中部、西部、东北地区完成软件与信息技术服务业总收入同比增速分别为 10.2%、14.4%、15.9%和6.3%。","imgs":["image/综合_题56_材料图.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"2021年上半年，我国东北地区软件与信息技术服务业月均收入不足150亿元","B":"2022年6月，我国软件与信息技术服务业总收入增速超过10%","C":"2022年上半年，我国嵌入式系统软件收入同比增量小于信息安全收入同比增量","D":"2022年上半年，我国集成电路设计收入占信息技术服务收入比重低于上年同期"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"61%","trap":"C","sol":"- A项：定位文字材料第二段可得：2022年上半年，我国东北地区完成软件与信息技术服务业总收入同比增速为6.3%；定位表格材料可得：2022年上半年，我国东北地区完成软件与信息技术服务业总收入为974亿元。根据公式：基期量$=\\frac{现期量}{1+增长率}$，可得2021年上半年我国东北地区完成软件与信息技术服务业总收入为$\\frac{974}{1+6.3\\%}\\approx\\frac{974}{1.06}=900^{+}$亿元，则题干所求为$\\frac{900^{+}}{6}=150^{+}$亿元>150亿元，错误；\n- B项：定位文字材料第一段可得：2022年上半年，我国软件与信息技术服务业总收入同比增长10.9%，增速较1~5月提高0.3个百分点。则2022年1~5月我国软件与信息技术服务业总收入同比增速为10.9%-0.3%=10.6%。根据混合增长率口诀：\"总体增长率居中，但不正中\"可知：6月同比增长率>10.9%>10.6%，即6月同比增长率>10%，正确；\n- C项：定位文字材料第一段可得：2022年上半年，我国信息安全收入、嵌入式系统软件收入同比分别增长11.4%和5%；定位表格材料可得：2022年上半年，我国信息安全收入、嵌入式系统软件收入分别为755亿元、3788亿元。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，则信息安全收入同比增量为$\\frac{755}{1+11.4\\%}\\times 11.4\\%\\approx\\frac{755}{1+\\frac{1}{9}}\\times\\frac{1}{9}=\\frac{755}{10}=75.5$亿元；嵌入式系统软件收入同比增量为$\\frac{3788}{1+5\\%}\\times 5\\%\\approx\\frac{3788}{1+\\frac{1}{20}}\\times\\frac{1}{20}=\\frac{3788}{21}=100^{+}$亿元。则嵌入式系统软件收入同比增量（100⁺亿元）大于信息安全收入同比增量（75.5亿元），错误；\n- D项：定位文字材料第一段可得：2022年上半年，我国信息技术服务收入同比增长12%（b）；信息技术服务收入中，集成电路设计收入同比增长15.2%（a）。根据两期比重比较的结论：当部分增长率（a）>整体增长率（b）时，比重上升。由15.2%（a）>12%（b），故比重高于上年同期，错误。\n\n故正确答案为B。","point":"综合分析；综合资料","src":"2025年四川省考/选调公务员录用考试《行测》题（网友回忆版）第99题","bimgs":["book/265.webp","book/266.webp"],"setno":7,"qno":5,"p0":"266","setTxt":"综合·提升进阶 第7套","gid":115},{"no":"ZL-178","sec":"综合资料","cat":"综合资料","qh":"268-9","page":"266 267 268","bsec":"综合","bpart":"提升进阶","mat":"2012~2021的10年间，辽宁、天津、河北、山东、江苏、上海、浙江、福建、广东、广西、海南11个沿海 省市的核电、火电、钢铁、石化等行业的海水冷却用水量稳步增长（图1），其中浙江、福建、广东3省海水冷 却用水量相对较高（表1）。截至2021年底，11个沿海省市共建有海水冷却工程22个，2021年全国11个沿海省 市海水冷却工程年总循环量为169.5亿吨。 ","imgs":["image/综合_题60_材料图1.png","image/综合_题60_材料图2.png"],"stem":"2021年海水冷却用水量低于海水冷却工程年总循环量的沿海省市共有几个：","opts":{"A":"5个","B":"6个","C":"7个","D":"8个"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"A","a2":null,"rate":"22%","trap":"A","sol":"定位文字材料可得，2021年全国11个沿海省市海水冷却工程年总循环量为169.5亿吨。结合表格比较可得，8个沿海省中，海水冷却用水量低于海水冷却工程年总循环量的省份共有5个，分别为辽宁（49.0亿吨）、河北（54.6亿吨）、山东（145.1亿吨）、江苏（117.5亿吨）、广西（70.6亿吨）。\n\n除表中8省外，剩余3个沿海省市海水冷却用水量之和\n\n$$\\approx 1775.1-(49+55+145+118+339+264+571+71)$$\n\n$$=1775.1-1612=163.1\\ \\text{亿吨}$$\n\n。因3个省市的海水冷却用水量之和（163.1亿吨）低于海水冷却工程年总循环量（169.5亿吨），则每个省市的沿海用水量均应低于海水冷却工程年总循环量。\n\n故满足要求的沿海省市共5+3=8个。\n\n故正确答案为D。","point":"简单比较；综合资料","src":"2023年江西省公务员录用考试《行测》题（网友回忆版）第127题","bimgs":["book/266.webp","book/267.webp","book/268.webp"],"setno":7,"qno":9,"p0":"268","setTxt":"综合·提升进阶 第7套","gid":116},{"no":"ZL-179","sec":"综合资料","cat":"综合资料","qh":"268-10","page":"266 267 268","bsec":"综合","bpart":"提升进阶","mat":"2012~2021的10年间，辽宁、天津、河北、山东、江苏、上海、浙江、福建、广东、广西、海南11个沿海 省市的核电、火电、钢铁、石化等行业的海水冷却用水量稳步增长（图1），其中浙江、福建、广东3省海水冷 却用水量相对较高（表1）。截至2021年底，11个沿海省市共建有海水冷却工程22个，2021年全国11个沿海省 市海水冷却工程年总循环量为169.5亿吨。 ","imgs":["image/综合_题60_材料图1.png","image/综合_题60_材料图2.png"],"stem":"可以从上述资料推出的是：","opts":{"A":"2021年全国11个沿海省份海水冷却用水量前4名依次为：广东、浙江、福建、江苏","B":"2012~2021年浙江、广东年海水冷却用水量之和均超过全国同期的60%","C":"2012~2021年表1的8个省市中福建的海水冷却用水量年平均增速最快","D":"2012~2021年间，广东的海水冷却用水量均为辽宁同期的3倍以上"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"69%","trap":"B","sol":"- A项：定位表1，2021年辽宁、河北等8省海水冷却用水量前4名依次为：广东（571.3亿吨）、浙江（338.7亿吨）、福建（264.3亿吨）、山东（145.1亿吨），江苏省在此表中排名为第5，故一定无法排到全国11个沿海省份海水冷却用水量的前4名，错误；\n- B项：定位图1可知2012～2021年全国11个沿海省市的海水冷却用水量，定位表1可知2012～2021年浙江、广东年海水冷却用水量。2012年浙江、广东年海水冷却用水量之和占全国11个沿海省市的海水冷却用水量的比重为$\\frac{199.1+275.5}{841.0}=\\frac{474.6}{841.0}\\approx 56.4\\%\u003c60\\%$，并非均超过全国同期的60%，错误；\n- C项：定位表1可知2012年、2021年辽宁、河北等8省海水冷却用水量。根据年均增长率公式：$(1+r)^{n}=\\frac{现期量}{基期量}$（n为年份差），当年份差相同时，直接比较$\\frac{现期量}{基期量}$即可。表1的8个省份$\\frac{现期量}{基期量}$分别为：辽宁，$\\frac{49.0}{56.2}\u003c1$；河北，$\\frac{54.6}{30.1}\\approx 1^{+}$；山东，$\\frac{145.1}{83.7}\\approx 1^{+}$；江苏，$\\frac{117.5}{44.2}\\approx 2^{+}$；浙江，$\\frac{338.7}{199.1}\\approx 1^{+}$；福建，$\\frac{264.3}{69.8}\\approx 3^{+}$；广东，$\\frac{571.3}{275.5}\\approx 2^{+}$；广西，$\\frac{70.6}{24.5}\\approx 2^{+}$，比较可知8个省份中福建的海水冷却用水量年平均增速最快，正确；\n- D项：定位表1可知2012～2021年间，广东、辽宁的海水冷却用水量。2014年广东的海水冷却用水量为辽宁同期的$\\frac{318.5}{116.2}\\approx 2.7$倍\u003c3倍，并非均为3倍以上，错误。\n\n故正确答案为C。","point":"综合分析；综合资料","src":"2023年江西省公务员录用考试《行测》题（网友回忆版）第130题","bimgs":["book/266.webp","book/267.webp","book/268.webp"],"setno":7,"qno":10,"p0":"268","setTxt":"综合·提升进阶 第7套","gid":116},{"no":"ZL-180","sec":"综合资料","cat":"综合资料","qh":"269-15","page":"268 269","bsec":"综合","bpart":"提升进阶","mat":"2021年间，广东的海水冷却用水量均为辽宁同期的3倍以上 2017年1-4月，T地区批发和零售业商品销售总额为15220亿元，同比增长10.5%，其中，限额以上商品销售 额达到11107亿元，同比增长10%；4月份，T地区批发和零售业商品销售总额和限额以上商品销售额分别为3339 亿元和2554亿元。 ","imgs":["image/综合_题63_材料图.png"],"stem":"关于2017年T地区限额以上商品销售额，能够从资料中推出的是：","opts":{"A":"4月批发业及零售业销售额均低于一季度月均数值","B":"一季度，外商及港澳台商企业销售额同比增长100亿元以上","C":"一季度，小微型企业销售额同比增量超过大型企业和中型企业之和","D":"1-4月，限额以上商品销售额占批发和零售业商品销售总额的比重较上年同期有所提升"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"71%","trap":"A","sol":"（以下解析中的描述均省略了T地区限额以上商品这个前提。）\n\n- A项：定位表格材料，2017年1-4月批发业销售额为10251亿元，1-3月销售额为7913亿元，则4月份销售额为10251-7913=2338亿元，一季度月均$=\\frac{7913}{3}\\approx 2638$亿元，4月份销售额低于一季度月均数值；2017年1-4月零售业销售额为856亿元，1-3月销售额为640亿元，则4月份销售额为856-640=216亿元，一季度月均$=\\frac{640}{3}\\approx 213$亿元，4月份销售额高于一季度月均数值，错误；\n- B项：定位表格材料，2017年1-3月外商及港澳台商企业销售额为614亿元，同比增长率为16.7%，则2017年一季度，外商及港澳台商企业销售额同比增长量\n\n  $$=\\frac{现期量}{1+r}\\times r=\\frac{614}{1+16.7\\%}\\times 16.7\\%\\approx\\frac{614}{1+\\frac{1}{6}}\\times\\frac{1}{6}=\\frac{614}{7}\\approx 87.7\\ \\text{亿元}$$\n\n  \u003c100亿元，错误；\n- C项：定位表格材料，2017年1-3月小微型企业销售额为3639亿元，同比增长率为15.3%，所以小微型企业销售额同比增长量$=\\frac{现期量}{1+r}\\times r=\\frac{3639}{1+15.3\\%}\\times 15.3\\%\\approx\\frac{3639}{1+\\frac{1}{6.5}}\\times\\frac{1}{6.5}=\\frac{3639}{7.5}\\approx 485.2$亿元；2017年1-3月中型企业销售额为3533亿元，同比增长率为6.1%，所以中型企业销售额同比增长量$=\\frac{现期量}{1+r}\\times r=\\frac{3533}{1+6.1\\%}\\times 6.1\\%\\approx\\frac{3533}{1+\\frac{1}{16.5}}\\times\\frac{1}{16.5}=\\frac{3533}{17.5}\\approx 202$亿元；2017年1-3月大型企业销售额为1381亿元，同比增长率为8.4%，所以大型企业销售额同比增长量$=\\frac{现期量}{1+r}\\times r=\\frac{1381}{1+8.4\\%}\\times 8.4\\%\\approx\\frac{1381}{1+\\frac{1}{12}}\\times\\frac{1}{12}=\\frac{1381}{13}\\approx 106$亿元；故大、中型企业同比增长量之和为106+202=308亿元\u003c小微型企业销售额同比增量485.2亿元，即小微型企业销售额同比增量超过大型企业和中型企业之和，正确；\n- D项：定位文字材料，2017年1-4月，T地区批发和零售业商品销售总额为15220亿元，同比增长10.5%，其中，限额以上商品销售额达到11107亿元，同比增长10%。则a=10%，b=10.5%，a\u003cb 增长率=9.9%-0.4%=9.5%，因此2018年全国房地产开发投资比上年增长金额\n\n$$=\\frac{现期}{1+r}\\times r=\\frac{120000}{1+9.5\\%}\\times 9.5\\%\\approx\\frac{120000}{1+\\frac{1}{10.5}}\\times\\frac{1}{10.5}=\\frac{120000}{10.5+1}\\approx 10430\\ \\text{亿元}$$\n\n，最接近C项。\n\n故正确答案为C。","point":"增长量计算；综合资料","src":"2020年内蒙古自治区公务员公安类考试《行测》题（网友回忆版）第106题","bimgs":["book/274.webp","book/275.webp"],"setno":8,"qno":11,"p0":"275","setTxt":"综合·提升进阶 第8套","gid":121},{"no":"ZL-186","sec":"综合资料","cat":"综合资料","qh":"277-20","page":"276 277 278","bsec":"综合","bpart":"提升进阶","mat":"2019年全国房地产开发投资132194亿元，比上年增长9.9%，增速比上年加快0.4个百分点。其中，住宅投资 97071亿元，增长13.9%，增速比上年加快0.5个百分点。2019年，全国商品房销售面积171558万平方米，比上年 下降0.1%。其中，住宅销售面积增长1. 5%，办公楼销售面积下降14.7%，商业营业用房销售面积下降15.0%。  商品房销售额159725亿元，增长6. 5%，增速比上年回落5.7个百分点。其中，住宅销售额增长10.3%，办公楼销 售额下降15.1%，商业营业用房销售额下降16.5%。","imgs":["image/综合_题69_材料图1.png","image/综合_题69_材料图2.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"2013年，采矿业法人单位占全国法人单位的比重超过1%","B":"2013—2018年间，机关、事业法人单位年均增加不到1万个","C":"2013年，批发和零售业法人单位数量是教育法人单位数量的7倍以上","D":"2013—2018年间，科学研究和技术服务业是法人单位数年均增速最快的行业"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"D","a2":null,"rate":"79%","trap":"C","sol":"- A项：定位统计表可得，2018年采矿业法人单位数量及增量分别为7.0万个、1.9万个，全国法人单位总量为2178.9万个、1093.2万个，故2013年采矿业法人单位数量为7.0-1.9=5.1万个，全国法人单位总量为2178.9-1093.2=1085.7万个。根据公式：比重$=\\frac{部分量}{总体量}$，可得2013年采矿业法人单位占全国法人单位的比重$=\\frac{5.1}{1085.7}\\approx 0.5\\%\u003c1\\%$，错误；\n- B项：定位统计图可得，2013年机关、事业法人单位数量为103.7万个，2018年机关、事业法人单位数量为107.5万个。根据公式：年均增长量$=\\frac{现期量-基期量}{年份差}$，可得机关、事业法人单位年均增长量\n\n  $$=\\frac{107.5-103.7}{5}=\\frac{3.8}{5}\u003c1\\ \\text{万个}$$\n\n  ，正确；\n- C项：定位统计表可得，2018年批发和零售业法人单位数量为649.9万个，2018年较2013年增量为368.9万个，2018年教育法人单位数量为66.6万个，2018年较2013年增量为25.2万个，根据公式：基期=现期量-增长量，则2013年批发和零售业法人单位数量=649.9-368.9=281万个；2013年教育法人单位数量=66.6-25.2=41.4万个，故所求$=\\frac{281}{41.4}\u003c7$，错误；\n- D项：根据公式：年均增长率$=\\sqrt[n]{\\frac{现期}{基期}}-1$，其中年份差n相同，且表格资料中分别给出2018年各行业法人单位数量及较2013年增量，则比较$\\frac{现期量}{现期量-增长量}$即可，科学研究和技术服务业：$\\frac{127.6}{127.6-82.0}$，建筑业：$\\frac{121.8}{121.8-87.1}$，前者小于后者，故科学研究和技术服务业不是法人单位数年均增速最快的行业，错误。\n\n故正确答案为B。","point":"综合分析；综合资料","src":"2021年上海市公务员录用考试《行测》题（A类）（网友回忆版）第84题","bimgs":["book/276.webp","book/277.webp","book/278.webp"],"setno":8,"qno":20,"p0":"277","setTxt":"综合·提升进阶 第8套","gid":122}],"points":["一般增长率","一般增长率比较","两期比重","两期比重/比值比较","两集合容斥","基期倍数","基期和差","基期平均数","基期比较","基期比重","基期计算","增长量比较","增长量计算","平均数与增长量比较","平均数增长量","平均数的增长率","年均增长率","文字资料","比值比较","比值计算","混合增长率","混合平均","混合平均数","现期倍数","现期平均数","现期平均数比较","现期平均数计算","现期比值","现期比重","现期比重计算","现期计算","现期量计算","直接找数","简单加减计算","简单查找","简单比较","简单计算","统计图","统计表","综合分析","综合资料","间隔增长率"],"sections":["文字资料","统计图","统计表","综合资料"],"sets":[{"sec":"表格","part":"夯实基础","n":1,"txt":"表格·夯实基础 第1套"},{"sec":"表格","part":"夯实基础","n":2,"txt":"表格·夯实基础 第2套"},{"sec":"表格","part":"夯实基础","n":3,"txt":"表格·夯实基础 第3套"},{"sec":"表格","part":"夯实基础","n":4,"txt":"表格·夯实基础 第4套"},{"sec":"表格","part":"夯实基础","n":5,"txt":"表格·夯实基础 第5套"},{"sec":"表格","part":"夯实基础","n":6,"txt":"表格·夯实基础 第6套"},{"sec":"表格","part":"提升进阶","n":1,"txt":"表格·提升进阶 第1套"},{"sec":"表格","part":"提升进阶","n":2,"txt":"表格·提升进阶 第2套"},{"sec":"图形","part":"夯实基础","n":1,"txt":"图形·夯实基础 第1套"},{"sec":"图形","part":"夯实基础","n":2,"txt":"图形·夯实基础 第2套"},{"sec":"图形","part":"提升进阶","n":1,"txt":"图形·提升进阶 第1套"},{"sec":"图形","part":"提升进阶","n":2,"txt":"图形·提升进阶 第2套"},{"sec":"文字","part":"夯实基础","n":1,"txt":"文字·夯实基础 第1套"},{"sec":"文字","part":"夯实基础","n":2,"txt":"文字·夯实基础 第2套"},{"sec":"文字","part":"夯实基础","n":3,"txt":"文字·夯实基础 第3套"},{"sec":"文字","part":"夯实基础","n":4,"txt":"文字·夯实基础 第4套"},{"sec":"文字","part":"夯实基础","n":5,"txt":"文字·夯实基础 第5套"},{"sec":"文字","part":"夯实基础","n":6,"txt":"文字·夯实基础 第6套"},{"sec":"文字","part":"夯实基础","n":7,"txt":"文字·夯实基础 第7套"},{"sec":"文字","part":"夯实基础","n":8,"txt":"文字·夯实基础 第8套"},{"sec":"文字","part":"夯实基础","n":9,"txt":"文字·夯实基础 第9套"},{"sec":"文字","part":"夯实基础","n":10,"txt":"文字·夯实基础 第10套"},{"sec":"文字","part":"提升进阶","n":1,"txt":"文字·提升进阶 第1套"},{"sec":"文字","part":"提升进阶","n":2,"txt":"文字·提升进阶 第2套"},{"sec":"文字","part":"提升进阶","n":3,"txt":"文字·提升进阶 第3套"},{"sec":"文字","part":"提升进阶","n":4,"txt":"文字·提升进阶 第4套"},{"sec": <script>
"use strict";
var PAYLOAD = JSON.parse(document.getElementById("app-data").textContent);
var ASSETS = JSON.parse(document.getElementById("app-assets").textContent);
var RECS = PAYLOAD.records;
var GROUPS = PAYLOAD.groups;

var LS_NOTE = "dt_note_v1";
var LS_QUIZ = "dt_quiz_v2";
var LS_TAB = "dt_tab_v2";
var PAGE = 8;

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function asset(p){
  if (ASSETS[p]) return ASSETS[p];
  // 拆分模式（--split）：图片不入库，直接按相对路径引用 image/ 与 book/ 目录
  return PAYLOAD.meta.split ? p : "";
}
function imgHtml(path, cls){
  if (!path) return "";
  var src = asset(path);
  if (!src) return '<div class="mat">图片缺失：' + esc(path) + '</div>';
  return '<img loading="lazy" class="zoomable ' + (cls || "") + '" data-name="' + esc(path) +
         '" src="' + src + '" alt="' + esc(path) + '">';
}

function fmtSec(s){
  s = Math.max(0, Math.floor(s));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  if (h > 0) return h + " 小时 " + m + " 分 " + x + " 秒";
  if (m > 0) return m + " 分 " + x + " 秒";
  return x + " 秒";
}
function prettySol(t){
  if (!t) return "";
  var s = String(t);
  s = s.replace(/\$\$/g, "").replace(/\$/g, "");
  s = s.replace(/\\div/g, "÷").replace(/\\times/g, "×").replace(/\\approx/g, "≈");
  s = s.replace(/\\%/g, "%").replace(/\\text\{([^}]*)\}/g, "$1");
  s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)÷($2)");
  s = s.replace(/\\/g, "").replace(/[{}]/g, "").replace(/[ \t]+\n/g, "\n");
  return s.trim();
}

/* ---------------- Lightbox（含双指缩放） ---------------- */
var LB = { scale: 1, tx: 0, ty: 0, pts: {}, mode: 0,
           d0: 0, s0: 1, tx0: 0, ty0: 0, mx: 0, my: 0, px: 0, py: 0, lastTap: 0 };
var stage = $("lb-stage"), lbImg = $("lb-img");

function lbApply(){
  var sc = LB.scale <= 1.001 ? 1 : LB.scale;
  if (sc === 1){ LB.tx = 0; LB.ty = 0; }
  lbImg.style.transform = "translate(" + LB.tx + "px," + LB.ty + "px) scale(" + sc + ")";
}
function lbSet(scale){
  LB.scale = Math.min(8, Math.max(1, scale));
  lbApply();
}
function lbReset(){ LB.scale = 1; LB.tx = 0; LB.ty = 0; lbApply(); }
function openLB(src, name){
  lbImg.src = src;
  $("lb-name").textContent = name || "";
  lbReset();
  $("lb").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeLB(){
  $("lb").classList.remove("on");
  lbImg.removeAttribute("src");
  document.body.style.overflow = "";
}
function ptCount(){ return Object.keys(LB.pts).length; }
function ptAvg(){
  var ks = Object.keys(LB.pts), sx = 0, sy = 0;
  for (var i = 0; i < ks.length; i++){ sx += LB.pts[ks[i]].x; sy += LB.pts[ks[i]].y; }
  return { x: sx / ks.length, y: sy / ks.length };
}
function ptDist(){
  var ks = Object.keys(LB.pts);
  if (ks.length < 2) return 0;
  var a = LB.pts[ks[0]], b = LB.pts[ks[1]];
  var dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}
stage.addEventListener("pointerdown", function(e){
  stage.setPointerCapture(e.pointerId);
  LB.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
  var n = ptCount();
  if (n === 1){
    LB.mode = 1; LB.px = e.clientX; LB.py = e.clientY; LB.tx0 = LB.tx; LB.ty0 = LB.ty;
    var now = Date.now();
    if (now - LB.lastTap < 300){ lbSet(LB.scale > 1.2 ? 1 : 2.5); LB.lastTap = 0; } else { LB.lastTap = now; }
  } else if (n >= 2){
    LB.mode = 2;
    LB.d0 = ptDist(); LB.s0 = LB.scale; LB.tx0 = LB.tx; LB.ty0 = LB.ty;
    var m = ptAvg(); LB.mx = m.x; LB.my = m.y;
  }
});
stage.addEventListener("pointermove", function(e){
  if (!LB.pts[e.pointerId]) return;
  LB.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
  if (ptCount() >= 2 && LB.mode === 2){
    var d = ptDist();
    if (LB.d0 > 0){
      var ns = Math.min(8, Math.max(1, LB.s0 * (d / LB.d0)));
      var ratio = ns / LB.s0;
      var m = ptAvg();
      LB.scale = ns;
      LB.tx = m.x - (LB.mx - LB.tx0) * ratio;
      LB.ty = m.y - (LB.my - LB.ty0) * ratio;
      lbApply();
    }
  } else if (ptCount() === 1 && LB.mode === 1 && LB.scale > 1.001){
    LB.tx = LB.tx0 + (e.clientX - LB.px);
    LB.ty = LB.ty0 + (e.clientY - LB.py);
    lbApply();
  }
});
function lbUp(e){
  delete LB.pts[e.pointerId];
  if (ptCount() === 0){ LB.mode = 0; if (LB.scale <= 1.001) lbReset(); }
  else if (ptCount() === 1){
    var ks = Object.keys(LB.pts), p = LB.pts[ks[0]];
    LB.mode = 1; LB.px = p.x; LB.py = p.y; LB.tx0 = LB.tx; LB.ty0 = LB.ty;
  }
}
stage.addEventListener("pointerup", lbUp);
stage.addEventListener("pointercancel", lbUp);
stage.addEventListener("wheel", function(e){
  e.preventDefault();
  lbSet(LB.scale * (e.deltaY < 0 ? 1.12 : 0.9));
}, { passive: false });
$("lb-close").onclick = closeLB;
$("lb-reset").onclick = lbReset;
$("lb-in").onclick = function(){ lbSet(LB.scale * 1.35); };
$("lb-out").onclick = function(){ lbSet(LB.scale / 1.35); };
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeLB(); });
document.addEventListener("click", function(e){
  var t = e.target;
  if (t && t.classList && t.classList.contains("zoomable")){
    openLB(t.getAttribute("src"), t.getAttribute("data-name"));
  }
});

var filters = { sec: "", point: "", set: "", mis: false };

function updateReviewStats(){
  var mis = 0;
  filtered.forEach(function(r){ if (r.mis) mis += 1; });

  if (mis) txt += "（含误记 " + mis + " 条）";

function applyFilter(){
  filtered = RECS.filter(function(r){
    if (r.mis && !filters.mis) return false;
    if (filters.set && r.setTxt !== filters.set) return false;
    if (filters.sec && r.sec !== filters.sec) return false;
    if (filters.point){
      var pts = (r.point || "").split(/[;；]/).map(function(x){ return x.trim(); });
      if (pts.indexOf(filters.point) < 0) return false;
    }
    return true;
  });
  shown = 0;
  $("review-list").innerHTML = "";
  updateReviewStats();
  renderMore();
}
function reviewCard(r){

  h += '<div class="meta">';

  h += '<h3 style="margin-top:8px">' + esc(r.point || (r.mis ? "误记记录（无错题数据）" : "")) + '</h3>';
  if (r.note) h += '<div class="imgtip">' + esc(r.note) + '</div>';
  if (!r.stem) h += '<div class="imgtip">题干未录入，请对照下方原书扫描页。</div>';

  if (r.bookkey && r.bookkey !== r.key) h += ' <span class="tag bad">原书记录 ' + esc(r.bookkey) + '</span>';
  if (r.a1) h += ' <span class="tag' + (r.a1 === r.key ? " ok" : " bad") + '">一刷作答 ' + esc(r.a1) + '</span>';
  if (r.a2) h += ' <span class="tag">二刷作答 ' + esc(r.a2) + '</span>';
  h += '</div>';
  if (r.rate || r.trap){

    h += '<div class="imgtip">点击图片可全屏放大（双指缩放 / 双击放大）</div>';
    h += '<div class="imgs">';

    h += '</div>';

    h += '</details>';
  }
  h += '</div>';
  return h;
}
function renderMore(){
  var box = $("review-list");
  var end = Math.min(filtered.length, shown + PAGE);
  var buf = "";
  for (var i = shown; i < end; i++) buf += reviewCard(filtered[i]);
  box.insertAdjacentHTML("beforeend", buf);
  shown = end;
  if (!filtered.length){
    box.innerHTML = '<div class="empty">没有符合筛选条件的题目</div>';
    $("more").classList.add("hidden");
  } else {
    $("more").classList.toggle("hidden", shown >= filtered.length);
    $("more").textContent = "加载更多（已显示 " + shown + " / " + filtered.length + "）";

}
$("more").onclick = renderMore;
$("f-sec").onchange = function(){ filters.sec = this.value; applyFilter(); };
$("f-point").onchange = function(){ filters.point = this.value; applyFilter(); };
$("f-set").onchange = function(){ filters.set = this.value; applyFilter(); };
$("f-mis").onchange = function(){ filters.mis = this.checked; applyFilter(); };

/* ---------------- 刷题模式 ---------------- */
var QUIZ = {};
try { QUIZ = JSON.parse(localStorage.getItem(LS_QUIZ) || "{}") || {}; } catch (err) { QUIZ = {}; }
function saveQuiz(){ try { localStorage.setItem(LS_QUIZ, JSON.stringify(QUIZ)); } catch (err) {} }
function gRec(gid){ return QUIZ[gid] || null; }

function groupCard(g){
  var rec = gRec(g.gid);
  var head = '<div class="card" id="g' + g.gid + '">';
  head += '<div class="ghead"><div><h3>第 ' + g.gid + ' 组 · ' + esc(g.label) + '</h3>' +
          '<div class="meta">' +
          (g.setTxt ? '<span class="tag brand">' + esc(g.setTxt) + '</span>' : '<span class="tag brand">' + esc(g.sec) + '</span>') +
          '<span class="tag">' + g.size + ' 题</span>' +
          '<span class="tag">' + esc(g.pageTxt || ("P" + g.page)) + '</span></div></div></div>';
  if (g.point) head += '<div class="meta" style="margin-top:6px"><span class="tag">' + esc(g.point.split(/[;；]/).join(" / ")) + '</span></div>';
  head += '<div class="record">题号：' + esc((g.qhs || []).join("、")) + '</div>';
  var status;
  if (rec && rec.done){
    status = '<div class="record">已刷 · 用时 ' + fmtSec(rec.sec) + ' · 正确率 ' + rec.correct + '/' + rec.total +
             '（' + Math.round(rec.correct * 100 / rec.total) + '%）· ' + esc(rec.ts || "") + '</div>';
  } else if (rec && rec.elapsed){
    status = '<div class="record">上次作答未交卷 · 已用 ' + fmtSec(rec.elapsed) + '，可继续</div>';
  } else {
    status = '<div class="record">未刷 · 本组共 ' + g.size + ' 题</div>';
  }
  var btn = rec && rec.done ? "重做本组" : (rec && rec.elapsed ? "继续作答" : "开始作答");
  head += status;
  head += '<div class="row" style="margin-top:10px"><button class="btn-primary" data-start="' + g.gid + '">' + btn + '</button>' +
          (rec ? '<button class="btn-ghost" data-clear="' + g.gid + '">清除记录</button>' : "") + '</div>';
  head += '<div id="body' + g.gid + '"></div></div>';
  return head;
}
function renderQuiz(){
  var buf = "";
  GROUPS.forEach(function(g){ buf += groupCard(g); });
  $("quiz-list").innerHTML = buf;
}

var running = {};
function startGroup(gid, keep){
  var g = GROUPS.filter(function(x){ return x.gid === gid; })[0];
  if (!g) return;
  var rec = gRec(gid) || {};
  var answers = (keep && rec.answers) ? rec.answers : {};
  var elapsed = (keep && rec.elapsed) ? rec.elapsed : 0;

  var body = "";
  body += '<div id="res' + gid + '"></div>';
  if (g.mat) body += '<div class="mat">' + esc(g.mat) + '</div>';
  if (g.imgs && g.imgs.length){
    body += '<div class="imgtip">材料图 ' + g.imgs.length + ' 张 · 点击图片可全屏放大（双指缩放 / 双击放大）</div><div class="imgs">';
    g.imgs.forEach(function(p){ body += imgHtml(p); });
    body += '</div>';
  }
  body += '<div class="row" style="justify-content:space-between;margin:6px 0 10px">' +
          '<span>计时：<span class="timer" id="t' + gid + '">' + fmtSec(elapsed) + '</span></span>' +
          '<span class="row"><button class="btn-sm btn-ghost" data-hide="' + gid + '">收起</button>' +
          '<button class="btn-primary btn-sm" data-submit="' + gid + '">交卷</button></span></div>';

  g.idx.forEach(function(ri, qi){
    var r = RECS[ri];
    body += '<div class="qbox" id="q' + gid + '_' + qi + '">';
    body += '<div class="meta"><span class="tag brand">本套第 ' + (r.qno || (qi + 1)) + ' 题</span>' +
            '<span class="tag">题号 ' + esc(r.qh) + '</span>' +
            '<span class="tag">原书 P' + esc(r.page) + '</span>' +
            (g.setTxt ? '<span class="tag">' + esc(g.setTxt) + '</span>' : '') +
            '<span class="tag">第 ' + g.gid + ' 组</span>';
    if (r.imgs) r.imgs.forEach(function(p){ if (!g.imgs || g.imgs.indexOf(p) < 0) body += '<span class="tag">附图</span>'; });
    body += '</div>';
    body += '<div class="stem">' + esc(r.stem) + '</div>';
    if (r.imgs && r.imgs.length){
      body += '<div class="imgs">';
      r.imgs.forEach(function(p){ if (!g.imgs || g.imgs.indexOf(p) < 0) body += imgHtml(p); });
      body += '</div>';
    }
    body += '<div class="opts">';
    (r.letters || []).forEach(function(L){
      var checked = answers[r.no] === L ? " checked" : "";
      body += '<label class="opt"><input type="radio" name="n' + gid + '_' + qi + '" value="' + L + '"' +
              ' data-ans="' + esc(r.no) + '" data-g="' + gid + '"' + checked + '>' +
              '<span><b>' + L + '．</b>' + esc(r.opts[L]) + '</span></label>';
    });
    body += '</div>';
    body += '<div id="fb' + gid + '_' + qi + '"></div>';
    if (r.sol) body += '<div id="sol' + gid + '_' + qi + '"></div>';
    body += '</div>';
  });
  $("body" + gid).innerHTML = body;

  running[gid] = { elapsed: elapsed, answers: answers, timer: null };
  tickGroup(gid);
  persistRun(gid);
}
/* 单选变更：全局委托一次，避免反复展开时重复绑定监听器 */
document.addEventListener("change", function(e){
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var no = t.getAttribute("data-ans");
  var gid = parseInt(t.getAttribute("data-g") || "0", 10);
  if (no && running[gid]){
    running[gid].answers[no] = t.value;
    persistRun(gid);
  }
});
function persistRun(gid){
  var st = running[gid];
  if (!st) return;
  var old = QUIZ[gid] || {};
  QUIZ[gid] = { done: false, elapsed: st.elapsed, answers: st.answers, ts: old.ts || "" };
  saveQuiz();
}
function tickGroup(gid){
  var st = running[gid];
  if (!st) return;
  if (st.timer) clearInterval(st.timer);
  st.timer = setInterval(function(){
    if (!running[gid]) return;
    running[gid].elapsed += 1;
    var el = $("t" + gid);
    if (el) el.textContent = fmtSec(running[gid].elapsed);
    if (running[gid].elapsed % 5 === 0) persistRun(gid);
  }, 1000);
}
function stopGroup(gid){
  var st = running[gid];
  if (st && st.timer){ clearInterval(st.timer); st.timer = null; }
}
function submitGroup(gid){
  var g = GROUPS.filter(function(x){ return x.gid === gid; })[0];
  var st = running[gid];
  if (!g || !st) return;
  stopGroup(gid);

  var total = g.idx.length, correct = 0;
  g.idx.forEach(function(ri, qi){
    var r = RECS[ri];
    var mine = st.answers[r.no] || "";
    var ok = mine && mine === r.key;
    if (ok) correct += 1;
    var box = $("q" + gid + "_" + qi);
    if (box){
      var labels = box.querySelectorAll("label.opt");
      for (var i = 0; i < labels.length; i++){
        var inp = labels[i].querySelector("input");
        var val = inp ? inp.value : "";
        labels[i].classList.remove("tick", "cross");
        if (val === r.key) labels[i].classList.add("tick");
        else if (val === mine && !ok) labels[i].classList.add("cross");
        if (inp) inp.disabled = true;
      }
    }
    var fb = $("fb" + gid + "_" + qi);
    if (fb){
      var line = "<div class='answerline'>";
      line += ok ? "<span class='tag ok'>作答正确</span>" : "<span class='tag bad'>作答错误</span>";
      line += " 你的选择：<b>" + (mine ? esc(mine) : "未作答") + "</b>　标准答案：<b>" + esc(r.key) + "</b>";
      if (r.rate) line += "　<span class='tag'>全站正确率 " + esc(r.rate) + "</span>";
      if (r.trap) line += " <span class='tag'>易错项 " + esc(r.trap) + "</span>";
      line += "</div>";
      fb.innerHTML = line;
    }
    var solBox = $("sol" + gid + "_" + qi);
    if (solBox && r.sol){
      solBox.innerHTML = '<details class="fold" open><summary>APP解析</summary><div class="sol">' + esc(prettySol(r.sol)) + '</div></details>';
    }
  });

  var res = $("res" + gid);
  if (res){
    res.innerHTML = '<div class="result">本组用时：' + fmtSec(st.elapsed) + '　正确率：' + correct + '/' + total +
                    '（' + Math.round(correct * 100 / total) + '%）</div>';
  }
  var card0 = $("g" + gid);
  var submitBtn = card0 ? card0.querySelector("[data-submit]") : null;
  if (submitBtn){
    submitBtn.setAttribute("disabled", "disabled");
    submitBtn.textContent = "已交卷";
    submitBtn.classList.remove("btn-primary");
    submitBtn.classList.add("btn-ghost");
  }
  var hideBtn = card0 ? card0.querySelector("[data-hide]") : null;
  if (hideBtn) hideBtn.textContent = "收起";
  var now = new Date();
  var ts = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2);
  QUIZ[gid] = { done: true, sec: st.elapsed, correct: correct, total: total, answers: st.answers, ts: ts };
  saveQuiz();
  delete running[gid];
  updateHint();
  var card = $("g" + gid);
  if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.addEventListener("click", function(e){
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var gid = 0;
  if (t.getAttribute("data-start")){
    gid = parseInt(t.getAttribute("data-start"), 10);
    var rec = gRec(gid);
    startGroup(gid, !!(rec && rec.elapsed && !rec.done));
    t.setAttribute("disabled", "disabled");
    t.textContent = "作答中";
    t.classList.remove("btn-primary");
    t.classList.add("btn-ghost");
  } else if (t.getAttribute("data-submit")){
    gid = parseInt(t.getAttribute("data-submit"), 10);
    submitGroup(gid);
  } else if (t.getAttribute("data-hide")){
    gid = parseInt(t.getAttribute("data-hide"), 10);
    stopGroup(gid);
    persistRun(gid);
    var body = $("body" + gid);
    if (body) body.innerHTML = "";
    var card = $("g" + gid);
    var sb = card ? card.querySelector("[data-start]") : null;
    if (sb){
      sb.removeAttribute("disabled");
      sb.textContent = "继续作答";
      sb.classList.add("btn-primary");
      sb.classList.remove("btn-ghost");
    }
    updateHint();
  } else if (t.getAttribute("data-clear")){
    gid = parseInt(t.getAttribute("data-clear"), 10);
    if (window.confirm("清除第 " + gid + " 组的作答与成绩记录？")){
      stopGroup(gid);
      delete running[gid];
      delete QUIZ[gid];
      saveQuiz();
      renderQuiz();
      updateHint();
    }
  }
});

function updateHint(){
  var done = 0, sum = 0, cnt = 0, right = 0, wrong = 0;
  Object.keys(QUIZ).forEach(function(k){
    var q = QUIZ[k];
    if (q && q.done){
      done += 1; sum += q.sec; cnt += 1;
      right += q.correct || 0;
      wrong += (q.total || 0) - (q.correct || 0);
    }
  });
  var txt = "有效错题 " + PAYLOAD.meta.valid + " 条（另误记 " + PAYLOAD.meta.mis + " 条）　·　刷题组 " + GROUPS.length + " 组　·　已刷 " + done + " 组";
  if (cnt) txt += "，平均用时 " + fmtSec(Math.round(sum / cnt));
  $("topHint").textContent = txt;
  var st = $("quizStats");
  if (st){
    st.textContent = done
      ? "已刷 " + done + " 组｜答对 " + right + " 题｜答错 " + wrong + " 题｜总用时 " + fmtSec(sum)
      : "还没有已交卷的记录";
  }
}

/* ---------------- 作答记录导出 ---------------- */
function pad2(n){ return ("0" + n).slice(-2); }
function stampFile(){
  var d = new Date();
  return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" +
         pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
}
function stampHuman(){
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " +
         pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}
function buildExport(onlyWrong){
  var right = [], wrong = [], groupRows = [];
  var totQ = 0, totRight = 0, totSec = 0, doneN = 0;
  GROUPS.forEach(function(g){
    var rec = gRec(g.gid);
    if (!rec || !rec.done) return;
    doneN += 1; totSec += rec.sec; totQ += rec.total; totRight += rec.correct;
    groupRows.push({
      "组号": g.gid,
      "组名": g.label,
      "套次": g.setTxt || "",
      "章节": g.sec,
      "考点": g.point,
      "题号": (g.qhs || []).join("、"),
      "原书页码": g.pageTxt || g.page,
      "题量": rec.total,
      "答对数": rec.correct,
      "答错数": rec.total - rec.correct,
      "正确率": Math.round(rec.correct * 100 / rec.total) + "%",
      "用时秒": rec.sec,
      "用时": fmtSec(rec.sec),
      "完成时间": rec.ts || ""
    });
    g.idx.forEach(function(ri, qi){
      var r = RECS[ri];
      var mine = (rec.answers || {})[r.no] || "";
      var item = {
        "组号": g.gid,
        "组名": g.label,
        "套次": r.setTxt || g.setTxt || "",
        "套内题号": r.qno || (qi + 1),
        "编号": r.no,
        "题号": r.qh,
        "章节": r.sec,
        "考点": r.point,
        "原书页码": r.page,
        "标准答案": r.key,
        "我的作答": mine || "未作答",
        "本题结果": mine === r.key ? "正确" : "错误",
        "组内用时秒": rec.sec,
        "历史一刷作答": r.a1 || "",
        "全站正确率": r.rate || "",
        "易错项": r.trap || ""
      };
      if (mine && mine === r.key) right.push(item); else wrong.push(item);
    });
  });
  var out = {
    "导出时间": stampHuman(),
    "统计": {
      "已刷组数": doneN,
      "总题数": totQ,
      "答对题数": right.length,
      "答错题数": wrong.length,
      "正确率": totQ ? Math.round(right.length * 100 / totQ) + "%" : "0%",
      "总用时秒": totSec,
      "总用时": fmtSec(totSec)
    },
    "分组成绩": groupRows
  };
  if (onlyWrong){
    out["答错记录"] = wrong;
  } else {
    out["作答明细"] = right.concat(wrong);
    out["答对记录"] = right;
    out["答错记录"] = wrong;
  }
  return out;
}
function exportFile(obj, fileName){
  var text = JSON.stringify(obj, null, 2);
  var blob = new Blob([text], { type: "application/json;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  window.setTimeout(function(){
    URL.revokeObjectURL(url);
    if (a.parentNode) a.parentNode.removeChild(a);
  }, 3000);
  return Math.max(1, Math.round(blob.size / 1024));
}
function doExport(onlyWrong){
  var data = buildExport(onlyWrong);
  if (!data["统计"]["已刷组数"]){
    window.alert("还没有已交卷的作答记录，先完整刷一组并交卷吧。");
    return;
  }
  var name = "资料分析_" + (onlyWrong ? "错题记录_" : "作答记录_") + stampFile() + ".json";
  try {
    var kb = exportFile(data, name);
    noteState.textContent = "已导出 " + kb + " KB";
    window.alert("已导出：" + name + "\n（浏览器会保存到「下载」文件夹，手机端可能提示保存或分享）");
  } catch (err) {
    window.alert("导出失败：" + err.message + "\n建议改用电脑端浏览器打开本页面再导出。");
  }
}
$("btn-export").onclick = function(){ doExport(false); };
$("btn-export-last").onclick = function(){ doExport(true); };

/* ---------------- 启动 ---------------- */
fillSelects();
applyFilter();
renderQuiz();
updateHint();
setTab(curTab);
</script>
