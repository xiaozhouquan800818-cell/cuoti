<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资料分析 · 刷题卷（第二优先级 · 能力边界 37 题）</title>
<style>
  :root{
    --ink:#1f2733; --sub:#5b6676; --line:#e3e8ef; --bg:#f4f6fa; --card:#ffffff;
    --brand:#2f6fed; --brand-soft:#eaf1fe; --ok:#1a9e5f; --ok-soft:#e8f8ef;
    --bad:#d93a3a; --bad-soft:#fdecec; --warn:#b26a00; --warn-soft:#fff6e5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
    line-height:1.75; font-size:15px;
  }
  .wrap{max-width:940px; margin:0 auto; padding:26px 20px 80px;}

  /* 顶部醒目 Banner */
  .banner{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,#0f2438 0%,#1a3d5f 48%,#24557f 100%);
    color:#fff; border-radius:18px; padding:30px 34px 28px;
    box-shadow:0 14px 36px rgba(15,36,56,.30);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .banner::after{
    content:""; position:absolute; right:-60px; top:-60px; width:240px; height:240px;
    background:radial-gradient(circle,rgba(93,160,230,.35),transparent 70%); border-radius:50%;
  }
  .banner .pill{
    position:relative; display:inline-block; border:1px solid rgba(255,255,255,.45);
    color:#dfeaf7; background:rgba(255,255,255,.07);
    padding:5px 16px; border-radius:20px; font-size:14px; letter-spacing:1px; margin-bottom:16px;
  }
  .banner h1{
    position:relative; margin:0 0 16px; font-size:31px; letter-spacing:2px; font-weight:800;
    text-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .banner .lead{
    position:relative; margin:0 0 8px; font-size:19.5px; line-height:2; color:#eef5ff; font-weight:600;
  }
  .banner .lead .hl{color:#ffc24b; font-weight:800;}
  .banner .sub{
    position:relative; margin:4px 0 0; font-size:16.5px; color:#c3d8ef; line-height:1.9;
  }
  .banner .cards{
    position:relative; display:flex; gap:14px; margin-top:22px; flex-wrap:wrap;
  }
  .banner .card{
    flex:1 1 150px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.17);
    border-radius:14px; padding:15px 20px; backdrop-filter:blur(2px);
  }
  .banner .card .num{font-size:35px; font-weight:800; color:#ffc24b; line-height:1.05;}
  .banner .card .num small{font-size:17px; color:#ffd97a; margin-left:3px;}
  .banner .card .cap{font-size:14px; color:#c6d8ec; margin-top:6px; letter-spacing:.5px;}
  .banner .alert{
    position:relative; margin-top:20px; background:rgba(217,58,58,.20);
    border-left:5px solid #ff6b6b; border-radius:10px; padding:13px 18px;
    font-size:17.5px; font-weight:700; color:#ffe3e3; line-height:1.8;
  }

  /* 工具条 */
  .toolbar{
    position:sticky; top:0; z-index:20; margin:14px 0 22px;
    background:rgba(255,255,255,.94); backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:14px; padding:12px 16px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    box-shadow:0 4px 16px rgba(31,39,51,.06);
  }
  .toolbar button{
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border:none; border-radius:10px; padding:9px 16px; transition:.15s;
  }
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:#255bd0;}
  .btn-ghost{background:#eef1f6; color:#3a4657;}
  .btn-ghost:hover{background:#e2e7ef;}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-ok:hover{background:#158a51;}
  .score{margin-left:auto; font-size:14px; color:var(--sub);}
  .score b{color:var(--brand); font-size:17px;}
  .score .ok{color:var(--ok);} .score .bad{color:var(--bad);}

  /* 题目卡片 */
  .q{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px 22px; margin-bottom:20px; box-shadow:0 2px 10px rgba(31,39,51,.04);
    border-left:5px solid var(--brand);
  }
  .q.right{border-left-color:var(--ok); background:var(--ok-soft);}
  .q.wrong{border-left-color:var(--bad); background:var(--bad-soft);}
  .q-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px;}
  .badge-id{
    background:var(--brand); color:#fff; font-weight:700; font-size:13px;
    padding:3px 11px; border-radius:8px; letter-spacing:.5px;
  }
  .q-no{font-size:13px; color:var(--sub);}
  .q-page{
    font-size:13px; color:var(--warn); background:var(--warn-soft);
    border:1px solid #f0dcae; padding:2px 9px; border-radius:8px;
  }
  .q-kp{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto;}
  .kp-tag{
    font-size:12px; color:var(--brand); background:var(--brand-soft);
    border:1px solid #cfe0fd; padding:2px 9px; border-radius:20px;
  }

  .block{display:flex; gap:10px; margin:12px 0;}
  .block .label{
    flex:0 0 auto; font-size:12px; font-weight:700; color:#fff; height:22px;
    line-height:22px; padding:0 10px; border-radius:6px;
  }
  .label-mat{background:#8a94a6;}
  .label-stem{background:#3a4657;}
  .block .content{flex:1 1 auto; min-width:0;}
  .mat-text{
    background:#fafbfd; border:1px dashed #d7dee9; border-radius:10px;
    padding:12px 14px; color:#33404f; font-size:14px; text-align:justify;
  }
  .imgs{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;}
  .imgs img{
    max-width:100%; border:1px solid var(--line); border-radius:10px;
    background:#fff; padding:4px; box-shadow:0 2px 8px rgba(31,39,51,.06);
  }
  .stem-text{font-size:15px; font-weight:600; color:#1f2733; text-align:justify;}

  .opts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:9px;}
  .opts li{
    display:flex; align-items:flex-start; gap:10px; padding:9px 13px;
    border:1px solid var(--line); border-radius:10px; background:#fcfdff;
    cursor:pointer; transition:.12s;
  }
  .opts li:hover{border-color:#b9cdf6; background:#f5f9ff;}
  .opts li input{margin-top:5px; accent-color:var(--brand); flex:0 0 auto;}
  .opts li .k{
    font-weight:700; color:var(--brand); flex:0 0 auto; min-width:16px;
  }
  .opts li .v{flex:1 1 auto; text-align:justify;}
  .opts li.sel{border-color:var(--brand); background:var(--brand-soft);}
  .q.right .opts li.sel{border-color:var(--ok); background:#d9f2e4;}
  .q.wrong .opts li.sel{border-color:var(--bad); background:#fbdcdc;}

  .verdict{
    display:none; margin-top:12px; font-weight:700; font-size:14px;
    padding:7px 14px; border-radius:9px;
  }
  .q.right .verdict{display:inline-block; color:var(--ok); background:#d3f1e1;}
  .q.wrong .verdict{display:inline-block; color:var(--bad); background:#fadada;}

  /* 考点分区标题 */
  .sec{
    margin:34px 0 14px; padding:10px 16px; font-size:19px; color:#1f2733;
    border-left:6px solid var(--brand);
    background:linear-gradient(90deg,#eaf1fe,rgba(234,241,254,0));
    border-radius:0 12px 12px 0; display:flex; align-items:center; gap:10px;
  }
  .sec-key{
    background:#d93a3a; color:#fff; font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:20px;
  }
  .sec-n{margin-left:auto; font-size:13px; color:var(--sub); font-weight:400;}
  .xref{
    margin:-6px 0 20px; padding:9px 14px; font-size:13px; color:var(--sub);
    background:#eef1f6; border-radius:9px;
  }
  .xref a{color:var(--brand); text-decoration:none; font-weight:600; margin:0 2px;}
  .xref a:hover{text-decoration:underline;}
  .q{scroll-margin-top:86px;}

  footer{text-align:center; color:#98a2b3; font-size:12px; margin-top:34px;}

  @media print{
    body{background:#fff; font-size:12.5px;}
    .wrap{max-width:none; padding:0;}
    .toolbar{display:none;}
    .banner{box-shadow:none; border-radius:0;}
    .q{break-inside:avoid; box-shadow:none; margin-bottom:14px;}
    .opts li{background:#fff;}
  }
</style>
</head>

<div class="wrap">

 material:"2018年国家统计局组织开展了第二次全国时间利用的随机抽样调查，共调查48580人。结果显示，受访居民在一天的活动中，有酬劳动平均用时4小时24分钟。其中，男性5小时15分钟，女性3小时35分钟；城镇居民3小时59分钟，农村居民5小时1分钟；工作日4小时50分钟，休息日3小时19分钟。受访居民有酬劳动的参与率为59.0%，其中城镇居民53.1%。受访居民无酬劳动平均用时2小时42分钟。其中，女性3小时48分钟；农村居民2小时39分钟；工作日2小时34分钟。受访居民无酬劳动的参与率为70.2%，其中男性55.3%。 无酬劳动包括家务劳动、陪伴照料孩子生活、护送辅导孩子学习、陪伴照料成年家人、购买商品或服务、看病就医和公益活动。受访居民家务劳动平均用时1小时26分钟，参与率为58.5%。其中，女性2小时6分钟，参与率75.6%。受访居民陪伴照料孩子生活平均用时36分钟，参与率为18.9%；护送辅导孩子学习平均用时9分钟，参与率为10.2%；陪伴照料成年家人平均用时8分钟，参与率为5.0%；看病就医平均用时4分钟，参与率为2.2%；公益活动平均用时3分钟，参与率为4.1%。",
 imgs:[], stem:"受访的男性居民约有",
 opts:{A:"2.4万人",B:"2.6万人",C:"2.9万人",D:"3.0万人"}, ans:"A"},

{id:"ZL045", no:"109-13", page:"108 109", kp:"现期平均数",
 material:"2017年，国内旅游市场高速增长，入出境市场平稳发展，供给侧结构性改革成效明显。国内旅游人数50.01亿人次，比上年同期增长12.8%；入出境旅游总人数2.7亿人次，增长3.7%；全年实现旅游总收入5.40万亿元，增长15.1%；全年全国旅游业对GDP的综合贡献为9.13万亿元，占GDP总量的11.04%；旅游直接就业2825万人，旅游直接和间接就业7990万人，占全国就业总人口的10.28%。 一、全年国内旅游收入增长15.9% 2017年，国内旅游人数50.01亿人次，比上年同期增长12.8%。其中，城镇居民36.77亿人次，增长15.1%；农村居民13.24亿人次，增长6.8%。国内旅游收入4.57万亿元，增长15.9%。其中，城镇居民花费3.77万亿元，增长16.8%；农村居民花费0.80万亿元，增长11.8%。 二、全年入境过夜旅游人数增长2.5% 2017年，入境旅游人数13948万人次，比上年同期增长0.8%。其中，外国人2917万人次，增长3.6%；香港同胞7980万人次，下降1.6%；澳门同胞2465万人次，增长4.9%；台湾同胞587万人次，增长2.5%。入境旅游人数按照入境方式分，船舶占3.2%，飞机占16.5%，火车占0.8%，汽车占22.2%，其他占57.2%。 2017年，入境过夜旅游人数6074万人次，比上年同期增长2.5%。其中，外国人2248万人次，增长3.8%；香港同胞2775万人次，增长0.1%；澳门同胞522万人次，增长8.6%；台湾同胞529万人次，增长4.0%。 三、全年国际旅游收入达1234亿美元 2017年，国际旅游收入1234亿美元，比上年同期增长2.9%。其中，外国人在华花费695亿美元，增长4.1%；香港同胞在内地花费301亿美元，下降1.5%；澳门同胞在内地花费83亿美元，增长8.0%；台湾同胞在大陆花费155亿美元，增长4.0%。 四、全年入境外国游客亚洲占74.6%，以观光休闲为目的游客占37.1% 2017年，入境外国游客人数4294万人次，亚洲占74.6%，美洲占8.2%，欧洲占13.7%，大洋洲占2.1%，非洲占1.4%。其中，按照年龄分，14岁以下人数占3.1%，15—24岁占13.2%，25—44岁占49.9%，45—64岁占29.2%，65岁以上占4.6%；按性别分，男占60.7%，女占39.3%；按目的分，会议/商务占13.3%，观光休闲占37.1%，探亲访友占2.6%，服务员工占14.8%，其他占32.2%。 2017年，按入境旅游人数排序，我国主要客源市场前17位国家如下：缅甸、越南、韩国、日本、俄罗斯、美国、蒙古、马来西亚、菲律宾、新加坡、印度、加拿大、泰国、澳大利亚、印度尼西亚、德国、英国。 五、全年中国公民出境旅游人数达13051万人次 2017年，中国公民出境旅游人数13051万人次，比上年同期增长7.0%。",
 imgs:[], stem:"2017年，城镇居民平均每人次旅游消费比农村居民约多多少元？",
 opts:{A:"382",B:"395",C:"406",D:"421"}, ans:"D"},

{id:"ZL052", no:"120-20", page:"119 120", kp:"增长量计算, 两期平均数, 基期倍数",
 material:"2021年1-2月，全国房地产开发投资13986亿元，同比增长3873亿元，房屋施工面积770629万平方米，同比增长11.0%。其中，住宅542503万平方米，增长11.2%；办公楼31802万平方米，增长7.3%；商业营业用房76346万平方米，增长2.5%；其他类型119978万平方米。房屋新开工面积17037万平方米，增长64.3%，其中，住宅12736万平方米，增长68.5%。商品房销售面积17363万平方米，同比增长1.05倍，比2019年1-2月增长23.3%，商品房销售额19151亿元，同比增长1.33倍，比2019年同期增长49.6%。 2月末，商品房待售面积比上年末增加2575万平方米，其中，住宅增加2314万平方米，办公楼和商业营业用房分别减少24万平方米和269万平方米。 2021年1-2月，分地区看，东部地区房地产开发投资8353亿元，同比增长32.4%；中部地区2640亿元，增长52.5%；西部地区2834亿元，增长45.1%；东北地区158亿元，增长28.6%。 东部地区商品房销售面积7565万平方米，同比增长113.9%；销售额11891亿元，增长148.1%，中部地区商品房销售面积4369万平方米，增长104.3%；销售额3280亿元，增长130.2%，西部地区商品房销售面积5004万平方米，增长95.1%；销售额3620亿元，增长103.6%，东北地区商品房销售面积425万平方米，增长82.0%；销售额359亿元，增长72.7%。",
 imgs:[], stem:"根据上文，下列说法正确的是（　）。",
 opts:{A:"2021年1-2月，全国房屋新开工面积同比增加超6800万平方米",B:"2021年2月末，商业营业用房待售面积同比减少量比办公楼多245万平方米",C:"2020年1-2月，房地产开发投资最低的地区，其投资额与最高的地区相差55倍",D:"2021年1-2月，分地区看，东北地区的商品房销售均价同比增长最小"}, ans:"D"},

{id:"ZL062", no:"129-15", page:"128 129", kp:"增长量计算, 两期比重, 两期平均数",
 material:"2023年全国著作权（包括作品著作权、计算机软件著作权、著作权质权）登记总量达8923901件，同比增长40.46%，增速比上年同期增加39个百分点。根据各省、自治区、直辖市版权局和中国版权保护中心作品登记信息统计，2023年全国共完成作品著作权登记6428277件，同比增长42.30%，登记量前五位的分别是：北京市1101072件，同比增加53802件；山东省873826件，同比增加619459件；福建省710648件，同比增加424814件；中国版权保护中心493070件，同比增加1476件；上海市412660件，同比增加30660件。从作品类型来看，登记量最多的是美术作品3296437件，第二是摄影作品2501968件，第三是文字作品329128件，前三类作品类型登记量占作品著作权登记总量的95.32%，该比例比上年同期增加4.86个百分点。 2023年全国共完成著作权质权登记411件，同比增长17.43%，涉及主债务金额995817.4万元，同比增长82.82%；涉及担保金额985783.88万元，同比增长80.85%。其中计算机软件著作权质权登记361件，涉及主债务金额917149.06万元，涉及担保金额907399.56万元；作品（除计算机软件之外）著作权质权登记50件，同比下降26.47%，涉及主债务金额78668.34万元，同比下降55.13%，涉及担保金额78384.32万元，同比下降55.46%。",
 imgs:[], stem:"不能从上述资料中推出的是：",

{id:"ZL066", no:"132-5", page:"131 132", kp:"现期比重, 基期比重, 两期平均数",
 material:"2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。 截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只，存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。 截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。",

{id:"ZL070", no:"134-12", page:"134", kp:"现期比重",
 material:"2019年A市专利密集型产业实现增加值6918.8亿元，比上年增长9.6%，分别高于战略性新兴产业、高技术产业增加值增速2.3个和1.7个百分点；专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。 2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，比规模以上重点企业高5.1个百分点。专利密集型产业每亿元R&D经费产生的发明专利申请量为73.1件，比规模以上重点企业高3.6件；企业户均拥有有效发明专利15.6件，是规模以上重点企业的2.2倍。从成果转化看，已被成功实施的发明专利数为5.2万件，占有效发明专利数的58.4%。 在专利密集型产业中，2019年信息通信技术服务业实现营业收入10198.5亿元，增速达41.3%；实现利润197.6亿元，比上年增长1倍；单位企业实现营业收入12亿元，是专利密集型产业平均水平的3.3倍。 在专利密集型产业中，2019年医药医疗产业营业收入、利润分别增长13.7%和5%；收入利润率达到17%，高于专利密集型产业平均水平4.1个百分点；单位企业营业收入、利润分别为4.5亿元和0.76亿元。",
 imgs:[], stem:"现已知2019年A市①专利密集型产业专利申请总量、②专利密集型产业R&D经费占专利密集型产业实现增加值的比重。如果想得到当年A市专利密集型产业发明专利申请量的数值，下列说法正确的是：",

{id:"ZL075", no:"136-19", page:"135 136", kp:"基期比重",
 material:"2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。 2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。 2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。 2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。",
 imgs:[], stem:"2020年中国出口的纺织制品总额中，防疫类口罩出口额占比约为：",
 opts:{A:"57%",B:"72%",C:"33%",D:"45%"}, ans:"A"},

{id:"ZL081", no:"141-5", page:"140 141 142", kp:"现期平均数, 基期量计算, 间隔增长率",
 material:"2020年，我国规模以上互联网和相关服务企业（以下简称互联网企业）业务收入12838亿元，同比增长12.5%，增速低于上年同期8.9个百分点。 2020年，互联网企业实现营业利润1187亿元，同比增长13.2%，增速低于上年同期3.7个百分点；得益于成本控制较好，营业成本仅增长2.4%，行业营业利润高出同期收入增速0.7个百分点。 2020年，互联网企业信息服务收入共7068亿元，同比增长11.5%，增速低于上年同期11.2个百分点。互联网接入及相关服务收入447.5亿元，同比增长11.5%，增速低于上年同期20.8个百分点；互联网数据服务（包括云服务、大数据服务等）收入199.8亿元，同比增长29.5%，增速较上年同期提高3.9个百分点。 2020年，东部地区互联网业务收入11227亿元，同比增长14.8%，增速较上年同期回落9个百分点，中部地区互联网业务收入448.1亿元，同比增长3.4%，增速较上年同期回落53.1个百分点。西部地区互联网业务收入497.2亿元，同比增长6.9%，增速较上年同期回落15.2个百分点。东北地区互联网业务收入47.1亿元，同比增长9.1%。 2020年，互联网业务累计收入居前5名的广东（增长5.2%）、北京（增长21.5%）、上海（增长20.9%）、浙江（增长24.4%）和江苏（增长8.0%）共完成互联网业务收入10706亿元，同比增长15.1%，增速超过全国平均水平2.6个百分点，占全国（扣除跨地区企业）比重达87.6%，占比较上年同期提高0.8个百分点。",
 imgs:[], stem:"关于我国互联网企业业务状况，能够从上述资料中推出的有几条？ ①2019年实现利润超过1000亿元 ②2020年，互联网数据服务收入比2018年增长了不到70% ③2018年及2019年，中部地区互联网业务收入均低于西部地区",
 opts:{A:"0",B:"1",C:"2",D:"3"}, ans:"D"},

{id:"ZL082", no:"142-8", page:"142", kp:"基期比重",
 material:"2019年上半年，我国服务进出口总额达到26124.6亿元，同比增长2.6%。其中，出口总额9333.7亿元，同比增长9.0%；进口总额16790.8亿元，同比下降0.6%。服务进出口总额占对外贸易总额的比重达到15.1%，比2018年全年高出0.5个百分点。 2019年全年，我国服务进出口总额54152.9亿元，同比增长2.8%。其中，出口总额19564.0亿元，同比增长8.9%；进口总额34588.9亿元，同比减少0.4%。 2019年上半年，我国知识密集型服务进出口额8923.9亿元，同比增长9.4%，其中，知识密集型服务出口额4674.1亿元，同比增长12.1%；进口额4249.8亿元，同比增长6.5%。从具体领域看，知识产权使用费出口同比增长33.0%；电信、计算机和信息服务出口同比增长15.7%，进口同比增长19.6%；其他商业服务（含技术、专业和管理咨询服务、研发成果转让费及委托研发等）出口同比增长10.4%；金融服务出口同比增长13.9%，进口同比增长43.9%。 2019年全年，我国知识密集型服务进出口额18777.7亿元，同比增长10.8%，其中，知识密集型服务出口额9916.8亿元，同比增长13.4%；进口额8860.9亿元，同比增长8.0%。从具体领域看，个人文化娱乐服务，电信、计算机和信息服务，金融服务进出口总额分别同比增长19.4%、18.9%、18.7%。",
 imgs:[], stem:"2018年，我国对外贸易总额约为多少万亿元？",
 opts:{A:"17",B:"25",C:"36",D:"48"}, ans:"C"},

{id:"ZL083", no:"145-17", page:"144 145", kp:"现期平均数",
 material:"2022年，深圳全市绿化覆盖总面积达到101385.6公顷，比上年增长513.4公顷；其中建成区绿化覆盖面积41457.5公顷，比上年增长345.2公顷；建成区绿化覆盖率43.09%，比上年增长0.09个百分点；全市绿地面积98270.2公顷，比上年增长1.45%；其中建成区绿地面积36613.1公顷，比上年增长3.30%；建成区绿地率比上年增长0.98个百分点；全市公园绿地面积22219.0公顷，比上年增长222.5公顷，按常住人口计算人均公园绿地面积比上年增长1.13%。 2022年全市公园已达到1260个，公园总面积38209.9公顷，分别是2003年的8.6倍和5.6倍；全市公园中，有自然公园37个，比上年增加4个；城市公园191个，比上年增加4个；社区公园1032个，比上年增加14个。三级公园体系的建成，基本实现了市民出门500米可达社区公园，2公里可达城市综合圈，5公里可达自然公园的目标。全市公园绿化活动场地服务半径覆盖的居住用地面积达到21018.2公顷，较上年增长280.8公顷，公园绿化活动场地服务半径覆盖率达到90.87%，与上年持平。 2022年，全市绿道长度3119公里，比上年增长9.70%，增速较上年收窄5.78个百分点，万人拥有绿道长度1.77公里，比上年增长9.94%；绿道密度（全市绿道长度与全市面积之比）1.56公里/平方公里，居广东省首位。深圳市建成区绿化覆盖率、公园绿化活动场地服务半径覆盖率、万人拥有绿道长度3项指标已达到国家生态园林城市标准。",
 imgs:[], stem:"2022年，深圳市每万人拥有公园绿地面积约为（　）公顷。",
 opts:{A:"11.6",B:"12.1",C:"12.6",D:"无法判断"}, ans:"C"},

/* ===== 渲染 ===== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const LETTERS = ["A","B","C","D"];
const groupsOf = q => q.kp.split(",").map(s=>s.trim());

/* 考点分类顺序（依据考点映射表） */
const SECTION_ORDER = ["现期比重","现期平均数","现期倍数","增长量计算","两期比重","简单加减","一般增长率计算","一般增长率比较","增长量比较","基期比重","基期量计算","直接找数","基期平均数","两期平均数","年均增长率","间隔增长率","基期倍数","年均增长量"];
const KEY_SECTIONS = ["现期比重","现期平均数","增长量计算"];

function cardHtml(q,i){
  const kpTags = groupsOf(q).map(k=>`<span class="kp-tag">${esc(k)}</span>`).join("");
  const imgHtml = (q.imgs && q.imgs.length)
    ? `<div class="imgs">${q.imgs.map(src=>`<img src="${esc(src)}" alt="配图" loading="lazy">`).join("")}</div>` : "";
  const matHtml = `
      <div class="block">
        <span class="label label-mat">材料</span>
        <div class="content">
          ${q.material ? `<div class="mat-text">${esc(q.material)}</div>` : `<div class="mat-text" style="color:#98a2b3">（本题无文字材料，请见配图）</div>`}
          ${imgHtml}
        </div>
      </div>`;
  const optsHtml = LETTERS.map(L=>`
      <li data-q="${i}" data-k="${L}">
        <input type="radio" name="q${i}" value="${L}" id="q${i}_${L}">
        <span class="k">${L}</span><span class="v">${esc(q.opts[L])}</span>
      </li>`).join("");
  return `
    <a class="anchor" id="${esc(q.id)}"></a>
    <section class="q" id="card-${i}">
      <div class="q-head">
        <span class="badge-id">${esc(q.id)}</span>
        <span class="q-no">题号 ${esc(q.no)}</span>
        <span class="q-page">书籍页码 ${esc(q.page)}</span>
        <span class="q-kp">${kpTags}</span>
      </div>
      ${matHtml}
      <div class="block">
        <span class="label label-stem">题干</span>
        <div class="content"><div class="stem-text">${esc(q.stem)}</div></div>
      </div>
      <ul class="opts">${optsHtml}</ul>
      <div class="verdict"></div>
    </section>`;
}

function render(){
  const sheet = document.getElementById("sheet");
  const items = DATA.map((q,i)=>({q,i}));
  let html = "";
  SECTION_ORDER.forEach(sec=>{
    const members = items.filter(o=>groupsOf(o.q).includes(sec));
    if(!members.length) return;
    const primary = members.filter(o=>groupsOf(o.q)[0]===sec);
    const secondary = members.filter(o=>groupsOf(o.q)[0]!==sec);
    const keyBadge = KEY_SECTIONS.includes(sec) ? `<span class="sec-key">重点攻坚</span>` : "";
    html += `<h2 class="sec">${esc(sec)}${keyBadge}<span class="sec-n">共 ${members.length} 题</span></h2>`;
    html += primary.map(o=>cardHtml(o.q,o.i)).join("");
    if(secondary.length){
      html += `<div class="xref">↳ 交叉考点（完整题干见主分类）：` +
        secondary.map(o=>`<a href="#${esc(o.q.id)}">${esc(o.q.id)}</a>`).join("、") + `</div>`;
    }
  });
  sheet.innerHTML = html;

  sheet.querySelectorAll(".opts li").forEach(li=>{
    li.addEventListener("click", e=>{
      const i = li.dataset.q;
      const inp = li.querySelector("input");
      inp.checked = true;
      document.querySelectorAll(`.opts li[data-q="${i}"]`).forEach(x=>x.classList.remove("sel"));
      li.classList.add("sel");
      document.getElementById("card-"+i).classList.remove("right","wrong");
      document.querySelector(`#card-${i} .verdict`).textContent = "";
      updateDone();
    });
  });
}

function selectedOf(i){
  const inp = document.querySelector(`input[name="q${i}"]:checked`);
  return inp ? inp.value : "";
}
function updateDone(){
  let n = 0;
  for(let i=0;i<DATA.length;i++) if(selectedOf(i)) n++;
  document.getElementById("doneN").textContent = n;
}

/* ===== 判定正确率 ===== */
function grade(){
  let right=0, answered=0;
  DATA.forEach((q,i)=>{
    const card = document.getElementById("card-"+i);
    const v = card.querySelector(".verdict");
    const sel = selectedOf(i);
    card.classList.remove("right","wrong");
    if(!sel){ v.textContent=""; return; }
    answered++;
    if(sel === q.ans){ right++; card.classList.add("right"); v.textContent="✔ 正确"; }
    else { card.classList.add("wrong"); v.textContent="✘ 错误"; }
  });
  const rate = answered ? (right/answered*100).toFixed(1) : "0.0";
  document.getElementById("score").innerHTML =
    `已作答 <b>${answered}</b> / ${DATA.length} ｜ 正确 <b class="ok">${right}</b> ｜ 错误 <b class="bad">${answered-right}</b> ｜ 正确率 <b>${rate}%</b>`;
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ===== 清空作答 ===== */
function resetAll(){
  document.querySelectorAll(".opts li").forEach(li=>li.classList.remove("sel"));
  document.querySelectorAll('input[type="radio"]').forEach(i=>i.checked=false);
  document.querySelectorAll(".q").forEach(c=>c.classList.remove("right","wrong"));
  document.querySelectorAll(".verdict").forEach(v=>v.textContent="");
  document.getElementById("score").innerHTML = `已作答 <b id="doneN">0</b> / ${DATA.length}`;
}

/* ===== 导出作答记录（仅 编号、题号、作答记录）===== */
function exportRecords(){
  const lines = ["编号,题号,作答记录"];
  DATA.forEach((q,i)=>{
    const sel = selectedOf(i) || "";
    lines.push(`${q.id},${q.no},${sel}`);
  });
  const blob = new Blob(["\ufeff"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  a.href = url; a.download = `资料分析_作答记录_${stamp}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
updateDone();
</script>
