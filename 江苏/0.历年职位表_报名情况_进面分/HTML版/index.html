<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>江苏省考历年职位表查询 (2019-2026)</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:"Microsoft YaHei",sans-serif; background:#f0f2f5; color:#2c3e50; }
header { background:#2c3e50; color:#fff; padding:12px 20px; position:sticky; top:0; z-index:10; }
header h1 { margin:0; font-size:18px; }
header .stats { font-size:12px; color:#bdc3c7; margin-top:3px; }
.toolbar { background:#fff; padding:12px 20px; border-bottom:1px solid #ddd; position:sticky; top:54px; z-index:9; }
.toolbar input[type=text] { padding:7px 10px; width:300px; border:1px solid #ccc; border-radius:3px; font-size:13px; }
.toolbar select { padding:7px 6px; border:1px solid #ccc; border-radius:3px; font-size:13px; margin-right:8px; }
.toolbar label { font-size:13px; color:#555; margin-right:4px; }
.btn { padding:7px 14px; background:#3498db; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:13px; }
.btn:hover { background:#2980b9; }
.btn.gray { background:#95a5a6; }
.result-info { padding:8px 20px; font-size:13px; color:#666; background:#eaf2f8; }
.result-info b { color:#e74c3c; }
.quick { margin-top:8px; }
.quick a { display:inline-block; padding:3px 12px; margin-right:6px; background:#fff; border:1px solid #3498db; color:#3498db; border-radius:12px; cursor:pointer; font-size:12px; }
.quick a:hover { background:#3498db; color:#fff; }
.table-wrap { overflow-x:auto; max-height:calc(100vh - 220px); }
table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
th, td { border-bottom:1px solid #eee; padding:8px 10px; text-align:left; vertical-align:top; white-space:nowrap; }
th { background:#34495e; color:#fff; cursor:pointer; position:sticky; top:0; z-index:2; }
th:hover { background:#2c3e50; }
th .arrow { font-size:10px; }
tr:hover { background:#f5f9ff; }
/* 第一列（年份）横向固定 */
th.sticky-y, td.sticky-y { position:sticky; left:0; z-index:1; background:#fff; box-shadow:2px 0 5px rgba(0,0,0,.1); }
th.sticky-y { z-index:3; background:#34495e; }
tr:hover td.sticky-y { background:#eaf2f8; }
.pagination { padding:15px 20px; text-align:center; }
.pagination button { margin:0 3px; padding:5px 12px; border:1px solid #ccc; background:#fff; cursor:pointer; border-radius:3px; }
.pagination button.active { background:#3498db; color:#fff; border-color:#3498db; }
.pagination button:disabled { opacity:.4; cursor:default; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
.hl { background:#fff3cd; padding:0 2px; }
</style>
<style>
.js-topnav{position:fixed;top:0;left:0;right:0;height:40px;background:#12243d;display:flex;align-items:center;padding:0 14px;gap:2px;z-index:9999;overflow-x:auto;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.js-topnav a{color:#b9cde4;font-size:13px;padding:6px 12px;border-radius:6px;white-space:nowrap;text-decoration:none}
.js-topnav a:hover{background:rgba(255,255,255,.12);color:#fff}
body{padding-top:40px !important;}
</style></head>
<body><nav class="js-topnav">
<a href="../../../index.html" style="background:rgba(232,182,76,.2);color:#ffd166;font-weight:700">← 错题工作台</a><a href="../../index.html">← 江苏首页</a>
<a href="../../2.学习计划/HTML版/index.html">学习计划</a>
<a href="../../3.思维导图/HTML版/index.html">思维导图</a>
<a href="../../5.高频考点/HTML版/index.html">高频考点</a>
<a href="../../6.专项突破/HTML版/index.html">专项突破</a>
<a href="../../4.时政积累/HTML版/index.html">时政积累</a>
<a href="../../0.历年职位表_报名情况_进面分/HTML版/index.html">职位表</a>
</nav>
<header>
  <h1>江苏省考历年职位表 · 报名人数 · 进面分 (2019-2026)</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <input type="text" id="q" placeholder="搜索单位/职位/专业/简介，如：法院、会计、南京...">
  <label>年份</label><select id="fYear"><option value="">全部</option></select>
  <label>地区</label><select id="fReg"><option value="">全部</option></select>
  <label>类别</label><select id="fCat"><option value="">全部</option><option>A</option><option>B</option><option>C</option></select>
  <label>学历</label><select id="fEdu"><option value="">全部</option></select>
  <button class="btn gray" onclick="resetFilter()">重置</button>
  <div class="quick">快捷：
    <a onclick="quickSearch('管理教育')">管理教育</a>
    <a onclick="quickSearch('监狱')">监狱</a>
    <a onclick="quickSearch('戒毒')">戒毒</a>
  </div>
</div>

<div class="result-info" id="info"></div>

<div class="table-wrap">
<table>
<thead><tr>
  <th data-k="y" class="sticky-y">年份<span class="arrow"></span></th>
  <th data-k="reg">地区<span class="arrow"></span></th>
  <th data-k="unit">单位<span class="arrow"></span></th>
  <th data-k="job">职位<span class="arrow"></span></th>
  <th data-k="cat">类<span class="arrow"></span></th>
  <th data-k="n" class="num">招<span class="arrow"></span></th>
  <th data-k="edu">学历<span class="arrow"></span></th>
  <th data-k="major">专业<span class="arrow"></span></th>
  <th data-k="apply" class="num">报名<span class="arrow"></span></th>
  <th data-k="min" class="num">最低分<span class="arrow"></span></th>
  <th data-k="max" class="num">最高分<span class="arrow"></span></th>
</tr></thead>
<tbody id="tb"></tbody>
</table>
</div>

<div class="pagination" id="pg"></div>

<script src="data.js"></script>
<script>
const PER = 50;
let filtered = [], page = 0, sortK = 'y', sortDir = -1;

function uniq(key) { return [...new Set(DATA.map(r=>r[key]).filter(Boolean))].sort(); }
function fill(sel, arr) { const e=document.getElementById(sel); arr.forEach(v=>{const o=document.createElement('option');o.textContent=v;e.appendChild(o);}); }
fill('fYear', uniq('y').reverse());
fill('fReg', uniq('reg'));
fill('fEdu', uniq('edu'));

function apply() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const fy = document.getElementById('fYear').value;
  const fr = document.getElementById('fReg').value;
  const fc = document.getElementById('fCat').value;
  const fe = document.getElementById('fEdu').value;
  filtered = DATA.filter(r => {
    if (fy && r.y !== fy) return false;
    if (fr && r.reg !== fr) return false;
    if (fc && r.cat !== fc) return false;
    if (fe && r.edu !== fe) return false;
    if (q) {
      const s = (r.unit+r.job+r.major+r.desc+r.other).toLowerCase();
      if (!s.includes(q)) return false;
    }
    return true;
  });
  filtered.sort((a,b) => {
    let x=a[sortK], y=b[sortK];
    if (x==null) x=-1e9; if (y==null) y=-1e9;
    if (typeof x === 'string') return x.localeCompare(y, 'zh')*sortDir;
    return (x-y)*sortDir;
  });
  page = 0;
  render();
}

function resetFilter() {
  document.getElementById('q').value='';
  document.getElementById('fYear').value='';
  document.getElementById('fReg').value='';
  document.getElementById('fCat').value='';
  document.getElementById('fEdu').value='';
  apply();
}

function quickSearch(kw) {
  document.getElementById('q').value = kw;
  apply();
}

function esc(s) { return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function hl(text) {
  const q = document.getElementById('q').value.trim();
  if (!q) return esc(text);
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return esc(text).replace(re, '<span class="hl">$1</span>');
}

function render() {
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total/PER));
  if (page >= pages) page = pages-1;
  const slice = filtered.slice(page*PER, (page+1)*PER);
  document.getElementById('tb').innerHTML = slice.map(r => `<tr>
    <td class="sticky-y">${r.y}</td><td>${hl(r.reg)}</td><td>${hl(r.unit)}</td><td>${hl(r.job)}<br><small style="color:#888">${hl(r.desc)}</small></td>
    <td>${r.cat||''}</td><td class="num">${r.n??''}</td><td>${esc(r.edu)}</td><td style="max-width:280px">${hl(r.major)}</td>
    <td class="num">${r.apply??''}</td><td class="num">${r.min??''}</td><td class="num">${r.max??''}</td>
  </tr>`).join('');
  // 汇总
  const sumN = filtered.reduce((s,r)=>s+(r.n||0),0);
  const sumApply = filtered.reduce((s,r)=>s+(r.apply||0),0);
  document.getElementById('info').innerHTML = `共 <b>${total.toLocaleString()}</b> 条结果 · 合计招考 <b>${sumN.toLocaleString()}</b> 人 · 合计报名 <b>${sumApply.toLocaleString()}</b> 人 · 第 ${page+1}/${pages} 页`;
  document.getElementById('stats').textContent = `全库 ${DATA.length.toLocaleString()} 条职位记录 · 2019-2026 · 8 个年度`;
  // 分页
  let ph = `<button onclick="page=0;render()" ${page===0?'disabled':''}>« 首页</button>`;
  ph += `<button onclick="page--;render()" ${page===0?'disabled':''}>上一页</button>`;
  const start = Math.max(0, page-3), end = Math.min(pages-1, page+3);
  for (let i=start; i<=end; i++) ph += `<button class="${i===page?'active':''}" onclick="page=${i};render()">${i+1}</button>`;
  ph += `<button onclick="page++;render()" ${page>=pages-1?'disabled':''}>下一页</button>`;
  ph += `<button onclick="page=${pages-1};render()" ${page>=pages-1?'disabled':''}>末页 »</button>`;
  document.getElementById('pg').innerHTML = ph;
  // 排序箭头
  document.querySelectorAll('th').forEach(th => {
    th.querySelector('.arrow').textContent = th.dataset.k===sortK ? (sortDir>0?' ▲':' ▼') : '';
  });
}

document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  if (sortK===k) sortDir*=-1; else { sortK=k; sortDir = (k==='y'||k==='reg') ? 1 : -1; }
  apply();
}));
['q','fYear','fReg','fCat','fEdu'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', apply);
  el.addEventListener('change', apply);
});
apply();
</script>
</body>
</html>
