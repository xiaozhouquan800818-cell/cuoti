"D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"54%","trap":"B","sol":"根据题干\"2022年……每只存续理财产品平均存续金额……\"，结合材料时间为2022年，可判定本题为现期平均数问题。定位文字材料第二段可得：截至2022年底，理财公司存续产品13947只，存续规模22.24万亿元；城商行存续产品9064只，存续规模2.45万亿元；股份制银行存续产品1208只，存续规模0.88万亿元；大型银行存续产品668只，存续规模0.92万亿元。根据每只存续理财产品平均存续金额$=\\frac{存续规模}{存续产品数量}$，则2022年下列机构每只存续理财产品平均存续金额分别为：理财公司，$\\frac{22.24万亿元}{13947只}\\approx\\frac{22.24\\times 10^{4}亿元}{13900只}=16$亿元/只；城商行，$\\frac{2.45万亿元}{9064只}\\approx\\frac{2.45\\times 10^{4}亿元}{9060只}=2^{+}$亿元/只；股份制银行，$\\frac{0.88万亿元}{1208只}\\approx\\frac{0.88\\times 10^{4}亿元}{1210只}=7^{+}$亿元/只；大型银行，$\\frac{0.92万亿元}{668只}=\\frac{0.92\\times 10^{4}亿元}{668只}=13^{+}$亿元/只。比较可知，2022年不同机构每只存续理财产品平均存续金额从大到小排前三名的是理财公司、大型银行、股份制银行。\n\n故正确答案为D。","point":"现期平均数；文字资料","src":"2024年青海省公务员录用考试《行测》题（网友回忆版）第116题","bimgs":["book/131.webp","book/132.webp"],"setno":1,"qno":3,"p0":"132","setTxt":"文字·提升进阶 第1套","gid":47},{"no":"ZL-066","sec":"文字资料","cat":"文字资料","qh":"132-4","page":"131 132","bsec":"文字","bpart":"提升进阶","mat":"2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上 年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。 截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下 降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模 22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降 32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只， 存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其 他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。 截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为 95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二 级（稳健型）的投资者，占比35.44%。","imgs":[],"stem":"以存续规模计算市场份额，2022年理财公司存续理财产品的市场份额是2021年理财公司的多少倍？","opts":{"A":"0.45","B":"0.78","C":"1.36","D":"1.56"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"71%","trap":"B","sol":"根据题干\"……2022年……是2021年……的多少倍\"，结合材料时间为2022年，可判定本题为现期倍数问题。定位文字材料第二段可得：截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，存续规模同比下降4.66%（b）。分机构类型来看，理财公司存续规模同比增长29.36%（a）。以存续规模计算市场份额，理财公司存续理财产品的市场份额为其存续规模占全国存续规模的比重。根据公式：现期比重$=\\frac{A}{B}$，基期比重$=\\frac{A}{B}\\times\\frac{1+b}{1+a}$，则所求倍数\n\n$$=\\frac{A}{B}\\div\\left(\\frac{A}{B}\\times\\frac{1+b}{1+a}\\right)=\\frac{1+a}{1+b}=\\frac{1+29.36\\%}{1+(-4.66\\%)}\\approx 1.2936+1.3\\times 5\\%\\approx 1.36\\ \\text{倍}$$\n\n。\n\n故正确答案为C。","point":"现期倍数；文字资料","src":"2024年河北省公务员录用考试《行测》题（网友回忆版）第128题","bimgs":["book/131.webp","book/132.webp"],"setno":1,"qno":4,"p0":"132","setTxt":"文字·提升进阶 第1套","gid":47},{"no":"ZL-067","sec":"文字资料","cat":"文字资料","qh":"132-5","page":"131 132","bsec":"文字","bpart":"提升进阶","mat":"2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%，降幅比上 年同期扩大7.22个百分点；累计募集资金89.62万亿元，同比减少32.57万亿元。 截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，同比下 降4.41%；存续规模27.65万亿元，同比下降4.66%。分机构类型来看，理财公司存续产品13947只，存续规模 22.24万亿元，同比增长29.36%。银行机构中，城商行存续产品9064只，存续规模2.45万亿元，同比下降 32.34%；农村金融机构存续产品7808只，存续规模1.09万亿元，同比下降2.63%；股份制银行存续产品1208只， 存续规模0.88万亿元，同比下降82.99%；大型银行存续产品668只，存续规模0.92万亿元，同比下降49.26%；其 他机构存续产品1980只，存续规模0.07万亿元，同比下降13.42%。 截至2022年底，持有理财产品的投资者数量为9671.27万个，较年初增长18.96%，其中机构投资者数量为 95.95万个，数量占比同比提升了0.22个百分点；在持有理财产品的个人投资者中，数量最多的是风险偏好为二 级（稳健型）的投资者，占比35.44%。","imgs":[],"stem":"能够从上述资料中推出的是：","opts":{"A":"2021年持有理财产品的个人投资者数量占比为98.88%","B":"2022年新发理财产品中平均每只产品募集资金低于2021年","C":"2022年城商行存续产品存续金额在银行机构存续产品中比例为8.85%","D":"2022年持有理财产品的个人投资者中风险偏好为二级的数量约为3393万个"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"47%","trap":"C","sol":"- A项：定位文字材料第三段可得：截至2022年底，持有理财产品的投资者数量为9671.27万个，其中机构投资者数量为95.95万个，数量占比同比提升了0.22个百分点。根据公式：比重$=\\frac{部分}{整体}$，则2021年机构投资者数量占持有理财产品的投资者数量的比重为$\\frac{95.95}{9671.27}-0.22\\%=1\\%^{-}-0.22\\%=0.78\\%^{-}$，故2021年持有理财产品的个人投资者数量占比>1-0.78%=99.22%，不可能为98.88%，错误；\n- B项：定位文字材料第一段可得：2022年，全国共有260家银行机构和29家理财公司累计新发理财产品2.94万只，同比下降38.23%（b）；累计募集资金89.62万亿元，同比减少32.57万亿元。根据公式：增长率$=\\frac{增长量}{现期量-增长量}$，则累计募集资金同比增速\n\n  $$a=\\frac{-32.57}{89.62+32.57}\\approx\\frac{-32.57}{122}\\approx -26.7\\%$$\n\n  。根据两期平均数比较结论：当a>b时，平均数上升，-26.7%>-38.23%，则2022年新发理财产品中平均每只产品募集资金高于2021年，错误；\n- C项：定位文字材料第二段可得：截至2022年底，全国共有278家银行机构和29家理财公司有存续的理财产品，共存续产品3.47万只，存续规模27.65万亿元。分机构类型来看，理财公司存续产品13947只，存续规模22.24万亿元。银行机构中，城商行存续产品9064只，存续规模2.45万亿元。根据公式：比重$=\\frac{部分}{整体}$，则2022年城商行存续产品存续金额在银行机构存续产品中比例\n\n  $$=\\frac{2.45}{27.65-22.24}=\\frac{2.45}{5.41}=40\\%^{+}$$\n\n  ，远高于8.85%，错误；\n- D项：定位文字材料第三段可得：截至2022年底，持有理财产品的投资者数量为9671.27万个，其中机构投资者数量为95.95万个，在持有理财产品的个人投资者中，数量最多的是风险偏好为二级（稳健型）的投资者，占比35.44%。根据公式：部分=整体×比重，则2022年持有理财产品的个人投资者中风险偏好为二级的数量$=(9671.27-95.95)\\times 35.44\\%\\approx 9575.32\\times 35.4\\%\\approx 3390$万个，非常接近于3393万个，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2024年青海省公务员录用考试《行测》题（网友回忆版）第119题","bimgs":["book/131.webp","book/132.webp"],"setno":1,"qno":5,"p0":"132","setTxt":"文字·提升进阶 第1套","gid":47},{"no":"ZL-068","sec":"文字资料","cat":"文字资料","qh":"133-7","page":"132 133","bsec":"文字","bpart":"提升进阶","mat":"哨点医院ILI%监测情况 本周哨点医院共报告流感样病例总数为5187例，比上周增加4.49%，比去年同期减少56.16%，其中国家级 哨点医院455例，比上周减少6.57%，比去年同期减少55.04%。城区哨点医院1899例，比上周减少19.40%，比去 年同期减少55.46%；郊区、县（市）哨点医院3288例，比上周增加26.07%，比去年同期减少56.55%。本周全市 哨点医院ILI%为5.98%，比上周低0.07个百分点，其中国家级哨点医院ILI%为2.12%，比上周高0.23个百分点。 城区哨点医院ILI%为4.45%，比上周低0.56个百分点；郊区、县（市）哨点医院ILI%为7.46%，比上周高0.01个 百分点。 （二）哨点医院ILI%纵向比较 2023年第14周全市哨点医院ILI%为5.98%，比2022年同期低7.56个百分点，比2021年同期低0.66个百分点， 其中国家级哨点医院ILI%为2.12%，比2022年同期低3.36个百分点，比2021年同期低4.67个百分点。城区哨点医 院ILI%为4.45%，比2022年同期低6.81个百分点，比2021年同期低2.08个百分点；郊区、县（市）哨点医院ILI% 为7.46%，比2022年同期低7.82个百分点，比2021年同期高0.54个百分点。 （三）各年龄组流感样病例构成情况 2023年第14周各年龄组报告的流感样病例构成情况为：0~4岁组1472例，5~14岁组1103例，15~24岁组406 例，25~59岁组1266例，60岁以上组940例。","imgs":[],"stem":"2023年第13周，H市郊区、县（市）哨点医院报告流感样病例约是城区的多少倍？","opts":{"A":"1.7","B":"1.5","C":"1.3","D":"1.1"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"64%","trap":"A","sol":"根据题干\"2023年第13周……约是……的多少倍\"，结合材料时间为2023年第14周，可判定本题为基期倍数问题。定位材料第二段可得：（2023年第14周）本周哨点医院共报告流感样病例总数为5187例，城区哨点医院1899例（B），比上周减少19.40%（b），郊区、县（市）哨点医院3288例（A），比上周增加26.07%（a）。根据公式：基期倍数$=\\frac{A}{B}\\times\\frac{1+b}{1+a}$，则题干所求\n\n$$=\\frac{3288}{1899}\\times\\frac{1-19.40\\%}{1+26.07\\%}\\approx\\frac{3300}{1900}\\times\\frac{0.81}{1.3}\\approx 1.7\\times 0.6=1.02$$\n\n，与D项最接近。\n\n故正确答案为D。","point":"基期倍数；文字资料","src":"2024年浙江省公务员录用考试《行测》题（A类）（网友回忆版）第121题","bimgs":["book/132.webp","book/133.webp"],"setno":1,"qno":7,"p0":"133","setTxt":"文字·提升进阶 第1套","gid":48},{"no":"ZL-069","sec":"文字资料","cat":"文字资料","qh":"133-9","page":"132 133","bsec":"文字","bpart":"提升进阶","mat":"哨点医院ILI%监测情况 本周哨点医院共报告流感样病例总数为5187例，比上周增加4.49%，比去年同期减少56.16%，其中国家级 哨点医院455例，比上周减少6.57%，比去年同期减少55.04%。城区哨点医院1899例，比上周减少19.40%，比去 年同期减少55.46%；郊区、县（市）哨点医院3288例，比上周增加26.07%，比去年同期减少56.55%。本周全市 哨点医院ILI%为5.98%，比上周低0.07个百分点，其中国家级哨点医院ILI%为2.12%，比上周高0.23个百分点。 城区哨点医院ILI%为4.45%，比上周低0.56个百分点；郊区、县（市）哨点医院ILI%为7.46%，比上周高0.01个 百分点。 （二）哨点医院ILI%纵向比较 2023年第14周全市哨点医院ILI%为5.98%，比2022年同期低7.56个百分点，比2021年同期低0.66个百分点， 其中国家级哨点医院ILI%为2.12%，比2022年同期低3.36个百分点，比2021年同期低4.67个百分点。城区哨点医 院ILI%为4.45%，比2022年同期低6.81个百分点，比2021年同期低2.08个百分点；郊区、县（市）哨点医院ILI% 为7.46%，比2022年同期低7.82个百分点，比2021年同期高0.54个百分点。 （三）各年龄组流感样病例构成情况 2023年第14周各年龄组报告的流感样病例构成情况为：0~4岁组1472例，5~14岁组1103例，15~24岁组406 例，25~59岁组1266例，60岁以上组940例。","imgs":[],"stem":"2022年第14周，H市哨点医院监测门诊就诊病人总数约多少例？","opts":{"A":"87000","B":"89000","C":"91000","D":"93000"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"D","a2":null,"rate":"45%","trap":"B","sol":"根据题干\"2022年第14周……约多少例\"，结合材料时间为2023年第14周，且材料中给出了2023年第14周H市哨点医院共报告流感样病例总数和流感样病例的就诊比例（ILI%）及其同比变化情况，可判定本题为基期比重问题。定位材料第二段可得：（2023年第14周，H市）哨点医院共报告流感样病例总数为5187例，比去年同期减少56.16%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，则2022年第14周，H市哨点医院共报告流感样病例总数\n\n$$=\\frac{5187}{1-56.16\\%}\\approx\\frac{5187}{0.438}=11800^{+}\\ \\text{例}$$\n\n；定位材料第三段可得：2023年第14周全市哨点医院ILI%（流感样病例的就诊比例）为5.98%，比2022年同期低7.56个百分点。则2022年第14周全市哨点医院ILI%（流感样病例的就诊比例）=5.98%+7.56%=13.54%。根据公式：整体$=\\frac{部分}{比重}$，则题干所求\n\n$$=\\frac{11800^{+}}{13.54\\%}\\approx\\frac{11800^{+}}{0.135}=87000^{+}\\ \\text{例}$$\n\n，对应A项。\n\n故正确答案为A。","point":"基期比重；文字资料","src":"2024年浙江省公务员录用考试《行测》题（A类）（网友回忆版）第123题","bimgs":["book/132.webp","book/133.webp"],"setno":1,"qno":9,"p0":"133","setTxt":"文字·提升进阶 第1套","gid":48},{"no":"ZL-070","sec":"文字资料","cat":"文字资料","qh":"133-10","page":"132 133 134","bsec":"文字","bpart":"提升进阶","mat":"哨点医院ILI%监测情况 本周哨点医院共报告流感样病例总数为5187例，比上周增加4.49%，比去年同期减少56.16%，其中国家级 哨点医院455例，比上周减少6.57%，比去年同期减少55.04%。城区哨点医院1899例，比上周减少19.40%，比去 年同期减少55.46%；郊区、县（市）哨点医院3288例，比上周增加26.07%，比去年同期减少56.55%。本周全市 哨点医院ILI%为5.98%，比上周低0.07个百分点，其中国家级哨点医院ILI%为2.12%，比上周高0.23个百分点。 城区哨点医院ILI%为4.45%，比上周低0.56个百分点；郊区、县（市）哨点医院ILI%为7.46%，比上周高0.01个 百分点。 （二）哨点医院ILI%纵向比较 2023年第14周全市哨点医院ILI%为5.98%，比2022年同期低7.56个百分点，比2021年同期低0.66个百分点， 其中国家级哨点医院ILI%为2.12%，比2022年同期低3.36个百分点，比2021年同期低4.67个百分点。城区哨点医 院ILI%为4.45%，比2022年同期低6.81个百分点，比2021年同期低2.08个百分点；郊区、县（市）哨点医院ILI% 为7.46%，比2022年同期低7.82个百分点，比2021年同期高0.54个百分点。 （三）各年龄组流感样病例构成情况 2023年第14周各年龄组报告的流感样病例构成情况为：0~4岁组1472例，5~14岁组1103例，15~24岁组406 例，25~59岁组1266例，60岁以上组940例。","imgs":[],"stem":"能够从上述材料中推出的是：","opts":{"A":"从2021年到2023年，H市第14周哨点医院ILI%逐年上升","B":"2023年第14周，H市哨点医院报告流感样病例同比减少超过6000例","C":"2023年第13周，H市国家级哨点医院报告流感样病例占全市比例超过10%","D":"2023年第14周H市哨点医院报告流感样病例中，占比低于20%的年龄组有3个"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"50%","trap":"C","sol":"- A项：定位材料第三段可得：2023年第14周H市哨点医院ILI%为5.98%，比2022年同期低7.56个百分点，比2021年同期低0.66个百分点。因2023年第14周H市哨点医院ILI%比2022年同期低，故并非逐年上升，错误；\n- B项：定位材料第二段可得：2023年第14周H市哨点医院共报告流感样病例总数为5187例，比去年同期减少56.16%。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，则2023年第14周，H市哨点医院报告流感样病例同比减少量\n\n  $$=\\frac{5187}{1-56.16\\%}\\times 56.16\\%\\approx\\frac{5200\\times 56}{44}=5200\\times 1.2^{+}\\ \\text{例}$$\n\n  ，即减少超过6000例，正确；\n- C项：定位材料第二段可得：2023年第14周H市哨点医院共报告流感样病例总数为5187例（B），比上周增加4.49%（b），其中国家级哨点医院455例（A），比上周减少6.57%（a）。根据公式：基期比重$=\\frac{A}{B}\\times\\frac{1+b}{1+a}$，则2023年第13周，H市国家级哨点医院报告流感样病例占全市比例\n\n  $$=\\frac{455}{5187}\\times\\frac{1+4.49\\%}{1-6.57\\%}\\approx\\frac{460\\times\\frac{1.04}{0.934}}{5187}\\approx\\frac{460\\times 1.1}{5187}=\\frac{506}{5187}\u003c10\\%$$\n\n  ，错误；\n- D项：定位材料第二、四段可得：2023年第14周H市哨点医院共报告流感样病例总数为5187例；各年龄组报告的流感样病例构成情况为：0~4岁组1472例，5~14岁组1103例，15~24岁组406例，25~59岁组1266例，60岁以上组940例。根据公式：部分=整体×比重，$5187\\times 20\\%=1037.4$例，则2023年第14周H市哨点医院报告流感样病例中，占比低于20%的年龄组即流感样病例低于1037.4例的年龄组有15~24岁组（406例）、60岁以上组（940例），共2个，错误。\n\n故正确答案为B。","point":"综合分析；文字资料","src":"2024年浙江省公务员录用考试《行测》题（A类）（网友回忆版）第124题","bimgs":["book/132.webp","book/133.webp","book/134.webp"],"setno":1,"qno":10,"p0":"133","setTxt":"文字·提升进阶 第1套","gid":48},{"no":"ZL-071","sec":"文字资料","cat":"文字资料","qh":"134-12","page":"134","bsec":"文字","bpart":"提升进阶","mat":"2019年A市专利密集型产业实现增加值6918.8亿元，比上年增长9.6%，分别高于战略性新兴产业、高技术 产业增加值增速2.3个和1.7个百分点；专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。 2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，比规模以上重点企业高5.1个百分 点。专利密集型产业每亿元R&D经费产生的发明专利申请量为73.1件，比规模以上重点企业高3.6件；企业户均 拥有有效发明专利15.6件，是规模以上重点企业的2.2倍。从成果转化看，已被成功实施的发明专利数为5.2万 件，占有效发明专利数的58.4%。 在专利密集型产业中，2019年信息通信技术服务业实现营业收入10198.5亿元，增速达41.3%；实现利润 197.6亿元，比上年增长1倍；单位企业实现营业收入12亿元，是专利密集型产业平均水平的3.3倍。 在专利密集型产业中，2019年医药医疗产业营业收入、利润分别增长13.7%和5%；收入利润率达到17%， 高于专利密集型产业平均水平4.1个百分点；单位企业营业收入、利润分别为4.5亿元和0.76亿元。","imgs":[],"stem":"现已知2019年A市①专利密集型产业专利申请总量、②专利密集型产业R&D经费占专利密集型产业实现增加值的比重。如果想得到当年A市专利密集型产业发明专利申请量的数值，下列说法正确的是：","opts":{"A":"补充①可以得到，补充②不可以得到","B":"补充①不可以得到，补充②可以得到","C":"补充①和②中任一条可以得到","D":"①和②两条相加才可以得到"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"50%","trap":"A","sol":"根据题干\"2019年……占……的比重……得到当年A市专利密集型产业发明专利申请量\"，结合材料给出\"专利密集型产业发明专利申请量占……的比重\"，可判定本题为现期比重计算问题。定位文字材料第一段可得：2019年A市专利密集型产业实现增加值6918.8亿元；定位文字材料第二段可得：2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，专利密集型产业每亿元R&D经费产生的发明专利申请量为73.1件。\n\n令条件①所述量为A件，根据部分=总体×比重，可得A市专利密集型产业发明专利申请量=A×66%件。\n\n令条件②所述比重为m，根据部分=总体×比重，可得A市专利密集型产业R&D经费为6918.8m亿元；由于专利密集型产业每亿元R&D经费产生的发明专利申请量$=\\frac{发明专利申请量}{R\\&D经费}$，故发明专利申请量为$73.1\\times 6918.8m$件。\n\n补充①和②中任意一条都可以得到。\n\n故正确答案为C。","point":"现期比重计算；文字资料","src":"2022年北京市公务员录用考试《行测》题（网友回忆版）第126题","bimgs":["book/134.webp"],"setno":1,"qno":12,"p0":"134","setTxt":"文字·提升进阶 第1套","gid":49},{"no":"ZL-072","sec":"文字资料","cat":"文字资料","qh":"135-14","page":"134 135","bsec":"文字","bpart":"提升进阶","mat":"2019年A市专利密集型产业实现增加值6918.8亿元，比上年增长9.6%，分别高于战略性新兴产业、高技术 产业增加值增速2.3个和1.7个百分点；专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。 2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，比规模以上重点企业高5.1个百分 点。专利密集型产业每亿元R&D经费产生的发明专利申请量为73.1件，比规模以上重点企业高3.6件；企业户均 拥有有效发明专利15.6件，是规模以上重点企业的2.2倍。从成果转化看，已被成功实施的发明专利数为5.2万 件，占有效发明专利数的58.4%。 在专利密集型产业中，2019年信息通信技术服务业实现营业收入10198.5亿元，增速达41.3%；实现利润 197.6亿元，比上年增长1倍；单位企业实现营业收入12亿元，是专利密集型产业平均水平的3.3倍。 在专利密集型产业中，2019年医药医疗产业营业收入、利润分别增长13.7%和5%；收入利润率达到17%， 高于专利密集型产业平均水平4.1个百分点；单位企业营业收入、利润分别为4.5亿元和0.76亿元。","imgs":[],"stem":"在专利密集型产业中，2019年A市信息通信技术服务业单位企业实现利润额约为多少亿元？","opts":{"A":"0.18","B":"0.23","C":"0.35","D":"0.59"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"61%","trap":"C","sol":"根据题干\"……2019年……单位企业实现利润额约为多少亿元\"，结合材料时间为2019年，可判定本题为现期平均数问题。定位文字材料第三段可知，（A市）2019年信息通信技术服务业实现营业收入10198.5亿元，实现利润197.6亿元；单位企业实现营业收入12亿元。根据个数$=\\frac{总数}{平均数}$，则2019年A市有信息通信技术服务业企业数$\\frac{10198.5}{12}$家；根据平均数$=\\frac{总数}{个数}$，则2019年A市信息通信技术服务业单位企业实现利润额为\n\n$$\\frac{197.6}{\\frac{10198.5}{12}}\\approx\\frac{200\\times 12}{10000}=0.24\\ \\text{亿元}$$\n\n，与B项最接近。\n\n故正确答案为B。","point":"现期平均数；文字资料","src":"2022年北京市公务员录用考试《行测》题（网友回忆版）第128题","bimgs":["book/134.webp","book/135.webp"],"setno":1,"qno":14,"p0":"135","setTxt":"文字·提升进阶 第1套","gid":49},{"no":"ZL-073","sec":"文字资料","cat":"文字资料","qh":"135-15","page":"134 135","bsec":"文字","bpart":"提升进阶","mat":"2019年A市专利密集型产业实现增加值6918.8亿元，比上年增长9.6%，分别高于战略性新兴产业、高技术 产业增加值增速2.3个和1.7个百分点；专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。 2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%，比规模以上重点企业高5.1个百分 点。专利密集型产业每亿元R&D经费产生的发明专利申请量为73.1件，比规模以上重点企业高3.6件；企业户均 拥有有效发明专利15.6件，是规模以上重点企业的2.2倍。从成果转化看，已被成功实施的发明专利数为5.2万 件，占有效发明专利数的58.4%。 在专利密集型产业中，2019年信息通信技术服务业实现营业收入10198.5亿元，增速达41.3%；实现利润 197.6亿元，比上年增长1倍；单位企业实现营业收入12亿元，是专利密集型产业平均水平的3.3倍。 在专利密集型产业中，2019年医药医疗产业营业收入、利润分别增长13.7%和5%；收入利润率达到17%， 高于专利密集型产业平均水平4.1个百分点；单位企业营业收入、利润分别为4.5亿元和0.76亿元。","imgs":[],"stem":"关于A市专利密集型产业发展状况，能够从上述资料中推出的是：","opts":{"A":"2018年增加值占全市GDP比重为19.9%","B":"2019年发明专利申请量比非发明专利申请量高一倍以上","C":"2018年信息通信技术服务业实现利润超过100亿元","D":"2019年医药医疗产业利润占营业收入的比重低于上年水平"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"B","a2":null,"rate":"74%","trap":"B","sol":"- A项：定位文字材料第一段可得：2019年A市专利密集型产业增加值占GDP的比重为19.5%，比上年提高0.4个百分点。故2018年A市专利密集型产业增加值占GDP的比重为19.5%-0.4%=19.1%，错误；\n- B项：定位文字材料第二段可得：2019年专利密集型产业发明专利申请量占专利申请总量的比重为66%。则2019年非发明专利申请量占专利申请总量的比重为1-66%=34%；故所求为\n\n  $$\\frac{专利申请总量\\times 66\\%}{专利申请总量\\times 34\\%}-1=2^{-}-1=1^{-}\\ \\text{倍}$$\n\n  ，即2019年发明专利申请量比非发明专利申请量高不到一倍，错误；\n- C项：定位文字材料第三段可得：2019年信息通信技术服务业实现利润197.6亿元，比上年增长1倍。故2018年信息通信技术服务业实现利润为$\\frac{197.6}{1+1}\u003c100$亿元，错误；\n- D项：定位文字材料第四段可得：2019年医药医疗产业营业收入、利润分别增长13.7%（b）和5%（a）。5%\u003c13.7%，结合两期比重比较结论\"部分增长率（a）\u003c总体增长率（b），比重下降\"，可得2019年医药医疗产业利润占营业收入的比重低于上年水平，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2022年北京市公务员录用考试《行测》题（网友回忆版）第130题","bimgs":["book/134.webp","book/135.webp"],"setno":1,"qno":15,"p0":"135","setTxt":"文字·提升进阶 第1套","gid":49},{"no":"ZL-074","sec":"文字资料","cat":"文字资料","qh":"135-16","page":"135","bsec":"文字","bpart":"提升进阶","mat":"2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降 5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装 及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。 2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为 563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织 品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。 2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制 品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其 他纺织制品出口额为517.2亿美元，同比增长27.5%。 2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长 17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。","imgs":[],"stem":"2020年，全国服装出口额比2019年：","opts":{"A":"增长了10%以上","B":"下降了10%以上","C":"增长了不到10%","D":"下降了不到10%"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"B","a2":null,"rate":"57%","trap":"C","sol":"根据题干\"2020年……比2019年\"，结合选项为增长/下降+百分数，且材料给出2021年全国服装出口额的同比增速以及相对于2019年的增速，可判定本题为间隔增长率问题。定位文字材料第一段可得：2021年，全国服装出口1702.8亿美元，同比增长24.0%（$r_{1}$），较2019年增长16.0%（$r_{间}$）。根据公式：$r_{间}=r_{1}+r_{2}+r_{1}\\times r_{2}$，代入数据则有\n\n$$16.0\\%=24.0\\%+r_{2}+24.0\\%\\times r_{2}$$\n\n，解得$r_{2}=\\frac{-8\\%}{1.24}\\approx -6.5\\%$，即下降了不到10%。\n\n故正确答案为D。","point":"间隔增长率；文字资料","src":"2023年国家公务员录用考试《行测》题（副省级网友回忆版）第131题","bimgs":["book/135.webp"],"setno":1,"qno":16,"p0":"135","setTxt":"文字·提升进阶 第1套","gid":50},{"no":"ZL-075","sec":"文字资料","cat":"文字资料","qh":"136-17","page":"135 136","bsec":"文字","bpart":"提升进阶","mat":"2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降 5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装 及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。 2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为 563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织 品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。 2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制 品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其 他纺织制品出口额为517.2亿美元，同比增长27.5%。 2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长 17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。","imgs":[],"stem":"2021年，全国针织、梭织服装及衣着附件总出口额约占纺织品服装出口总额的：","opts":{"A":"55%","B":"50%","C":"45%","D":"40%"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"76%","trap":"C","sol":"根据题干\"2021年，全国……约占……的\"，结合材料时间为2021年，可判定本题为现期比重问题。定位文字材料第一段可得：2021年，全国纺织品服装出口3155亿美元……其中，针织服装及衣着附件出口864.8亿美元……梭织服装及衣着附件出口701.2亿美元。根据公式：比重$=\\frac{部分}{整体}$，可得所求比重\n\n$$=\\frac{864.8+701.2}{3155}\\approx\\frac{1566}{3160}\\approx 50\\%$$\n\n。\n\n故正确答案为B。","point":"现期比重；文字资料","src":"2023年国家公务员录用考试《行测》题（副省级网友回忆版）第132题","bimgs":["book/135.webp","book/136.webp"],"setno":1,"qno":17,"p0":"136","setTxt":"文字·提升进阶 第1套","gid":50},{"no":"ZL-076","sec":"文字资料","cat":"文字资料","qh":"136-19","page":"135 136","bsec":"文字","bpart":"提升进阶","mat":"2021年，全国纺织品服装出口3155亿美元，同比增长8.4%。其中，纺织品出口1452.2亿美元，同比下降 5.6%，较2019年增长22.0%；服装出口1702.8亿美元，同比增长24.0%，较2019年增长16.0%。其中，针织服装 及衣着附件出口864.8亿美元，同比增长39.0%；梭织服装及衣着附件出口701.2亿美元，同比增长12.6%。 2021年，中国对美国、东盟、欧盟和日本的纺织品服装出口合计1724.9亿美元。其中，对美国出口额为 563.5亿美元，同比增长4.0%；向东盟十国出口纺织品服装491.2亿美元，同比增长24.9%；对欧盟27国出口纺织 品服装469.9亿美元，同比下降11.1%；对日本出口纺织品服装200.3亿美元，同比下降7.2%。 2021年，中国向全球出口纺织纱线138亿美元，出口织物667亿美元，分别同比增长41.5%和34.3%。纺织制 品当中，防疫类口罩出口额为129.5亿美元，出口金额、数量同比分别下降76.0%和13.0%。除防疫类口罩外，其 他纺织制品出口额为517.2亿美元，同比增长27.5%。 2021年，中国向“一带一路”沿线国家出口纺织品服装1137.9亿美元，同比增长24.5%，较2019年增长 17.3%；同时，中国自“一带一路”沿线国家进口纺织品服装131.6亿美元，同比增长24.5%。","imgs":[],"stem":"2020年中国出口的纺织制品总额中，防疫类口罩出口额占比约为：","opts":{"A":"57%","B":"72%","C":"33%","D":"45%"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"47%","trap":"C","sol":"根据题干\"2020年……占比……\"，结合材料时间为2021年，可判定本题为基期比重问题。定位文字材料第三段可知：2021年……纺织制品当中，防疫类口罩出口额为129.5亿美元，出口金额同比下降76.0%。除防疫类口罩外，其他纺织制品出口额为517.2亿美元，同比增长27.5%。根据公式：基期量$=\\frac{现期量}{1+r}$，可得2020年防疫类口罩出口额$=\\frac{129.5}{1-76.0\\%}\\approx 540$亿美元；2020年其他纺织制品出口额$=\\frac{517.2}{1+27.5\\%}\\approx 410$亿美元。根据公式：比重$=\\frac{部分}{整体}$，可得所求$=\\frac{540}{540+410}=\\frac{540}{950}=50\\%^{+}$。\n\n故正确答案为A。","point":"基期比重；文字资料","src":"2023年国家公务员录用考试《行测》题（副省级网友回忆版）第133题","bimgs":["book/135.webp","book/136.webp"],"setno":1,"qno":19,"p0":"136","setTxt":"文字·提升进阶 第1套","gid":50},{"no":"ZL-077","sec":"文字资料","cat":"文字资料","qh":"137-3","page":"136 137","bsec":"文字","bpart":"提升进阶","mat":"2021年上半年，S市工业战略性新兴产业总产值7164.68亿元，比去年同期增长19.6%，两年平均增长 12.3%。其中，新能源汽车、新能源和高端装备产值同比分别增长2.5倍、32.1%和24.5%。 2021年上半年，全市第三产业增加值15080.35亿元，比去年同期增长11.3%。其中，信息传输、软件和信息 技术服务业增加值1770.06亿元，比去年同期增加245.5亿元；批发和零售业增加值2428.92亿元，同比增长 15.2%；金融业增加值3842.65亿元，比去年同期增加274.7亿元；房地产业增加值1812.18亿元，同比增长 13.6%。 2021年上半年，全市社会消费品零售总额9048.44亿元，比去年同期增加了2104.14亿元。分行业看，批发 和零售业零售额8287.13亿元，同比增长28.4%；住宿和餐饮业零售额761.31亿元，同比增长54.0%。2021年上半 年，全市网上商店零售额1485.72亿元，比去年同期增加259.92亿元。 2021年上半年，全市新建商品房销售面积832.83万平方米，比去年同期增长29.2%。其中，新建商品住宅销 售面积667.94万平方米，同比增长23.0%。","imgs":[],"stem":"2021年上半年，S市批发和零售业零售额同比增量约是住宿和餐饮业的多少倍？","opts":{"A":"3","B":"5","C":"7","D":"9 （四）"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"63%","trap":"B","sol":"根据题干\"2021年上半年……约是……的多少倍\"，可判定本题为现期倍数问题。定位文字材料第三段可得：2021年上半年，批发和零售业零售额8287.13亿元，同比增长28.4%；住宿和餐饮业零售额761.31亿元，同比增长54.0%。根据公式：增长量$=\\frac{现期量}{1+r}\\times r$，可得2021年上半年，批发和零售业零售额的同比增长量为$\\frac{8287.13}{1+28.4\\%}\\times 28.4\\%\\approx\\frac{8287.13}{1+\\frac{1}{3.5}}\\times\\frac{1}{3.5}=\\frac{8287.13}{4.5}\\approx 1842$亿元，住宿和餐饮业零售额的同比增长量为$\\frac{761.31}{1+54.0\\%}\\times 54.0\\%\\approx\\frac{761.31}{1+\\frac{1}{1.9}}\\times\\frac{1}{1.9}=\\frac{761.31}{2.9}\\approx 263$亿元，则所求倍数为$\\frac{1842}{263}\\approx 7$倍。\n\n故正确答案为C。","point":"现期倍数；文字资料","src":"2023年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第7题","bimgs":["book/136.webp","book/137.webp"],"setno":2,"qno":3,"p0":"137","setTxt":"文字·提升进阶 第2套","gid":51},{"no":"ZL-078","sec":"文字资料","cat":"文字资料","qh":"138-10","page":"137 138","bsec":"文字","bpart":"提升进阶","mat":"2022年1~7月，全国规模以上工业发电4.77万亿千瓦时，同比增长1.4%，增速比上半年加快0.7个百分点。7 月份，全国发电量8059亿千瓦时，同比增长4.5%，增速比上月加快3.0个百分点。分品种看，7月份火电由降转 增，同比增长5.3%；由于来水偏枯，水电同比增长2.4%，增速比上月放缓26.6个百分点；风电同比增长5.7%， 增速比上月放缓11.0个百分点；核电同比下降3.3%，降幅比上月收窄5.7个百分点；太阳能发电同比增长 13.0%，增速比上月加快3.1个百分点。 2022年1~7月，全社会用电量累计49303亿千瓦时，同比增长3.4%。分产业看，第一产业用电量634亿千瓦 时，同比增长11.1%；第二产业用电量32552亿千瓦时，同比增长1.1%；第三产业用电量8531亿千瓦时，同比增 长4.6%；城乡居民生活用电量7586亿千瓦时，同比增长12.5%。7月份，全社会用电量8324亿千瓦时，同比增长 6.3%。分产业看，第一产业用电量121亿千瓦时，同比增长14.3%；第二产业用电量5132亿千瓦时，同比下降 0.1%；第三产业用电量1591亿千瓦时，同比增长11.5%；城乡居民生活用电量1480亿千瓦时，同比增长26.8%。","imgs":[],"stem":"能够从上述资料中推出的是：","opts":{"A":"2022年7月全国太阳能发电增长量最大","B":"2022年6月全国核电发电量比5月份高","C":"2022年7月第二产业用电量高于上半年第二产业月均用电量","D":"2021年7月第一产业用电量低于2021年上半年第一产业月均用电量"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"60%","trap":"D","sol":"- A项：定位文字材料第一段可得，2022年7月份，太阳能发电同比增长13.0%，增速比上月加快3.1个百分点。并未给全国太阳能发电的其他数据，无法计算增长量，不能进行比较，错误；\n- B项：定位文字材料第一段可得，2022年7月份，核电同比下降3.3%，降幅比上月收窄5.7个百分点，根据百分点运算技巧，只能求得2022年6月的同比增长率而非环比增长率，无法判别2022年6月和5月全国核电发电量的大小关系，错误；\n- C项：根据题意，$7月>\\frac{上半年}{6}=\\frac{1\\sim 7月-7月}{6}$，推导可得$7\\times 7月>1\\sim 7月$。定位文字材料第二段可得，2022年1~7月，第二产业用电量32552亿千瓦时；7月份，第二产业用电量5132亿千瓦时。代入数据验证，2022年7月第二产业用电量$\\times 7=5132\\times 7>5100\\times 7=35700$亿千瓦时>32552亿千瓦时（2022年1~7月第二产业用电量），满足\"$7\\times 7月>1\\sim 7月$\"，正确；\n- D项：根据题意，$7月\u003c\\frac{上半年}{6}=\\frac{1\\sim 7月-7月}{6}$，推导可得$7\\times 7月\u003c1\\sim 7月$。定位文字材料第二段可得，2022年1~7月，第一产业用电量634亿千瓦时，同比增长11.1%；7月份，第一产业用电量121亿千瓦时，同比增长14.3%。根据公式：基期量$=\\frac{现期量}{1+r}$，则2021年7月第一产业用电量\n\n  $$=\\frac{121}{1+14.3\\%}\\approx\\frac{121}{1.14}\\approx 106\\ \\text{亿千瓦时}$$\n\n  ，2021年1~7月第一产业用电量$=\\frac{634}{1+11.1\\%}\\approx\\frac{634}{1.11}\\approx 571$亿千瓦时。代入数据验证，2021年7月第一产业用电量$\\times 7=106\\times 7=742$亿千瓦时>571亿千瓦时（2021年1~7月第一产业用电量），不满足\"$7\\times 7月\u003c1\\sim 7月$\"，错误。\n\n故正确答案为C。","point":"综合分析；文字资料","src":"2023年青海省公务员录用考试《行测》题（网友回忆版）第109题","bimgs":["book/137.webp","book/138.webp"],"setno":2,"qno":10,"p0":"138","setTxt":"文字·提升进阶 第2套","gid":52},{"no":"ZL-079","sec":"文字资料","cat":"文字资料","qh":"139-14","page":"138 139","bsec":"文字","bpart":"提升进阶","mat":"2016年全国女性就业人员占全社会就业人员的比重为43.1%，其中城镇单位女性就业人员6518万人，比 2010年增加1656万人。 2016年公有制企事业单位中女性专业技术人员1480万人，比2010年增加211万人，所占比重达47.8%，提高 2.8个百分点；其中女性高级专业技术人员161万人，比2010年增加59.3万人，所占比重38.3%，提高3个百分 点。 2016年企业董事会中女职工董事占职工董事的比重为39.9%，企业监事会中女职工监事占职工监事的比重 为40.1%，比2010年分别提高7.2和4.9个百分点；企业职工代表大会中女性代表比重为28.7%，略低于2010年0.3 个百分点。 2016年女性参加生育保险的人数达8020万人，比2010年增长49%。2016年，参加城镇职工基本医疗保险的 女性1.4亿人，比2011年增长21.5%；参加城镇居民基本医疗保险的女性1.9亿人，比2011年增长了1.5倍。 2016年全国参加城镇职工基本养老保险人数3.8亿人，其中女性1.8亿人，占比比2010年提高3个百分点； 2016年，参加城乡居民基本养老保险人数5.1亿人，其中女性超过1.7亿人。 2016年全国参加失业保险的人数超过1.8亿人，其中女性7551万人，分别比2010年增加4713万人和2402万 人，增长约35%和47%；参加工伤保险人数2.2亿人，其中女性8129万人，分别比2010年增加5728万人和2429万 人，增长约35%和43%。","imgs":[],"stem":"如2017年及以后年份同比增量保持不变，同比增量按照2011-2016年间同比增量的平均值计算，全国参加失业保险的女性将在哪年超过1.2亿人？","opts":{"A":"2024","B":"2026","C":"2028","D":"2030"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"52%","trap":"B","sol":"根据题干\"……同比增量保持不变，……将在哪年超过……\"，结合选项时间为2016年以后的时间，可判定本题为现期追赶问题。定位文字材料最后一段可得：2016年全国参加失业保险的人数超过1.8亿人，其中女性7551万人，分别比2010年增加4713万人和2402万人。且\"同比增量按照2011-2016年间同比增量的平均值计算\"，故包括2011年的同比增量，2011-2016年间同比增量（即6年）的平均值为$\\frac{2402}{6}\\approx 400$万人。假设n年后全国参加失业保险的女性超过1.2亿人。根据公式：现期量=基期量+n×增长量，可得$7551+n\\times 400>12000$，解得n>11.1，则过12年超过1.2亿人，即全国参加失业保险的女性将在2016+12=2028年超过1.2亿人。\n\n故正确答案为C。","point":"现期量计算；文字资料","src":"2021年北京市公务员录用考试《行测》题（区级及以上卷）（网友回忆版）第133题","bimgs":["book/138.webp","book/139.webp"],"setno":2,"qno":14,"p0":"139","setTxt":"文字·提升进阶 第2套","gid":53},{"no":"ZL-080","sec":"文字资料","cat":"文字资料","qh":"139-15","page":"138 139","bsec":"文字","bpart":"提升进阶","mat":"2016年全国女性就业人员占全社会就业人员的比重为43.1%，其中城镇单位女性就业人员6518万人，比 2010年增加1656万人。 2016年公有制企事业单位中女性专业技术人员1480万人，比2010年增加211万人，所占比重达47.8%，提高 2.8个百分点；其中女性高级专业技术人员161万人，比2010年增加59.3万人，所占比重38.3%，提高3个百分 点。 2016年企业董事会中女职工董事占职工董事的比重为39.9%，企业监事会中女职工监事占职工监事的比重 为40.1%，比2010年分别提高7.2和4.9个百分点；企业职工代表大会中女性代表比重为28.7%，略低于2010年0.3 个百分点。 2016年女性参加生育保险的人数达8020万人，比2010年增长49%。2016年，参加城镇职工基本医疗保险的 女性1.4亿人，比2011年增长21.5%；参加城镇居民基本医疗保险的女性1.9亿人，比2011年增长了1.5倍。 2016年全国参加城镇职工基本养老保险人数3.8亿人，其中女性1.8亿人，占比比2010年提高3个百分点； 2016年，参加城乡居民基本养老保险人数5.1亿人，其中女性超过1.7亿人。 2016年全国参加失业保险的人数超过1.8亿人，其中女性7551万人，分别比2010年增加4713万人和2402万 人，增长约35%和47%；参加工伤保险人数2.2亿人，其中女性8129万人，分别比2010年增加5728万人和2429万 人，增长约35%和43%。","imgs":[],"stem":"能够从上述资料中推出的是：","opts":{"A":"2016年全国参加工伤保险的人中，女性占比低于2010年水平","B":"2010年全国参加城镇职工基本养老保险的人中，女性占比低于40%","C":"2010年女职工董事占职工董事的比重高于女职工监事占职工监事的比重","D":"2010年公有制企业事业单位中男性高级专业技术人员不到210万人"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"58%","trap":"B","sol":"- A项：定位文字材料最后一段可知，\"2016年全国参加工伤保险保险人数2.2亿人，其中女性8129万人，分别比2010年增加……，增长约35%（b）和43%（a）\"。根据两期比重比较结论：若部分增长率（a）>整体增长率（b），则比重上升。43%（a）>35%（b），即2016年全国参加工伤保险的人中，女性占比高于2010年水平，错误；\n- B项：定位文字材料第五段可知，\"2016年全国参加城镇职工基本养老保险人数3.8亿人，其中女性1.8亿人，占比比2010年提高3个百分点\"。则2016年全国参加城镇职工基本养老保险的人中，女性占比为$\\frac{1.8}{3.8}\\approx 47\\%$，故2010年全国参加城镇职工基本养老保险的人中，女性占比为47%-3%=44%>40%，错误；\n- C项：定位文字材料第三段可知，\"2016年企业董事会中女职工董事占职工董事的比重为39.9%，企业监事会中女职工监事占职工监事的比重为40.1%，比2010年分别提高7.2和4.9个百分点\"。则2010年女职工董事占职工董事的比重=39.9%-7.2%=32.7%；女职工监事占职工监事的比重=40.1%-4.9%=35.2%。可以看出32.7%\u003c35.2%，即2010年女职工董事占职工董事的比重低于女职工监事占职工监事的比重，错误；\n- D项：定位文字材料第二段可知，\"2016年公有制企事业单位中女性专业技术人员1480万人，……其中女性高级专业技术人员161万人，比2010年增加59.3万人，所占比重38.3%，提高3个百分点\"。由此可知2010年高级专业技术人员总人数为\n\n  $$\\frac{2010年女性高级专业技术人员}{2010年女性高级专业技术人员的占比}=\\frac{161-59.3}{38.3\\%-3\\%}=\\frac{101.7}{35.3\\%}=280^{+}\\ \\text{万人}$$\n\n  ，2010年男性高级专业技术人员$=280^{+}-101.7=100^{+}$万人\u003c210万人，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2021年北京市公务员录用考试《行测》题（区级及以上卷）（网友回忆版）第134题","bimgs":["book/138.webp","book/139.webp"],"setno":2,"qno":15,"p0":"139","setTxt":"文字·提升进阶 第2套","gid":53},{"no":"ZL-081","sec":"文字资料","cat":"文字资料","qh":"141-2","page":"140 141","bsec":"文字","bpart":"提升进阶","mat":"2020年，我国规模以上互联网和相关服务企业（以下简称互联网企业）业务收入12838亿元，同比增长 12.5%，增速低于上年同期8.9个百分点。 2020年，互联网企业实现营业利润1187亿元，同比增长13.2%，增速低于上年同期3.7个百分点；得益于成 本控制较好，营业成本仅增长2.4%，行业营业利润高出同期收入增速0.7个百分点。 2020年，互联网企业信息服务收入共7068亿元，同比增长11.5%，增速低于上年同期11.2个百分点。互联网 接入及相关服务收入447.5亿元，同比增长11.5%，增速低于上年同期20.8个百分点；互联网数据服务（包括云 服务、大数据服务等）收入199.8亿元，同比增长29.5%，增速较上年同期提高3.9个百分点。 2020年，东部地区互联网业务收入11227亿元，同比增长14.8%，增速较上年同期回落9个百分点，中部地 区互联网业务收入448.1亿元，同比增长3.4%，增速较上年同期回落53.1个百分点。西部地区互联网业务收入 497.2亿元，同比增长6.9%，增速较上年同期回落15.2个百分点。东北地区互联网业务收入47.1亿元，同比增长 9.1%。 2020年，互联网业务累计收入居前5名的广东（增长5.2%）、北京（增长21.5%）、上海（增长20.9%）、 浙江（增长24.4%）和江苏（增长8.0%）共完成互联网业务收入10706亿元，同比增长15.1%，增速超过全国平 均水平2.6个百分点，占全国（扣除跨地区企业）比重达87.6%，占比较上年同期提高0.8个百分点。","imgs":[],"stem":"2019年，互联网企业互联网接入及相关服务收入同比增速比同年信息服务收入同比增速：","opts":{"A":"高不到10个百分点","B":"高10个百分点以上","C":"低不到10个百分点","D":"低10个百分点以上"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"79%","trap":"C","sol":"定位文字材料第三段，\"2020年，互联网企业信息服务收入……同比增长11.5%，增速低于上年同期11.2个百分点。互联网接入及相关服务收入……同比增长11.5%，增速低于上年同期20.8个百分点\"。因此，2019年，互联网接入及相关服务收入同比增速为11.5%+20.8%=32.3%；互联网企业信息服务收入同比增速为11.5%+11.2%=22.7%。32.3%-22.7%=9.6%，则2019年，互联网企业互联网接入及相关服务收入同比增速比同年信息服务收入同比增速高不到10个百分点。\n\n故正确答案为A。","point":"简单计算；文字资料","src":"2021年甘肃公务员录用考试《行测》题（网友回忆版）第106题","bimgs":["book/140.webp","book/141.webp"],"setno":3,"qno":2,"p0":"141","setTxt":"文字·提升进阶 第3套","gid":54},{"no":"ZL-082","sec":"文字资料","cat":"文字资料","qh":"141-5","page":"140 141 142","bsec":"文字","bpart":"提升进阶","mat":"2020年，我国规模以上互联网和相关服务企业（以下简称互联网企业）业务收入12838亿元，同比增长 12.5%，增速低于上年同期8.9个百分点。 2020年，互联网企业实现营业利润1187亿元，同比增长13.2%，增速低于上年同期3.7个百分点；得益于成 本控制较好，营业成本仅增长2.4%，行业营业利润高出同期收入增速0.7个百分点。 2020年，互联网企业信息服务收入共7068亿元，同比增长11.5%，增速低于上年同期11.2个百分点。互联网 接入及相关服务收入447.5亿元，同比增长11.5%，增速低于上年同期20.8个百分点；互联网数据服务（包括云 服务、大数据服务等）收入199.8亿元，同比增长29.5%，增速较上年同期提高3.9个百分点。 2020年，东部地区互联网业务收入11227亿元，同比增长14.8%，增速较上年同期回落9个百分点，中部地 区互联网业务收入448.1亿元，同比增长3.4%，增速较上年同期回落53.1个百分点。西部地区互联网业务收入 497.2亿元，同比增长6.9%，增速较上年同期回落15.2个百分点。东北地区互联网业务收入47.1亿元，同比增长 9.1%。 2020年，互联网业务累计收入居前5名的广东（增长5.2%）、北京（增长21.5%）、上海（增长20.9%）、 浙江（增长24.4%）和江苏（增长8.0%）共完成互联网业务收入10706亿元，同比增长15.1%，增速超过全国平 均水平2.6个百分点，占全国（扣除跨地区企业）比重达87.6%，占比较上年同期提高0.8个百分点。","imgs":[],"stem":"关于我国互联网企业业务状况，能够从上述资料中推出的有几条？ ①2019年实现利润超过1000亿元 ②2020年，互联网数据服务收入比2018年增长了不到70% ③2018年及2019年，中部地区互联网业务收入均低于西部地区","opts":{"A":"0","B":"1","C":"2","D":"3 （七）"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"37%","trap":"C","sol":"①：定位文字材料第二段\"2020年，互联网企业实现营业利润1187亿元，同比增长13.2%\"。根据基期计算公式：基期量$=\\frac{现期量}{1+增长率}$，可知2019年实现利润为$\\frac{1187}{1+13.2\\%}=1000^{+}$亿元，正确；\n\n②：定位文字材料第三段可知，2020年，互联网数据服务（包括云服务、大数据服务等）收入199.8亿元，同比增长29.5%，增速较上年同期提高3.9个百分点。则2019年增长率为29.5%-3.9%=25.6%，根据间隔增长率公式：$r_{间}=r_{1}+r_{2}+r_{1}\\times r_{2}$，可知2020年互联网数据服务收入比2018年增长$29.5\\%+25.6\\%+29.5\\%\\times 25.6\\%\u003c55.1\\%+30\\%\\times 30\\%=55.1\\%+9\\%\u003c70\\%$，正确；\n\n③：定位文字材料第四段可知，（2020年）中部地区互联网业务收入448.1亿元，同比增长3.4%，增速较上年同期回落53.1个百分点。西部地区互联网业务收入497.2亿元，同比增长6.9%，增速较上年同期回落15.2个百分点。则2019年中、西部地区互联网业务收入同比增速分别为3.4%+53.1%=56.5%、6.9%+15.2%=22.1%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，可得2019年中、西部地区互联网业务收入分别为\n\n$$\\frac{448.1}{1+3.4\\%}\\approx\\frac{448.1}{1.03}\\approx 435\\ \\text{亿元}$$\n\n、$\\frac{497.2}{1+6.9\\%}\\approx\\frac{497.2}{1.07}\\approx 465$亿元，435亿元（中部）\u003c465亿元（西部），即2019年中部地区互联网业务收入低于西部地区；同理，2018年中、西部地区互联网业务收入分别为$\\frac{435}{1+56.5\\%}\\approx\\frac{435}{1.57}$亿元、$\\frac{465}{1+22.1\\%}\\approx\\frac{465}{1.22}$亿元，$\\frac{435}{1.57}$亿元（中部）\u003c$\\frac{465}{1.22}$亿元（西部），即2018年中部地区互联网业务收入低于西部地区，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2021年甘肃公务员录用考试《行测》题（网友回忆版）第109题","bimgs":["book/140.webp","book/141.webp","book/142.webp"],"setno":3,"qno":5,"p0":"141","setTxt":"文字·提升进阶 第3套","gid":54},{"no":"ZL-083","sec":"文字资料","cat":"文字资料","qh":"142-8","page":"142","bsec":"文字","bpart":"提升进阶","mat":"2019年上半年，我国服务进出口总额达到26124.6亿元，同比增长2.6%。其中，出口总额9333.7亿元，同比 增长9.0%；进口总额16790.8亿元，同比下降0.6%。服务进出口总额占对外贸易总额的比重达到15.1%，比2018 年全年高出0.5个百分点。 2019年全年，我国服务进出口总额54152.9亿元，同比增长2.8%。其中，出口总额19564.0亿元，同比增长 8.9%；进口总额34588.9亿元，同比减少0.4%。 2019年上半年，我国知识密集型服务进出口额8923.9亿元，同比增长9.4%，其中，知识密集型服务出口额 4674.1亿元，同比增长12.1%；进口额4249.8亿元，同比增长6.5%。从具体领域看，知识产权使用费出口同比增 长33.0%；电信、计算机和信息服务出口同比增长15.7%，进口同比增长19.6%；其他商业服务（含技术、专业 和管理咨询服务、研发成果转让费及委托研发等）出口同比增长10.4%；金融服务出口同比增长13.9%，进口同 比增长43.9%。 2019年全年，我国知识密集型服务进出口额18777.7亿元，同比增长10.8%，其中，知识密集型服务出口额 9916.8亿元，同比增长13.4%；进口额8860.9亿元，同比增长8.0%。从具体领域看，个人文化娱乐服务，电信、 计算机和信息服务，金融服务进出口总额分别同比增长19.4%、18.9%、18.7%。","imgs":[],"stem":"2018年，我国对外贸易总额约为多少万亿元？","opts":{"A":"17","B":"25","C":"36","D":"48"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"39%","trap":"A","sol":"根据题干\"2018年，我国对外贸易总额约为\"，结合材料第一段\"服务进出口总额占对外贸易总额的比重达到15.1%，比2018年全年高出0.5个百分点\"，可判定本题为基期比重问题。可得，2018年我国服务进出口总额占对外贸易总额的比重=15.1%-0.5%=14.6%。根据材料第二段，2019年全年，我国服务进出口总额54152.9亿元，同比增长2.8%，则2018年我国服务进出口总额$=\\frac{54152.9}{1+2.8\\%}$亿元。根据公式：整体$=\\frac{部分}{比重}$，则2018年我国对外贸易总额\n\n$$\\approx\\frac{5.4万亿}{1+2.8\\%}\\div 14.6\\%\\approx\\frac{5.4万亿}{1+2.8\\%}\\div\\frac{1}{7}\\approx\\frac{5.4万亿\\times 7}{1.03}=\\frac{37.8万亿}{1.03}=36^{+}\\ \\text{万亿}$$\n\n，与C项接近。\n\n故正确答案为C。","point":"基期比重；文字资料","src":"2021年国家公务员录用考试《行测》题（地市级网友回忆版）第127题","bimgs":["book/142.webp"],"setno":3,"qno":8,"p0":"142","setTxt":"文字·提升进阶 第3套","gid":55},{"no":"ZL-084","sec":"文字资料","cat":"文字资料","qh":"145-17","page":"144 145","bsec":"文字","bpart":"提升进阶","mat":"2022年，深圳全市绿化覆盖总面积达到101385.6公顷，比上年增长513.4公顷；其中建成区绿化覆盖面积 41457.5公顷，比上年增长345.2公顷；建成区绿化覆盖率43.09%，比上年增长0.09个百分点；全市绿地面积 98270.2公顷，比上年增长1.45%；其中建成区绿地面积36613.1公顷，比上年增长3.30%；建成区绿地率比上年 增长0.98个百分点；全市公园绿地面积22219.0公顷，比上年增长222.5公顷，按常住人口计算人均公园绿地面积 比上年增长1.13%。 2022年全市公园已达到1260个，公园总面积38209.9公顷，分别是2003年的8.6倍和5.6倍；全市公园中，有 自然公园37个，比上年增加4个；城市公园191个，比上年增加4个；社区公园1032个，比上年增加14个。三级 公园体系的建成，基本实现了市民出门500米可达社区公园，2公里可达城市综合圈，5公里可达自然公园的目 标。全市公园绿化活动场地服务半径覆盖的居住用地面积达到21018.2公顷，较上年增长280.8公顷，公园绿化 活动场地服务半径覆盖率达到90.87%，与上年持平。 2022年，全市绿道长度3119公里，比上年增长9.70%，增速较上年收窄5.78个百分点，万人拥有绿道长度 1.77公里，比上年增长9.94%；绿道密度（全市绿道长度与全市面积之比）1.56公里/平方公里，居广东省首位。 深圳市建成区绿化覆盖率、公园绿化活动场地服务半径覆盖率、万人拥有绿道长度3项指标已达到国家生态园 林城市标准。","imgs":[],"stem":"2022年，深圳市每万人拥有公园绿地面积约为（ ）公顷。","opts":{"A":"11.6","B":"12.1","C":"12.6","D":"无法判断"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"36%","trap":"D","sol":"根据题干\"2022年……每万人拥有……约为（ ）公顷\"，结合材料时间为2022年，可判定本题为现期平均数问题。定位材料第一段和第三段可得：2022年，全市公园绿地面积22219.0公顷；全市绿道长度3119公里，万人拥有绿道长度1.77公里。则深圳市人口数$=\\frac{3119}{1.77}\\approx 1762$万人。根据公式：每万人拥有公园绿地面积$=\\frac{公园绿地面积}{人口数(万人)}$，故所求为\n\n$$\\frac{22219.0}{1762}\\approx\\frac{22219}{1760}\\approx 12.6\\ \\text{公顷/万人}$$\n\n，对应C项。\n\n故正确答案为C。","point":"现期平均数；文字资料","src":"2024年深圳市考公务员录用考试《行测》试题（网友回忆版）第86题","bimgs":["book/144.webp","book/145.webp"],"setno":3,"qno":17,"p0":"145","setTxt":"文字·提升进阶 第3套","gid":56},{"no":"ZL-085","sec":"文字资料","cat":"文字资料","qh":"146-3","page":"145 146","bsec":"文字","bpart":"提升进阶","mat":"2023年三季度，支付系统共处理支付业务3358.88亿笔，金额3151.37万亿元，同比分别增长12.59%和 6.97%。 三季度，人民银行清算总中心系统共处理支付业务54.79亿笔，金额2379.52万亿元，同比分别增长0.92%和 9.53%，其中，大额实时支付系统处理业务9518.17万笔，同比下降10.39%，金额2254.07万亿元，同比增长 9.72%；小额批量支付系统处理业务11.51亿笔，金额46.69万亿元，同比分别增长5.73%和10.03%；网上支付跨 行清算系统处理业务42.31亿笔，同比下降0.03%，金额74.66万亿元，同比增长5.38%；境内外币支付系统处理 业务134.46万笔，同比增长2.83%，金额5707.35亿美元，同比下降14.63%。 在其他支付系统中，银行行内业务系统三季度处理业务54.42亿笔，同比增长11.14%，金额539.56万亿元， 同比下降4.10%；银联跨行支付系统处理业务837.93亿笔，金额70.27万亿元，同比分别增长21.37%和8.70%；城 银清算支付清算系统处理业务1056.40万笔，金额9744.45亿元，同比分别增长34.61%和36.31%；农信银支付清 算系统处理业务7.41亿笔，金额7162.13亿元，同比分别下降39.98%和13.55%；人民币跨境支付系统处理业务 176.43万笔，金额33.42万亿元，同比分别增长43.23%和31.41%；网联清算平台处理业务2404.21亿笔，金额 126.92万亿元，同比分别增长10.42%和6.28%。","imgs":[],"stem":"2022年三季度，人民银行清算总中心系统境内外币支付系统处理业务日均处理金额在以下哪个范围内？","opts":{"A":"超过80亿美元","B":"70亿-80亿美元之间","C":"60亿-70亿美元之间","D":"不到60亿美元"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"D","a2":null,"rate":"49%","trap":"D","sol":"根据题干\"2022年三季度……日均处理金额……\"，结合材料时间为2023年三季度，可判定本题为基期平均数问题。定位文字材料第二段可得：2023年三季度，人民银行清算总中心系统境内外币支付系统处理金额5707.35亿美元，同比下降14.63%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，可得2022年三季度，人民银行清算总中心系统境内外币支付系统处理金额\n\n$$=\\frac{5707.35}{1-14.63\\%}\\approx\\frac{5707.35}{0.854}\\approx 6683\\ \\text{亿美元}$$\n\n。由于2022年7月有31天，8月有31天，9月有30天，则三季度共有31+31+30=92天，可得三季度日均处理金额$=\\frac{6683}{92}\\approx 73$亿美元，在B项范围内。\n\n故正确答案为B。","point":"基期平均数；文字资料","src":"2025年国家公务员录用考试《行测》题（副省级网友回忆版）第132题","bimgs":["book/145.webp","book/146.webp"],"setno":4,"qno":3,"p0":"146","setTxt":"文字·提升进阶 第4套","gid":57},{"no":"ZL-086","sec":"文字资料","cat":"文字资料","qh":"146-4","page":"145 146","bsec":"文字","bpart":"提升进阶","mat":"2023年三季度，支付系统共处理支付业务3358.88亿笔，金额3151.37万亿元，同比分别增长12.59%和 6.97%。 三季度，人民银行清算总中心系统共处理支付业务54.79亿笔，金额2379.52万亿元，同比分别增长0.92%和 9.53%，其中，大额实时支付系统处理业务9518.17万笔，同比下降10.39%，金额2254.07万亿元，同比增长 9.72%；小额批量支付系统处理业务11.51亿笔，金额46.69万亿元，同比分别增长5.73%和10.03%；网上支付跨 行清算系统处理业务42.31亿笔，同比下降0.03%，金额74.66万亿元，同比增长5.38%；境内外币支付系统处理 业务134.46万笔，同比增长2.83%，金额5707.35亿美元，同比下降14.63%。 在其他支付系统中，银行行内业务系统三季度处理业务54.42亿笔，同比增长11.14%，金额539.56万亿元， 同比下降4.10%；银联跨行支付系统处理业务837.93亿笔，金额70.27万亿元，同比分别增长21.37%和8.70%；城 银清算支付清算系统处理业务1056.40万笔，金额9744.45亿元，同比分别增长34.61%和36.31%；农信银支付清 算系统处理业务7.41亿笔，金额7162.13亿元，同比分别下降39.98%和13.55%；人民币跨境支付系统处理业务 176.43万笔，金额33.42万亿元，同比分别增长43.23%和31.41%；网联清算平台处理业务2404.21亿笔，金额 126.92万亿元，同比分别增长10.42%和6.28%。","imgs":[],"stem":"将其他支付系统中①银行行内业务系统、②银联跨行支付系统、③城银清算支付清算系统和④农信银支付清算系统按2023年三季度平均每笔业务金额同比增速从高到低排列，以下正确的是：","opts":{"A":"①②③④","B":"③②①④","C":"④③②①","D":"④①②③"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"55%","trap":"B","sol":"根据题干\"……2023年三季度平均每笔业务金额同比增速……\"，可判定本题为平均数的增长率问题。定位文字资料第三段可得：（2023年三季度）在其他支付系统中，银行行内业务系统三季度处理业务数量同比增长11.14%（$b_{1}$），金额同比下降4.10%（$a_{1}$）；银联跨行支付系统处理业务数量和金额同比分别增长21.37%（$b_{2}$）和8.70%（$a_{2}$）；城银清算支付清算系统处理业务数量和金额同比分别增长34.61%（$b_{3}$）和36.31%（$a_{3}$）；农信银支付清算系统处理业务数量和金额同比分别下降39.98%（$b_{4}$）和13.55%（$a_{4}$）。根据公式：平均数的增长率$=\\frac{a-b}{1+b}$，则2023年三季度①银行行内业务系统、②银联跨行支付系统、③城银清算支付清算系统和④农信银支付清算系统平均每笔业务金额同比增速分别为：\n\n①银行行内业务系统：$\\frac{-4.10\\%-11.14\\%}{1+11.14\\%}\\approx\\frac{-15.24\\%}{1.1}=-13\\%^{+}$；\n\n②银联跨行支付系统：$\\frac{8.70\\%-21.37\\%}{1+21.37\\%}\\approx\\frac{-12.67\\%}{1.2}=-10\\%^{+}$；\n\n③城银清算支付清算系统：$\\frac{36.31\\%-34.61\\%}{1+34.61\\%}\\approx\\frac{1.7\\%}{1.3}=1\\%^{+}$；\n\n④农信银支付清算系统：$\\frac{-13.55\\%-(-39.98\\%)}{1-39.98\\%}\\approx\\frac{26.43\\%}{0.6}=44\\%^{+}$。\n\n综上可知，同比增速从高到低排列为：④③②①。\n\n故正确答案为C。","point":"平均数的增长率；文字资料","src":"2025年国家公务员录用考试《行测》题（副省级网友回忆版）第133题","bimgs":["book/145.webp","book/146.webp"],"setno":4,"qno":4,"p0":"146","setTxt":"文字·提升进阶 第4套","gid":57},{"no":"ZL-087","sec":"文字资料","cat":"文字资料","qh":"147-6","page":"147","bsec":"文字","bpart":"提升进阶","mat":"2020年1-2月，我国境内投资者共对全球147个国家和地区的1733家境外企业进行了非金融类直接投资，累 计实现投资1078.6亿元人民币，同比增长1.8%。对外承包工程完成营业额1080亿元人民币，同比下降9.5%，新 签合同额2150.3亿元人民币，同比增长38.3%。对外劳务合作派出各类劳务人员3.9万人，同比减少2.9万人，2月 末在外各类劳务人员77.8万人。 2020年1-2月，我国对外投资合作主要呈现以下特点： 一是对“一带一路”投资合作增幅较大。2020年1-2月，我国企业对“一带一路”沿线的48个国家有新增 投资，合计27.2亿美元，同比增长18.3%。在“一带一路”沿线的59个国家新签对外承包工程合同额153.6亿美 元，同比增长25.6%，完成营业额91.4亿美元。 二是对外投资结构持续多元。2020年1-2月，对外投资主要流向租赁和商务服务业、批发和零售业、制造 业和采矿业等传统投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其 中流向租赁和商务服务业的投资额同比增长43.2%，成为增速最高的领域。 三是对外承包工程新签大项目增多。2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有 115个，较去年同期增加29个，占新签合同总额的83.9%。","imgs":[],"stem":"2020年1-2月，我国境内投资者对每个当期内产生非金融类直接投资的境外企业的非金融类直接投资额均值约为多少亿元人民币？","opts":{"A":"1.6","B":"1.3","C":"0.8","D":"0.6"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"B","a2":null,"rate":"82%","trap":"C","sol":"根据题干\"2020年1-2月，……每个……均值约为多少亿元人民币\"，可判定本题为现期平均数问题。定位文字资料第一段\"2020年1-2月，我国境内投资者共对全球147个国家和地区的1733家境外企业进行了非金融类直接投资，累计实现投资1078.6亿元人民币，同比增长1.8%\"，可得，累计实现投资额1078.6亿元人民币，境外企业数为1733家，故题干所求\n\n$$=\\frac{累计实现投资额}{境外企业数}=\\frac{1078.6}{1733}\\approx\\frac{1078.6}{1700}\\approx 0.6\\ \\text{亿元人民币}$$\n\n。\n\n故正确答案为D。","point":"现期平均数；文字资料","src":"2021年国家公务员录用考试《行测》题（副省级网友回忆版）第131题","bimgs":["book/147.webp"],"setno":4,"qno":6,"p0":"147","setTxt":"文字·提升进阶 第4套","gid":58},{"no":"ZL-088","sec":"文字资料","cat":"文字资料","qh":"147-7","page":"147","bsec":"文字" 投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其 中流向租赁和商务服务业的投资额同比增长43.2%，成为增速最高的领域。 三是对外承包工程新签大项目增多。2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有 115个，较去年同期增加29个，占新签合同总额的83.9%。","imgs":[],"stem":"2020年1-2月，租赁和商务服务业对外投资额占对境外企业非金融类直接投资额的比重比上年同期约：","opts":{"A":"上升了3个百分点","B":"上升了12个百分点","C":"下降了3个百分点","D":"下降了12个百分点"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"69%","trap":"A","sol":"根据题干\"2020年1-2月，……占……的比重比上年同期约\"，结合选项为上升/下降+百分点，可判定本题为两期比重差计算问题。定位材料第一段可得，2020年1-2月……累计实现投资（B）1078.6亿元人民币，同比增长（b）1.8%；定位材料第四段可得，2020年1-2月，对外投资主要流向租赁和商务服务业、批发和零售业、制造业和采矿业等传统投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其中流向租赁和商务服务业的投资额同比增长（a）43.2%，成为增速最高的领域。\n\n根据两期比重差计算公式：\n\n$$\\frac{A}{B}\\times\\frac{a-b}{1+a}=40.8\\%\\times\\frac{43.2\\%-1.8\\%}{1+43.2\\%}\\approx 41\\%\\times\\frac{41\\%}{1.4}>40\\%\\times\\frac{16\\%}{1.4}=\\frac{16\\%}{1.4}=10\\%^{+}$$\n\n，B项符合。\n\n故正确答案为B。","point":"两期比重；文字资料","src":"2021年国家公务员录用考试《行测》题（副省级网友回忆版）第132题","bimgs":["book/147.webp"],"setno":4,"qno":8,"p0":"147","setTxt":"文字·提升进阶 第4套","gid":58},{"no":"ZL-090","sec":"文字资料","cat":"文字资料","qh":"147-9","page":"147 148","bsec":"文字","bpart":"提升进阶","mat":"2020年1-2月，我国境内投资者共对全球147个国家和地区的1733家境外企业进行了非金融类直接投资，累 计实现投资1078.6亿元人民币，同比增长1.8%。对外承包工程完成营业额1080亿元人民币，同比下降9.5%，新 签合同额2150.3亿元人民币，同比增长38.3%。对外劳务合作派出各类劳务人员3.9万人，同比减少2.9万人，2月 末在外各类劳务人员77.8万人。 2020年1-2月，我国对外投资合作主要呈现以下特点： 一是对“一带一路”投资合作增幅较大。2020年1-2月，我国企业对“一带一路”沿线的48个国家有新增 投资，合计27.2亿美元，同比增长18.3%。在“一带一路”沿线的59个国家新签对外承包工程合同额153.6亿美 元，同比增长25.6%，完成营业额91.4亿美元。 二是对外投资结构持续多元。2020年1-2月，对外投资主要流向租赁和商务服务业、批发和零售业、制造 业和采矿业等传统投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其 中流向租赁和商务服务业的投资额同比增长43.2%，成为增速最高的领域。 三是对外承包工程新签大项目增多。2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有 115个，较去年同期增加29个，占新签合同总额的83.9%。","imgs":[],"stem":"如2020年1-2月人民币与美元的汇率稳定为7元人民币兑换1美元，则同期对外承包工程新签合同额在5000万美元以上的项目的平均新签合同额在以下哪个范围内？","opts":{"A":"2亿美元以上","B":"1.5-2亿美元之间","C":"1-1.5亿美元之间","D":"0.5-1亿美元之间"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"D","a2":null,"rate":"54%","trap":"C","sol":"根据题干\"2020年1-2月……同期……的平均新签合同额在以下哪个范围内\"，可判定本题为现期平均数计算问题。定位材料第一段可得，2020年1-2月……新签合同额2150.3亿元人民币；定位材料最后一段可得，2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有115个……，占新签合同总额的83.9%。根据题干可知，人民币与美元的汇率稳定为7元人民币兑换1美元，则对外承包工程新签合同额在5000万美元以上的项目合同总额为\n\n$$\\frac{2150.3\\times 83.9\\%}{7}\\approx 2150.3\\times 12\\%\\approx 260\\ \\text{亿美元}$$\n\n，所求平均数为$\\frac{260}{115}=2^{+}$亿美元，在A项范围之内。\n\n故正确答案为A。","point":"现期平均数计算；文字资料","src":"2021年国家公务员录用考试《行测》题（副省级网友回忆版）第133题","bimgs":["book/147.webp","book/148.webp"],"setno":4,"qno":9,"p0":"147","setTxt":"文字·提升进阶 第4套","gid":58},{"no":"ZL-091","sec":"文字资料","cat":"文字资料","qh":"148-10","page":"147 148","bsec":"文字","bpart":"提升进阶","mat":"2020年1-2月，我国境内投资者共对全球147个国家和地区的1733家境外企业进行了非金融类直接投资，累 计实现投资1078.6亿元人民币，同比增长1.8%。对外承包工程完成营业额1080亿元人民币，同比下降9.5%，新 签合同额2150.3亿元人民币，同比增长38.3%。对外劳务合作派出各类劳务人员3.9万人，同比减少2.9万人，2月 末在外各类劳务人员77.8万人。 2020年1-2月，我国对外投资合作主要呈现以下特点： 一是对“一带一路”投资合作增幅较大。2020年1-2月，我国企业对“一带一路”沿线的48个国家有新增 投资，合计27.2亿美元，同比增长18.3%。在“一带一路”沿线的59个国家新签对外承包工程合同额153.6亿美 元，同比增长25.6%，完成营业额91.4亿美元。 二是对外投资结构持续多元。2020年1-2月，对外投资主要流向租赁和商务服务业、批发和零售业、制造 业和采矿业等传统投资领域，占对境外企业非金融类直接投资的比重分别为40.8%、15.1%、11.3%和8.9%。其 中流向租赁和商务服务业的投资额同比增长43.2%，成为增速最高的领域。 三是对外承包工程新签大项目增多。2020年1-2月，对外承包工程新签合同额在5000万美元以上的项目有 115个，较去年同期增加29个，占新签合同总额的83.9%。","imgs":[],"stem":"能够从上述资料中推出的是：","opts":{"A":"2019年1-2月，我国境内投资者对境外企业非金融类直接投资额高于对外承包工程完成营业额","B":"2019年1-2月，我国对外劳务合作月均派出各类劳务人员不到1万人","C":"2020年1-2月，我国企业有新增投资的“一带一路”沿线国家中，我国企业平均对每个国家的新增投资额超过0.6亿美元","D":"2020年1-2月，我国企业在“一带一路”沿线国家新签对外承包工程合同额同比增量超过30亿美元"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"69%","trap":"C","sol":"- A项：定位文字材料第一段：2020年1-2月，我国境内投资者共对……境外企业进行了非金融类直接投资，累计实现投资1078.6亿元人民币，同比增长1.8%；对外承包工程完成营业额1080亿元人民币，同比下降9.5%。根据公式：基期量$=\\frac{现期量}{1+r}$，则2019年1-2月非金融类直接投资额$=\\frac{1078.6}{1+1.8\\%}$，对外承包工程完成营业额$=\\frac{1080}{1-9.5\\%}$，后者分子大且分母小，故前者\u003c后者，并非高于，错误；\n- B项：定位文字材料第一段：2020年1-2月，对外劳务合作派出各类劳务人员3.9万人，同比减少2.9万人。则2019年1-2月，我国对外劳务合作月均派出各类劳务人员为$\\frac{3.9+2.9}{2}=3.4$万人，大于1万人，错误；\n- C项：定位文字材料第三段：2020年1-2月，我国企业对\"一带一路\"沿线的48个国家有新增投资，合计27.2亿美元。则我国企业平均对每个国家的新增投资额为$\\frac{27.2}{48}\u003c0.6$亿美元，不到0.6亿美元，错误；\n- D项：定位文字材料第三段：2020年1-2月，在\"一带一路\"沿线的59个国家新签对外承包工程合同额153.6亿美元，同比增长25.6%。根据增长量$=\\frac{现期量}{1+r}\\times r$，所求同比增量\n\n  $$=\\frac{153.6}{1+25.6\\%}\\times 25.6\\%\\approx\\frac{153.6}{1+\\frac{1}{4}}\\times\\frac{1}{4}=\\frac{153.6}{5}>30\\ \\text{亿美元}$$\n\n  ，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2021年国家公务员录用考试《行测》题（副省级网友回忆版）第135题","bimgs":["book/147.webp","book/148.webp"],"setno":4,"qno":10,"p0":"148","setTxt":"文字·提升进阶 第4套","gid":58},{"no":"ZL-092","sec":"文字资料","cat":"文字资料","qh":"149-14","page":"148 149","bsec":"文字","bpart":"提升进阶","mat":"党的十八大以来，我国居民收入水平持续较快增长，消费水平稳步提高，消费结构优化升级，生活质量明 显提升，人民生活正阔步迈向全面小康。 2019年，全国居民人均可支配收入30733元，比2000年增长4.4倍。全国居民人均消费支出21559元，比2012 年增长78.9%，年均增长8.7%。其中，城镇居民人均消费支出28063元，比2012年增长64.0%；农村居民人均消 费支出13328元，比2012年增长99.9%。 2019年全国居民恩格尔系数（人均食品支出占人均消费支出的比重）为28.2%，比2000年下降14.0个百分 点。其中，城镇居民恩格尔系数为27.6%，农村居民恩格尔系数为30.0%，分别比2000年下降11.0和18.3个百分 点。 2019年，全国居民平均每百户拥有彩色电视机120.6台、洗衣机96.0台、电冰箱100.9台、空调115.6台、汽 车35.3辆。城镇居民人均住房建筑面积为39.8平方米，比2002年增长62.1%；农村居民人均住房建筑面积为48.9 平方米，比2000年增长97.2%。全国居民人均交通通信支出2862元，比2000年年均增长14.7%，占人均消费支出 的比重较2000年提高6.1个百分点。全国居民人均医疗保健支出1902元，比2000年年均增长13.4%，占人均消费 支出的比重较2000年提高2.9个百分点。","imgs":[],"stem":"2019年城镇居民人口占总人口的比重约为：","opts":{"A":"52.7%","B":"53.8%","C":"54.1%","D":"55.9%"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"55%","trap":"C","sol":"根据题干\"2019年……占……的比重约为\"，结合材料时间为2019年，可判定本题为现期比重问题。定位文字材料第二段可得：2019年，全国居民人均消费支出21559元，其中，城镇居民人均消费支出28063元，农村居民人均消费支出13328元。人均消费支出$=\\frac{总消费支出}{总人口}$，故可利用混合比例解题，根据线段法，距离与量成反比，\n\n```\n  城镇居民人均消费支出     全国人均消费支出      农村人均消费支出\n         |----------6504--------|--------8231--------|\n       28063                 21559                13328\n```\n\n即城镇人口：农村人口=8231:6504≈82:65，根据公式：比重$=\\frac{部分量}{总体量}=\\frac{城镇人口}{城镇人口+农村人口}=\\frac{82}{82+65}=\\frac{82}{147}\\approx 55.8\\%$，与D项最接近。\n\n故正确答案为D。","point":"现期比重；混合平均；文字资料","src":"2021年江苏省公务员录用考试《行测》题（B类）（网友回忆版）第118题","bimgs":["book/148.webp","book/149.webp"],"setno":4,"qno":14,"p0":"149","setTxt":"文字·提升进阶 第4套","gid":59},{"no":"ZL-093","sec":"文字资料","cat":"文字资料","qh":"150-20","page":"149 150","bsec":"文字","bpart":"提升进阶","mat":"2025年清明假期3天，Y省接待游客2110.5万人次，同比增长6.4%；实现旅游收入107.8亿元，同比增长 8.7%。全省4A级及以上景区接待游客657.5万人次，同比增长7.4%；纳入监测的13家红色旅游经典景区接待游 客54.7万人次，同比增长5.1%。 2025年“五一”假期5天，Y省接待游客4608.2万人次，同比增长18.7%；实现旅游收入295亿元，同比增长 20.3%。全省4A级及以上景区接待游客1629.9万人次，同比增长14.3%；纳入监测的13家红色旅游经典景区接待 游客119.5万人次，同比增长12.0%。 2025年端午假期3天，Y省接待游客2321.0万人次，同比增长20.6%；实现旅游收入114.4亿元，同比增长 25.6%。全省4A级及以上景区接待游客726.1万人次，同比增长18.9%；纳入监测的13家红色旅游经典景区接待 游客54.4万人次，同比增长17.5%。","imgs":["image/题23_柱状图.png"],"stem":"以下柱状图反映了2025年清明假期、“五一”假期和端午假期，Y省接待游客哪一指标的变化情况（横轴位置表示数值为0）？","opts":{"A":"纳入监测的13家红色旅游经典景区日均接待游客数同比增量","B":"纳入监测的13家红色旅游经典景区日均接待游客数量","C":"4A级及以上景区日均接待游客数同比增量","D":"4A级及以上景区日均接待游客数量"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"36%","trap":"C","sol":"根据题干\"以下柱状图反映了2025年……Y省接待游客哪一指标的变化情况……\"，结合选项中涉及日均接待游客数，可判定本题为平均数问题。定位材料第一、二、三段可得2025年清明假期、\"五一\"假期和端午假期的天数、Y省接待游客各指标数据和同比增长率。根据公式：平均数$=\\frac{总数}{个数}$，增长量$=\\frac{现期量}{1+r}\\times r$，可得Y省接待游客各指标的数据情况如下：\n\n- A项，纳入监测的13家红色旅游经典景区日均接待游客数同比增量：清明假期，$\\frac{\\frac{54.7}{1+5.1\\%}\\times 5.1\\%}{3}\\approx\\frac{\\frac{54.7}{1+\\frac{1}{20}}\\times\\frac{1}{20}}{3}=\\frac{54.7}{21\\times 3}=\\frac{54.7}{63}\\approx 0.87$万人次；\"五一\"假期，$\\frac{\\frac{119.5}{1+12\\%}\\times 12\\%}{5}\\approx\\frac{\\frac{119.5}{1+\\frac{1}{8.3}}\\times\\frac{1}{8.3}}{5}=\\frac{119.5}{9.3\\times 5}\\approx\\frac{119.5}{47}\\approx 2.54$万人次；端午假期，$\\frac{\\frac{54.4}{1+17.5\\%}\\times 17.5\\%}{3}\\approx\\frac{\\frac{54.4}{1+\\frac{1}{5.7}}\\times\\frac{1}{5.7}}{3}=\\frac{54.4}{6.7\\times 3}\\approx\\frac{54.4}{20}=2.72$万人次，符合柱状图变化趋势，当选；\n- B项，纳入监测的13家红色旅游经典景区日均接待游客数量：清明假期，$\\frac{54.7}{3}=18^{+}$万人次；端午假期，$\\frac{54.4}{3}=18^{+}$万人次。清明假期日均接待游客数量与端午假期几乎相等，不符合柱状图变化趋势，排除；\n- C项，4A级及以上景区日均接待游客数同比增量：清明假期，$\\frac{\\frac{657.5}{1+7.4\\%}\\times 7.4\\%}{3}\\approx\\frac{\\frac{657.5}{1+ ":"根据资料推算汇率换算，化工新材料产业结构中，2024年中国产业规模占全球比重超过70%的有几类？","opts":{"A":"1","B":"2","C":"3","D":"4"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"68%","trap":"B","sol":"根据题干\"……2024年……比重超过70%的有几类\"，结合材料时间为2024年，可判定本题为现期比重问题。定位文字材料可得：2024年，中国化工新材料产业规模达到1655.6亿美元；定位统计表1可得：2024年，中国化工新材料产业规模为11787.7亿元；定位统计表2可得2024年全球及中国化工新材料各产业类别产业规模。换算汇率，1美元$=\\frac{11787.7}{1655.6}\\approx\\frac{11787.7}{1660}\\approx 7.1$元。根据公式：比重$=\\frac{部分}{整体}$，可得2024年化工新材料各产业类别中，中国产业规模占全球比重分别为：\n\n工程塑料和特种工程塑料，$\\frac{969.6}{869.6\\times 7.1}\\approx\\frac{970}{870\\times 7.1}=10\\%^{+}$；\n\n高端聚烯烃，$\\frac{1128.2}{765.7\\times 7.1}\\approx\\frac{1100}{770\\times 7.1}=20\\%^{+}$；\n\n聚氨酯材料，$\\frac{2485.2}{595.1\\times 7.1}\\approx\\frac{2500}{600\\times 7.1}=50\\%^{+}$；\n\n高性能橡胶，$\\frac{1890.0}{573.7\\times 7.1}\\approx\\frac{1900}{570\\times 7.1}=40\\%^{+}$；\n\n功能性膜材料，$\\frac{778.0}{501.2\\times 7.1}\\approx\\frac{780}{500\\times 7.1}=20\\%^{+}$；\n\n新能源材料，$\\frac{2865.1}{434.4\\times 7.1}\\approx\\frac{2900}{430\\times 7.1}=90\\%^{+}$；\n\n氟硅材料，$\\frac{746.6}{333.4\\times 7.1}\\approx\\frac{750}{330\\times 7.1}=30\\%^{+}$；\n\n电子化学品，$\\frac{380.2}{210.3\\times 7.1}\\approx\\frac{380}{210\\times 7.1}=20\\%^{+}$；\n\n高性能纤维，$\\frac{280.8}{160.2\\times 7.1}\\approx\\frac{280}{160\\times 7.1}=20\\%^{+}$；\n\n其他材料，$\\frac{264.0}{106.7\\times 7.1}\\approx\\frac{260}{110\\times 7.1}=30\\%^{+}$。\n\n比较可知，比重超过70%的只有新能源材料，共1类。\n\n故正确答案为A。","point":"现期比重；综合资料","src":"2026年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第99题","bimgs":["book/169.webp","book/170.webp"],"setno":3,"qno":19,"p0":"170","setTxt":"综合·夯实基础 第3套","gid":67},{"no":"ZL-104","sec":"综合资料","cat":"综合资料","qh":"172-3","page":"171 172","bsec":"综合","bpart":"夯实基础","mat":"2021年12月，我国原煤产量3.8亿吨，同比增长7.2%；原油产量1647万吨，同比增长1.7%；天然气产量192 亿立方米，同比增长2.3%；发电量7234亿千瓦时，同比下降2.1%。 ","imgs":["image/综合_题93_材料图1.png","image/综合_题93_材料图2.png"],"stem":"将我国主要能源按2021年产量的同比增速从高到低排列，正确的是：","opts":{"A":"电>天然气>原煤>原油","B":"天然气>电>原煤>原油","C":"电>原油>天然气>原煤","D":"天然气>原油>电>原煤"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"53%","trap":"A","sol":"根据题干\"……同比增速从高到低……\"，可判定本题为一般增长率问题。定位表1可得：2020年与2021年原煤产量、原油产量、天然气产量、发电量。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2021年四种主要能源产量的同比增速分别为：\n\n原煤：$\\frac{40.7-38.6}{38.6}=\\frac{2.1}{38.6}\\approx 5.4\\%$；\n\n原油：$\\frac{1.99-1.95}{1.95}=\\frac{0.04}{1.95}\\approx 2.1\\%$；\n\n天然气：$\\frac{2053-1897}{1897}\\approx\\frac{156}{1900}\\approx 8.2\\%$；\n\n发电量：$\\frac{8.11-7.50}{7.50}=\\frac{0.61}{7.5}\\approx 8.1\\%$。\n\n则从高到低排列正确的是：天然气>电>原煤>原油，B项符合。\n\n故正确答案为B。","point":"一般增长率比较；综合资料","src":"2023年湖北省选调生招录考试综合知识和行政职业能力测验试卷（网友回忆版）第92题","bimgs":["book/171.webp","book/172.webp"],"setno":4,"qno":3,"p0":"172","setTxt":"综合·夯实基础 第4套","gid":68},{"no":"ZL-105","sec":"综合资料","cat":"综合资料","qh":"173-7","page":"172 173","bsec":"综合","bpart":"夯实基础","mat":"2024年有48.07%的家庭收入持平，22.01%的家庭收入增加，其中6.09%的家庭收入 明显增加；近三成被访者表示收入减少，其中11.23%的家庭明显减少。对于2025年的家庭收入，46.10%的居民 预计将基本持平，19.04%的居民预期收入将增加，23.28%的居民对未来收入变化不确定，11.58%的居民预期收 入将明显减少。 调查发现，47.01%的城乡居民日常购物以线上渠道为主，37.52%的城乡居民线上、线下并重，只有15.48% 的城乡居民明确表示以线下为主。 不同群体的购物选择存在较大差异：一是代际断层，年轻群体成为线上消费主力，其中00后群体线上购物 占比69.8%，比70后群体高了53.79个百分点；二是城乡分化，城镇居民的线上购物占比50.18%，高于农村居民 11.66个百分点，务农群体选择线上购物的占比比农村居民还要低19.74个百分点；三是学历分化，高学历群体 选择线上购物比例更高，硕士以上学历群体线上购物占比62.81%，远高于初中及以下学历群体的22.63%。 ","imgs":["image/综合_题91_材料图.png"],"stem":"已知2023年初我国人口为14.12亿，2025年初我国人口为14.08亿。根据调查分析的比例推测，2025年初我国更倾向于“只买必需品，多存点钱”的人数比2023年初：","opts":{"A":"少不到0.1亿","B":"少0.1亿以上","C":"多不到0.1亿","D":"多0.1亿以上"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"53%","trap":"A","sol":"根据题干\"……2025年初……人数比2023年初\"，结合题干给出2023年初与2025年初我国人口，统计图给出2023年与2025年各消费观念人数占比，可判定本题为现期比重问题。根据题干可得：2023年初我国人口为14.12亿，2025年初我国人口为14.08亿，定位统计图可得：2023年初我国更倾向于\"只买必需品，多存点钱\"的人数占比为64.01%，2025年占比为63.29%。根据公式：部分=整体×比重，则所求\n\n$$=14.08\\times 63.29\\%-14.12\\times 64.01\\%$$\n\n$$\\approx 8.91-9.03=-0.12\\ \\text{亿}$$\n\n，即少0.1亿以上。\n\n故正确答案为B。","point":"现期比重；综合资料","src":"2026年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第107题","bimgs":["book/172.web webp"],"setno":6,"qno":8,"p0":"187","setTxt":"综合·夯实基础 第6套","gid":74},{"no":"ZL-113","sec":"综合资料","cat":"综合资料","qh":"187-10","page":"185 186 187","bsec":"综合","bpart":"夯实基础","mat":"增加森林面积、提高森林质量、提升生态系统碳汇增量，将为我国实现碳达峰、碳中和目标、维护全球生 态安全做出巨大贡献。1973年，我国开展了第一次森林资源清查。目前已完成第9次森林资源清查，我国森林 面积和森林蓄积量连续30年保持“双增长”。“十三五”时期，我国累计造林5.45亿亩，森林覆盖率达到 23.04%，森林蓄积量为175.6亿立方米，森林面积达到2.2亿公顷（1公顷为15亩）。湿地保护率达到52%，治理 沙化土地1.5亿亩。 ","imgs":["image/综合_题71_材料图1.png","image/综合_题71_材料图2.png"],"stem":"根据以上资料，下列说法不准确的是（ ）。","opts":{"A":"我国森林蓄积量较前一次森林资源清查增幅最大的是第6次森林资源清查","B":"第5次至第9次森林资源清查，我国森林面积和森林蓄积量的变化趋势一致","C":"2016-2020年，我国平均每年增加国际重要湿地超过3个","D":"2017-2020年，我国平均每个国际重要湿地面积同比增幅最大的年份是2020年"},"letters":["A","B","C","D"],"key":"D","bookkey":"B","a1":"D","a2":null,"rate":"50%","trap":"A","sol":"- A项：定位统计图1，可知我国第1次至第9次森林资源清查中的森林蓄积量，根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，第6次森林资源清查中我国森林蓄积量增幅$=\\frac{124.56-101.37}{101.37}=\\frac{23.19}{101.37}\\approx 22.9\\%$；第2次：$\\frac{90.28-86.56}{86.56}=\\frac{3.72}{86.56}\u003c10\\%$；第3次：$\\frac{91.41-90.28}{90.28}=\\frac{1.13}{90.28}\u003c10\\%$；第4次：$\\frac{101.37-91.41}{91.41}=\\frac{9.96}{91.41}\u003c20\\%$；第5次：$\\frac{101.37-101.37}{101.37}=0\\%$；第7次：$\\frac{137.21-124.56}{124.56}=\\frac{12.65}{124.56}\u003c20\\%$；第8次：$\\frac{151.37-137.21}{137.21}=\\frac{14.16}{137.21}\u003c20\\%$；第9次：$\\frac{175.60-151.37}{151.37}=\\frac{24.23}{151.37}\u003c20\\%$，故我国森林蓄积量较前一次森林资源清查增幅最大的是第6次森林资源清查，正确；\n- B项：定位统计图1，观察发现第5次至第9次森林资源清查，我国森林面积和森林蓄积量均保持增长，变化趋势一致，正确；\n- C项：定位统计图2，可知2016年和2020年我国国际重要湿地数量分别为49个和64个。根据公式：年均增长量$=\\frac{现期量-基期量}{年份差}$，则2016-2020年我国平均每年增加国际重要湿地数量$=\\frac{64-49}{4}=\\frac{15}{4}=3.75$个>3个，正确；\n- D项：定位统计图2，可知2016-2020年我国国际重要湿地面积分别为61.68万亩、61.68万亩、104.24万亩、104.24万亩、109.91万亩，2016-2020年我国国际重要湿地数量分别为49个、49个、57个、57个、64个。其中2017年和2019年较上年数据均未发生变化，同比增幅为0，只需比较2018年和2020年即可。根据公式：增长率$=\\frac{现期量}{基期量}-1$，可得2018年我国平均每个国际重要湿地面积同比增幅$=\\frac{\\frac{104.24}{57}}{\\frac{61.68}{49}}-1\\approx\\frac{1.8}{1.3}-1>0$，2020年同比增幅$=\\frac{\\frac{109.91}{64}}{\\frac{104.24}{57}}-1\\approx\\frac{1.7}{1.8}-1\u003c0$，则2020年我国平均每个国际重要湿地面积同比增幅并非最大，错误。\n\n本题为选非题，故正确答案为D。","point":"综合分析；综合资料","src":"2022年广东省公务员录用考试《行测》题（乡镇卷）（网友回忆版）第94题","bimgs":["book/185.webp","book/186.webp","book/187.webp"],"setno":6,"qno":10,"p0":"187","setTxt":"综合·夯实基础 第6套","gid":74},{"no":"ZL-114","sec":"综合资料","cat":"综合资料","qh":"188-13","page":"188 189","bsec":"综合","bpart":"夯实基础","mat":"2020年，我国平均每个国际重要湿地面积同比增幅最大的年份是2020年 ","imgs":["image/综合_题73_材料图1.png","image/综合_题73_材料图2.png"],"stem":"2017-2020年全国农村人均可支配收入增长最慢的年份是：","opts":{"A":"2017","B":"2018","C":"2019","D":"2020"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"74%","trap":"A","sol":"根据题干\"2017-2020年……增长最慢的年份是\"，可判定本题为一般增长率比较问题。定位表1可得：2016-2020年全国农村居民人均可支配收入分别为12363.4元、13432.4元、14617.1元、16020.8元、17131.4元。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，可得2017-2020年全国农村人均可支配收入同比增速分别为：\n\n2017年：$\\frac{13432.4-12363.4}{12363.4}\\approx\\frac{1069}{12400}\\approx 8.6\\%$；\n\n2018年：$\\frac{14617.1-13432.4}{13432.4}\\approx\\frac{1184.7}{13400}\\approx 8.8\\%$；\n\n2019年：$\\frac{16020.8-14617.1}{14617.1}\\approx\\frac{1403.7}{14600}\\approx 9.6\\%$；\n\n2020年：$\\frac{17131.4-16020.8}{16020.8}\\approx\\frac{1110.6}{16000}\\approx 6.9\\%$。\n\n则2017-2020年全国农村人均可支配收入增长最慢的年份是2020年。\n\n故正确答案为D。","point":"一般增长率比较；综合资料","src":"2022年青海省公务员录用考试《行测》题（网友回忆版）第107题","bimgs":["book/188.webp","book/189.webp"],"setno":6,"qno":13,"p0":"188","setTxt":"综合·夯实基础 第6套","gid":75},{"no":"ZL-115","sec":"综合资料","cat":"综合资料","qh":"189-15","page":"188 189","bsec":"综合","bpart":"夯实基础","mat":"2020年，我国平均每个国际重要湿地面积同比增幅最大的年份是2020年 ","imgs":["image/综合_题73_材料图1.png","image/综合_题73_材料图2.png"],"stem":"根据以上材料可以推出的是：","opts":{"A":"2020年全国居民人均可支配收入约为30493.9元","B":"2015-2020年农村居民人均可支配收入增速持续上升","C":"2014-2020年工资性收入占农村居民可支配收入的比重始终最高","D":"2014年农民经营性收入小于同时期城镇居民可支配收入的20%"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"54%","trap":"B","sol":"- A项：定位统计图及统计表，可得2020年农村居民及城镇居民人均可支配收入，并未给出农村和城镇居民人数，故无法推出全国居民人均可支配收入，错误；\n- B项：定位统计表，可得2014-2020年农村居民人均可支配收入分别为10488.9元、11421.7元、12363.4元、13432.4元、14617.1元、16020.8元、17131.4元。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2015-2020年农村居民人均可支配收入增速分别为：2015年，$\\frac{11421.7-10488.9}{10488.9}=\\frac{932.8}{10488.9}\\approx 8.9\\%$；2016年，$\\frac{12363.4-11421.7}{11421.7}=\\frac{941.7}{11421.7}\\approx 8.2\\%$。可得2016年增速\u003c2015年增速，非持续上升，错误；\n- C项：定位统计表，可得2014-2020年农村居民人均可支配收入及工资性收入的数据。根据比重公式可知，因每年整体量不变，故直接比较每年部分量大小即可。由2014年工资性收入（4152.2元）\u003c2014年经营性收入（4237.4元），可得2014年工资性收入占农村居民人均可支配收入的比重不是最高，错误；\n- D项：定位统计表，可得2014年农村居民人均可支配收入为10488.9元；农民经营性收入为4237.4元。定位统计图，2014年城乡收入倍差为2.75。根据城乡收入倍差\n\n  $$=\\frac{城镇居民人均可支配收入}{农村居民人均可支配收入}$$\n\n  ，可知2014年城镇居民人均可支配收入为$10488.9\\times 2.75\\approx 28844.5$元，故2014年农民经营性收入（4237.4元）$\u003c28844.5\\times 20\\%=5768.9$元，正确。\n\n故正确答案为D。","point":"综合分析；综合资料","src":"2022年青海省公务员录用考试《行测》题（网友回忆版）第109题","bimgs":["book/188.webp","book/189.webp"],"setno":6,"qno":15,"p0":"189","setTxt":"综合·夯实基础 第6套","gid":75},{"no":"ZL-116","sec":"综合资料","cat":"综合资料","qh":"190-19","page":"189 190","bsec":"综合","bpart":"夯实基础","mat":"截至2024年底，城乡居民基本医疗保险参保94713.73万人，收入11180.91亿元，支出10661.49亿元。","imgs":["image/综合_题75_材料图.png"],"stem":"2013~2023年间，城乡居民医疗保险收入个人缴费收入同比增速超过20%的年份有几个？","opts":{"A":"5","B":"6","C":"7","D":"8"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"82%","trap":"A","sol":"根据题干\"2013~2023年间……同比增速超过20%的年份有几个\"，可判定本题为一般增长率计算问题。定位统计图可得2012~2023年间，城乡居民医疗保险收入个人缴费收入。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2013~2023年间，城乡居民医疗保险收入个人缴费收入同比增速分别为：\n\n2013年：$\\frac{243-179}{179}=\\frac{64}{179}=30\\%^{+}>20\\%$，满足；\n\n2014年：$\\frac{342-243}{243}=\\frac{99}{243}=40\\%^{+}>20\\%$，满足；\n\n2015年：$\\frac{476-342}{342}=\\frac{134}{342}=40\\%^{-}>20\\%$，满足；\n\n2016年：$\\frac{680-476}{476}=\\frac{204}{476}=40\\%^{+}>20\\%$，满足；\n\n2017年：$\\frac{1491-680}{680}=\\frac{811}{680}>100\\%>20\\%$，满足；\n\n2018年：$\\frac{2396-1491}{1491}=\\frac{905}{1491}=60\\%^{+}>20\\%$，满足；\n\n2019年：$\\frac{2737-2396}{2396}=\\frac{341}{2396}=10\\%^{+}\u003c20\\%$，不满足；\n\n2020年：$\\frac{3029-2737}{2737}=\\frac{292}{2737}=10\\%^{+}\u003c20\\%$，不满足；\n\n2021年：$\\frac{3242-3029}{3029}=\\frac{213}{3029}=10\\%^{-}\u003c20\\%$，不满足；\n\n2022年：$\\frac{3336-3242}{3242}=\\frac{94}{3242}=10\\%^{-}\u003c20\\%$，不满足；\n\n2023年：$\\frac{3723-3336}{3336}=\\frac{387}{3336}=10\\%^{+}\u003c20\\%$，不满足。\n\n综上，2013~2023年间，城乡居民医疗保险收入个人缴费收入同比增速超过20%的年份有2013年、2014年、2015年、2016年、2017年和2018年，共6个。\n\n故正确答案为B。","point":"一般增长率；综合资料","src":"2026年天津市公务员录用考试《行测》题（网友回忆版）第119题","bimgs":["book/189.webp","book/190.webp"],"setno":6,"qno":19,"p0":"190","setTxt":"综合·夯实基础 第6套","gid":76},{"no":"ZL-117","sec":"综合资料","cat":"综合资料","qh":"190-20","page":"189 190","bsec":"综合","bpart":"夯实基础","mat":"截至2024年底，城乡居民基本医疗保险参保94713.73万人，收入11180.91亿元，支出10661.49亿元。","imgs":["image/综合_题75_材料图.png","image/综合_题77_材料图1.png","image/综合_题77_材料图2.png","image/综合_题77_材料图3.png","image/综合_题77_材料图4.png"],"stem":"以下折线图中，最能准确反映2016~2019年间，财政补助收入占城乡居民医疗保险收入比重变化趋势的是：","opts":{"A":"","B":"","C":"","D":""},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"71%","trap":"A","sol":"根据题干\"……2016~2019年间……占……比重变化趋势……\"，结合材料给出2016~2019年相关数据，可判定本题为现期比重问题。定位统计图可得2016~2019年每年的财政补助收入和个人缴费收入。根据公式：比重$=\\frac{部分}{整体}$，结合城乡居民医疗保险收入=财政补助收入+个人缴费收入，故2016~2019年财政补助收入占城乡居民医疗保险收入的比重分别为：\n\n2016年：$\\frac{2045}{2045+680}\\approx\\frac{2045}{2730}\\approx 75\\%$；\n\n2017年：$\\frac{3943}{3943+1491}\\approx\\frac{3943}{5430}\\approx 73\\%$；\n\n2018年：$\\frac{4446}{4446+2396}\\approx\\frac{4446}{6840}=65\\%$；\n\n2019年：$\\frac{5733}{5733+2737}\\approx\\frac{5733}{8470}\\approx 68\\%$。\n\n观察可得，变化趋势为先下降后上升，只有D项符合。\n\n故正确答案为D。","point":"现期比重；综合资料","src":"2026年天津市公务员录用考试《行测》题（网友回忆版）第119题","bimgs":["book/189.webp","book/190.webp"],"setno":6,"qno":20,"p0":"190","setTxt":"综合·夯实基础 第6套","gid":77},{"no":"ZL-118","sec":"综合资料","cat":"综合资料","qh":"191-4","page":"190 191 192","bsec":"综合","bpart":"夯实基础","mat":"","imgs":["image/综合_题77_材料图5.png"],"stem":"2015-2023年，我国集成电路布图设计登记当年发证量与当年申请量比值大于0.9的年份有几个？","opts":{"A":"2","B":"3","C":"4","D":"5"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"78%","trap":"B","sol":"根据题干\"2015-2023年……与……比值大于0.9的年份有几个\"，可判定本题为比值计算问题。定位统计图可知2015-2023年我国集成电路布图设计登记当年发证量与当年申请量。2015-2023年各年份比值分别为：\n\n2015年，$\\frac{1800}{2058}\u003c\\frac{1800}{2000}=0.9$；\n\n2016年，$\\frac{2154}{2360}=1-\\frac{206}{2360}=1-0.1^{-}>0.9$；\n\n2017年，$\\frac{2670}{3228}\\approx 0.8\u003c0.9$；\n\n2018年，$\\frac{3815}{4431}\u003c\\frac{3960}{4400}=0.9$；\n\n2019年，$\\frac{6614}{8319}\\approx 0.8\u003c0.9$；\n\n2020年，$\\frac{11727}{14375}\\approx 0.8\u003c0.9$；\n\n2021年，$\\frac{13087}{20353}\\approx 0.6\u003c0.9$；\n\n2022年，$\\frac{9106}{14403}\\approx 0.6\u003c0.9$；\n\n2023年，$\\frac{11316}{12503}\\approx 1-\\frac{1200}{12500}=1-0.1^{+}>0.9$。\n\n综上，2015-2023年我国集成电路布图设计登记当年发证量与当年申请量比值大于0.9的年份有2016年、2023年，共2个。\n\n故正确答案为A。","point":"比值计算；综合资料","src":"2025年国家公务员录用考试《行测》题（副省级网友回忆版）第118题","bimgs":["book/190.webp","book/191.webp","book/192.webp"],"setno":7,"qno":4,"p0":"191","setTxt":"综合·夯实基础 第7套","gid":78},{"no":"ZL-119","sec":"综合资料","cat":"综合资料","qh":"193-10","page":"192 193","bsec":"综合","bpart":"夯实基础","mat":"2019年全球太空经济规模增至3660亿美元，较2018年增长1.7%，其中全球卫星产业收入为2707亿美元。在 全球卫星产业收入中，卫星制造业的收入为125亿美元，较上年减少70亿美元；卫星发射服务业的收入为49亿 美元，较上年下降21.0%；卫星通信服务业的收入为1230亿美元，较上年减少35亿美元；地面设备制造业的收 入为1303亿美元，较上年增长4.1%。","imgs":["image/综合_题78_材料图.png"],"stem":"关于2019年全球卫星产业，能够从上述资料中推出的是：","opts":{"A":"卫星产业收入增速为-2.4%","B":"卫星发射服务业收入比2017年提高13.8个百分点","C":"卫星产业收入占全球太空经济的比重同比上升3.0个百分点","D":"卫星通信服务业收入的同比增加额与地面设备制造业相差16亿美元"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"67%","trap":"C","sol":"- A项：根据本篇材料第4题的计算结果，2019年全球卫星产业收入增速为$\\frac{2707-2774}{2774}\\approx\\frac{-67}{2770}\\approx -2.4\\%$，正确；\n- B项：定位图形材料可得：2018年卫星发射服务业收入增速为34.8%，2019年增速为-21%。则所求间隔增长率\n\n  $$=r_{1}+r_{2}+r_{1}\\times r_{2}=(-21\\%)+34.8\\%+(-21\\%)\\times 34.8\\%$$\n\n  $=13.8\\%-21\\%\\times 34.8\\%\u003c13.8\\%$，即2019年比2017年提高不到13.8%，错误；\n- C项：根据本篇材料第4题的计算结果，2019年全球卫星产业收入增速为$\\frac{2707-2774}{2774}\\approx\\frac{-67}{2770}\\approx -2.4\\%$；定位文字材料可得：2019年全球太空经济规模较2018年增长1.7%。根据两期比重比较结论，部分量增长率（-2.4%）小于总量增长率（1.7%），2019年比重下降，并非同比上升，错误；\n- D项：定位文字材料可得：2019年，卫星通信服务业较上年减少35亿美元；地面设备制造业的收入为1303亿美元，较上年增长4.1%。则地面设备制造业收入的同比增长量$=\\frac{现期量}{1+r}\\times r=\\frac{1303}{1+4.1\\%}\\times 4.1\\%\\approx\\frac{1303}{1+\\frac{1}{25}}\\times\\frac{1}{25}=\\frac{1303}{26}\\approx 50$亿美元，两者相差50-(-35)=85亿美元，并非16亿美元，错误。\n\n故正确答案为A。","point":"综合分析；综合资料","src":"2021年江苏省公务员录用考试《行测》题（C类）（网友回忆版）第129题","bimgs":["book/192.webp","book/193.webp"],"setno":7,"qno":10,"p0":"193","setTxt":"综合·夯实基础 第7套","gid":79},{"no":"ZL-120","sec":"综合资料","cat":"综合资料","qh":"194-14","page":"193 194","bsec":"综合","bpart":"夯实基础","mat":"2019年G省共有农业科研和科技开发机构68个，职工人数4633人，其中1254人有高级职称，1148人有中级 职称。全省共有农村科普示范基地554个、科普示范街道（乡镇）145个、科普示范社区（村）1341个。","imgs":["image/综合_题79_材料图.png"],"stem":"2015-2019年，G省农业科研和科技开发机构发表科学论文篇数最多的一年是（ ）。","opts":{"A":"2015年","B":"2016年","C":"2017年","D":"2019年"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"90%","trap":"D","sol":"定位表格材料可知，2015-2019年，G省农业科研和科技开发机构发表科学论文篇数依次为1519篇、1680篇、1891篇、1383篇、1862篇，因此发表科学论文篇数最多的一年为2017年。\n\n故正确答案为C。","point":"简单查找；综合资料","src":"2021年广东省公务员录用考试《行测》题（乡镇卷）（网友回忆版）第88题","bimgs":["book/193.webp","book/194.webp"],"setno":7,"qno":14,"p0":"194","setTxt":"综合·夯实基础 第7套","gid":80},{"no":"ZL-121","sec":"综合资料","cat":"综合资料","qh":"195-20","page":"194 195","bsec":"综合","bpart":"夯实基础","mat":"2021年上半年，湖北省规模以上信息传输、软件和信息技术服务业（以下简称“规上信息软件业”）保持 较快增长，推动全省规上服务业稳步发展。 2021年上半年，湖北省676家规上信息软件业企业中营业收入前20的企业共实现营业收入355.46亿元，同比 增长8.3%，拉动规上服务业营业收入增长1.1个百分点。 ","imgs":["image/综合_题80_材料图1.png","image/综合_题80_材料图2.png"],"stem":"下列说法不正确的是：","opts":{"A":"2021年上半年，北京规上服务业营业收入占全国的比例比上海多5%以内","B":"2020年上半年，江苏、湖北、河南、安徽、江西五省规上信息软件业企业营业收入之和比上海低","C":"2021年上半年湖北比河南规上信息软件业营业收入多，规上服务业营业收入少","D":"2020年上半年湖北省规上信息软件业企业中营业收入前20的企业总营业收入，与2021年上半年湖北省规上信息软件业中软件和信息技术服务业营业收入的差在5亿元以内"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"16%","trap":"A","sol":"- A项：定位统计表2可知，全国的营业收入为39271.6亿元，占规上服务业营业收入比重为29%；北京的营业收入为9751.1亿元，占规上服务业营业收入比重为41%；上海的营业收入为4678.99亿元，占规上服务业营业收入比重为23%。根据公式：整体$=\\frac{部分}{比重}$，可知全国的规上服务业营业收入$\\frac{39271.6}{29\\%}\\approx\\frac{39300}{0.29}\\approx 135517$亿元；北京的规上服务业营业收入比上海多\n\n  $$\\frac{9751.1}{41\\%}-\\frac{4678.99}{23\\%}\\approx\\frac{9750}{0.41}-\\frac{4680}{0.23}\\approx 23780-20345=3435\\ \\text{亿元}$$\n\n  ，则其占比较上海高约$\\frac{3435}{135517}\\approx\\frac{3435}{136000}\\approx 2.5\\%\u003c5\\%$，正确；\n- B项：定位统计表2可知，各省2021年上半年规上信息软件业企业营业收入及其同比增长率，根据公式：基期量$=\\frac{现期量}{1+增长率}$，可以分别得到各省2020年上半年规上信息软件业企业营业收入如下：上海$=\\frac{4678.99}{1+30.5\\%}\\approx\\frac{4678.99}{1.3}\\approx 3599$亿元、江苏$=\\frac{2202.2}{1+25.1\\%}\\approx\\frac{2202.2}{1.3}=1694$亿元、湖北$=\\frac{744.27}{1+19.7\\%}\\approx\\frac{744.27}{1.2}\\approx 620$亿元、河南$=\\frac{639.54}{1+18.4\\%}\\approx\\frac{639.54}{1.2}\\approx 533$亿元、安徽$=\\frac{555.5}{1+15.8\\%}\\approx\\frac{555.5}{1.2}\\approx 463$亿元、江西$=\\frac{378.19}{1+13.7\\%}\\approx\\frac{378.19}{1.1}\\approx 344$亿元。\n\n  1694+620+533+463+344=3654>3599，即2020年上半年，江苏、湖北、河南、安徽、江西五省规上信息软件业企业营业收入之和高于上海，错误；\n- C项：定位统计表2可知，湖北2021年上半年规上信息软件业企业营业收入744.27亿元，占规上服务业营业收入比重为20.6%；河南2021年上半年规上信息软件业企业营业收入639.54亿元，占规上服务业营业收入比重为17.4%，则2021年上半年湖北比河南规上信息软件业营业收入多。根据公式：整体$=\\frac{部分}{比重}$，可知2021年上半年湖北规上服务业营业收入与河南相比$\\frac{744.27}{20.6\\%}-\\frac{639.54}{17.4\\%}\\approx 3612-3678\u003c0$，则2021年上半年湖北比河南规上服务业营业收入少，正确；\n- D项：定位文字资料可知，2021年上半年湖北省规上信息软件业企业中营业收入前20的企业营业收入为355.46亿元，同比增长8.3%；定位统计表1可知，2021年上半年湖北省规上信息软件业中软件和信息技术服务业营业收入为329.91亿元。根据公式：基期量$=\\frac{现期量}{1+增长率}$，可知2020年上半年湖北省规上信息软件业企业中营业收入前20的企业营业收入$=\\frac{355.46}{1+8.3\\%}\\approx\\frac{355.46}{1.08}\\approx 329$亿元，与2021年上半年湖北省规上信息软件业中软件和信息技术服务业营业收入的差在5亿元以内，正确。\n\n本题为选非题，故正确答案为B。","point":"综合分析；综合资料","src":"2022年湖北省选调生招录考试综合知识和行政职业能力测验试卷（网友回忆版）第99题","bimgs":["book/194.webp","book/195.webp"],"setno":7,"qno":20,"p0":"195","setTxt":"综合·夯实基础 第7套","gid":81},{"no":"ZL-122","sec":"综合资料","cat":"综合资料","qh":"197-4","page":"196 197","bsec":"综合","bpart":"夯实基础","mat":"","imgs":["image/综合_题1_材料图1.png","image/综合_题1_材料图 ","cat":"综合资料","qh":"201-18","page":"200 201","bsec":"综合","bpart":"夯实基础","mat":"2020年1~12月，中国新能源汽车市场共计72家动力电池企业实现装车配套，其中排名前3家、前5家、前10 家的企业动力电池装车量分别占总装车量的71.3%、82.1%和91.8%。","imgs":["image/综合_题4_材料图1.png","image/综合_题4_材料图2.png"],"stem":"2019年12月，我国插混客车的日均动力电池装车量约为（ ）。","opts":{"A":"2.4MWh","B":"2.6MWh","C":"2.8MWh","D":"3.1MWh"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"D","a2":null,"rate":"66%","trap":"B","sol":"根据题干\"2019年12月……日均……约为\"，结合材料给出2020年12月相关数据，可判定本题为基期平均数问题。定位表格材料可得：2020年12月，我国插混客车动力电池装车量为9.8MWh，同比增速为-86.9%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，可得2019年12月我国插混客车动力电池装车量\n\n$$=\\frac{9.8}{1-86.9\\%}=\\frac{9.8}{0.131}\\approx 74.8\\ \\text{MWh}$$\n\n，12月有31天，则题干所求$=\\frac{74.8}{31}\\approx 2.4$MWh。\n\n故正确答案为A。","point":"基期平均数；综合资料","src":"2021年湖北省选调生招录考试综合知识和行政职业能力测验试卷（网友回忆版）第97题","bimgs":["book/200.webp","book/201.webp"],"setno":8,"qno":18,"p0":"201","setTxt":"综合·夯实基础 第8套","gid":84},{"no":"ZL-127","sec":"综合资料","cat":"综合资料","qh":"201-20","page":"200 201","bsec":"综合","bpart":"夯实基础","mat":"2020年1~12月，中国新能源汽车市场共计72家动力电池企业实现装车配套，其中排名前3家、前5家、前10 家的企业动力电池装车量分别占总装车量的71.3%、82.1%和91.8%。","imgs":["image/综合_题4_材料图1.png","image/综合_题4_材料图2.png"],"stem":"据所给资料推断，下列表述正确的是（ ）。","opts":{"A":"2020年下半年，我国动力电池装车量月平均增长约1.3GWh","B":"2018～2020年各年中，我国动力电池的装车量都是逐季度递增","C":"2020年12月我国动力电池装车量同比递增主要归功于插混乘用车","D":"2020年12月我国动力电池装车量中纯电动车电池装车量占比超95%"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"47%","trap":"A","sol":"- A项：定位图形材料可得2020年6-12月我国动力电池装车量。根据公式：增长量=现期量-基期量，由于2020年下半年为7月1日-12月31日，则现期为12月末，基期为7月初（即6月末）。则2020年下半年，我国动力电池装车量月均增长量\n\n  $$=\\frac{12.95-4.7}{6}=\\frac{8.25}{6}=1.375\\approx 1.4\\ \\text{GWh}$$\n\n  ，错误；\n- B项：定位图形材料可得2018~2020年我国动力电池月度装车量。则2019年二季度我国动力电池装车量=5.41+5.68+6.62=17.71GWh，三季度我国动力电池装车量=4.7+3.46+3.95=12.11GWh，比较可知，我国动力电池的装车量并非逐季递增，错误；\n- C项：定位表格材料可得，2020年12月我国插混乘用车动力电池装车量为546.8MWh，同比增长118.3%；纯电动乘用车动力电池装车量为8429.6MWh，同比增长87.2%。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，则2020年12月插混乘用车动力电池装车量同比增量\n\n  $$=\\frac{546.8}{1+118.3\\%}\\times 118.3\\%\\approx\\frac{546.8}{1+\\frac{1}{0.85}}\\times\\frac{1}{0.85}=\\frac{546.8}{1.85}\\approx 296\\ \\text{MWh}$$\n\n  ，纯电动乘用车同比增量$=\\frac{8429.6}{1+87.2\\%}\\times 87.2\\%\\approx\\frac{8429.6}{1+\\frac{1}{1.15}}\\times\\frac{1}{1.15}=\\frac{8429.6}{2.15}\\approx 3921$MWh，前者低于后者，则2020年12月我国动力电池装车量同比递增并非主要归功于插混乘用车，错误；\n- D项：定位表格材料可得，2020年12月我国动力电池装车量为12952.4MWh，其中，纯电动乘用车动力电池装车量为8429.6MWh，纯电动客车动力电池装车量为3066.3MWh，纯电动专用车动力电池装车量为873.4MWh。根据公式：比重$=\\frac{部分}{整体}$，则2020年12月我国动力电池装车量中纯电动车电池装车量占比\n\n  $$=\\frac{8429.6+3066.3+873.4}{12952.4}=\\frac{12369.3}{12952.4}\\approx 95.5\\%>95\\%$$\n\n  ，正确。\n\n注：A项，在题干无明确说明的情况下一般问与\"月\"相关默认为\"环比\"；与\"年\"相关默认为\"同比\"。\n\n故正确答案为D。","point":"综合分析；综合资料","src":"2021年湖北省选调生招录考试综合知识和行政职业能力测验试卷（网友回忆版）第99题","bimgs":["book/200.webp","book/201.webp"],"setno":8,"qno":20,"p0":"201","setTxt":"综合·夯实基础 第8套","gid":84},{"no":"ZL-128","sec":"综合资料","cat":"综合资料","qh":"202-4","page":"202","bsec":"综合","bpart":"夯实基础","mat":"某市学生招生毕业均在9月份，2019年末有普通高校2所，普通本专科（不含成人）在校生22555人。高考 文理本科达线率为50.14%。各类中等职业教育（不含技工学校）16所，在校生16079人。普通高中19所，在校 生20387人，高中阶段毛入学率108.51%。普通初中101所，在校生33552人，初中阶段适龄人口入学率100%。小 学129所，在校生68523人，小学学龄儿童入学率100%。幼儿园176所，在校生36719人，学前三年毛入园率 102.01%。特殊教育学校2所，在校生112人。","imgs":["image/综合_题7_材料图.png"],"stem":"2019年末该市各类教育在校生人数共有多少人？","opts":{"A":"197927","B":"212365","C":"186524","D":"201386"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"36%","trap":"D","sol":"定位文字材料可得，2019年末该市普通本专科（不含成人）在校生22555人，各类中等职业教育（不含技工学校）在校生16079人，普通高中在校生20387人，普通初中在校生33552人，小学在校生68523人，幼儿园在校生36719人，特殊教育学校在校生112人，则各类教育在校生共有22555+16079+20387+33552+68523+36719+112=197927人。\n\n（可通过计算尾数为7，快速排除B、C、D三项。）\n\n故正确答案为A。","point":"简单加减计算；综合资料","src":"2021年重庆市选调优秀大学生到基层工作考试《行测》题第98题","bimgs":["book/202.webp"],"setno":9,"qno":4,"p0":"202","setTxt":"综合·夯实基础 第9套","gid":85},{"no":"ZL-129","sec":"综合资料","cat":"综合资料","qh":"209-4","page":"208 209","bsec":"综合","bpart":"夯实基础","mat":"2019年12月31日，中国共产党党员总数为9191.6万名，同比增长1.46%。在党员的性别、民族和学历 上，女党员2559.9万名，少数民 现期量5.3、日均增长率11.9%，根据增量比较\"大大则大\"，10月份日均增量一定大于9月份日均增量，并且天数31大于9月30天，因此10月份增量大于9月份增量，大于10亿立方米；\n\n11月：日均现期量5.6、日均增长率11.8%，同理，11月份增量大于9月份增量，大于10亿立方米；\n\n12月：日均现期量6.0、日均增长率13.7%，同理，12月份增量大于9月份增量，大于10亿立方米；\n\n则2020年下半年，天然气产量同比增量超过10亿立方米的月份有4个。\n\n故正确答案为D。","point":"增长量比较；综合资料","src":"2021年新疆公务员录用考试《行测》试题（网友回忆版）第108题","bimgs":["book/214.webp","book/215.webp"],"setno":11,"qno":4,"p0":"215","setTxt":"综合·夯实基础 第11套","gid":88},{"no":"ZL-132","sec":"综合资料","cat":"综合资料","qh":"215-5","page":"214 215","bsec":"综合","bpart":"夯实基础","mat":"2021年1-2月，全国进口天然气2080万吨，同比增长17.4%。中国天然气进口金额为7312.1百万美元，同比 增长3.8%。 ","imgs":["image/综合_题11_材料图1.png"],"stem":"不能从上述资料中推出的是：","opts":{"A":"2020年四季度，全国天然气产量比三季度增长了10%以上","B":"2019年1～2月，全国天然气日均产量超过5亿立方米","C":"2021年1～2月，全国天然气进口金额同比增长额超过200百万美元","D":"2020年二、三、四季度，全国天然气日均产量同比增速低于上月的月份超过一半"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"47%","trap":"C","sol":"- A项：定位统计图可知：2020年7月-12月各月全国天然气日均产量，可得2020年第三季全国天然气产量=4.6×31+4.6×31+4.9×30=432.2亿立方米，2020年第四季全国天然气产量=5.3×31+5.6×30+6.0×31=518.3亿立方米。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，故题干所求\n\n  $$=\\frac{518.3-432.2}{432.2}\\approx\\frac{86.1}{430}\\approx 20\\%>10\\%$$\n\n  ，正确；\n- B项：定位统计图可知：2020年1-2月全国天然气日均产量为5.2亿立方米，同比增速为8.0%。根据公式：基期量$=\\frac{现期量}{1+r}$，可得2019年1-2月全国天然气日均产量\n\n  $$=\\frac{5.2}{1+8\\%}=\\frac{5.2}{1.08}\\approx 4.8\\ \\text{亿立方米}$$\n\n  \u003c5亿立方米，错误；\n- C项：定位文字材料可知：2021年1-2月中国天然气进口金额为7312.1百万美元，同比增长3.8%。根据公式：增长量$=\\frac{现期量}{1+r}\\times r$，可得2021年1-2月全国天然气进口金额同比增长额$=\\frac{7312.1}{1+3.8\\%}\\times 3.8\\%\\approx\\frac{7312.1}{1+\\frac{1}{25}}\\times\\frac{1}{25}=\\frac{7312.1}{26}\\approx 281$百万美元>200百万美元，正确；\n- D项：定位统计图可知：2020年4月-12月全国天然气日均产量的同比增速低于上月的月份有5月、6月、7月、8月、11月，共5个。而2020年二、三、四季度总共有9个月，$5>9\\times\\frac{1}{2}=4.5$，即超过一半，正确。\n\n本题为选非题，故正确答案为B。","point":"综合分析；综合资料","src":"2021年新疆公务员录用考试《行测》题（网友回忆版）第109题","bimgs":["book/214.webp","book/215.webp"],"setno":11,"qno":5,"p0":"215","setTxt":"综合·夯实基础 第11套","gid":88},{"no":"ZL-133","sec":"综合资料","cat":"综合资料","qh":"216-9","page":"216","bsec":"综合","bpart":"夯实基础","mat":"2023年，我国跨境电商进出口2.37万亿元人民币，比2022年（下同）增长15.3%，占同期我国货物贸易进出 口总值的5.7%，比重提升0.8个百分点。其中，出口约1.84万亿元，增长20.2%，占同期我国出口总值的7.7%， 进口约5335.2亿元，增长1.1%，占同期我国进口总值的3%。 从出口目的地看，美国（37.4%）、英国（8.7%）、德国（4.7%）、俄罗斯（4.6%）、法国（3.7%），合 计占出口总额近6成；泰国（2.5%）、越南（2.4%）、马来西亚（2.4%）、澳大利亚（2.1%）等新兴市场活 跃。美国（15.6%）、日本（13.5%）、澳大利亚（11.2%）、法国（7.9%）、韩国（7.2%）、新西兰（7%）、 德国（6.4%）、意大利（3.6%）、英国（3.4%）、荷兰（3.3%）是主要进口来源地。","imgs":["image/综合_题13_材料图.png"],"stem":"2023年，在跨境电商进出口贸易中，我国与下列哪个国家出现贸易逆差？","opts":{"A":"德国","B":"法国","C":"英国","D":"澳大利亚"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"65%","trap":"C","sol":"根据题干\"出现贸易逆差\"，且材料中给出2023年我国跨境电商出口额、进口额及我国跨境电商对德国、法国、英国、澳大利亚出口额、进口额的占比，可判定本题为现期比重问题。定位表格可得：2023年我国跨境电商出口金额为18409亿元，进口金额为5335亿元，定位文字材料第二段可得：我国跨境电商对德国、法国、英国、澳大利亚出口额占比分别为4.7%、3.7%、8.7%、2.1%，进口额占比分别为6.4%、7.9%、3.4%、11.2%。根据公式：部分=比重×占比，贸易逆差=进口额-出口额，可得2023年我国跨境电商与下列国家贸易状况为：\n\n德国：$5335\\times 6.4\\%-18409\\times 4.7\\%\\approx 341-865\u003c0$，为贸易顺差；\n\n法国：$5335\\times 7.9\\%-18409\\times 3.7\\%\\approx 421-681\u003c0$，为贸易顺差；\n\n英国：$5335\\times 3.4\\%-18409\\times 8.7\\%\\approx 181-1602\u003c0$，为贸易顺差；\n\n澳大利亚：$5335\\times 11.2\\%-18409\\times 2.1\\%\\approx 598-387>0$，为贸易逆差。\n\n故正确答案为D。","point":"现期比重；综合资料","src":"2025年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第108题","bimgs":["book/216.webp"],"setno":11,"qno":9,"p0":"216","setTxt":"综合·夯实基础 第11套","gid":89},{"no":"ZL-134","sec":"综合资料","cat":"综合资料","qh":"217-12","page":"217","bsec":"综合","bpart":"夯实基础","mat":"","imgs":["image/综合_题14_材料图1.png","image/综合_题14_材料图2.png"],"stem":"2016-2022年期间，我国A股市场新上市公司的首次募资金额同比增长超过15%的年份有：","opts":{"A":"3个","B":"4个","C":"5个","D":"6个"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"71%","trap":"B","sol":"根据题干\"2016-2022年期间……同比增长超过15%的年份有\"，可判定本题为一般增长率问题。定位统计图可知2015-2022年我国A股市场新上市公司的首次募资金额。根据公式：一般增长率$=\\frac{现期量-基期量}{基期量}$，则2016-2022年期间，我国A股市场新上市公司的首次募资金额同比增长率分别为：\n\n2016年，$\\frac{1496-1564}{1564}\u003c0$，不符合；\n\n2017年，$\\frac{2296-1496}{1496}\\approx\\frac{800}{1500}=53\\%^{+}$，符合；\n\n2018年，$\\frac{1378-2296}{2296}\u003c0$，不符合；\n\n2019年，$\\frac{2532-1378}{1378}\\approx\\frac{1154}{1400}=80\\%^{+}$，符合；\n\n2020年，$\\frac{4793-2532}{2532}\\approx\\frac{2261}{2500}=90\\%^{+}$，符合；\n\n2021年，$\\frac{5426-4793}{4793}\\approx\\frac{633}{4800}=13\\%^{+}$，不符合；\n\n2022年，$\\frac{5870-5426}{5426}\\approx\\frac{444}{5400}=8\\%^{+}$，不符合。\n\n因此，同比增长率超过15%的年份有2017年、2019年、2020年，共3个。\n\n故正确答案为A。","point":"一般增长率；综合资料","src":"2025年新疆公务员录用考试《行测》题（网友回忆版）第111题","bimgs":["book/217.webp"],"setno":11,"qno":12,"p0":"217","setTxt":"综合·夯实基础 第11套","gid":90},{"no":"ZL-135","sec":"综合资料","cat":"综合资料","qh":"218-15","page":"217 218","bsec":"综合","bpart":"夯实基础","mat":"","imgs":["image/综合_题14_材料图1.png","image/综合_题14_材料图2.png"],"stem":"能够从上述资料中推出的是：","opts":{"A":"2022年下半年，我国A股市场新上市公司首次募资总金额高于2022年上半年","B":"2022年下半年，我国A股市场新上市公司平均每家首次募资金额约为10.7亿元","C":"2016-2022年期间，我国A股市场新上市公司数量增长率最大的年份出现在2019年","D":"2023年上半年，我国A股市场新上市公司数量与首次募资金额都小于2022年上半年"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"D","a2":null,"rate":"52%","trap":"C","sol":"- A项：定位统计图可知，2022年我国A股市场新上市公司首次募资金额为5870亿元；定位统计表可知2022年上半年我国A股市场主板、科创板、创业板、北交所新上市公司首次募资金额。2022年上半年我国A股市场新上市公司首次募资总金额为1064+1156+871+29≈1060+1160+870+30=3120亿元，则2022年下半年我国A股市场新上市公司首次募资总金额为5870-3120=2750亿元，则2022年下半年低于2022年上半年，错误；\n- B项：定位统计图可知，2022年我国A股市场新上市公司数量为428家；定位统计表可知2022年上半年我国A股市场主板、科创板、创业板、北交所新上市公司数量；根据本题A项可知，2022年下半年我国A股市场新上市公司首次募资总金额为2750亿元。2022年上半年我国A股市场新上市公司总数量为30+54+68+19=171家。故题干所求\n\n  $$=\\frac{2022年下半年募资总金额}{2022年下半年新上市公司数量}=\\frac{2750}{428-171}=\\frac{2750}{257}\\approx 10.7\\ \\text{亿元}$$\n\n  ，正确；\n- C项：定位统计图可知2015-2022年我国A股市场新上市公司数量。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，可得2019年我国A股市场新上市公司数量同比增长率$=\\frac{203-105}{105}=\\frac{98}{105}\u003c1$、2020年同比增长率$=\\frac{434-203}{203}=\\frac{231}{203}>1$，2019年同比增长率小于2020年，2019年同比增长率并非最大，错误；\n- D项：定位统计表可知2023年上半年我国A股市场主板、科创板、创业板、北交所新上市公司数量。根据本题B项可知，2022年上半年我国A股市场新上市公司总数量为171家。2023年上半年我国A股市场新上市公司总数量为38+41+52+42=173家，则2023年上半年大于2022年上半年，错误。\n\n故正确答案为B。","point":"综合分析；综合
