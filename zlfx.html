<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#f4f6f9">
<title>资料分析 · 刷题与复盘</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e3e7ee; --ink:#1f2430; --ink2:#5b6577; --ink3:#8a93a3;
  --brand:#2f6fed; --brand-soft:#eaf1ff; --ok:#1a7f37; --ok-bg:#e8f5ec; --bad:#c0392b; --bad-bg:#fdecea;
  --warn:#8a6d1f; --warn-bg:#fdf6e3; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  padding-bottom:150px;
}
img{max-width:100%;display:block}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 14px}
button:active{transform:scale(.985)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn-ghost{background:transparent}
.btn-sm{min-height:36px;padding:0 10px;font-size:14px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}

/* 顶部 */
header.topbar{
  position:sticky; top:0; z-index:50; background:rgba(244,246,249,.94);
  backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
  padding-top:calc(8px + env(safe-area-inset-top,0px));
}
.tabs{display:flex;gap:8px;background:#e9edf3;border-radius:12px;padding:4px}
.tabs button{flex:1;border:none;background:transparent;font-weight:600;color:var(--ink2);border-radius:9px}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(20,30,60,.12)}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}

main{padding:12px;max-width:920px;margin:0 auto}
.hidden{display:none !important}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px;line-height:1.4}
.meta{font-size:12.5px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;background:#f1f4f9;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--ink2)}
.tag.brand{background:var(--brand-soft);border-color:#d3e0ff;color:#2455c3}
.tag.ok{background:var(--ok-bg);border-color:#cfe8d6;color:var(--ok)}
.tag.bad{background:var(--bad-bg);border-color:#f6d5d0;color:var(--bad)}
.stem{font-weight:600;margin:8px 0}
.mat{background:#fafbfd;border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:14.5px;color:var(--ink2);white-space:pre-wrap}
.imgs{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0}
.imgs img{border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;max-height:80vh;object-fit:contain;cursor:zoom-in}
@media (min-width:760px){
  .imgs{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
  .imgs img{max-height:72vh}
}
.imgtip{font-size:12.5px;color:var(--ink3);margin:6px 0 0}
.opts{margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;min-height:44px;background:#fff}
.opt input{margin-top:5px;width:20px;height:20px;flex:none}
.opt.tick{background:var(--ok-bg);border-color:#bfe0c8}
.opt.cross{background:var(--bad-bg);border-color:#f3cec8}
.opt b{color:var(--brand)}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfcfe;margin-top:8px}
details summary{cursor:pointer;font-size:14px;color:var(--brand);font-weight:600;min-height:28px;list-style-position:inside}
details[open] summary{margin-bottom:6px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.sol{white-space:pre-wrap;font-size:14px;color:var(--ink2);margin-top:8px}
.answerline{font-size:14px;margin:6px 0}
.filters{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filters select{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}
.empty{text-align:center;color:var(--ink3);padding:40px 10px}

/* 刷题 */
.ghead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.record{font-size:13px;color:var(--ink2);margin-top:6px}
.result{background:var(--brand-soft);border:1px solid #d3e0ff;border-radius:10px;padding:10px;margin:10px 0;font-weight:600;color:#1d4ed8;text-align:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--bad)}
.qbox{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}

/* 底部笔记 */
.notepad{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(20,30,60,.10);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.notepad .bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
.notepad .bar b{font-size:14px}
.notepad textarea{width:100%;border:none;border-top:1px solid var(--line);padding:10px 12px;min-height:150px;resize:vertical;outline:none;background:#fcfdff}
.saved{font-size:12px;color:var(--ok)}

/* Lightbox */
#lb{position:fixed;inset:0;background:rgba(12,16,24,.96);z-index:200;display:none;flex-direction:column}
#lb.on{display:flex}
#lb-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));color:#fff;gap:8px}
#lb-bar button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
#lb-stage{flex:1;overflow:hidden;position:relative;touch-action:none;display:flex;align-items:center;justify-content:center}
#lb-img{max-width:100%;max-height:100%;will-change:transform;transform-origin:center center;user-select:none;-webkit-user-drag:none}
#lb-tip{color:#c9d2e0;font-size:12px;text-align:center;padding:6px 10px 10px}
</style>
</head>
<body>

<header class="topbar">
  <div class="tabs">
    <button id="tab-review" class="on">复盘模式</button>
    <button id="tab-quiz">刷题模式</button>
  </div>
  <div class="hint" id="topHint"></div>
</header>

<main>
  <section id="view-review">
    <div class="filters">
      <select id="f-set" style="flex:1 1 100%"></select>
      <select id="f-sec"></select>
      <select id="f-point"></select>
    </div>
    <div class="row" style="justify-content:space-between;margin:0 0 12px">
      <span class="record" id="reviewStats" style="margin:0"></span>
      <label class="row" style="gap:6px;flex:none">
        <input type="checkbox" id="f-mis" style="width:20px;height:20px">
        <span style="font-size:13px;color:var(--ink2)">显示误记</span>
      </label>
    </div>
    <div id="review-list"></div>
    <button id="more" class="btn-ghost" style="width:100%">加载更多</button>
  </section>

  <section id="view-quiz" class="hidden">
    <div class="card" style="padding:10px 12px">
      <div class="row" style="justify-content:space-between">
        <span class="record" id="quizStats" style="margin:0"></span>
        <span class="row">
          <button class="btn-sm" id="btn-export">导出作答记录</button>
          <button class="btn-sm btn-ghost" id="btn-export-last">仅导出错题</button>
        </span>
      </div>
    </div>
    <div id="quiz-list"></div>
  </section>
</main>

<div class="notepad">
  <div class="bar">
    <b>我的笔记</b>
    <span class="saved" id="noteState">自动保存于本机</span>
    <button class="btn-sm" id="noteToggle">展开</button>
  </div>
  <textarea id="note" class="hidden" placeholder="随手记录薄弱考点、易错点、复盘结论……（输入即自动保存到本机）"></textarea>
</div>

<div id="lb">
  <div id="lb-bar">
    <button class="btn-sm" id="lb-close">关闭</button>
    <span id="lb-name" style="font-size:12.5px;color:#c9d2e0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <span class="row">
      <button class="btn-sm" id="lb-out">缩小</button>
      <button class="btn-sm" id="lb-reset">复位</button>
      <button class="btn-sm" id="lb-in">放大</button>
    </span>
  </div>
  <div id="lb-stage"><img id="lb-img" alt=""></div>
  <div id="lb-tip">双指缩放 / 拖拽移动 / 双击放大 · 也可用「放大」「缩小」按钮</div>
</div>

/材料组12_白酒啤酒产量.png","image/题19_折线图.png"],"stem":"下图为2024年全国白酒或啤酒哪个季度各月当期环比增长率的变化趋势？","opts":{"A":"白酒、第二季度","B":"白酒、第三季度","C":"啤酒、第二季度","D":"啤酒、第三季度"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"A","a2":null,"rate":"30%","trap":"A","sol":"根据题干\"……2024年……哪个季度各月当期环比增长率的变化趋势\"，可判定本题为一般增长率问题。定位表格材料可得2024年2-9月白酒和啤酒累计产量。根据当月产量=当月累计产量-上月累计产量，可得2024年3-9月，白酒各月产量依次为43千万升、30千万升、34千万升、25千万升、20千万升、27千万升、36千万升；啤酒各月产量依次为305千万升、278千万升、355千万升、404千万升、358千万升、371千万升、292千万升。根据公式：\n\n$$增长率=\\frac{现期量-基期量}{基期量}$$\n\n，可得选项中各指标环比增长率如下：\n\n- A项，白酒、第二季度：4月，$\\frac{30-43}{43}=-\\frac{13}{43}\\approx -30\\%$；5月，$\\frac{34-30}{30}=\\frac{4}{30}>0$；6月，$\\frac{25-34}{34}=-\\frac{9}{34}\\approx -26\\%$，则第一个点低于第三个点，不符合折线图的变化趋势，排除；\n- B项，白酒、第三季度：7月，$\\frac{20-25}{25}=-\\frac{5}{25}=-20\\%$；8月，$\\frac{27-20}{20}=\\frac{7}{20}=35\\%$；9月，$\\frac{36-27}{27}=\\frac{9}{27}>0$，则第一个点低于第三个点，不符合折线图的变化趋势，排除；\n- C项，啤酒、第二季度：4月，$\\frac{278-305}{305}=-\\frac{27}{305}\\approx -9\\%$；5月，$\\frac{355-278}{278}=\\frac{77}{278}\\approx 28\\%$；6月，$\\frac{404-355}{355}=\\frac{49}{355}>0$，则第一个点低于第三个点，不符合折线图的变化趋势，排除；\n- D项，啤酒、第三季度：7月，$\\frac{358-404}{404}=-\\frac{46}{404}\\approx -11\\%$；8月，$\\frac{371-358}{358}=\\frac{13}{358}>0$；9月，$\\frac{292-371}{371}=-\\frac{79}{371}\\approx -21\\%$，符合折线图的变化趋势，当选。\n\n故正确答案为D。","point":"一般增长率；统计表","src":"2025年内蒙古公务员录用考试《行测》题（网友回忆版）第114题","bimgs":["book/47.webp","book/48.webp"],"setno":2,"qno":15,"p0":"48","setTxt":"表格·提升进阶 第2套","gid":12},{"no":"ZL-020","sec":"统计表","cat":"统计表","qh":"48-17","page":"48","bsec":"表格","bpart":"提升进阶","mat":"","imgs":["image/材料组13_期货交易所.png"],"stem":"2025年1~2月，上海期货交易所成交额同比增速在以下哪个范围内？","opts":{"A":"不到45%","B":"超过85%","C":"45%~65%之间","D":"65%~85%之间"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"56%","trap":"C","sol":"根据题干\"2025年1~2月……同比增速在以下哪个范围内\"，结合选项是百分数，且材料给出2025年一季度与3月的相关数据，可判定本题为混合增长率问题。定位统计表可得：2025年一季度，上海期货交易所成交额为48.2万亿元、同比增速为54.4%；2025年3月，上海期货交易所成交额为19.4万亿元、同比增速为31.9%。根据混合增长率结论\"混合后居中不正中\"，可得$r_{1-2月}>54.4\\%>31.9\\%$，排除A项。2025年1~2月上海期货交易所成交额=48.2-19.4=28.8万亿元，根据混合增长率口诀：增速差与基期量成反比（一般用现期量代替基期量计算），可得\n\n$$\\frac{r_{1-2月}-54.4\\%}{54.4\\%-31.9\\%}\\approx\\frac{19.4}{28.8}\\approx 0.7$$\n\n，解得$r_{1-2月}\\approx 70\\%$，在D项范围内。\n\n```\n   r₁₋₂月                    54.4%                     31.9%\n     |_______________________|________________________|\n   1~2月                    一季度                      3月\n 28.8万亿元               48.2万亿元                19.4万亿元\n```\n\n故正确答案为D。","point":"混合增长率；统计表","src":"2026年国家公务员录用考试《行测》题（副省级网友回忆版）第117题","bimgs":["book/48.webp"],"setno":2,"qno":17,"p0":"48","setTxt":"表格·提升进阶 第2套","gid":13},{"no":"ZL-021","sec":"统计表","cat":"统计表","qh":"49-20","page":"48 49","bsec":"表格","bpart":"提升进阶","mat":"","imgs":["image/材料组13_期货交易所.png"],"stem":"全国期货交易所中，2025年3月平均每手成交额同比增幅和同比降幅最大的分别是：","opts":{"A":"中国金融期货交易所，广州期货交易所","B":"中国金融期货交易所，上海国际能源交易中心","C":"上海期货交易所，广州期货交易所","D":"上海期货交易所，上海国际能源交易中心"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"45%","trap":"D","sol":"根据题干\"2025年3月平均……同比增幅和同比降幅最大的分别是\"，可判定本题为平均数的增长率问题。定位统计表可知2025年3月全国各期货交易所的成交数量同比增速（b）及成交金额同比增速（a），根据公式：平均数的增长率$=\\frac{a-b}{1+b}$，计算比较选项各期货交易所相关增幅与降幅即可。\n\n中国金融期货交易所同比增幅：$\\frac{44.7\\%-33.2\\%}{1+33.2\\%}=\\frac{11.5\\%}{1.332}$；上海期货交易所同比增幅：$\\frac{31.9\\%-12.9\\%}{1+12.9\\%}=\\frac{19\\%}{1.129}$，后者较前者分子大分母小，增幅更大，排除A、B两项；\n\n广州期货交易所同比降幅：$\\left|\\frac{-58.8\\%-(-24.5\\%)}{1+(-24.5\\%)}\\right|=\\frac{34.3\\%}{0.755}>34.3\\%$；上海国际能源交易中心同比降幅：$\\left|\\frac{-5.0\\%-31.3\\%}{1+31.3\\%}\\right|=\\frac{36.3\\%}{1.313}\u003c30\\%$，前者降幅大于后者，可排除D项。\n\n故正确答案为C。","point":"平均数的增长率；统计表","src":"2026年国家公务员录用考试《行测》题（副省级网友回忆版）第119题","bimgs":["book/48.webp","book/49.webp"],"setno":2,"qno":20,"p0":"49","setTxt":"表格·提升进阶 第2套","gid":13},{"no":"ZL-022","sec":"统计图","cat":"统计图","qh":"53-9","page":"52 53","bsec":"图形","bpart":"夯实基础","mat":"","imgs":["image/材料组1_图1_保费收入.png","image/材料组1_图2_赔付金额.png"],"stem":"2022年下半年全国保险赔付金额与全国原保险保费收入比值最高的月份，当月保费收入同比约增加了多少亿元？","opts":{"A":"98","B":"158","C":"209"  4.5\\%$，比重呈持续下降趋势，错误；\n- B项：定位统计图可知，2016年、2019年国家备案众创空间数量分别为1337家、1888家。则2019年国家备案众创空间数量是2016年的$\\frac{1888}{1337}\\approx 1.41$倍，正确；\n- C项：根据A项计算结果可知2016~2019年全国众创空间数量：2016年4298家；2017年5739家；2018年6959家；2019年8000家。根据公式：增长量=现期量-基期量，则2017~2019年全国众创空间数量同比增量分别为：2017年，5739-4298=1441家；2018年，6959-5739=1220家；2019年，8000-6959=1041家，比较可知，同比增量逐年下降，正确；\n- D项：定位统计图可知，2016~2019年东部地区众创空间数量分别为2491家、3353家、3867家、4612家。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2017~2019年东部地区众创空间数量同比增长率分别为：2017年，$\\frac{3353-2491}{2491}\\approx\\frac{862}{2500}=30\\%^{+}$；2018年，$\\frac{3867-3353}{3353}\\approx\\frac{514}{3400}\\approx 15\\%$；2019年，$\\frac{4612-3867}{3867}\\approx\\frac{745}{3900}\\approx 19\\%$，同比增长最慢的年份是2018年，正确。\n\n本题为选非题，故正确答案为A。","point":"综合分析；统计图","src":"2023年深圳市考公务员录用考试《行测》题（网友回忆版）第94题","bimgs":["book/71.webp","book/72.webp"],"setno":2,"qno":5,"p0":"72","setTxt":"图形·提升进阶 第2套","gid":18},{"no":"ZL-028","sec":"统计图","cat":"统计图","qh":"72-10","page":"71 72","bsec":"图形","bpart":"提升进阶","mat":"","imgs":["image/材料组6_众创空间.png","image/补72-10配图.JPG"],"stem":"下列地区中，2019年众创空间数量同比增长率最高的是（  ）。","opts":{"A":"东部地区","B":"中部地区","C":"西部地区","D":"东北地区"},"letters":["A","B","C","D"],"key":"B","bookkey":"C","a1":"A","a2":null,"rate":"71%","trap":"A","sol":"根据题干\"……2019年……同比增长率最高的是\"，可判定本题为一般增长率问题。定位统计图可得：2019年和2018年东部地区、中部地区、西部地区和东北地区众创空间的数量。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，则2019年四个地区众创空间数量同比增长率分别为：\n\n东部地区：$\\frac{4612-3867}{3867}\\approx\\frac{745}{3870}\u003c20\\%$；\n\n中部地区：$\\frac{1512-1249}{1249}\\approx\\frac{263}{1250}>20\\%$；\n\n西部地区：$\\frac{1518-1511}{1511}\\approx\\frac{7}{1510}\u003c1\\%$；\n\n东北地区：$\\frac{358-332}{332}=\\frac{26}{332}\u003c10\\%$。\n\n比较可知，2019年众创空间数量同比增长率最高的是中部地区。\n\n故正确答案为B。","point":"一般增长率；统计图","src":"2023年深圳市考公务员录用考试《行测》题（网友回忆版）第93题","bimgs":["book/71.webp","book/72.webp"],"setno":2,"qno":10,"p0":"72","setTxt":"图形·提升进阶 第2套","gid":18},{"no":"ZL-029","sec":"统计图","cat":"统计图","qh":"73-6","page":"73","bsec":"图形","bpart":"提升进阶","mat":"","imgs":["image/材料组5_图1_医保收入.png","image/材料组5_图2_医保支出.png"],"stem":"2024年，全国基本医疗保险统筹基金支出金额超过收入金额的月份有几个？","opts":{"A":"4","B":"5","C":"6","D":"7"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"A","a2":null,"rate":"72%","trap":"C","sol":"根据题干\"2024年，全国基本医疗保险……支出金额超过收入金额的月份有几个\"，结合材料全国基本医疗保险=职工基本医疗保险+城乡居民基本医疗保险，定位统计图1和图2可知2024年各月职工基本医疗保险和城乡居民基本医疗保险情况。故各月基金支出和基金收入情况如下：\n\n1月：全国基金支出$=749+908=1600^{+}$亿元；全国基金收入$=1541+1307=2800^{+}$亿元。基金支出$\u003c$基金收入，不符合；\n\n2月：全国基金支出$=688+787=1400^{+}$亿元；全国基金收入$=768+1427=2100^{+}$亿元。基金支出$\u003c$基金收入，不符合；\n\n3月：全国基金支出$=888+968=1800^{+}$亿元；全国基金收入$=1160+1512=2600^{+}$亿元。基金支出$\u003c$基金收入，不符合；\n\n4月：全国基金支出$=979+1202=2100^{+}$亿元；全国基金收入$=551+1409=1900^{+}$亿元。基金支出$>$基金收入，符合；\n\n5月：全国基金支出$=981+1177=2100^{+}$亿元；全国基金收入$=517+1414=1900^{+}$亿元。基金支出$>$基金收入，符合；\n\n6月：全国基金支出$=1087+1321=2400^{+}$亿元；全国基金收入$=549+1429=1900^{+}$亿元。基金支出$>$基金收入，符合；\n\n7月：全国基金支出$=920+1174=2000^{+}$亿元；全国基金收入$=455+1416=1800^{+}$亿元。基金支出$>$基金收入，符合；\n\n8月：全国基金支出$=804+1082=1886$亿元；全国基金收入$=415+1424=1839$亿元。基金支出$>$基金收入，符合；\n\n9月：全国基金支出$=810+1054=1800^{+}$亿元；全国基金收入$=1094+1479=2500^{+}$亿元。基金支出$\u003c$基金收入，不符合；\n\n10月：全国基金支出$=560+1026=1500^{+}$亿元；全国基金收入$=1395+1503=2800^{+}$亿元。基金支出$\u003c$基金收入，不符合；\n\n11月：全国基金支出$=775+1052=1800^{+}$亿元；全国基金收入$=1089+1430=2500^{+}$亿元。基金支出$\u003c$基金收入，不符合；\n\n12月：全国基金支出$=1378+1453=2800^{+}$亿元；全国基金收入$=1305+1618=2900^{+}$亿元。基金支出$\u003c$基金收入，不符合。\n\n综上，2024年全国基本医疗保险统筹基金支出金额超过收入金额的月份有4月、5月、6月、7月、8月，共5个。\n\n故正确答案为B。","point":"简单加减计算；统计图","src":"2026年国家公务员录用考试《行测》题（副省级网友回忆版）第121题","bimgs":["book/73.webp"],"setno":2,"qno":6,"p0":"73","setTxt":"图形·提升进阶 第2套","gid":19},{"no":"ZL-030","sec":"统计图","cat":"统计图","qh":"76-16","page":"76 77","bsec":"图形","bpart":"提升进阶","mat":"","imgs":["image/材料组7_图1_电影票房.png","image/材料组7_图2_电影观众.png"],"stem":"2023年12月，资料中电影总放映场次最多的三个城市票房之和在以下哪个范围内？","opts":{"A":"超过5亿元","B":"4.5亿~4.75亿元之间","C":"4.75亿~5亿元之间","D":"不到4.5亿元"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"A","a2":null,"rate":"72%","trap":"A","sol":"定位图1可知2023年12月电影总放映场次最多的三个城市分别为上海、北京、成都，其票房分别为18682万元、19324万元、11085万元，则所求为18682+19324+11085=49091万元$\\approx 4.91$亿元，在C项范围内。\n\n故正确答案为C。","point":"简单加减计算；统计图","src":"2025年国家公务员录用考试《行测》题（地市级网友回忆版）第121题","bimgs":["book/76.webp","book/77.webp"],"setno":2,"qno":16,"p0":"76","setTxt":"图形·提升进阶 第2套","gid":20},{"no":"ZL-031","sec":"文字资料","cat":"文字资料","qh":"80-7","page":"80","bsec":"文字","bpart":"夯实基础","mat":"2023年3月，全国规模以上工业企业的工业机器人完成产量4.4万套，服务机器人完成产量70万套。2023年 1~3月全国规模以上工业企业的工业机器人累计完成产量10.4万套，服务机器人累计完成产量145万套。 2023年3月，我国机器人设备出口金额0.7亿美元，较上年增长110.3%，进口金额2.4亿美元，较上年增长 68.5%。2023年1~3月我国机器人设备累计出口金额1.9亿美元，较上年增长62.1%，累计进口金额6.9亿美元，较 上年增长55.1%。 2022年12月，全国规模以上工业企业的工业机器人完成产量4万套，服务机器人完成产量49.1万套。2022年 1~12月全国规模以上工业企业的工业机器人累计完成产量44.3万套，服务机器人累计完成产量645.8万套。 2022年12月，我国工业机器人设备出口金额0.5亿美元，进口金额1.8亿美元。2022年1~12月我国工业机器 人设备累计出口金额6.1亿美元，累计进口金额20亿美元。","imgs":[],"stem":"2023年一季度，我国机器人设备进出口贸易逆差比上年同期：","opts":{"A":"下降了不到30%","B":"下降了30%以上","C":"上升了不到30%","D":"上升了30%以上"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"B","a2":null,"rate":"60%","trap":"A","sol":"方法一：根据题干\"2023年一季度……进出口贸易逆差比上年同期……\"，结合选项为百分数，可判定本题为一般增长率问题。定位文字材料第二段可知：2023年1~3月，我国机器人设备累计出口金额1.9亿美元，较上年增长62.1%，累计进口金额6.9亿美元，较上年增长55.1%。根据公式：贸易逆差=进口额-出口额，则2023年1-3月，我国机器人设备进出口贸易逆差为6.9-1.9=5亿美元；根据公式：基期量$=\\frac{现期量}{1+增长率}$，则2022年1-3月，我国机器人设备进出口贸易逆差为$\\frac{6.9}{1+55.1\\%}-\\frac{1.9}{1+62.1\\%}\\approx\\frac{6.9}{1.55}-\\frac{1.9}{1.62}\\approx 4.5-1.2=3.3$亿美元。根据公式：增长率$=\\frac{现期量-基期量}{基期量}$，故贸易逆差的增长率为$\\frac{5-3.3}{3.3}=\\frac{1.7}{3.3}=50\\%^{+}$，即上升了30%以上。\n\n方法二：根据公式：贸易逆差=进口额-出口额，则进口额=贸易逆差+出口额，结合材料中给出了进口额与出口额的增长率，可判定本题为混合增长率问题。根据混合增长率口诀\"混合居中\"，则有出口额同比增长率（62.1%）>进口额同比增长率（55.1%）>贸易逆差同比增长率（r）。2023年1-3月，我国机器人设备进出口贸易逆差为6.9-1.9=5亿美元，出口额为1.9亿美元，根据\"混合增长率偏向基期量大的（一般用现期量代替基期量近似计算）\"，故进口额同比增长率更靠近贸易逆差的同比增长率，则有55.1%-r\u003c62.1%-55.1%，解得r>48.1%，即上升了30%以上。\n\n故正确答案为D。","point":"混合增长率；文字资料","src":"2024年国家公务员录用考试《行测》题（行政执法卷网友回忆版）第126题","bimgs":["book/80.webp"],"setno":1,"qno":7,"p0":"80","setTxt":"文字·夯实基础 第1套","gid":21},{"no":"ZL-032","sec":"文字资料","cat":"文字资料","qh":"81-12","page":"81 82","bsec":"文字","bpart":"夯实基础","mat":"2022年，京津冀地区生产总值合计10.0万亿元，是2013年的1.8倍。其中，北京、河北跨越4万亿元量级， 均为4.2万亿元，分别是2013年的2.0倍和1.7倍；天津1.6万亿元，是2013年的1.6倍。京津冀第一产业、第二产 业、第三产业增加值占生产总值比重构成由2013年的6.2：35.7：58.1变化为2022年的4.8：29.6：65.6。京津冀 三地第三产业增加值占生产总值比重分别为83.8%、61.3％和49.4%，较2013年分别提高4.3、7.2和8.4个百分 点。 2013—2022年，京津冀地区城镇累计分别新增就业288.1万、405.5万和748.4万人。2021年，北京法人单位 从业人员中，第三产业比重为84.4%，较2013年提高6.2个百分点，其中信息服务业和商务服务业占比达25.5%， 较2013年提高6.2个百分点；天津和河北第三产业就业人员占比为60.5％和46.6%，较2013年提高10.9和15.1个百 分点。 2022年，京津冀三地全体居民人均可支配收入分别为77415元、48976元和30867元，与2013年相比，年均 分别增长7.4%、7.1％和8.2%。其中，城镇居民人均可支配收入分别增长7.3%、6.9％和7.1%，农村居民人均可 支配收入分别增长8.2%、7.3％和8.6%。","imgs":[],"stem":"2013年，北京第三产业增加值占其生产总值比重比天津高多少个百分点？","opts":{"A":"25.4","B":"22.5","C":"19.6","D":"16.7"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"71%","trap":"B","sol":"定位文字材料第一段可知，2022年京津冀三地第三产业增加值占生产总值比重分别为83.8%、61.3%和49.4%，较2013年分别提高4.3、7.2和8.4个百分点。则2013年北京第三产业增加值占其生产总值比重=83.8%-4.3%=79.5%，2013年天津第三产业增加值占其生产总值比重=61.3%-7.2%=54.1%，故题干所求=79.5%-54.1%=25.4%，即2013年北京第三产业增加值占其生产总值比重比天津高25.4个百分点。\n\n故正确答案为A。","point":"简单计算；文字资料","src":"2024年国家公务员录用考试《行测》题（副省级网友回忆版）第131题","bimgs":["book/81.webp","book/82.webp"],"setno":1,"qno":12,"p0":"81","setTxt":"文字·夯实基础 第1套","gid":22},{"no":"ZL-033","sec":"文字资料","cat":"文字资料","qh":"83-20","page":"82 83","bsec":"文字","bpart":"夯实基础","mat":"2023年前三季度，规模以上文化及相关产业企业（简称文化企业）实现营业收入91619亿元，同比增长 7.7%。其中，文化新业态特征较为明显的16个行业小类实现营业收入36870亿元，同比增长15.2%。 分产业类型看，文化制造业实现营业收入29007亿元，同比下降1.0%；文化批发和零售业15024亿元，同比 增长5.3%；文化服务业47588亿元，同比增长14.6%。 分领域看，文化核心领域实现营业收入59507亿元，同比增长12.4%；文化相关领域32112亿元，同比下降 0.1%。 分行业类别看，新闻信息服务实现营业收入12203亿元，同比增长14.9%；内容创作生产19857亿元，同比 增长10.3%；创意设计服务14973亿元，同比增长9.6%；文化传播渠道10712亿元，同比增长12.4%；文化投资运 营473亿元，同比增长27.7%；文化娱乐休闲服务1289亿元，同比增长67.2%；文化生产和中介服务10894亿元， 同比下降1.5%；文化装备生产4443亿元，同比下降4.3%；文化消费终端生产16775亿元，同比增长2.1%。 分区域看，东部地区实现营业收入71959亿元，同比增长8.1%；中部地区10600亿元，同比增长1.9%；西部 地区8196亿元，同比增长12.2%；东北地区864亿元，同比增长7.0%。前三季度，文化企业实现利润总额7508亿 元，同比增长31.4%。前三季度末，文化企业资产总计192849亿元，同比增长6.7%。","imgs":[],"stem":"下列说法错误的是：","opts":{"A":"2022年前三季度，文化新业态特征较为明显的16个行业小类的营业收入占文化企业营业收入比重超过40%","B":"2023年前三季度，文化核心领域实现营业收入同比增量超过文化企业实现营业收入同比增量","C":"2022年前三季度，中部地区文化企业实现营业收入比西部地区多3000亿元以上","D":"2023年前三季度，每百元资产实现营业收入比上一年高"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"45%","trap":"C","sol":"- A项：定位文字材料第一段可得，2023年前三季度，规模以上文化企业（简称文化企业）实现营业收入91619亿元（B），同比增长7.7%（b），其中，文化新业态特征较为明显的16个行业小类实现营业收入36870亿元（A），同比增长15.2%（a）。根据公式：基期比重$=\\frac{A}{B}\\times\\frac{1+b}{1+a}$，则所求比重$=\\frac{36870}{91619}\\times\\frac{1+7.7\\%}{1+15.2\\%}\\approx 40.2\\%\\times\\frac{1.1}{1.2}\\approx 40.2\\%\\times 0.92\\approx 37\\%\u003c40\\%$，错误；\n- B项：定位文字材料第一段和第三段可得，2023年前三季度，规模以上文化企业（简称文化企业）实现营业收入91619亿元，同比增长7.7%，文化核心领域实现营业收入59507亿元，同比增长12.4%。根据公式：增长量$=\\frac{现期量}{1+r}\\times r$，则2023年前三季度文化核心领域实现营业收入同比增量$=\\frac{59507}{1+12.4\\%}\\times 12.4\\%\\approx\\frac{59507}{1+\\frac{1}{8}}\\times\\frac{1}{8}=\\frac{59507}{9}\\approx 6610$亿元，文化企业实现营业收入同比增量$=\\frac{91619}{1+7.7\\%}\\times 7.7\\%\\approx\\frac{91619}{1+\\frac{1}{13}}\\times\\frac{1}{13}=\\frac{91619}{14}\\approx 6540$亿元，文化核心领域实现营业收入同比增量（6610亿元）>文化企业实现营业收入同比增量（6540亿元），正确；\n- C项：定位文字材料最后一段可得，2023年前三季度中部地区文化企业实现营业收入10600亿元，同比增长1.9%；西部地区文化企业实现营业收入8196亿元，同比增长12.2%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，则2022年前三季度中部地区文化企业实现营业收入比西部地区多$\\frac{10600}{1+1.9\\%}-\\frac{8196}{1+12.2\\%}\\approx 10600\\times(1-1.9\\%)-\\frac{8196}{1.12}\\approx 10600-200-7300=3100$亿元$>3000$亿元，即多3000亿元以上，正确；\n- D项：定位文字材料第一段和最后一段可得，2023年前三季度，规模以上文化企业（简称文化企业）实现营业收入91619亿元（A），同比增长7.7%（a）；文化企业资产总计192849亿元（B），同比增长6.7%（b）。根据公式：每百元资产实现营业收入$=\\frac{营业收入}{资产}\\times 100$，结合两期平均数比较结论：当a>b时，平均数上升，则2023年前三季度每百元资产实现营业收入比上年高，正确。\n\n本题为选非题，故正确答案为A。","point":"综合分析；文字资料","src":"2024年黑龙江省公务员录用考试《行测》题（网友回忆版）第115题","bimgs":["book/82.webp","book/83.webp"],"setno":1,"qno":20,"p0":"83","setTxt":"文字·夯实基础 第1套","gid":23},{"no":"ZL-034","sec":"文字资料","cat":"文字资料","qh":"84-3","page":"83 84","bsec":"文字","bpart":"夯实基础","mat":"2023年上半年，全国新注册登记机动车1688万辆，同比增长1.9%。新注册登记汽车1175万辆，同比增长 5.8%。其中，新注册登记载客汽车1034万辆，同比增长5.6%；新注册登记载货汽车133万辆，同比增长8.1%。 新注册登记新能源汽车313万辆，同比增长41.6%。 2023年上半年，全国办理机动车转让登记业务1134万辆。其中，办理汽车转让登记业务1057万辆，同比增 长5.3%；异地直接办理交易登记二手小客车157万辆。 2023年6月末，全国机动车保有量4.26亿辆，同比增长4.9%。其中，汽车3.28亿辆，同比增长5.8%；新能源 汽车1620万辆，同比增长61.8%。新能源汽车中，纯电动汽车保有量1259万辆，同比增长55.4%；2023年6月 末，全国机动车驾驶人为5.13亿人，同比增长4.3%。其中，汽车驾驶人4.75亿人，同比增长4.6%。2023年上半 年，全国新领证驾驶人1191万人，同比增长8.0%。 2023年6月末，全国有88个城市汽车保有量超过100万辆，同比增加7个城市。其中，41个城市超过200万 辆，24个城市超过300万辆，3个城市超过500万辆，2个城市超过600万辆。","imgs":[],"stem":"2023年6月末，新能源汽车保有量占汽车保有量的比重，比当年上半年新注册登记新能源汽车数量占新注册登记汽车数量的比重约低多少个百分点？","opts":{"A":"12","B":"17","C":"22","D":"27 据对全国6.4万家规模以上文化及相关产业企业调查，"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"60%","trap":"B","sol":"根据题干\"2023年6月末……的比重，比当年上半年……的比重约低多少个百分点\"，结合材料时间为2023年上半年及6月末，可判定本题为现期比重问题。定位文字材料第一段可得：2023年上半年，新注册登记汽车1175万辆，新注册登记新能源汽车313万辆；定位文字材料第三段可得：2023年6月末，汽车保有量3.28亿辆，新能源汽车保有量1620万辆。根据公式：比重$=\\frac{部分}{整体}$，则所求$=\\frac{1620万}{3.28亿}-\\frac{313万}{1175万}\\approx\\frac{1620}{33000}-\\frac{313}{1200}\\approx 5\\%-26\\%=-21\\%$，即前者比后者约低21个百分点，与C项最接近。\n\n故正确答案为C。","point":"现期比重；文字资料","src":"2025年四川省考/选调公务员录用考试《行测》题（网友回忆版）第88题","bimgs":["book/83.webp","book/84.webp"],"setno":2,"qno":3,"p0":"84","setTxt":"文字·夯实基础 第2套","gid":24},{"no":"ZL-035","sec":"文字资料","cat":"文字资料","qh":"85-6","page":"85","bsec":"文字","bpart":"夯实基础","mat":"2022年，全国软件和信息技术服务业规模以上企业超3.5万家，累计完成软件业务收入108126亿元，同比增 长11.2%，增速较上年同期回落6.5个百分点。 2022年，全国软件业利润总额12648亿元，同比增长5.7%，增速较上年同期回落1.9个百分点。软件业务出 口额524.1亿美元，同比增长3.0%，增速较上年同期回落5.8个百分点。其中，软件外包服务出口额同比增长 9.2%。 2022年，东部、中部、西部和东北地区分别完成软件业务收入88663亿元、5390亿元、11574亿元和2499亿 元，分别同比增长10.6%、16.9%、14.3%和8.7%。软件业务收入居前5名的北京、广东、江苏、山东、浙江共完 成收入74537亿元，占比较上年同期提高2.9个百分点。 2022年，全国15个副省级中心城市实现软件业务收入53419亿元，同比增长10.0%，增速较上年同期回落6.3 个百分点；实现利润总额6924亿元，同比增长2.4%，增速较上年同期回落2.1个百分点。","imgs":[],"stem":"2022年，全国软件和信息技术服务业规模以上企业累计完成软件业务收入约比2020年增长了：","opts":{"A":"16%","B":"23%","C":"29%","D":"31%"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"B","a2":null,"rate":"63%","trap":"C","sol":"根据题干\"2022年……约比2020年增长了\"，结合选项为百分数，可判定本题为间隔增长率问题。定位文字材料第一段可得：2022年，全国软件和信息技术服务业规模以上企业累计完成软件业务收入同比增长11.2%（$r_{1}$），增速较上年同期回落6.5个百分点。则2021年，全国软件和信息技术服务业规模以上企业累计完成软件业务收入同比增长11.2%+6.5%=17.7%（$r_{2}$）。根据间隔增长率公式：$r_{间}=r_{1}+r_{2}+r_{1}\\times r_{2}$，则所求\n\n$$=11.2\\%+17.7\\%+11.2\\%\\times 17.7\\%\\approx 28.9\\%+2\\%=30.9\\%$$\n\n，与D项最接近。\n\n故正确答案为D。","point":"间隔增长率；文字资料","src":"2024年四川省公务员录用考试《行测》题（网友回忆版）第86题","bimgs":["book/85.webp"],"setno":2,"qno":6,"p0":"85","setTxt":"文字·夯实基础 第2套","gid":25},{"no":"ZL-036","sec":"文字资料","cat":"文字资料","qh":"86-10","page":"85 86","bsec":"文字","bpart":"夯实基础","mat":"2022年，全国软件和信息技术服务业规模以上企业超3.5万家，累计完成软件业务收入108126亿元，同比增 长11.2%，增速较上年同期回落6.5个百分点。 2022年，全国软件业利润总额12648亿元，同比增长5.7%，增速较上年同期回落1.9个百分点。软件业务出 口额524.1亿美元，同比增长3.0%，增速较上年同期回落5.8个百分点。其中，软件外包服务出口额同比增长 9.2%。 2022年，东部、中部、西部和东北地区分别完成软件业务收入88663亿元、5390亿元、11574亿元和2499亿 元，分别同比增长10.6%、16.9%、14.3%和8.7%。软件业务收入居前5名的北京、广东、江苏、山东、浙江共完 成收入74537亿元，占比较上年同期提高2.9个百分点。 2022年，全国15个副省级中心城市实现软件业务收入53419亿元，同比增长10.0%，增速较上年同期回落6.3 个百分点；实现利润总额6924亿元，同比增长2.4%，增速较上年同期回落2.1个百分点。","imgs":[],"stem":"以下信息中，能够从上述资料中推出的有几项？ ①2020年平均每个副省级中心城市软件业务收入 ②2021年北京、广东、江苏、山东、浙江软件业务收入之和 ③2022年软件外包服务出口额占软件业务出口额比重","opts":{"A":"0","B":"1","C":"2","D":"3 （十四）"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"70%","trap":"B","sol":"①定位文字材料第四段可得：2022年，全国15个副省级中心城市实现软件业务收入53419亿元，同比增长10.0%（$r_{1}$），增速较上年同期回落6.3个百分点。则2021年全国15个副省级中心城市实现软件业务收入同比增速为10%+6.3%=16.3%（$r_{2}$），2022年全国15个副省级中心城市实现软件业务收入相较于2020年的增速$r_{间}=r_{1}+r_{2}+r_{1}\\times r_{2}$。故所求\n\n$$=\\frac{2020年全国15个副省级中心城市软件业务收入}{15}=\\frac{\\frac{53419}{1+r_{间}}}{15}$$\n\n，可以推出；\n\n②定位文字材料第一段可得：2022年，全国软件和信息技术服务业……累计完成软件业务收入108126亿元，同比增长11.2%。定位文字材料第三段可得：2022年……软件业务收入居前5名的北京、广东、江苏、山东、浙江共完成收入74537亿元，占比较上年同期提高2.9个百分点。则2021年全国软件业务收入$=\\frac{现期量}{1+r}=\\frac{108126}{1+11.2\\%}$，北京、广东、江苏、山东、浙江软件业务收入之和占比为$\\frac{74537}{108126}-2.9\\%$，故所求=2021年全国软件业务收入×占比$=\\frac{108126}{1+11.2\\%}\\times(\\frac{74537}{108126}-2.9\\%)$，可以推出；\n\n③定位文字材料第二段可得：2022年……软件业务出口额524.1亿美元……其中，软件外包服务出口额同比增长9.2%。材料只给出2022年软件业务出口额和软件外包服务出口额同比增长率，无法求出软件外包服务出口额及其所占比重，无法推出。\n\n综上可知，只有①②可以推出，共2项。\n\n故正确答案为C。","point":"综合分析；文字资料","src":"2024年四川省公务员录用考试《行测》题（网友回忆版）第89题","bimgs":["book/85.webp","book/86.webp"],"setno":2,"qno":10,"p0":"86","setTxt":"文字·夯实基础 第2套","gid":25},{"no":"ZL-037","sec":"文字资料","cat":"文字资料","qh":"91-10","page":"90 91","bsec":"文字","bpart":"夯实基础","mat":"2021年前三季度，上述企业实现营业收入84205亿 元，按可比口径计算，同比增长21.8%；两年平均增长10.0%。 分业态营业收入情况：文化新业态特征较为明显的16个行业小类28322亿元，同比增长26.1%；两年平均增 长24.0%，高于全部规模以上文化及相关产业企业14.0个百分点。 分行业类别营业收入情况：新闻信息服务9847亿元，同比增长22.1%；内容创作生产17693亿元，同比增长 18.6%；创意设计服务13787亿元，同比增长24.0%；文化传播渠道9309亿元，同比增长30.1%；文化投资运营 359亿元，同比增长13.8％；文化娱乐休闲服务916亿元，同比增长35.3％；文化辅助生产和中介服务11441亿 元，同比增长18.3％；文化装备生产4880亿元，同比增长17.8％；文化消费终端生产15974亿元，同比增长 22.0％。 分产业类型营业收入情况：文化制造业30950亿元，同比增长17.7％；文化批发和零售业13561亿元，同比 增长26.0％；文化服务业39693亿元，同比增长23.7％。 分领域营业收入情况：文化核心领域51911亿元，同比增长22.9％；文化相关领域32294亿元，同比增长 20.0％。 分区域营业收入情况：东部地区64715亿元，同比增长22.5％；中部地区11417亿元，同比增长19.7％；西 部地区7329亿元，同比增长19.0％；东北地区744亿元，同比增长20.2％。","imgs":[],"stem":"关于2020年前三季度，以下说法正确的是：","opts":{"A":"文化新业态特征较为明显的16个行业小类营业收入同比增速高于2021年同期","B":"内容创作生产营业收入超过15000亿元","C":"文化核心领域收入超过文化相关领域收入2倍","D":"东部地区与中部地区营业收入之比低于"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"A","a2":null,"rate":"60%","trap":"A","sol":"- A项：定位文字材料第二段可得：（2021年前三季度）文化新业态特征较为明显的16个行业小类（实现营业收入）28322亿元，同比增长26.1%（$r_{1}$）；两年平均增长24.0%。根据公式：$r_{间隔}=r_{1}+r_{2}+r_{1}\\times r_{2}$，则$r_{间隔}=24.0\\%+24.0\\%+24.0\\%\\times 24.0\\%\\approx 48\\%+6\\%=54\\%$，则$54\\%=26.1\\%+r_{2}+26.1\\%\\times r_{2}$，解得$r_{2}\\approx 22\\%\u003c26.1\\%$，即2020年前三季度，文化新业态特征较为明显的16个行业小类营业收入同比增速低于2021年同期。此项也可以这样理解，2021年前三季度增长率为26.1%，两年平均增长率为24.0%，则2020年前三季度增长率必然小于26.1%（否则两年平均增长率要大于26.1%，不可能为24.0%），错误；\n- B项：定位文字材料第三段可得：（2021年前三季度）内容创作生产（实现营业收入）17693亿元，同比增长18.6%。根据公式：基期量$=\\frac{现期量}{1+增长率}$，则2020年前三季度内容创作生产营业收入为$\\frac{17693}{1+18.6\\%}\\approx 14918$亿元$\u003c15000$亿元，错误；\n- C项：定位文字材料第五段可得：（2021年前三季度）分领域营业收入情况：文化核心领域51911亿元（A），同比增长22.9%（a）；文化相关领域32294亿元（B），同比增长20.0%（b）。代入基期倍数公式：$\\frac{A}{B}\\times\\frac{1+b}{1+a}=\\frac{51911}{32294}\\times\\frac{1+20.0\\%}{1+22.9\\%}=2^{-}\\times 1^{-}\u003c2$，并非超过2倍，错误；\n- D项：定位文字材料第六段可得：（2021年前三季度）分区域营业收入情况：东部地区64715亿元，同比增长22.5%（a）；中部地区11417亿元，同比增长19.7%（b）。根据两期比例比较结论：分子增长率（a）>分母增长率（b），比例上升。22.5%（a）>19.7%（b），则2021年前三季度，东部地区与中部地区营业收入之比上升，即2020年前三季度，东部地区与中部地区营业收入之比低于2021年同期，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2023年辽宁省公务员录用考试《行测》题（网友回忆版）第120题","bimgs":["book/90.webp","book/91.webp"],"setno":3,"qno":10,"p0":"91","setTxt":"文字·夯实基础 第3套","gid":26},{"no":"ZL-038","sec":"文字资料","cat":"文字资料","qh":"92-13","page":"92","bsec":"文字","bpart":"夯实基础","mat":"2022年，规模以上工业企业实现营业收入137.91万亿元，同比增长5.9％；发生营业成本116.84万亿元，同 比增长7.1％；营业收入利润率为6.09％，同比下降0.64个百分点。 2022年，规模以上工业企业中，分行业看：采矿业实现利润总额15573.6亿元，同比增长48.6％；制造业实 现利润总额64150.2亿元，同比下降13.4％；电力、热力、燃气及水生产和供应业实现利润总额4314.7亿元，同 比增长41.8％。 2022年，在41个工业大类行业中，利润总额由高到低的前十个行业的利润情况如下：煤炭开采和洗选业实 现利润总额10202亿元，同比增长44.3％；计算机、通信和其他电子设备制造业实现利润总额7389.5亿元，同比 下降13.1％；化学原料和化学制品制造业实现利润总额7302.6亿元，同比下降8.7％；电气机械和器材制造业实 现利润总额5915.6亿元，同比增长31.2％；汽车制造业实现利润总额5319.6亿元，同比增长0.6％；非金属矿物 制品业实现利润总额4759亿元，同比下降15.5％；医药制造业实现利润总额4288.7亿元，同比下降31.8％；石油 和天然气开采业实现利润总额3545亿元，同比增长109.8％；通用设备制造业实现利润总额3250.3亿元，同比增 长0.4％；电力、热力生产和供应业实现利润总额3154亿元，同比增长86.3％。","imgs":[],"stem":"2021年，石油和天然气开采业利润总额占采矿业利润总额的（ ）。","opts":{"A":"不足10%","B":"10%-20%之间","C":"20%-30%之间","D":"30%以上"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"C","a2":null,"rate":"64%","trap":"C","sol":"根据题干\"2021年……占……的\"，结合材料时间为2022年，可判定本题为基期比重问题。定位文字材料第二段可得：2022年，采矿业实现利润总额15573.6亿元，同比增长48.6%。定位文字材料第三段可得：2022年，石油和天然气开采业实现利润总额3545亿元，同比增长109.8%。根据公式：基期比重$=\\frac{A}{B}\\times\\frac{1+b}{1+a}$，可得：2021年，石油和天然气开采业利润总额占采矿业利润总额的比重$=\\frac{3545}{15573.6}\\times\\frac{1+48.6\\%}{1+109.8\\%}\\approx\\frac{3500}{16000}\\times\\frac{1.5}{2.1}\\approx 16\\%$，在10%-20%之间。\n\n故正确答案为B。","point":"基期比重；文字资料","src":"2023年吉林省公务员录用考试《行测》题（网友回忆版）第97题","bimgs":["book/92.webp"],"setno":3,"qno":13,"p0":"92","setTxt":"文字·夯实基础 第3套","gid":27},{"no":"ZL-039","sec":"文字资料","cat":"文字资料","qh":"94-19","page":"94","bsec":"文字","bpart":"夯实基础","mat":"2020年全国人口共141178万人，比2010年增长了约5.38%。从地区分布上看，2020年东部地区人口占 39.93%，中部地区占25.83%，西部地区占27.12%，东北地区占6.98%。与2010年相比，东部地区人口所占比重 上升2.15个百分点，中部地区下降0.79个百分点，西部地区上升0.22个百分点，东北地区下降1.20个百分点。 从性别构成上看，2020年男性人口为72334万人，女性人口为68844万人。从年龄构成上看，2020年0-14岁 人口为25338万人，15-59岁人口为89438万人，60岁及以上人口为26402万人（其中，65岁及以上人口为19064 万人）。从城乡分布上看，2020年居住在城镇的人口为90199万人，居住在乡村的人口为50979万人，与2010年 相比，城镇人口增加23642万人，乡村人口减少16436万人。从民族构成上看，2020年汉族人口为128631万人， 各少数民族人口为12547万人，与2010年相比，汉族人口增长4.93%，各少数民族人口增长10.26%，少数民族人 口比重上升0.40个百分点。","imgs":[],"stem":"2020年，65岁及以上人口占比与60-64岁人口占比相差：","opts":{"A":"约6.3%","B":"约7.3%","C":"约8.3%","D":"约9.3%"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"A","a2":null,"rate":"65%","trap":"A","sol":"根据题干\"2020年……占比与……占比相差\"，结合材料时间为2020年，可判定本题为现期比重问题。定位文字材料第一段可得：2020年全国人口共141178万人。定位文字材料第二段可得：2020年60岁及以上人口为26402万人，其中，65岁及以上人口为19064万人。则2020年60-64岁人口为26402-19064=7338万人，根据公式：比重$=\\frac{部分}{整体}$，则所求比重差\n\n$$=\\frac{19064-7338}{141178}\\approx\\frac{11726}{140000}\\approx 8.4\\%$$\n\n，与C项最接近。\n\n故正确答案为C。","point":"现期比重；文字资料","src":"2022年青海省公务员录用考试《行测》题（网友回忆版）第118题","bimgs":["book/94.webp"],"setno":3,"qno":19,"p0":"94","setTxt":"文字·夯实基础 第3套","gid":28},{"no":"ZL-040","sec":"文字资料","cat":"文字资料","qh":"96-8","page":"95 96","bsec":"文字","bpart":"夯实基础","mat":"2019年6月，全国发行地方政府债券8996亿元，同比增长68.37%，环比增长195.63%。其中，发行一般债券 3178亿元，同比减少28.33%，环比增长117.08%，发行专项债券5818亿元，同比增长540.04%，环比增长 268.46%；按用途划分，发行新增债券7170亿元，同比增长127.11%，环比增长332.71%，发行置换债券和再融 资债券1826亿元，同比减少16.47%，环比增长31.75%。 2019年6月，地方政府债券平均发行期限11.1年，其中新增债券10.4年，置换债券和再融资债券13.4年；地 方政府债券平均发行利率3.55%，其中新增债券3.52%，置换债券和再融资债券3.65%。 2019年1至6月，全国发行地方政府债券28372亿元，同比增长101.09%。其中，发行一般债券12858亿元， 同比增长23.21%，发行专项债券15514亿元，同比增长322.38%；按用途划分，发行新增债券21765亿元，同比 增长553.80%，发行置换债券和再融资债券6607亿元，同比减少38.71%。 2019年1至6月，地方政府债券平均发行期限9.3年，其中一般债券11.2年，专项债券7.8年；地方政府债券平 均发行利率3.47%，其中一般债券3.53%，专项债券3.43%。 2019年全国地方政府债务限额为240774.3亿元。其中，一般债务限额133089.22亿元，专项债务限额 107685.08亿元。截至2019年6月末，全国地方政府债务余额205477亿元，其中，一般债务118397亿元，专项债 务87080亿元。","imgs":[],"stem":"2018年1至6月，发行一般债券的占比较发行专项债券的占比约：","opts":{"A":"低9.36%","B":"低52.81%","C":"高47.93%","D":"高53.43%"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"51%","trap":"D","sol":"根据题干\"2018年1至6月……占比约\"，结合材料时间，可判定本题为基期比重问题。结合文字资料第三段\"2019年1至6月，全国发行地方政府债券28372亿元，同比增长101.09%。其中，发行一般债券12858亿元，同比增长23.21%，发行专项债券15514亿元，同比增长322.38%\"。代入公式：基期量$=\\frac{现期量}{1+增长率}$和比重$=\\frac{部分}{总体}$，可得所求比重\n\n$$=\\frac{\\frac{12858}{1+23.21\\%}-\\frac{15514}{1+322.38\\%}}{\\frac{28372}{1+101.09\\%}}\\approx\\frac{\\frac{12858}{1.23}-\\frac{15514}{4.22}}{\\frac{28000}{2}}\\approx\\frac{10454-3676}{14000}=\\frac{6778}{14000}\\approx 48.4\\%$$\n\n，与C项最接近。\n\n故正确答案为C。","point":"基期比重；文字资料","src":"2020年云南公务员录用考试《行测》题（网友回忆版）第113题","bimgs":["book/95.webp","book/96.webp"],"setno":4,"qno":8,"p0":"96","setTxt":"文字·夯实基础 第4套","gid":29},{"no":"ZL-041","sec":"文字资料","cat":"文字资料","qh":"98-14","page":"96 97 98","bsec":"文字","bpart":"夯实基础","mat":"2016年国产工业机器人销量继续增长，全年累计销售29144台，较上年增长16.8%，增速较上年提升。 从机械结构看，2016年国产多关节机器人销量首次超过万台，为11756台，增速已连续两年超过70%，占国 产工业机器人总销量的40.4%，比上年提高12.9个百分点。坐标机器人仍是国产工业机器人销量第一的机型， 2016年销售12830台，占销售总量的比重为44.0%，比上年回落3.5个百分点，连续两年占比回落。工厂用AGV机 器人销量超过2100台，同比增长23.9%。并联机器人销售增长8%。而SCARA机器人和圆柱坐标机器人的销售则 出现超过30%的下降。 从应用领域看，2016年搬运与上下料仍是国产工业机器人的首要应用领域，全年销售1.65万台，同比增长 22.0%，增速放缓，占国产工业机器人销售总量的56.6%；焊接和钎焊机器人销售0.51万台，同比增长36.3%； 装配与拆卸机器人销售0.37万台，同比增长129%。此外涂层与胶封机器人的销售也实现了32.9%的增长，特别 是其中的喷漆上釉机器人销量增长了138%，而洁净室机器人和加工机器人的销售量均出现了同比下降。 从应用行业看，3C行业和电气设备行业销量均超过5000台，分列第一第二位，特别是电气设备行业，同比 大幅增长3倍有余。汽车行业销量同比增长45.4%；非金属矿物制品业销量同比增长125%。此外，在家具、服 装、烟草等消费品制造行业的机器人消费量均翻番。","imgs":[],"stem":"下列指标中，2015、2016连续两年均实现增长的是： ①国产多关节机器人销量 ②搬运与上下料机器人销量 ③圆柱坐标机器人销量 ④并联机器人销量占总销量的比例","opts":{"A":"①②","B":"①③","C":"②④","D":"③④"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"93%","trap":"B","sol":"①定位文字材料第二段，\"……2016年国产多关节机器人销量……增速已连续两年超过70%……\"，可得国产多关节机器人销量2015、2016连续两年均实现增长，正确；\n\n②定位文字材料第三段，\"……2016年搬运与上下料……机器人……同比增长22.0%，增速放缓……\"，即2015年增长率大于22.0%，可得搬运与上下料机器人销量2015、2016连续两年均实现增长，正确；\n\n③定位文字材料第二段，\"……圆柱坐标机器人的销售则出现超过30%的下降\"，可得2016年圆柱坐标机器人销量下降，错误；\n\n④定位文字材料第二段，\"……并联机器人销售增长8%……\"，材料只有2016年数据，无法得知2015年并联机器人销量占总销量的比例相比2014年的变化情况，错误。\n\n故正确答案为A。","point":"综合分析；文字资料","src":"2020年山东省公务员录用考试《行测》题（网友回忆版）第78题","bimgs":["book/96.webp","book/97.webp","book/98.webp"],"setno":4,"qno":14,"p0":"98","setTxt":"文字·夯实基础 第4套","gid":30},{"no":"ZL-042","sec":"文字资料","cat":"文字资料","qh":"102-6","page":"101 102","bsec":"文字","bpart":"夯实基础","mat":"8月份，规模以上工业原煤生产增速回升，煤炭进口保持较高水平；原油生产增速由负转正，进口继续增加； 天然气生产保持较快增长，进口持续高速增长；电力生产加快。 一、原煤生产增速回升，煤炭进口保持较高水平，市场价格小幅波动 8月份，原煤产量3.0亿吨，同比增长4.2%，上月为下降2.0%；日均产量957万吨，环比增加49万吨。1—8月份， 原煤产量22.8亿吨，同比增长3.6%。 8月份，煤炭主产区生产均开始回升。其中，内蒙古同比增长10.0%，上月为下降1.4%；山西同比下降0.9%，降 幅较上月收窄2.2个百分点；陕西同比增长14.0%，增速较上月加快7.6个百分点；新疆同比增长7.1%，上月为下 降5.5%。 8月份，煤炭进口2868万吨，比上月略降33万吨，但仍保持较高水平，同比增长13.5%。1—8月份，煤炭进口2.0 亿吨，同比增长14.7%。 8月底，秦皇岛5500大卡煤炭综合交易价格为573元/吨，比7月底下降3元；5000大卡煤炭价格为510元/吨，比7 月底下降17元；4500大卡煤炭价格为456元/吨，比7月底下降12元。 二、原油生产增速由负转正，进口持续增加 8月份，原油生产1600万吨，同比增长0.2%，上月为下降2.6%，为2015年11月以来首次正增长；日均产量51.6万 吨，环比增加0.5万吨。1—8月份，原油产量12595万吨，同比下降1.8%。 原油进口持续增加，8月份进口原油3838万吨，比上月增加236万吨，同比增长12.9%。1—8月份，进口原油 29919万吨，同比增长6.5%。 国际原油价格震荡上行，截至8月底，布伦特原油现货离岸价格为76.94美元/桶，比7月底上涨2.78美元/桶。 三、原油加工量增速有所放缓 8月份，原油加工量5031万吨，同比增长5.6%，增速比上月回落6.0个百分点；日均加工162.3万吨，环比减少1.4 万吨。1—8月，原油加工量40041万吨，同比增长8.7%。 四、天然气生产保持较快增长，进口持续高速增长 8月份，天然气产量129亿立方米，同比增长9.7%，增速比上月回落0.8个百分点；日均生产4.2亿立方米，与上 月基本持平。1—8月份，天然气产量1040亿立方米，同比增长5.9%。 天然气进口持续高速增长。8月份，进口天然气777万吨（1吨约为1380立方米），比上月增加39万吨，同比增 长37.3%。1—8月份，进口天然气5718万吨，同比增长34.8%。 五、电力生产加快 8月份，发电量6404.9亿千瓦时，同比增长7.3%，增速比上月加快1.6个百分点；日均发电206.6亿千瓦时，再创 新高。1—8月份，发电量同比增长7.7%，比去年同期加快1.2个百分点。 8月份，除风电外，其他品种电力生产同比增速较7月份均有所加快。其中火电同比增长6.0%，比上月加快1.7个 百分点；水电增长11.5%，加快5.5个百分点；核电增长16.9%，加快2.7个百分点；太阳能发电增长12.2%，加快 1.3个百分点。 因台风、降雨等气候因素影响，8月份风电大幅减少，增速比上月回落24.1个百分点，同比增长0.6%。","imgs":[],"stem":"本年度8月份，进口天然气环比增长约：","opts":{"A":"5.28%","B":"5.42%","C":"5.73%","D":"6.02%"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"C","a2":null,"rate":"85%","trap":"B","sol":"根据题干\"……环比增长约\"，结合选项是百分数，可判定本题为一般增长率计算问题。定位文字材料第四部分第二段可知：8月份，进口天然气777万吨（1吨约为1380立方米），比上月增加39万吨，同比增长37.3%。根据增长率$=\\frac{增长量}{现期量-增长量}$，可知本年度8月份，进口天然气环比增长率为：$\\frac{39}{777-39}=\\frac{39}{738}\\approx 5.28\\%$。\n\n故正确答案为A。","point":"一般增长率；文字资料","src":"2021年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第111题","bimgs":["book/101.webp","book/102.webp"],"setno":5,"qno":6,"p0":"102","setTxt":"文字·夯实基础 第5套","gid":31},{"no":"ZL-043","sec":"文字资料","cat":"文字资料","qh":"104-15","page":"103 104","bsec":"文字","bpart":"夯实基础","mat":"2018年，某市实现地区生产总值24221.98亿元，比上年增长7.6%。其中，第一产业增加值22.09亿元，增长 3.9%；第二产业增加值9961.95亿元，增长9.3%；第三产业增加值14237.94亿元，增长6.4%。现代产业中，现代 服务业增加值10090.59亿元，增长7.1%；先进制造业增加值6564.83亿元，增长12.0%；高技术制造业增加值 6131.20亿元，增长13.3%。四大支柱产业中，金融业增加值3067.21亿元，增长3.6%；物流业增加值2541.58亿 元，增长9.4%；文化及相关产业（规模以上）增加值1560.52亿元，增长6.3%；高新技术产业增加值8296.63亿 元，增长12.7%。七大战略性新兴产业增加值合计9155.18亿元，比上年增长9.5%，占地区生产总值比重 37.8%。其中，新一代信息技术产业增加值4772.02亿元，增长10.9%；数字经济产业增加值1240.73亿元，增长 3.8%；高端装备制造产业增加值1065.82亿元，增长10.7%；绿色低碳产业增加值990.73亿元，增长11.7%；海洋 经济产业增加值421.69亿元，下降11.3%；新材料产业增加值365.61亿元，增长8.6%；生物医药产业增加值 298.58亿元，增长22.3%。 全市年末常住人口1302.66万人，其中常住户籍人口454.70万人，增长4.6%，占常住人口比重34.9%；常住 非户籍人口847.97万人，增长3.6%，占比重65.1%。年末城镇登记失业率为2.3 %。全年居民消费价格比上年上 涨2.8%。全年完成一般公共预算收入3538.41亿元，比上年增长6.2%。其中税收收入2899.60亿元，增长9.2%。 一般公共预算支出4282.54亿元，下降6.8%。","imgs":[],"stem":"根据上文，下列说法正确的是：","opts":{"A":"2018年，该市第二产业增加值占地区生产总值比重同比下降","B":"2017年，该市四大支柱产业中，物流业增加值最大","C":"2018年，该市年末城镇登记失业人口29.96万人","D":"2018年，该市一般公共预算收入中，非税收收入同比负增长"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"33%","trap":"C","sol":"- A项：定位文字材料第一段，\"2018年，某市实现地区生产总值24221.98亿元，比上年增长7.6%。其中，……第二产业增加值9961.95亿元，增长9.3%\"，根据两期比重比较的结论：若部分增长率>整体增长率，比重上升；反之下降。9.3%>7.6%，因此第二产业增加值占地区生产总值比重同比上升，错误。\n- B项：定位文字材料第一段，2018年\"四大支柱产业中，金融业增加值3067.21亿元，增长3.6%；物流业增加值2541.58亿元，增长9.4%；文化及相关产业（规模以上）增加值1560.52亿元，增长6.3%；高新技术产业增加值8296.63亿元，增长12.7%\"。根据基期量$=\\frac{现期量}{1+增长率}$，2017年四大支柱产业增加值分别为：\n\n  2017年金融业增加值：$\\frac{3067.21}{1+3.6\\%}\u003c3067.21$亿元；\n\n  2017年物流业增加值：$\\frac{2541.58}{1+9.4\\%}\u003c2541.58$亿元；\n\n  2017年文化及相关产业（规模以上）增加值：$\\frac{1560.52}{1+6.3\\%}\u003c1560.52$亿元；\n\n  2017年高新技术产业增加值：$\\frac{8296.63}{1+12.7\\%}=7000^{+}$亿元。\n\n  比较可知，2017年该市四大支柱产业中，高新技术产业增加值最大，错误。\n- C项：定位文字材料第二段，根据城镇登记失业率$=\\frac{城镇登记失业人员}{城镇从业人员+城镇登记失业人员}\\times 100\\%$，材料并未给出城镇从业人员的数据，故无法推出城镇登记失业人数，错误。\n- D项：定位文字材料第二段，2018年\"全年完成一般公共预算收入3538.41亿元，比上年增长6.2%。其中税收收入2899.60亿元，增长9.2%\"，根据线段法\"距离与量成反比（一般用现期量代替基期量计算）\"，可知\n\n  $$\\frac{6.2\\%-r_{非税收}}{9.2\\%-6.2\\%}=\\frac{2899.60}{3538.41-2899.60}$$\n\n  ，即$\\frac{6.2\\%-r_{非税收}}{3\\%}=\\frac{2899.60}{638.81}\\approx 4.5$，解得$r_{非税收}\\approx 6.2\\%-4.5\\times 3\\%=-7.3\\%\u003c0$，即非税收入同比负增长，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2020年深圳市考公务员录用考试《行测2》试题（网友回忆版）第69题","bimgs":["book/103.webp","book/104.webp"],"setno":5,"qno":15,"p0":"104","setTxt":"文字·夯实基础 第5套","gid":32},{"no":"ZL-044","sec":"文字资料","cat":"文字资料","qh":"104-17","page":"104","bsec":"文字","bpart":"夯实基础","mat":"2017年全国海洋生产总值77611亿元，比上年增长6.9%，海洋生产总值占国内生产总值的9.4%。 2017年，J省海洋生产总值为7217亿元，比上年增长9.2%，海洋生产总值占地区生产总值的8.4%，2017 年，全省沿海沿江港口完成货物吞吐量20.4亿吨，同比增长8.3%；集装箱吞吐量1698.8万标箱，同比增长 5.5%。 2017年，J省造船完工量为1412.4万载重吨，同比下降5.4%；新承订单量为1393.4万载重吨，同比增长 228.5%；手持订单量为3662.3万载重吨，同比下降6.4%，分别占全国份额的33.1%、41.3%和42.0%。 2017年，J省沿海三市接待国内游客10558.01万人次，同比增长12.6%；接待入境过夜旅游者27.65万人次， 同比增长8.1%。 2017年，J省实现海水养殖产量93.1万吨，同比增长3%；海洋捕捞产量53万吨，同比下降3.4%；远洋渔业 产量2.9万吨，同比增长43.3%。 2017年，J省海工装备产值同比增长6.9%。全省沿海地区风电装机容量达到589.7万千瓦，同比增长16.6%； 海上风电装机容量达到162.5万千瓦，同比增长46.3%。2017年，全省完成海水淡化产量1.31万吨，同比增长 7.4%。","imgs":[],"stem":"2017年J省海洋生产总值占全国的比重比上年：","opts":{"A":"上升了约0.2个百分点","B":"上升了约2个百分点","C":"下降了约0.2个百分点","D":"下降了约2个百分点"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"B","a2":null,"rate":"72%","trap":"B","sol":"根据题干中\"2017年……占……比重比上年\"，可以判定本题为两期比重问题。定位文字材料第一段和第二段，\"2017年全国海洋生产总值77611亿元，比上年增长6.9%\"，\"2017年，J省海洋生产总值为7217亿元，比上年增长9.2%\"。代入公式，两期比重差$=\\frac{A}{B}\\times\\frac{a-b}{1+a}=\\frac{7217}{77611}\\times\\frac{9.2\\%-6.9\\%}{1+9.2\\%}\\approx 0.09\\times\\frac{2.3\\%}{1.1}\\approx 0.19\\%$，即上升了约0.19个百分点，与A项最接近。\n\n故正确答案为A。","point":"两期比重；文字资料","src":"2020年山东省公务员录用考试《行测》题（网友回忆版）第86题","bimgs":["book/104.webp"],"setno":5,"qno":17,"p0":"104","setTxt":"文字·夯实基础 第5套","gid":33},{"no":"ZL-045","sec":"文字资料","cat":"文字资料","qh":"107-9","page":"107","bsec":"文字","bpart":"夯实基础","mat":"2018年国家统计局组织开展了第二次全国时间利用的随机抽样调查，共调查48580人。结果显示，受访居 民在一天的活动中，有酬劳动平均用时4小时24分钟。其中，男性5小时15分钟，女性3小时35分钟；城镇居民3 小时59分钟，农村居民5小时1分钟；工作日4小时50分钟，休息日3小时19分钟。受访居民有酬劳动的参与率为 59.0%，其中城镇居民53.1%。受访居民无酬劳动平均用时2小时42分钟。其中，女性3小时48分钟；农村居民2 小时39分钟；工作日2小时34分钟。受访居民无酬劳动的参与率为70.2%，其中男性55.3%。 无酬劳动包括家务劳动、陪伴照料孩子生活、护送辅导孩子学习、陪伴照料成年家人、购买商品或服务、 看病就医和公益活动。受访居民家务劳动平均用时1小时26分钟，参与率为58.5%。其中，女性2小时6分钟，参 与率75.6%。受访居民陪伴照料孩子生活平均用时36分钟，参与率为18.9%；护送辅导孩子学习平均用时9分 钟，参与率为10.2%；陪伴照料成年家人平均用时8分钟，参与率为5.0%；看病就医平均用时4分钟，参与率为 2.2%；公益活动平均用时3分钟，参与率为4.1%。","imgs":[],"stem":"受访的男性居民约有","opts":{"A":"2.4万人","B":"2.6万人","C":"2.9万人","D":"3.0万人"},"letters":["A","B","C","D"],"key":"A","bookkey":"A","a1":"D","a2":null,"rate":"39%","trap":"C","sol":"由题干\"受访的男性居民约有\"，结合材料给出整体平均时间，及男女平均时间，可判定本题为混合平均数计算问题。定位材料第一段可得，\"…共调查48580人。结果显示，受访居民在一天的活动中，有酬劳动平均用时4小时24分钟。其中，男性5小时15分钟，女性3小时35分钟\"。根据\"混合居中但不中，距离与量成反比\"可知，（5小时15分-4小时24分）：（4小时24分-3小时35分）=女性人数：男性人数=51:49。则男性人数为$\\frac{48580}{51+49}\\times 49=485.8\\times 49\\approx 23800=2.38$万人，与A项最为接近。\n\n故正确答案为A。","point":"混合平均数；文字资料","src":"2019年江苏省公务员录用考试《行测》题（B类）（网友回忆版）第118题","bimgs":["book/107.webp"],"setno":6,"qno":9,"p0":"107","setTxt":"文字·夯实基础 第6套","gid":34},{"no":"ZL-046","sec":"文字资料","cat":"文字资料","qh":"109-13","page":"108 109","bsec":"文字","bpart":"夯实基础","mat":"2017年，国内旅游市场高速增长，入出境市场平稳发展，供给侧结构性改革成效明显。国内旅游人数50.01亿人 次，比上年同期增长12.8%；入出境旅游总人数2.7亿人次，增长3.7%；全年实现旅游总收入5.40万亿元，增长 15.1%；全年全国旅游业对GDP的综合贡献为9.13万亿元，占GDP总量的11.04%；旅游直接就业2825万人，旅游 直接和间接就业7990万人，占全国就业总人口的10.28%。 一、全年国内旅游收入增长15.9% 2017年，国内旅游人数50.01亿人次，比上年同期增长12.8%。其中，城镇居民36.77亿人次，增长15.1%；农村 居民13.24亿人次，增长6.8%。国内旅游收入4.57万亿元，增长15.9%。其中，城镇居民花费3.77万亿元，增长 16.8%；农村居民花费0.80万亿元，增长11.8%。 二、全年入境过夜旅游人数增长2.5% 2017年，入境旅游人数13948万人次，比上年同期增长0.8%。其中，外国人2917万人次，增长3.6%；香港同胞 7980万人次，下降1.6%；澳门同胞2465万人次，增长4.9%；台湾同胞587万人次，增长2.5%。入境旅游人数按 照入境方式分，船舶占3.2%，飞机占16.5%，火车占0.8%，汽车占22.2%，其他占57.2%。 2017年，入境过夜旅游人数6074万人次，比上年同期增长2.5%。其中，外国人2248万人次，增长3.8%；香港同 胞2775万人次，增长0.1%；澳门同胞522万人次，增长8.6%；台湾同胞529万人次，增长4.0%。 三、全年国际旅游收入达1234亿美元 2017年，国际旅游收入1234亿美元，比上年同期增长2.9%。其中，外国人在华花费695亿美元，增长4.1%；香 港同胞在内地花费301亿美元，下降1.5%；澳门同胞在内地花费83亿美元，增长8.0%；台湾同胞在大陆花费155 亿美元，增长4.0%。 四、全年入境外国游客亚洲占74.6%，以观光休闲为目的游客占37.1% 2017年，入境外国游客人数4294万人次，亚洲占74.6%，美洲占8.2%，欧洲占13.7%，大洋洲占2.1%，非洲占 1.4%。其中，按照年龄分，14岁以下人数占3.1%，15—24岁占13.2%，25—44岁占49.9%，45—64岁占29.2%， 65岁以上占4.6%；按性别分，男占60.7%，女占39.3%；按目的分，会议/商务占13.3%，观光休闲占37.1%，探 亲访友占2.6%，服务员工占14.8%，其他占32.2%。 2017年，按入境旅游人数排序，我国主要客源市场前17位国家如下：缅甸、越南、韩国、日本、俄罗斯、美 国、蒙古、马来西亚、菲律宾、新加坡、印度、加拿大、泰国、澳大利亚、印度尼西亚、德国、英国。 五、全年中国公民出境旅游人数达13051万人次 2017年，中国公民出境旅游人数13051万人次，比上年同期增长7.0%。","imgs":[],"stem":"2017年，城镇居民平均每人次旅游消费比农村居民约多多少元？","opts":{"A":"382","B":"395","C":"406","D":"421 截至"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"B","a2":null,"rate":"45%","trap":"C","sol":"根据题干\"2017年……平均每人次旅游消费……\"，结合材料时间是2017年，可判定本题为现期平均数问题。定位文字材料第一部分：2017年，……城镇居民36.77亿人次，……；农村居民13.24亿人次，……城镇居民花费3.77万亿元，……农村居民花费0.80万亿元。根据平均每人次旅游消费$=\\frac{花费}{人次数}$，则2017年，城镇居民平均每人次旅游消费比农村居民多\n\n$$=\\frac{3.77万亿元}{36.77亿人次}-\\frac{0.80万亿元}{13.24亿人次}$$\n\n$$\\approx 1025-604=421\\ \\text{元}$$\n\n。\n\n故正确答案为D。","point":"现期平均数；文字资料","src":"2021年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第108题","bimgs":["book/108.webp","book/109.webp"],"setno":6,"qno":13,"p0":"109","setTxt":"文字·夯实基础 第6套","gid":35},{"no":"ZL-047","sec":"文字资料","cat":"文字资料","qh":"114-15","page":"113 114 115","bsec":"文字","bpart":"夯实基础","mat":"2019年3月31日，证券业协会对证券公司2019年第一季度经营数据进行了统计，131家证券公司当期实 现营业收入1018.94亿元，同比增长54.47%。 其中，各主营业务收入分别为代理买卖证券业务净收入（含席位租赁）221.49亿元，同比增长13.77%；证 券承销与保荐业务净收入66.73亿元，同比增长19.5%；财务顾问业务净收入20.95亿元，同比增长15.17%；投资 咨询业务净收入7.15亿元，同比增长5.15%；资产管理业务净收入57.33亿元，同比下降15.43%；证券投资收益 （含公允价值变动）514.05亿元，同比增长215.17%；利息净收入69.04亿元，同比增长4.94%；当期实现净利润 440.16亿元，同比增长86.83%；119家公司实现盈利，同比增长10.19%。 2019年第一季度，131家证券公司总资产为7.05万亿元，比上年一季度同期增加0.64万亿元；净资产为1.94 万亿元，比上年一季度同期增加0.05万亿元；净资本为1.62万亿元，比上年一季度同期增加0.02万亿元。 另外，2019年第一季度131家证券公司客户交易结算资金余额（含信用交易资金）1.50万亿元，比上年一季 度同期增加0.32万亿元；受托管理资金本金总额14.11万亿元，比上年一季度同期下降2.82万亿元。","imgs":[],"stem":"关于证券公司2019年第一季度经营数据，下列说法正确的是：","opts":{"A":"131家证券公司总资产比净资产少了4.11亿元","B":"131家证券公司财务顾问业务净收入的同比增长率为13.77%","C":"131家证券公司净资产的同比增长金额低于净资本的同比增长金额","D":"131家证券公司资产管理业务净收入占当期实现营业收入的比重约为5.6%"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"83%","trap":"C","sol":"- A项：定位文字材料第三段可得，2019年第一季度，131家证券公司总资产为7.05万亿元，净资产为1.94万亿元。故131家证券公司总资产比净资产多7.05-1.94=5.11万亿元，非少了4.11亿元，错误；\n- B项：定位文字材料第二段可得，财务顾问业务净收入同比增长15.17%，故增长率不是13.77%，错误；\n- C项：定位文字材料第三段可得，2019年第一季度，131家证券公司净资产为1.94万亿元，比上年一季度同期增加0.05万亿元；净资本为1.62万亿元，比上年一季度同期增加0.02万亿元。0.05万亿元>0.02万亿元，故131家证券公司净资产的同比增长金额高于净资本的同比增长金额，错误；\n- D项：定位文字材料第一段和第二段可得，2019年第一季度，131家证券公司当期实现营业收入1018.94亿元，资产管理业务净收入57.33亿元。则131家证券公司资产管理业务净收入占当期实现营业收入的比重$=\\frac{57.33}{1018.94}\\approx\\frac{57.33}{1020}\\approx 5.6\\%$，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2021年青海省公务员录用考试《行测》题（网友回忆版）第120题","bimgs":["book/113.webp","book/114.webp","book/115.webp"],"setno":7,"qno":15,"p0":"114","setTxt":"文字·夯实基础 第7套","gid":36},{"no":"ZL-048","sec":"文字资料","cat":"文字资料","qh":"117-4","page":"116 117","bsec":"文字","bpart":"夯实基础","mat":"2018年，A省公共财政预算收入1180.07亿元，比上年增长10.7%。其中，一般公共预算收入103.82亿元，比 上年下降19.9%。全年A省实际完成地方税收收入104亿元，中央财政返还68.60亿元，增长1.2%。A省一般公共 预算支出从2012年的603.2亿元增加到2018年的958.41亿元，2018年同比增长8.9%。 2018年末，A省辖区各项存款余额3051.06亿元，同比增长4.4%。其中，个人存款1491.89亿元，增长 17.9%；单位存款1531.38亿元，下降7.6%；代理财政性存款25.38亿元，增长17.9倍。A省辖区各项贷款余额 2574.10亿元，同比增长9.4%。其中，个人贷款311.99亿元，下降2.6%；单位贷款2202.74亿元，增长10.8%；含 票据融资59.38亿元，增长32.9%。 2018年，农行A省分行年末各项本外币存款余额1300.85亿元，同比增长2.7%，比上年同期下降7个百分 点。其中，个人存款645.62亿元，增长8.4%；单位存款653.96亿元，下降1.9%；同业存款1.26亿元，下降 64.5%。年末各项贷款余额662.92亿元，同比增长0.7%，比上年同期下降19个百分点。其中，个人贷款103.52亿 元，增长6.0%；单位贷款484.65亿元，下降6.1%；贸易融资57.59亿元，增长30.8%；贴现及转贴现净值17.16亿 元，增长155.0倍。","imgs":[],"stem":"2017年，农行A省单位贷款额是个人贷款额的（ ）。","opts":{"A":"3～4倍","B":"4～5倍","C":"5～6倍","D":"6～7倍"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"D","a2":null,"rate":"59%","trap":"D","sol":"由题干\"2017年……是……多少倍\"，结合材料时间为2018年，可判定此题为基期倍数计算问题。定位文字材料第三段\"2018年，农行A省个人贷款103.52亿元，增长6.0%；单位贷款484.65亿元，下降6.1%\"。根据基期倍数公式$\\frac{A}{B}\\times\\frac{1+b}{1+a}$，代入数据可得$\\frac{484.65}{103.52}\\times\\frac{1+6\\%}{1-6.1\\%}\\approx 4.7\\times 1.13\\approx 5.3$倍，在C项范围内。\n\n故正确答案为C。","point":"文字资料；基期倍数","src":"2019年新疆生产建设兵团面向社会招录公务员考试《行测》题（网友回忆版）第104题","bimgs":["book/116.webp","book/117.webp"],"setno":7,"qno":4,"p0":"117","setTxt":"文字·夯实基础 第7套","gid":37},{"no":"ZL-049","sec":"文字资料","cat":"文字资料","qh":"117-5","page":"116 117","bsec":"文字","bpart":"夯实基础","mat":"2018年，A省公共财政预算收入1180.07亿元，比上年增长10.7%。其中，一般公共预算收入103.82亿元，比 上年下降19.9%。全年A省实际完成地方税收收入104亿元，中央财政返还68.60亿元，增长1.2%。A省一般公共 预算支出从2012年的603.2亿元增加到2018年的958.41亿元，2018年同比增长8.9%。 2018年末，A省辖区各项存款余额3051.06亿元，同比增长4.4%。其中，个人存款1491.89亿元，增长 17.9%；单位存款1531.38亿元，下降7.6%；代理财政性存款25.38亿元，增长17.9倍。A省辖区各项贷款余额 2574.10亿元，同比增长9.4%。其中，个人贷款311.99亿元，下降2.6%；单位贷款2202.74亿元，增长10.8%；含 票据融资59.38亿元，增长32.9%。 2018年，农行A省分行年末各项本外币存款余额1300.85亿元，同比增长2.7%，比上年同期下降7个百分 点。其中，个人存款645.62亿元，增长8.4%；单位存款653.96亿元，下降1.9%；同业存款1.26亿元，下降 64.5%。年末各项贷款余额662.92亿元，同比增长0.7%，比上年同期下降19个百分点。其中，个人贷款103.52亿 元，增长6.0%；单位贷款484.65亿元，下降6.1%；贸易融资57.59亿元，增长30.8%；贴现及转贴现净值17.16亿 元，增长155.0倍。","imgs":[],"stem":"下列哪个指标不能从上述资料中推出？（ ）","opts":{"A":"2012年到2018年A省一般公共预算支出的平均增长率","B":"2017年农行A省分行年末各项本外币存款余额的同比增长量","C":"2016年农行A省分行年末各项贷款余额占A省辖区各项贷款余额的比重","D":"2017年A省个人贷款额和农行A省分行个人贷款额的比值"},"letters":["A","B","C","D"],"key":"C","bookkey":"C","a1":"B","a2":null,"rate":"77%","trap":"A","sol":"- A项：定位材料第一段\"A省一般公共预算支出从2012年的603.2亿元增加到2018年的958.41亿元\"，结合年均增长率公式：$(1+r)^{n}=\\frac{现期量}{基期量}$，由于现期2018年数据、基期2012年数据以及年份差均已知，故年均增长率可以推出（此处平均增长率即为年均增长率）；\n- B项：定位材料第三段\"2018年，农行A省分行年末各项本外币存款余额1300.85亿元，同比增长2.7%，比上年同期下降7个百分点\"，则2017年农行A省分行年末各项本外币存款余额$=\\frac{1300.85}{1+2.7\\%}$亿元，又可得2017年农行A省分行年末各项本外币存款余额同比增速=2.7%+7%=9.7%，因此其2017年的现期量和同比增速均已知，故其同比增长量可以推出；\n- C项：定位材料第二段\"2018年A省辖区各项贷款余额2574.10亿元，同比增长9.4%\"，仅能得到2017年A省辖区各项贷款余额的量，缺少同比增速或同比增长量，无法得到其2016年的值，因此2016年的占比无法推出；\n- D项：定位材料第二三段\"2018年末，A省个人贷款311.99亿元，下降2.6%；农行A省分行个人贷款103.52亿元，增长6%\"，即2018年两者的现期量和同比增长率均已知，故2017年的比值可以推出。\n\n本题为选非题，故正确答案为C。","point":"综合分析；文字资料","src":"2019年新疆生产建设兵团面向社会招录公务员考试《行测》题（网友回忆版）第105题","bimgs":["book/116.webp","book/117.webp"],"setno":7,"qno":5,"p0":"117","setTxt":"文字·夯实基础 第7套","gid":37},{"no":"ZL-050","sec":"文字资料","cat":"文字资料","qh":"117-6","page":"117","bsec":"文字","bpart":"夯实基础","mat":"2023年，我国互联网企业完成互联网业务收入17483亿元，同比增长6.8%。实现利润总额1295亿元，同比 增长0.5%。共投入研发经费943.2亿元，同比下降3.7%。 2023年，东部地区互联网企业完成互联网业务收入15608亿元，同比增长7.3%；中部地区互联网企业完成 互联网业务收入781.6亿元，同比增长8.1%；西部地区互联网企业完成互联网业务收入1054亿元，同比增长 0.2%；东北地区互联网企业完成互联网业务收入39.4亿元，同比下降25.1%。 2023年，京津冀地区互联网企业完成互联网业务收入6777亿元，同比增长6.4%；长三角地区（上海、浙 江、江苏和安徽）互联网企业完成互联网业务收入6624亿元，同比增长12.9%。 2023年，互联网企业互联网业务累计收入居前5名的省级行政区为北京（5721.4亿元，增长4.2%）、上海 （4167.8亿元，增长17.5%）、浙江（1955.9亿元，增长4.8%）、广东（1754.5亿元，下降4.6%）和天津（981.7 亿元，增长20.3%）。全国互联网企业互联网业务增速实现正增长的省级行政区有16个，数量较2022年全年增 长3个。","imgs":[],"stem":"2023年，我国互联网企业投入的研发经费占业务收入的比重比上年下降了约多少个百分点？","opts":{"A":"0.2","B":"0.6","C":"1.9","D":"9.8"},"letters":["A","B","C","D"],"key":"B","bookkey":"B","a1":"D","a2":null,"rate":"60%","trap":"C","sol":"根据题干\"2023年……占……的比重比上年下降了约多少个百分点\"，可判定本题为两期比重问题。定位文字材料第一段可得：2023年，我国互联网企业完成互联网业务收入17483亿元（B），同比增长6.8%（b）。共投入研发经费943.2亿元（A），同比下降3.7%（a）。根据公式：两期比重差$=\\frac{A}{B}\\times\\frac{a-b}{1+a}$，则所求为\n\n$$\\frac{943.2}{17483}\\times\\frac{-3.7\\%-6.8\\%}{1-3.7\\%}\\approx\\frac{940}{17000}\\times\\frac{-11\\%}{0.96}$$\n\n$$\\approx -5.5\\%\\times 11\\%\\approx -0.6\\%$$\n\n，即2023年，我国互联网企业投入的研发经费占业务收入的比重比上年下降了约0.6个百分点。\n\n故正确答案为B。","point":"两期比重；文字资料","src":"2025年天津市公务员录用考试《行测》题（网友回忆版）第111题","bimgs":["book/117.webp"],"setno":7,"qno":6,"p0":"117","setTxt":"文字·夯实基础 第7套","gid":38},{"no":"ZL-051","sec":"文字资料","cat":"文字资料","qh":"118-12","page":"118 119","bsec":"文字","bpart":"夯实基础","mat":"2025年8月，全国电梯采购规模25.11亿元，环比增长7.77%，同比增长43%。 全国电梯采购规模突破千万元的有河北省、湖北省等22个省份，其中，河北省、湖北省和北京市位居全国 电梯采购规模前三，采购规模依次为67006.13万元、33061.49万元和23594.98万元。 8月，全国电梯更新改造采购规模56108.32万元，环比增长51.92%，同比增长347.55%。 8月，全国电梯维保采购规模9650.81万元，环比下降40.06%，同比下降14.11%，主要分布于政府机关、医 疗系统、教育系统、轨道交通等，其中，政府机关电梯维保占全国电梯维保采购市场40.85%。河北省、江苏省 和浙江省电梯维保采购规模排名位列前三，分别为2227.91万元、1662.78万元和1376.29万元。 8月，全国加装电梯采购规模9538.15万元，环比增长30.72%，同比下降18.63%，主要分布于政府机关、医 疗系统、教育系统等，其中，政府机关加装电梯占全国加装电梯采购市场61.17%。四川省、北京市和广东省加 装电梯采购规模排名前三，依次2484.57万元、2459.31万元和939.68万元。","imgs":[],"stem":"2025年8月，全国电梯更新改造采购规模环比增量约是全国加装电梯采购规模环比增量的多少倍？","opts":{"A":"4.4","B":"5.9","C":"7.3","D":"8.6"},"letters":["A","B","C","D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"59%","trap":"C","sol":"根据题干\"2025年8月……约是……的多少倍\"，结合材料时间为2025年8月，可判定本题为现期倍数问题。定位材料第三段和第五段可得：2025年8月，全国电梯更新改造采购规模56108.32万元，环比增长51.92%。2025年8月，全国加装电梯采购规模9538.15万元，环比增长30.72%。根据公式：增长量$=\\frac{现期量}{1+增长率}\\times 增长率$，则2025年8月全国电梯更新改造采购规模环比增量为$\\frac{56108.32}{1+51.92\\%}\\times 51.92\\%\\approx\\frac{56108.32}{1+\\frac{1}{2}}\\times\\frac{1}{2}=\\frac{56108.32}{3}\\approx 18700$万元；全国加装电梯采购规模环比增量为$\\frac{9538.15}{1+30.72\\%}\\times 30.72\\%\\approx\\frac{9538.15}{1+\\frac{1}{3.3}}\\times\\frac{1}{3.3}=\\frac{9538.15}{4.3}\\approx 2220$万元，故所求倍数为$\\frac{18700}{2220}\\approx 8.4$倍，与D项最接近。\n\n故正确答案为D。","point":"文字资料；现期倍数","src":"2026年浙江省公务员录用考试《行测》题（C类）（网友回忆版）第102题","bimgs":["book/118.webp","book/119.webp"],"setno":8,"qno":12,"p0":"118","setTxt":"文字·夯实基础 第8套","gid":39},{"no":"ZL-052","sec":"文字资料","cat":"文字资料","qh":"120-18","page":"119 120","bsec":"文字","bpart":"夯实基础","mat":"2021年1-2月，全国房地产开发投资13986亿元，同比增长3873亿元，房屋施工面积770629万平方米，同比 增长11.0%。其中，住宅542503万平方米，增长11.2%；办公楼31802万平方米，增长7.3%；商业营业用房76346 万平方米，增长2.5%；其他类型119978万平方米。房屋新开工面积17037万平方米，增长64.3%，其中，住宅 12736万平方米，增长68.5%。商品房销售面积17363万平方米，同比增长1.05倍，比2019年1-2月增长23.3%，商 品房销售额19151亿元，同比增长1.33倍，比2019年同期增长49.6%。 2月末，商品房待售面积比上年末增加2575万平方米，其中，住宅增加2314万平方米，办公楼和商业营业 用房分别减少24万平方米和269万平方米。 2021年1-2月，分地区看，东部地区房地产开发投资8353亿元，同比增长32.4%；中部地区2640亿元，增长 52.5%；西部地区2834亿元，增长45.1%；东北地区158亿元，增长28.6%。 东部地区商品房销售面积7565万平方米，同比增长113.9%；销售额11891亿元，增长148.1%，中部地区商 品房销售面积4369万平方米，增长104.3%；销售额3280亿元，增长130.2%，西部地区商品房销售面积5004万平 方米，增长95.1%；销售额3620亿元，增长103.6%，东北地区商品房销售面积425万平方米，增长82.0%；销售 额359亿元，增长72.7%。","imgs":[],"stem":"2021年1-2月，各地区按商品房销售额同比增量从大到小排列，正确的是（ ）。","opts":{"A":" ,"D"],"key":"D","bookkey":"D","a1":"C","a2":null,"rate":"36%","trap":"B","sol":"- A项：定位文字资料第一段可知，2021年1-2月，全国房屋新开工面积17037万平方米，增长64.3%。根据公式：增长量$=\\frac{现期量}{1+r}\\times r$，则2021年1-2月，全国房屋新开工面积同比增量\n\n  $$=\\frac{17037}{1+64.3\\%}\\times 64.3\\%\\approx\\frac{17037}{1+\\frac{1}{1.6}}\\times\\frac{1}{1.6}=\\frac{17037}{2.6}\\approx 6550\\ \\text{万平方米}$$\n\n  $\u003c6800$万平方米，错误；\n- B项：定位文字资料第二段可知，仅给出2021年2月末，商业营业用房和办公楼待售面积相比于2020年末的减少量，而未给出2021年2月末，商业营业用房和办公楼待售面积相比于2020年2月末的减少量，故无法推出同比减少量的差值，错误；\n- C项：定位文字资料第三段可知，2021年1-2月，各地区房地产开发投资额及其同比增速。根据公式：基期量$=\\frac{现期量}{1+r}$，则2020年1-2月，各地区房地产开发投资额分别为：东部地区$=\\frac{8353}{1+32.4\\%}\\approx 6310$亿元；中部地区$=\\frac{2640}{1+52.5\\%}\\approx 1730$亿元；西部地区$=\\frac{2834}{1+45.1\\%}\\approx 1950$亿元；东北地区$=\\frac{158}{1+28.6\\%}\\approx 123$亿元，则投资最低的地区，其投资额与最高的地区相差$\\frac{6310-123}{123}=\\frac{6187}{123}\\approx 50$倍$\u003c55$倍，错误；\n- D项：定位文字资料第四段可知，2021年1-2月，各地区商品房销售面积及其同比增速、销售额及其同比增速。根据公式：销售均价$=\\frac{销售额(A)}{销售面积(B)}$，平均数的增长量$=\\frac{A}{B}\\times\\frac{a-b}{1+a}$，则各地区商品房销售均价同比增量分别为：东部地区\n\n  $$=\\frac{11891}{7565}\\times\\frac{148.1\\%-113.9\\%}{1+148.1\\%}>0$$\n\n  ；中部地区$=\\frac{3280}{4369}\\times\\frac{130.2\\%-104.3\\%}{1+130.2\\%}>0$；西部地区$=\\frac{3620}{5004}\\times\\frac{103.6\\%-95.1\\%}{1+103.6\\%}>0$；东北地区$=\\frac{359}{425}\\times\\frac{72.7\\%-82.0\\%}{1+72.7\\%}\u003c0$。比较可知，东北地区的商品房销售均价同比增长最小，正确。\n\n故正确答案为D。","point":"综合分析；文字资料","src":"2023年深圳市考公务员录用考试《行测》试题（网友回忆版）第90题","bimgs":["book/119.webp","book/120.webp"],"setno":8,"qno":20,"p0":"120","setTxt":"文字·夯实基础 第8套","gid":40},{"no":"ZL-054","sec":"文字资料","cat":"文字资料","qh":"122-8","page":"122 123","bsec":"文字","bpart":"夯实基础","mat":"2024年，我国对联合国定义的45个最不发达国家（以下简称最不发达国家）进出口14230.2亿元人民币，占 同期我国外贸进出口总值的3.2%。其中出口8664.6亿元，同比（下同）增长4.3%；进口5565.5亿元，增长 12.8%。 2024年，我国对最不发达国家出口机电产品3942.2亿元，增长13.5%。其中出口船舶690.8亿元，增长 65.9%，主要出口至全球第一大船旗国利比里亚。出口金额654.3亿元，增长67%；出口工程机械、火车分别为 165.3亿元、91.6亿元，分别增长28.9%、39.5%；出口劳动密集型产品2481亿元，增长3.7%，其中纺织品1623.5 亿元，增长15.3%。 2024年，我国自最不发达国家进口铜材、原油、金属矿砂分别为1469.6亿元、1364.2亿元、1221亿
